// Hilfsfunktion: Basistitel einer Wahl ermitteln (ohne Stichwahl-Präfix)
// Grundordnung EKIBA: Mehrheitsregel automatisch bestimmen
// Erster Wahlgang: absolute Mehrheit (>50% aller abgegebenen Stimmen inkl. Enthaltungen)
// Stichwahl: einfache Mehrheit + mind. 1/3 der abgegebenen Stimmen
// ─── Bezirkskirchenratswahl (BKR) §45/46 LWG ─────────────────────────────────
// Vollständig abgekapselt — keine Auswirkung auf andere Wahltypen

function istBKRWahl(wahl) {
  return wahl?.wahltyp === "bkr";
}

function berechneBKRQuota(wahl) {
  // §45 Abs. 2 LWG: Hauptamtliche DÜRFEN Ehrenamtliche NICHT ERREICHEN (strikt <, nicht <=)
  // Gesamt nach Wahl: (kraftH + maxH) < (kraftE + zuWaehlen - maxH)
  // → kraftH + maxH < kraftE + zuWaehlen - maxH
  // → 2 * maxH < kraftE - kraftH + zuWaehlen
  // → maxH < (kraftE - kraftH + zuWaehlen) / 2
  // → maxH = ceil((kraftE - kraftH + zuWaehlen) / 2) - 1
  //        = floor((kraftE - kraftH + zuWaehlen - 1) / 2)
  const kraftAmtesH = parseInt(wahl?.kraftAmtesHauptamtlich || 0);
  const kraftAmtesE = parseInt(wahl?.kraftAmtesEhrenamtlich || 0);
  const zuWaehlen = parseInt(wahl?.maxAuswahl || 1);
  const maxH = Math.floor((kraftAmtesE - kraftAmtesH + zuWaehlen - 1) / 2);
  return Math.max(0, maxH);
}

function berechneBKRErgebnisse(wahl, ergebnisse) {
  const total = ergebnisse.length;
  if (total === 0) return { gewaehlte: [], nichtGewaehlteQuota: [], offeneAemter: 0, quotaErreicht: false };

  const maxAuswahl = parseInt(wahl?.maxAuswahl || 1);
  const maxHauptamtlich = berechneBKRQuota(wahl);

  // Stimmen pro Kandidat berechnen
  const opts = (wahl?.optionen || [])
    .filter(o => o && !o.istEnthaltung)
    .map(opt => ({
      ...opt,
      stimmen: ergebnisse.filter(a => {
        try { const pos = JSON.parse(a.Positionen||a.positionen||"[]"); return pos.some(p=>String(p.optionID)===opt.id); } catch { return false; }
      }).length,
      istHauptamtlich: opt.istHauptamtlich || false,
    }))
    .sort((a,b) => b.stimmen - a.stimmen);

  const hatAbsoluteMehrheit = (s) => total > 0 && s / total > 0.5;

  // Phase 1: Absolute Mehrheit prüfen, Quota beachten
  let gewaehlteH = 0;
  let gewaehlteE = 0;
  let gewaehlte = [];
  let nichtGewaehlteQuota = []; // hätten Mehrheit aber Quota erreicht

  for (const opt of opts) {
    if (!hatAbsoluteMehrheit(opt.stimmen)) continue;
    if (gewaehlte.length >= maxAuswahl) break;

    if (opt.istHauptamtlich) {
      if (gewaehlteH < maxHauptamtlich) {
        gewaehlte.push({ ...opt, grund: "absolut" });
        gewaehlteH++;
      } else {
        nichtGewaehlteQuota.push(opt);
      }
    } else {
      gewaehlte.push({ ...opt, grund: "absolut" });
      gewaehlteE++;
    }
  }

  const offeneAemter = maxAuswahl - gewaehlte.length;
  const quotaErreicht = nichtGewaehlteQuota.length > 0;

  return { gewaehlte, nichtGewaehlteQuota, offeneAemter, quotaErreicht, total, maxHauptamtlich, opts };
}

// ─── Ende BKR ────────────────────────────────────────────────────────────────

// Grundordnung EKIBA Wahlablauf:
// 1. Wahlgang: absolute Mehrheit (>50%)
// 2. Wahlgang: einfache Mehrheit + mind. 1/3 (wenn keine absolute Mehrheit im 1. Wahlgang)
// Stichwahl: einfache Mehrheit + mind. 1/3 (nur bei Gleichstand im 2. Wahlgang)

function ist2Wahlgang(wahl) {
  return /^2\.\s*Wahlgang:/i.test(wahl?.titel||"");
}
function istStichwahl(wahl) {
  return /Stichwahl:/i.test(wahl?.titel||"") && !ist2Wahlgang(wahl);
}
function istFolgeWahlgang(wahl) {
  // 2. Wahlgang ODER Stichwahl — beide nutzen einfache Mehrheit + 1/3
  return ist2Wahlgang(wahl) || istStichwahl(wahl);
}
function getMehrheitsregel(wahl) {
  return istFolgeWahlgang(wahl) ? "stichwahl" : "absolut";
}
// Bezugsgröße für absolute Mehrheit — PENDING KLÄRUNG
// Aktuell: Anzahl abgegebener Stimmzettel (nicht Stimmberechtigte)
// Nach Klärung hier anpassen falls nötig
function berechneTotal(ergebnisse, stimmberechtigte=null) {
  // Option A (aktuell): Anzahl abgegebener Stimmzettel
  return ergebnisse.length;
  // Option B (nach Klärung falls nötig): Anzahl Stimmberechtigte
  // return stimmberechtigte || ergebnisse.length;
}

function pruefeMehrheitGO(stimmen, total) {
  if (total === 0) return false;
  return stimmen / total > 0.5; // absolute Mehrheit: mehr als 50%
}
function pruefeFolgeWahlgang(stimmen, total) {
  // 2. Wahlgang + Stichwahl: einfache Mehrheit + mindestens 1/3
  if (total === 0) return false;
  return stimmen / total >= 1/3;
}
function pruefeStichwahl(stimmen, total) {
  return pruefeFolgeWahlgang(stimmen, total);
}
function getMehrheitsregelLabel(wahl) {
  if (ist2Wahlgang(wahl)) return "Einfache Mehrheit (mind. 1/3 der Stimmen) · 2. Wahlgang gem. Grundordnung";
  if (istStichwahl(wahl)) return "Einfache Mehrheit (mind. 1/3 der Stimmen) · Stichwahl gem. Grundordnung";
  return "Absolute Mehrheit (>50%) · 1. Wahlgang gem. Grundordnung";
}

function getBasisTitel(titel) {
  return titel
    .replace(/^2\.\s*Wahlgang:\s*/i, "")
    .replace(/^(\d+\.\s*)?Stichwahl:\s*/i, "")
    .trim();
}
// Hilfsfunktion: Wahlen gruppieren (Hauptwahl + Stichwahlen)
function gruppiereWahlen(wahlen) {
  const gruppen = [];
  const zugeordnet = new Set();
  wahlen.forEach(w => {
    if (zugeordnet.has(w.id)) return;
    if (istFolgeWahlgang(w)) return; // Folgewahlgänge separat behandeln
    // Hauptwahl gefunden — zugehörige Folgewahlgänge finden (2. Wahlgang + Stichwahlen)
    const basis = getBasisTitel(w.titel);
    const stichwahlen = wahlen
      .filter(s => istFolgeWahlgang(s) && getBasisTitel(s.titel) === basis)
      .sort((a,b) => (a.startzeit||"").localeCompare(b.startzeit||""));
    stichwahlen.forEach(s => zugeordnet.add(s.id));
    zugeordnet.add(w.id);
    gruppen.push({ hauptwahl: w, stichwahlen });
  });
  // Verwaiste Stichwahlen (ohne erkannte Hauptwahl) als eigene Gruppe
  wahlen.filter(w => !zugeordnet.has(w.id)).forEach(w => {
    gruppen.push({ hauptwahl: w, stichwahlen: [] });
  });
  return gruppen;
}

function ErgebnisDashboard({ appData, wahllokalID, onBack, isLeitung=false, onDataChange, initialWahlId, wahltag=null }) {

    if (!wahltag?.datum) return true;
    const wDatum = w.startzeit ? new Date(w.startzeit).toLocaleDateString("sv-SE") : null;
    return wDatum === wahltag.datum.slice(0,10);
  });
  useEffect(()=>{
    async function ladeWahlen(){ try{ const raw=await callFlow("getDaten",{ eventID:wahllokalID }); const optionen=(raw.optionen||[]).map(mapOption); const w=(raw.wahlen||[]).map(mapWahl); w.forEach(wahl=>{ wahl.optionen=optionen.filter(o=>o.wahlID===wahl.id).sort((a,b)=>{ if(a.istEnthaltung&&!b.istEnthaltung) return 1; if(!a.istEnthaltung&&b.istEnthaltung) return -1; return parseInt(a.id)-parseInt(b.id); }); }); setWahlenFrisch(w); }catch(e){ console.error(e); } }
    ladeWahlen();
  },[wahllokalID]);
  const wahlenGeladen = wahlenFrisch !== null;
  const gruppen = gruppiereWahlen(wahlen);
  const initialGruppeIdx = initialWahlId ? Math.max(0, gruppen.findIndex(g => g.hauptwahl.id===initialWahlId||g.stichwahlen.some(s=>s.id===initialWahlId))) : 0;
  const [selectedGruppeIdx, setSelectedGruppeIdx] = useState(initialGruppeIdx);
  const [selectedWahlID, setSelectedWahlID] = useState(initialWahlId||wahlen[0]?.id||"");

  const [letzteAktualisierung, setLetzteAktualisierung] = useState(null); const [vollbild, setVollbild] = useState(false);
  useEffect(()=>{ if(wahlen.length>0&&!selectedWahlID) setSelectedWahlID(wahlen[0].id); },[wahlen.length]);
  async function laden(){ if(!selectedWahlID) { setLoading(false); return; } setLoading(true); try{ const result=await callFlow("getErgebnisse",{ wahlID:parseInt(selectedWahlID), eventID:wahllokalID }); setErgebnisse(Array.isArray(result)?result:(result.value||result.abstimmungen||[])); setLetzteAktualisierung(new Date()); }catch(e){ console.error(e); } setLoading(false); }
  useEffect(()=>{ laden(); },[selectedWahlID]);
  useEffect(()=>{ const t=setInterval(laden,30000); return ()=>clearInterval(t); },[selectedWahlID]);

  const wahl = wahlen.find(w=>w.id===selectedWahlID);
  const total = ergebnisse?.length||0;
  const maxAuswahl = wahl?.maxAuswahl||1;
  function berechneOptErgebnisse(wahlObj, ergebnisseArr) {
    return (wahlObj?.optionen.map(opt=>({ ...opt, stimmen:(ergebnisseArr||[]).filter(a=>{ try{ const pos=JSON.parse(a.Positionen||a.positionen||"[]"); return pos.some(p=>String(p.optionID)===opt.id); }catch{ return false; } }).length||0 })).sort((a,b)=>b.stimmen-a.stimmen))||[];
  }

  const optErgebnisse = berechneOptErgebnisse(wahl, ergebnisse);
  const maxS = Math.max(...optErgebnisse.map(e=>e.stimmen),1);
  const nichtenthaltung = optErgebnisse.filter(e=>!e.istEnthaltung);
  const gewinner = (nichtenthaltung||[]).slice(0,maxAuswahl).filter(e=>e.stimmen>0);
  const wahlGeschlossen = wahl&&!!wahl.geschlossen;
  const gewinnerSchwelle = gewinner.length>0?gewinner[gewinner.length-1].stimmen:0;
  const gleichstandKandidaten = nichtenthaltung.filter(e=>e.stimmen===gewinnerSchwelle&&!gewinner.find(g=>g.id===e.id));
  const hatGleichstand = gleichstandKandidaten.length>0&&gewinnerSchwelle>0;
  const sichereGewinner = hatGleichstand?gewinner.slice(0,-1):gewinner;
  // Grundordnung: Mehrheit gegen ALLE abgegebenen Stimmen (inkl. Enthaltungen)
  const wahlIstStichwahl = istStichwahl(wahl);
  function pruefeMehrheit(stimmen) {
    if (total===0) return false;
    if (wahlIstStichwahl) return pruefeStichwahl(stimmen, total);
    return pruefeMehrheitGO(stimmen, total);
  }
  const mehrheitErreicht = gewinner.length>0&&gewinner.every(g=>pruefeMehrheit(g.stimmen));
  const stichwahNötig = total>0&&(!mehrheitErreicht||hatGleichstand);

  const stichwahSuchTitel = "Stichwahl: "+(wahl?.titel||"");
  const stichwahExistiert = !!wahlenFrisch&&wahlen.some(w=>w.titel===stichwahSuchTitel&&w.id!==wahl?.id);
  const mehrheitsregelLabel = getMehrheitsregelLabel(wahl);
  const VB = vollbild;

              </div>
              <div style={{ textAlign:"right" }}>
                <span style={{ fontSize:gross?28:16, fontWeight:800, color:col(C.primary,C.accent) }}>{e.stimmen}</span>
                <span style={{ fontSize:gross?16:12, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginLeft:6 }}>Stimme{e.stimmen!==1?"n":""} ({pct}%)</span>

              <div style={{ height:"100%", width:`${totalStimmen>0?(e.stimmen/maxStimmen)*100:0}%`, background:e.istEnthaltung?col(C.textLight,"rgba(255,255,255,0.3)"):(istFuehrend?col(C.accent,"#4ade80"):(istGleichstand?col("#f59e0b","#fbbf24"):col(C.primaryLight,C.accent))), borderRadius:8, transition:"width 1s ease", minWidth:e.stimmen>0?8:0 }}/>
            </div>
          </div>

  const containerStyle = VB?{ position:"fixed", inset:0, background:C.primary, zIndex:9999, display:"flex", flexDirection:"column", padding:"40px 56px", overflow:"auto" }:{ minHeight:"100vh", background:C.bg, padding:24 };

      <div style={{ fontSize:18, fontWeight:700, color:C.primary, marginBottom:8 }}>Noch keine Wahlen</div>
      <p style={{ color:C.textLight, fontSize:14 }}>Für diesen Wahltag wurden noch keine Wahlen angelegt.</p>
    </div>
  );

  return (

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:VB?40:24 }}>
        <div>
          {!VB&&onBack&&<button onClick={onBack} style={{ ...S.btn, ...S.btnGhost, fontSize:12, marginBottom:12 }}>← Zurück zum Wahllokal</button>}
          <div style={{ fontSize:VB?14:12, fontWeight:700, letterSpacing:"0.15em", textTransform:"uppercase", color:col(C.textLight,"rgba(255,255,255,0.5)"), marginBottom:6 }}>Evangelische Landeskirche in Baden</div>

          {ansicht==="einzeln"&&gruppen[selectedGruppeIdx]?.stichwahlen.length>0&&(
            <select style={{ ...S.select, maxWidth:400 }} value={selectedWahlID} onChange={e=>setSelectedWahlID(e.target.value)}>
              {wahlen.filter(w=>!w.geschlossen).length>0&&<optgroup label="Aktive & pausierte Wahlen">{wahlen.filter(w=>!w.geschlossen).map(w=><option key={w.id} value={w.id}>{w.aktiv?"● ":"⏸ "}{w.titel}</option>)}</optgroup>}
              {wahlen.filter(w=>w.geschlossen).length>0&&<optgroup label="Archiv (geschlossen)">{wahlen.filter(w=>w.geschlossen).map(w=><option key={w.id} value={w.id}><i className="ti ti-lock" aria-hidden="true"/> {w.titel}</option>)}</optgroup>}
            </select>
          )}
          {/* Kombinierte Ansicht — immer wenn nicht explizit Einzelansicht */}
          {ansicht!=="einzeln"&&gruppen[selectedGruppeIdx]&&(
            <KombinierteGruppenAnsicht
              gruppe={gruppen[selectedGruppeIdx]}
              wahllokalID={wahllokalID}
              isLeitung={isLeitung}
              onDataChange={onDataChange}
              wahlen={wahlen}
              VB={VB}
            />
          )}
        </div>
      )}
      {wahlen.length>1&&VB&&<div style={{ display:"flex", gap:12, marginBottom:32, flexWrap:"wrap" }}>{wahlen.map(w=><button key={w.id} onClick={()=>setSelectedWahlID(w.id)} style={{ padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer", fontSize:14, fontWeight:600, background:w.id===selectedWahlID?C.accent:"rgba(255,255,255,0.15)", color:"#fff" }}>{w.titel}</button>)}</div>}
      {(ansicht==="einzeln"||VB)&&wahl&&ergebnisse!==null&&(
        <>
          <div style={{ marginBottom:VB?40:24 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:VB?20:12, flexWrap:"wrap" }}>
            <div style={{ fontSize:VB?28:18, fontWeight:800, color:col(C.primary,"#fff") }}>{wahl.titel}</div>
            {!VB&&<div style={{ fontSize:11, color:C.textLight, marginTop:2 }}>{mehrheitsregelLabel}</div>}
            {wahl.geschlossen&&<span style={{ ...S.badge, ...S.badgeRed, fontSize:VB?15:12 }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>}
            {!wahl.geschlossen&&wahl.aktiv&&<span style={{ ...S.badge, ...S.badgeGreen, fontSize:VB?15:12 }}>● läuft</span>}
            {!wahl.geschlossen&&!wahl.aktiv&&<span style={{ ...S.badge, ...S.badgeOrange, fontSize:VB?15:12 }}>⏸ pausiert</span>}
          </div>
            <div style={{ display:"flex", gap:VB?48:24, flexWrap:"wrap", alignItems:"flex-end" }}>
              {wahlGeschlossen ? (
                <div><div style={{ fontSize:VB?64:40, fontWeight:900, color:col(C.primary,C.accent), lineHeight:1 }}>{total}</div><div style={{ fontSize:VB?16:13, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginTop:4 }}>{maxAuswahl>1?`Stimmberechtigte (je ${maxAuswahl} Stimmen)`:`Stimme${total!==1?"n":""} abgegeben`}</div></div>
              ) : (
                <div>
                  <div style={{ fontSize:VB?64:40, fontWeight:900, color:col(C.primary,C.accent), lineHeight:1 }}>{total}</div>
                  <div style={{ fontSize:VB?16:13, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginTop:4 }}>
                    Stimme{total!==1?"n":""} eingegangen
                  </div>
                  <div style={{ fontSize:VB?13:11, color:col(C.textLight,"rgba(255,255,255,0.45)"), marginTop:3 }}>
                    <i className="ti ti-lock" aria-hidden="true"/> Stimmverteilung erst nach Schließen sichtbar
                  </div>
                </div>
              )}
              {wahlGeschlossen&&total>0&&<div style={{ paddingBottom:VB?12:6 }}>
                {(() => {
                  const isBKRw = istBKRWahl(wahl);
                  const bkrD = isBKRw ? berechneBKRErgebnisse(wahl, ergebnisse||[]) : null;
                  const istFWGw = istFolgeWahlgang(wahl);
                  const maxAuswahlw = parseInt(wahl?.maxAuswahl||1);
                  const istMehrfachw = wahl?.mehrfach && maxAuswahlw>1;
                  const gewNeu = isBKRw ? (bkrD?.gewaehlte||[])
                    : (mehrheitErreicht&&!hatGleichstand)
                      ? (istMehrfachw ? optErgebnisse.filter(e=>!e.istEnthaltung&&e.gewaehlt) : [fuehrend].filter(Boolean))
                      : [];
                  const quotaN = isBKRw ? (bkrD?.nichtGewaehlteQuota||[]) : [];
                  const nichtGewN = optErgebnisse.filter(e=>!e.istEnthaltung&&!gewNeu.some(g=>g.id===e.id)&&!quotaN.some(g=>g.id===e.id));
                  const offeneN = isBKRw?(bkrD?.offeneAemter||0):istMehrfachw?maxAuswahlw-gewNeu.length:(gewNeu.length===0?1:0);
                  const braucht2WGn = offeneN>0&&!hatGleichstand&&!(istFWGw&&(!fuehrend||!pruefeFolgeWahlgang(fuehrend.stimmen,total)));
                  const gescheitern = istFWGw&&fuehrend&&!pruefeFolgeWahlgang(fuehrend.stimmen,total)&&!hatGleichstand;

                  const cfgL={g:{bg:"#f0faf5",bd:C.accent,tc:C.accent},q:{bg:"#fffbeb",bd:"#f59e0b",tc:"#92400e"},w:{bg:"#f5f3ff",bd:"#6366f1",tc:"#4338ca"},e:{bg:"#fef2f2",bd:C.error,tc:"#7b2d2d"}};
                  const cfgD={g:{bg:"rgba(74,222,128,0.12)",bd:"rgba(74,222,128,0.4)",tc:"#4ade80"},q:{bg:"rgba(245,158,11,0.12)",bd:"rgba(245,158,11,0.4)",tc:"#fbbf24"},w:{bg:"rgba(99,102,241,0.12)",bd:"rgba(99,102,241,0.4)",tc:"#a78bfa"},e:{bg:"rgba(239,68,68,0.12)",bd:"rgba(239,68,68,0.4)",tc:"#fca5a5"}};

                  function Blk({type,title,children}) {
                    const cfg=(VB?cfgD:cfgL)[type]||{bg:"transparent",bd:"transparent",tc:VB?"#fff":C.text};
                    return (
                      <div style={{background:cfg.bg,border:"2px solid "+cfg.bd,borderRadius:10,padding:VB?"16px 20px":"12px 16px",marginBottom:10}}>
                        <div style={{fontSize:VB?13:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:cfg.tc,marginBottom:VB?12:8}}>{title}</div>
                        {children}
                      </div>
                    );
                  }

                  function Balk({opt,hl}) {
                    const pct = maxS>0?Math.round(opt.stimmen/maxS*100):0;
                    const tpct = total>0?Math.round(opt.stimmen/total*100):0;
                    const barCol = hl==="g"?(VB?"#4ade80":C.accent):hl==="q"?"#f59e0b":hl==="w"?(VB?"#a78bfa":"#6366f1"):(VB?"rgba(255,255,255,0.15)":"#d1d5db");
                    return (
                      <div style={{marginBottom:VB?10:7}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            {hl==="g"&&<i className="ti ti-circle-check" style={{color:VB?"#4ade80":C.accent,fontSize:13}}/>}
                            <span style={{fontSize:VB?18:14,fontWeight:hl==="g"?700:400,color:hl==="g"?(VB?"#fff":C.accent):(VB?"rgba(255,255,255,0.7)":C.textLight)}}>{opt.name}</span>
                            {opt.istHauptamtlich&&<span style={{fontSize:10,background:VB?"rgba(59,130,246,0.3)":"#dbeafe",color:VB?"#93c5fd":"#1e40af",padding:"1px 5px",borderRadius:4,fontWeight:600}}>kirchl. Dienst</span>}
                          </div>
                          <span style={{fontSize:VB?17:13,fontWeight:600,color:hl==="g"?(VB?"#4ade80":C.accent):(VB?"rgba(255,255,255,0.5)":C.textLight)}}>{opt.stimmen} ({tpct}%)</span>
                        </div>
                        <div style={{background:VB?"rgba(255,255,255,0.1)":"#f3f4f6",borderRadius:4,height:VB?10:7,overflow:"hidden"}}>
                          <div style={{width:pct+"%",height:"100%",background:barCol,borderRadius:4}}/>
                        </div>
                      </div>
                    );
                  }

                  return (
                    <div>
                      {gewNeu.length>0&&<Blk type="g" title={"✓ Gewählt"+(istMehrfachw||isBKRw?" ("+gewNeu.length+" von "+maxAuswahlw+" Plätzen)":"")}>{gewNeu.map(o=><Balk key={o.id} opt={o} hl="g"/>)}</Blk>}
                      {quotaN.length>0&&<Blk type="q" title="⚠ Quota — nicht berücksichtigt (§45 Abs. 2 LWG)">{quotaN.map(o=><Balk key={o.id} opt={o} hl="q"/>)}</Blk>}
                      {!hatGleichstand&&braucht2WGn&&nichtGewN.length>0&&<Blk type="w" title={"⏳ "+offeneN+" Platz"+(offeneN>1?"e":"")+" offen — "+(istFWGw?"Stichwahl":"2. Wahlgang")+" erforderlich"}>{nichtGewN.map(o=><Balk key={o.id} opt={o} hl="w"/>)}</Blk>}
                      {hatGleichstand&&<Blk type="w" title={"⚖ Gleichstand — "+(istFWGw?"Stichwahl":"2. Wahlgang")+" erforderlich"}>{optErgebnisse.filter(e=>!e.istEnthaltung&&!gewNeu.some(g=>g.id===e.id)).map(o=><Balk key={o.id} opt={o} hl="w"/>)}</Blk>}
                      {gescheitern&&<Blk type="e" title="✕ Kein Kandidat hat 1/3 erreicht — neue Wahl in späterer Sitzung">{nichtGewN.map(o=><Balk key={o.id} opt={o} hl="n"/>)}</Blk>}
                      {!braucht2WGn&&!hatGleichstand&&!gescheitern&&nichtGewN.length>0&&<div style={{marginTop:4}}>{nichtGewN.map(o=><Balk key={o.id} opt={o} hl="n"/>)}</div>}
                      {optErgebnisse.filter(o=>o.istEnthaltung).map(o=><div key={o.id} style={{marginTop:4}}><Balk opt={o} hl="n"/></div>)}
                    </div>
                  );
                })()}
              </div>}
              {letzteAktualisierung&&<div style={{ paddingBottom:VB?12:6, marginLeft:"auto" }}><div style={{ fontSize:12, color:col(C.textLight,"rgba(255,255,255,0.4)") }}>Letzte Aktualisierung: {letzteAktualisierung.toLocaleTimeString("de-DE")}</div><div style={{ fontSize:11, color:col(C.textLight,"rgba(255,255,255,0.3)") }}>Auto-Refresh alle 30 Sekunden</div></div>}
            </div>
          </div>
          {wahlGeschlossen
            ? <BalkenDiagramm opts={optErgebnisse} totalStimmen={total} maxStimmen={maxS} gross={VB} gewinnerListe={gewaehlteKandidaten} gleichstandListe={hatGleichstand?[...gleichstandKandidaten,...(gewinner.slice(-1))]:[]}/>
            : <div style={{ padding:"20px 0", textAlign:"center", color:C.textLight, fontSize:14, background:C.bg, borderRadius:8 }}>
                <div style={{ fontSize:32, marginBottom:8 }}><i className="ti ti-lock" aria-hidden="true" style={{fontSize:32, color:C.textLight}}/></div>
                <p style={{ margin:0, fontWeight:600 }}>Ergebnisse und Stimmverteilung werden erst nach dem Schließen der Wahl angezeigt.</p>
              </div>
          }
          {wahlGeschlossen&&stichwahNötig&&!VB&&(
            <div style={{ marginTop:24, padding:16, borderRadius:10, background:stichwahExistiert?"#f0fdf4":"#fff8e1", border:`1px solid ${stichwahExistiert?"#22c55e":"#f59e0b"}` }}>
              {stichwahExistiert?<p style={{ fontWeight:700, color:"#166534" }}><i className="ti ti-circle-check" aria-hidden="true" style={{color:C.success}}/> Stichwahl bereits angelegt: "{stichwahSuchTitel}"</p>:<>
                {hatGleichstand&&<p style={{ fontWeight:700, color:"#92400e", marginBottom:8 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Gleichstand: {[...gleichstandKandidaten,...gewinner.slice(-1)].map(k=>k.name).join(", ")} — je {gewinnerSchwelle} Stimmen.</p>}
                {!mehrheitErreicht&&!hatGleichstand&&!wahlIstStichwahl&&<p style={{ fontWeight:700, color:"#92400e", marginBottom:8 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Absolute Mehrheit (>50%) nicht erreicht.</p>}
                {!mehrheitErreicht&&wahlIstStichwahl&&gewinner.length>0&&!pruefeStichwahl(gewinner[0].stimmen,total)&&(
                  <><p style={{ fontWeight:700, color:C.error, marginBottom:4 }}><i className="ti ti-circle-x" aria-hidden="true"/> Kein Kandidat hat die erforderliche Mindestanzahl von 1/3 der Stimmen erreicht.</p>
                  <p style={{ fontSize:12, color:"#7b2d2d", marginBottom:12 }}>Gem. Grundordnung § Abs. 1 Nr. 4 ist keine weitere automatische Stichwahl vorgesehen. Die Versammlung muss über das weitere Vorgehen beraten.</p></>
                )}
                {(!wahlIstStichwahl||(wahlIstStichwahl&&gewinner.length>0&&pruefeStichwahl(gewinner[0].stimmen,total)))&&<p style={{ fontSize:13, color:"#78350f", marginBottom:12 }}>Eine Stichwahl ist erforderlich.</p>}
                {wahlenFrisch&&<StichwahVorbereiten
                  wahl={wahl}
                  kandidaten={hatGleichstand?[...gleichstandKandidaten,...gewinner.slice(-1)]:sichereGewinner}
                  wahllokalID={wahllokalID}
                  isLeitung={isLeitung}
                  onDataChange={onDataChange}
                  wahlen={wahlen}
                />}
              </>}
            </div>
          )}
        </>
      )}
      {ergebnisse===null&&<div style={{ textAlign:"center", padding:48, color:col(C.textLight,"rgba(255,255,255,0.5)") }}>Wird geladen…</div>}
      {ergebnisse!==null&&total===0&&<div style={{ textAlign:"center", padding:48, color:col(C.textLight,"rgba(255,255,255,0.5)") }}>Noch keine Stimmen abgegeben.</div>}
    </div>
  );
}

function StatCard({ num, label, color, hint=null, onHintClick=null }) {
  return (
    <div style={S.statCard}>
      <div style={{ ...S.statNum, color }}>{num}</div>
      <div style={S.statLabel}>{label}</div>
      {hint && num===0 && (
        <div onClick={onHintClick}
          style={{ fontSize:11, color:onHintClick?C.primary:C.textLight, marginTop:6,
            cursor:onHintClick?"pointer":"default", textDecoration:onHintClick?"underline":"none",
            lineHeight:1.4 }}>
          {hint}
        </div>
      )}
    </div>
  );
}

function WahlForm({ form, onSave, onCancel, saving, fehler, wahltag=null }) {
  const [f, setF] = useState(form);
  function setField(key,val){ setF(x=>({...x,[key]:val})); }
  function addOption(){ setF(x=>({...x, optionen:[...x.optionen.filter(o=>!o.istEnthaltung),{ id:null, _tempKey:"tmp_"+Date.now(), name:"", istEnthaltung:false },...x.optionen.filter(o=>o.istEnthaltung)]})); }
  function setOptName(key,name){ setF(x=>({...x, optionen:x.optionen.map(o=>(o.id===key||o._tempKey===key)?{...o,name}:o)})); }
  function removeOpt(key){ setF(x=>({...x, optionen:x.optionen.filter(o=>o.id!==key&&o._tempKey!==key)})); }
  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}><button style={{ ...S.btn, ...S.btnGhost }} onClick={onCancel}>← Zurück</button><h3 style={{ margin:0, color:C.primary }}>{f.isNew?"Neue Wahl":"Wahl bearbeiten"}</h3></div>
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      <div style={S.card}>
        <div style={S.formGroup}>
          <label style={S.label}>Titel</label>
          <input style={{ ...S.input, ...(f.istStichwahl?{ background:"#f5f5f5", color:"#555" }:{}) }}
            value={f.titel}
            onChange={e=>!f.istStichwahl&&setField("titel",e.target.value)}
            readOnly={!!f.istStichwahl}
            placeholder="z.B. Diakoniepfarrer*in"/>
          {f.istStichwahl&&<p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>Titel einer Stichwahl kann nicht geändert werden.</p>}
        </div>
        {f.istStichwahl&&<div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", fontSize:13, marginBottom:16 }}><i className="ti ti-info-circle" aria-hidden="true"/> Die Stichwahl ist nach dem Speichern sofort startbereit — einfach auf ▶ Starten klicken.</div>}
        {!f.istStichwahl && (
          <div style={S.formGroup}>
            <label style={S.label}>Startzeit</label>
            {wahltag?.datum && <p style={{ fontSize:11, color:C.primary, margin:"2px 0 8px", display:"flex", alignItems:"center", gap:4 }}>
              <i className="ti ti-calendar" aria-hidden="true"/>
              {new Date(wahltag.datum+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
            </p>}
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <select style={{ ...S.input, width:70 }}
                  value={f.startzeit ? (f.startzeit.includes("T") ? f.startzeit.slice(11,13) : f.startzeit.slice(0,2)) : ""}
                  onChange={e=>{
                    if (!e.target.value) return;
                    const datum = wahltag?.datum?.slice(0,10) || new Date().toISOString().slice(0,10);
                    const m = f.startzeit ? (f.startzeit.includes("T") ? f.startzeit.slice(14,16) : f.startzeit.slice(3,5)) : "00";
                    setField("startzeit", datum + "T" + e.target.value + ":" + (m||"00"));
                  }}>
                  <option value="">Std.</option>
                  {Array.from({length:24}, (_,i)=>{
                    const h = String(i).padStart(2,"0");
                    return <option key={i} value={h}>{h}</option>;
                  })}
                </select>
                <span style={{ color:C.textLight, fontWeight:700 }}>:</span>
                <select style={{ ...S.input, width:70 }}
                  value={f.startzeit ? (f.startzeit.includes("T") ? f.startzeit.slice(14,16) : f.startzeit.slice(3,5)) : ""}
                  onChange={e=>{
                    if (!e.target.value) return;
                    const datum = wahltag?.datum?.slice(0,10) || new Date().toISOString().slice(0,10);
                    const h = f.startzeit ? (f.startzeit.includes("T") ? f.startzeit.slice(11,13) : f.startzeit.slice(0,2)) : "08";
                    setField("startzeit", datum + "T" + (h||"08") + ":" + e.target.value);
                  }}>
                  <option value="">Min.</option>
                  {Array.from({length:12}, (_,i)=>{
                    const m = String(i*5).padStart(2,"0");
                    return <option key={i} value={m}>{m}</option>;
                  })}
                </select>
                <span style={{ fontSize:13, color:C.textLight }}>Uhr</span>
              </div>
            </div>
            <p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>Die Wahl bleibt zunächst pausiert — nach dem Starten erscheint bis zur Startzeit ein Countdown.</p>
          </div>
        )}
        <div style={S.formGroup}>
          <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:f.hatEndzeit?10:0 }}>
            <input type="checkbox" checked={!!f.hatEndzeit} onChange={e=>setF(x=>({...x, hatEndzeit:e.target.checked, endzeit:e.target.checked ? (x.endzeit || "") : ""}))}/>
            <span style={S.label}>Endzeit festlegen (optional)</span>
          </label>
          {f.hatEndzeit&&(()=>{
            const startVal = f.startzeit?(f.startzeit.includes("Z")?toLocalInputValue(new Date(f.startzeit)):f.startzeit.slice(0,16)):"";
            return (<>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <select style={{ ...S.input, width:70 }}
                  value={f.endzeit ? (f.endzeit.includes("T") ? f.endzeit.slice(11,13) : f.endzeit.slice(0,2)) : ""}
                  onChange={e=>{
                    if (!e.target.value) return;
                    const datum = wahltag?.datum?.slice(0,10) || new Date().toISOString().slice(0,10);
                    const m = f.endzeit ? (f.endzeit.includes("T") ? f.endzeit.slice(14,16) : f.endzeit.slice(3,5)) : "00";
                    setField("endzeit", datum + "T" + e.target.value + ":" + (m||"00"));
                  }}>
                  <option value="">Std.</option>
                  {Array.from({length:24}, (_,i)=>{
                    const h = String(i).padStart(2,"0");
                    return <option key={i} value={h}>{h}</option>;
                  })}
                </select>
                <span style={{ color:C.textLight, fontWeight:700 }}>:</span>
                <select style={{ ...S.input, width:70 }}
                  value={f.endzeit ? (f.endzeit.includes("T") ? f.endzeit.slice(14,16) : f.endzeit.slice(3,5)) : ""}
                  onChange={e=>{
                    if (!e.target.value) return;
                    const datum = wahltag?.datum?.slice(0,10) || new Date().toISOString().slice(0,10);
                    const h = f.endzeit ? (f.endzeit.includes("T") ? f.endzeit.slice(11,13) : f.endzeit.slice(0,2)) : "08";
                    setField("endzeit", datum + "T" + (h||"08") + ":" + e.target.value);
                  }}>
                  <option value="">Min.</option>
                  {Array.from({length:12}, (_,i)=>{
                    const m = String(i*5).padStart(2,"0");
                    return <option key={i} value={m}>{m}</option>;
                  })}
                </select>
                <span style={{ fontSize:13, color:C.textLight }}>Uhr</span>
              </div>
              {f.endzeit&&f.startzeit&&(()=>{
                const st = f.startzeit.includes("T") ? f.startzeit.slice(11,16) : f.startzeit.slice(0,5);
                const vt = f.endzeit.includes("T") ? f.endzeit.slice(11,16) : f.endzeit.slice(0,5);
                return vt<=st ? <p style={{ color:C.error, fontSize:12, marginTop:4 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Endzeit muss nach der Startzeit liegen.</p> : null;
              })()}
            </>);
          })()}
        </div>
        <div style={{ marginBottom:16, opacity:f.hatStimmen?0.5:1, pointerEvents:f.hatStimmen?"none":"auto" }}>
          <div style={{ display:"flex", gap:16, flexWrap:"wrap", marginBottom:8 }}>
            <label style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", fontSize:14 }}>
              <input type="radio" name="wahltyp" checked={f.wahltyp!=="bkr"&&!f.mehrfach}
                onChange={()=>{setField("mehrfach",false);setField("maxAuswahl",1);setField("exakt",false);setField("wahltyp","normal");}}
                style={{ accentColor:C.primary }}/> Einzelwahl
            </label>
            <label style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", fontSize:14 }}>
              <input type="radio" name="wahltyp" checked={f.wahltyp!=="bkr"&&!!f.mehrfach}
                onChange={()=>{setField("mehrfach",true);setField("exakt",false);setField("wahltyp","normal");}}
                style={{ accentColor:C.primary }}/> Mehrfachauswahl
            </label>
            <label style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer", fontSize:14 }}>
              <input type="radio" name="wahltyp" checked={f.wahltyp==="bkr"}
                onChange={()=>{setField("wahltyp","bkr");setField("mehrfach",true);setField("exakt",false);}}
                style={{ accentColor:C.primary }}/>
              <i className="ti ti-building-church" aria-hidden="true" style={{marginRight:4}}/>Bezirkskirchenratswahl (§45/46 LWG)
            </label>
          </div>
          {f.wahltyp!=="bkr"&&f.mehrfach&&(
            <div style={{ display:"flex", gap:16, flexWrap:"wrap", marginTop:4 }}>
              <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:14 }}>
                <input type="checkbox" checked={f.exakt} disabled={!!f.hatStimmen} onChange={e=>setField("exakt",e.target.checked)}/>Exakte Anzahl
              </label>
              <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:14 }}>
                Max: <input style={{ ...S.input, width:60 }} type="number" min={1} value={f.maxAuswahl} disabled={!!f.hatStimmen} onChange={e=>setField("maxAuswahl",parseInt(e.target.value))}/>
              </label>
            </div>
          )}
          {f.wahltyp==="bkr"&&(()=>{
            const maxH = berechneBKRQuota(f);
            const maxAuswahl = f.maxAuswahl||1;
            const kandidatenH = (f.optionen||[]).filter(o=>!o.istEnthaltung&&o.istHauptamtlich).length;
            const quotaWarn = kandidatenH > maxH;
            function Stepper({label, hint, value, onChange, min=0, max=20}) {
              return (
                <div style={{ marginBottom:16 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:C.text, marginBottom:2 }}>{label}</div>
                  {hint&&<div style={{ fontSize:11, color:C.textLight, marginBottom:6 }}>{hint}</div>}
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <button type="button" onClick={()=>onChange(Math.max(min,value-1))}
                      style={{ width:32, height:32, borderRadius:8, border:`1px solid ${C.border}`, background:C.bgWhite, cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>−</button>
                    <span style={{ fontSize:20, fontWeight:700, color:C.primary, minWidth:32, textAlign:"center" }}>{value}</span>
                    <button type="button" onClick={()=>onChange(Math.min(max,value+1))}
                      style={{ width:32, height:32, borderRadius:8, border:`1px solid ${C.border}`, background:C.bgWhite, cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>+</button>
                  </div>
                </div>
              );
            }
            return (
              <div style={{ ...S.card, background:"#f0f4ff", border:`1.5px solid ${C.primary}`, marginTop:12 }}>
                <div style={{ fontSize:11, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:C.primary, marginBottom:12 }}>
                  Quota §45 Abs. 2 LWG
                </div>
                <div style={{ display:"flex", gap:32, flexWrap:"wrap" }}>
                  <Stepper
                    label="Bereits kraft Amtes: im kirchl. Dienst"
                    hint="Dekan/in, Dekanstellv., Schuldekan/in etc."
                    value={f.kraftAmtesHauptamtlich||0}
                    onChange={v=>setField("kraftAmtesHauptamtlich",v)}/>
                  <Stepper
                    label="Bereits kraft Amtes: andere Mitglieder"
                    hint="Vorsitz Bezirkssynode etc."
                    value={f.kraftAmtesEhrenamtlich||0}
                    onChange={v=>setField("kraftAmtesEhrenamtlich",v)}/>
                  <Stepper
                    label="Zu wählende Mitglieder (gesamt)"
                    hint="Max. 14 laut §45 Abs. 1 LWG"
                    value={maxAuswahl}
                    min={1} max={14}
                    onChange={v=>setField("maxAuswahl",v)}/>
                </div>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:12, display:"flex", gap:24, flexWrap:"wrap" }}>
                  <div style={{ fontSize:13 }}>
                    <span style={{ fontWeight:700, color:maxH===0?C.error:C.primary }}>{maxH}</span>
                    <span style={{ color:C.textLight }}> von {maxAuswahl} Plätzen für Personen im kirchl. Dienst</span>
                  </div>
                  <div style={{ fontSize:13 }}>
                    <span style={{ fontWeight:700, color:C.accent }}>{maxAuswahl-maxH}</span>
                    <span style={{ color:C.textLight }}> von {maxAuswahl} Plätzen für andere Mitglieder</span>
                  </div>
                </div>
                {maxH===0&&(
                  <div style={{ ...S.alert, background:"#fef3c7", border:"1px solid #fbbf24", color:"#92400e", fontSize:12, marginTop:8 }}>
                    <i className="ti ti-alert-triangle" aria-hidden="true"/> Aufgrund der Kraft-Amtes-Zusammensetzung können bei dieser Wahl keine Personen im kirchlichen Dienst gewählt werden — alle Plätze müssen mit anderen Mitgliedern besetzt werden (§45 Abs. 2 LWG).
                  </div>
                )}
                {kandidatenH>0&&(
                  <div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", fontSize:12, marginTop:10 }}>
                    <i className="ti ti-info-circle" aria-hidden="true"/> {kandidatenH} Kandidierende im kirchl. Dienst — davon können max. {maxH} gewählt werden. Mehrere dürfen kandidieren.
                  </div>
                )}
                {(()=>{
                  const nichtEnthaltung = (f.optionen||[]).filter(o=>!o.istEnthaltung);
                  const anzahl = nichtEnthaltung.length;
                  const diff = maxAuswahl - anzahl;
                  if (diff > 0) return (
                    <div style={{ ...S.alert, background:"#fef2f2", border:`1px solid ${C.error}`, color:"#7b2d2d", fontSize:12, marginTop:10 }}>
                      <i className="ti ti-alert-circle" aria-hidden="true"/> Zu wenige Kandidierende: {anzahl} eingetragen, {maxAuswahl} Sitze zu vergeben. Bitte {diff} weitere Kandidierende hinzufügen — die Wahl kann so nicht gespeichert werden.
                    </div>
                  );
                  if (diff < 0) return (
                    <div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", fontSize:12, marginTop:10 }}>
                      <i className="ti ti-info-circle" aria-hidden="true"/> Es gibt mehr Kandidierende ({anzahl}) als Plätze ({maxAuswahl}) — die Stimmberechtigten wählen aus allen Kandidierenden.
                    </div>
                  );
                  if (diff === 0 && anzahl > 0) return (
                    <div style={{ ...S.alert, background:"#f0faf5", border:"1px solid #6ee7b7", color:"#065f46", fontSize:12, marginTop:10 }}>
                      <i className="ti ti-circle-check" aria-hidden="true"/> Gleich viele Kandidierende wie Plätze ({anzahl}) — gem. §46 Abs. 5 LWG wäre eine offene Abstimmung möglich, sofern kein Mitglied widerspricht.
                    </div>
                  );
                  return null;
                })()}
              </div>
            );
          })()}
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>Kandidaten</label>
          {f.hatStimmen&&<div style={{ ...S.alert, ...S.alertWarning, marginBottom:12 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Bereits Stimmen abgegeben — Kandidaten können nicht mehr geändert werden.</div>}
          {f.optionen.filter(o=>!o.istEnthaltung).map((o,idx,arr)=>(
            <div key={o.id||o._tempKey||idx} style={{ display:"flex", gap:8, marginBottom:8 }}>
              {(() => {
                const istGespeichert = o.id && !isNaN(parseInt(o.id));
                const nameReadonly = f.hatStimmen && istGespeichert;
                return (<>
                  <input
                    style={{ ...S.input, flex:1, ...(nameReadonly?{ background:"#f5f5f5", color:"#555" }:{}) }}
                    value={o.name}
                    onChange={e=>!nameReadonly&&setOptName(o.id||o._tempKey,e.target.value)}
                    placeholder="Name"
                    readOnly={nameReadonly}
                    autoFocus={!nameReadonly&&idx===arr.length-1&&o.name===""}
                    onKeyDown={e=>{ if(e.key==="Enter"&&!nameReadonly){ e.preventDefault(); addOption(); } }}
                    title={nameReadonly?"Name kann nicht geändert werden da bereits Stimmen abgegeben wurden.":""}
                  />
                  {f.wahltyp==="bkr" && !o.istEnthaltung && (
                    <button type="button"
                      onClick={()=>{
                        setField("optionen", f.optionen.map(opt=>
                          (opt.id||opt._tempKey)===(o.id||o._tempKey)
                            ? {...opt, istHauptamtlich: !opt.istHauptamtlich}
                            : opt
                        ));
                      }}
                      title="Klicken um Status zu wechseln"
                      style={{ padding:"3px 8px", borderRadius:6, fontSize:11, fontWeight:600, cursor:"pointer",
                        border:`1.5px solid ${o.istHauptamtlich?"#1e40af":"#16a34a"}`,
                        background:o.istHauptamtlich?"#dbeafe":"#dcfce7",
                        color:o.istHauptamtlich?"#1e40af":"#16a34a",
                        whiteSpace:"nowrap" }}>
                      {o.istHauptamtlich ? "kirchl. Dienst" : "andere/r"}
                    </button>
                  )}
                  {!f.hatStimmen&&<button style={{ ...S.btn, ...S.btnDanger }} onClick={()=>removeOpt(o.id||o._tempKey)}><i className="ti ti-x" aria-hidden="true"/></button>}
                  {f.hatStimmen&&!istGespeichert&&<button style={{ ...S.btn, ...S.btnDanger }} onClick={()=>removeOpt(o.id||o._tempKey)}><i className="ti ti-x" aria-hidden="true"/></button>}
                </>);
              })()}
            </div>
          ))}
          {!f.hatStimmen&&<button style={{ ...S.btn, ...S.btnGhost, marginTop:4 }} onClick={addOption}>+ Kandidat hinzufügen</button>}
        </div>
        <div style={{ marginBottom:16 }}>
          <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:14 }}>
            <input type="checkbox" checked={f.optionen.some(o=>o.istEnthaltung)} onChange={e=>{ if(e.target.checked) setF(x=>({...x, optionen:[...x.optionen.filter(o=>!o.istEnthaltung),{ id:null, _tempKey:"tmp_enth_"+Date.now(), name:"Enthaltung", istEnthaltung:true }]})); else setF(x=>({...x, optionen:x.optionen.filter(o=>!o.istEnthaltung)})); }}/>
            Enthaltung als Option anbieten
          </label>
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>Mehrheitsregel</label>
          <div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", fontSize:13, marginBottom:0 }}>
            <i className="ti ti-info-circle" aria-hidden="true"/> {f.istStichwahl
              ? "Stichwahl: Einfache Mehrheit + mind. 1/3 der abgegebenen Stimmen (gem. Grundordnung § Abs. 1 Nr. 4)"
              : "Erster Wahlgang: Absolute Mehrheit (>50% aller abgegebenen Stimmen inkl. Enthaltungen, gem. Grundordnung § Abs. 1 Nr. 3)"}
          </div>
        </div>
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button style={{ ...S.btn, ...S.btnGhost }} onClick={onCancel}>Abbrechen</button><button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>onSave(f)} disabled={saving}>{saving?"Speichern…":"Speichern"}</button></div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
