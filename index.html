          {schritte.map(s=>(
            <button key={s.id} onClick={()=>setSchritt(s.id)}
              style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                gap:2, padding:"6px 2px", border:"none", background:"transparent", cursor:"pointer",
                color:schritt===s.id?C.primary:C.textLight, fontSize:9, fontWeight:schritt===s.id?700:400,
                borderTop:schritt===s.id?`2px solid ${C.primary}`:"2px solid transparent" }}>
              <i className={`ti ${s.icon}`} aria-hidden="true" style={{fontSize:18}}/>
              {s.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function LeitungTagestoken({ appData, eventID, wahltag, onDataChange, isMobile, onTokensChanged, onWahltag }) {
  const [tokens, setTokens] = useState([]);
  const [loading, setLoading] = useState(true);
  const [generating, setGenerating] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [fehler, setFehler] = useState(null);
  const [erfolg, setErfolg] = useState(null);
  const [kontrollcode, setKontrollcode] = useState(wahltag.kontrollcode||null);
  const [letzterKontrollcode, setLetzterKontrollcode] = useState(null);
  const [mitQR, setMitQR] = useState(true);
  const wahllokal = appData.wahllokale.find(w=>w.eventID===eventID);
  const datum = wahltag.datum?.slice(0,10);

  async function laden() {
    setLoading(true);
    try {
      const res = await callFlow("getDaten", { eventID, wahllokalID:eventID });
      const allTokens = (res?.tokenList||[]).map(mapToken);
      const tagesTokens = allTokens.filter(t=>{
        const ta = t.gueltigAm ? t.gueltigAm.slice(0,10) : null;
        return ta === datum;
      });
      setTokens(tagesTokens);
      // Kontrollcode aus geladenen Tokens aktualisieren
      const kc = tagesTokens.find(t=>t.kontrollcode)?.kontrollcode || null;
      if (kc) setKontrollcode(kc);
      // Fehler löschen nach erfolgreichem Laden
      if (tagesTokens.length > 0) setFehler(null);
    } catch(e) { setFehler(e.message); }
    setLoading(false);
  }

  useEffect(() => { laden(); }, []);

  async function generieren() {
    setGenerating(true); setFehler(null);
    showLoading(`${wahltag.anzahlStimmberechtigte} Tagestoken werden generiert — bitte warten…`);
    try {
      await callFlow("generateTagestoken", { apiKey:API.key, eventID, datum });
    } catch(e) {
      // 502 ist normal bei vielen Tokens — Flow läuft weiter im Hintergrund
    }
    // Warten dann laden — unabhängig vom Flow-Ergebnis
    // 130 Tokens brauchen ca. 60-90 Sekunden
    const ziel = wahltag.anzahlStimmberechtigte;
    let aktuell = 0;
    const warteSchritte = [6000, 8000, 8000, 8000, 8000, 8000, 8000, 10000];
    for (const warte of warteSchritte) {
      await new Promise(r=>setTimeout(r, warte));
      await laden();
      // Prüfe ob alle Tokens da sind
      const res2 = await callFlow("getDaten", { eventID, wahllokalID: eventID });
      const tT = (res2?.tokenList||[]).map(mapToken).filter(t=>{
        const raw = t.gueltigAm || null;
        return raw && raw.slice(0,10) === datum;
      });
      aktuell = tT.length;
      if (tT.length > 0) {
        setTokens(tT);
        setFehler(null);
        const kc = tT.find(t=>t.kontrollcode)?.kontrollcode || null;
        if (kc) setKontrollcode(kc);
        showLoading(`Tokens werden generiert (${tT.length} von ${ziel})…`);
      }
      if (tT.length >= ziel) break;
    }
    hideLoading();
    await laden();
    setGenerating(false);
    setFehler(null);
    // Reset anzahlGeaendert — neue Tokens entsprechen aktueller Anzahl
    onWahltag && onWahltag(wt => ({ ...wt, anzahlGeaendert: false }));
    onDataChange(); onTokensChanged();
  }

  async function alleLoeschen() {
    const ok = await new Promise(resolve => {
      const div = document.createElement("div");
      div.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
      div.innerHTML = `<div style="background:#fff;border-radius:12px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
        <div style="font-size:18px;font-weight:700;color:#1a3a5c;margin-bottom:12px">Tagestoken löschen</div>
        <p style="font-size:14px;color:#555;line-height:1.6;margin:0 0 8px">Alle ${tokens.length} Tagestoken für den <strong>${datum}</strong> wirklich löschen?</p>
        <p style="font-size:13px;color:#e24b4a;margin:0 0 20px">Der Kontrollcode wird zurückgesetzt. Ein bereits verteilter Ausdruck wäre damit ungültig.</p>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="dlg-cancel" style="padding:8px 16px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-size:14px">Abbrechen</button>
          <button id="dlg-ok" style="padding:8px 16px;background:#e24b4a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">Alle löschen</button>
        </div>
      </div>`;
      document.body.appendChild(div);
      div.querySelector("#dlg-ok").onclick = () => { document.body.removeChild(div); resolve(true); };
      div.querySelector("#dlg-cancel").onclick = () => { document.body.removeChild(div); resolve(false); };
      div.onclick = e => { if(e.target===div){ document.body.removeChild(div); resolve(false); } };
    });
    if (!ok) return;
    setDeleting(true); setFehler(null); showLoading("Tagestoken werden gelöscht…");
    try {
      await callFlow("deleteTagestoken", { apiKey:API.key, eventID, datum });
      setKontrollcode(null); setLetzterKontrollcode(null); setTokens([]);
      setErfolg("Alle Tagestoken gelöscht."); setTimeout(()=>setErfolg(null), 3000);
      onDataChange(); onTokensChanged();
    } catch(e) { setFehler(e.message); }
    setDeleting(false); hideLoading();
  }

  function drucken() {
    showLoading("PDF wird vorbereitet…"); setTimeout(hideLoading, 2000);
    const druckTokens = tokens.filter(t=>t.aktiv&&!t.verwendet).map(t=>t.code);
    if (druckTokens.length===0) { setFehler("Keine druckbaren Tokens vorhanden."); return; }
    const gespeicherterKontrollcode = tokens.find(t=>t.kontrollcode)?.kontrollcode || kontrollcode;
    // Gesamtanzahl = tatsächliche Token-Anzahl — nicht anzahlStimmberechtigte (könnte abweichen)
    const gesamtanzahl = tokens.length;
    generiereTokenPDF(druckTokens, wahllokal?.name||eventID, eventID, true, gespeicherterKontrollcode, gesamtanzahl);
  }

  const aktiveTokens = tokens.filter(t=>t.aktiv&&!t.verwendet).length;
  const verwendete = tokens.filter(t=>t.verwendet).length;

  return (
    <div>
      {fehler && tokens.length===0 && !loading && !generating && !erfolg && <div style={{ ...S.alert, ...S.alertError, marginBottom:12 }}>{fehler}</div>}
      {erfolg && <div style={{ ...S.alert, ...S.alertSuccess, marginBottom:12 }}><i className="ti ti-circle-check" aria-hidden="true"/> {erfolg}</div>}

      {/* Warnung wenn Token-Anzahl nicht mit Stimmberechtigten übereinstimmt */}
      {!generating && tokens.length > 0 && wahltag.anzahlStimmberechtigte && tokens.length !== wahltag.anzahlStimmberechtigte && (
        <div style={{ ...S.alert, background:"#fef3c7", border:"1px solid #fbbf24", color:"#92400e", marginBottom:12 }}>
          <i className="ti ti-alert-triangle" aria-hidden="true"/>
          <strong> Tagestoken nicht aktuell:</strong> Es wurden {tokens.length} Tokens generiert, aber die Anzahl der Stimmberechtigten beträgt jetzt {wahltag.anzahlStimmberechtigte}.
          Bitte neue Tagestoken generieren — bestehende Tokens sind ungültig.
        </div>
      )}
      {/* Kontrollcode Banner */}
      {(kontrollcode||letzterKontrollcode) && (
        <div style={{ ...S.card, background:"#f0f4ff", border:`1.5px solid ${C.primary}`, marginBottom:16, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
          <div>
            <div style={{ fontSize:11, color:C.textLight, marginBottom:2 }}>Kontrollcode</div>
            <div style={{ fontFamily:"monospace", fontSize:20, fontWeight:700, color:C.primary, letterSpacing:"0.1em" }}>{kontrollcode||letzterKontrollcode}</div>
          </div>
          <div style={{ fontSize:12, color:C.textLight }}>Mit Deckblatt des PDF-Ausdrucks vergleichen</div>
        </div>
      )}

      {/* Status */}
      <div style={{ ...S.card, marginBottom:16 }}>
        <div style={S.sectionLabel}>Tagestoken — {datum}</div>
        <div style={{ display:"flex", gap:24, flexWrap:"wrap", marginBottom:16 }}>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:C.primary }}>{wahltag.anzahlStimmberechtigte}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Stimmberechtigte</div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:tokens.length>0?C.accent:C.textLight }}>{tokens.length}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Generiert</div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:C.primary }}>{aktiveTokens}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Verfügbar</div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:verwendete>0?C.accent:C.textLight }}>{verwendete}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Verwendet</div>
          </div>
        </div>

        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {tokens.length===0 ? (
            <button style={{ ...S.btn, ...S.btnPrimary }} onClick={generieren} disabled={generating}>
              {generating ? "Wird generiert…" : <><i className="ti ti-ticket" aria-hidden="true"/> {wahltag.anzahlStimmberechtigte} Tagestoken generieren</>}
            </button>
          ) : (
            <>
              <button style={{ ...S.btn, ...S.btnGhost }} onClick={drucken} disabled={aktiveTokens===0}>
                <i className="ti ti-printer" aria-hidden="true"/> PDF drucken ({aktiveTokens})
              </button>
              {verwendete === 0 ? (
                <button style={{ ...S.btn, ...S.btnGhostDanger }} onClick={alleLoeschen} disabled={deleting}>
                  {deleting?"…":<><i className="ti ti-trash" aria-hidden="true"/> Alle löschen</>}
                </button>
              ) : (
                <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:C.textLight }}>
                  <i className="ti ti-lock" aria-hidden="true"/>
                  Löschen gesperrt — {verwendete} Stimme{verwendete!==1?"n":""} bereits abgegeben
                </div>
              )}
            </>
          )}
          <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={laden} disabled={loading}>
            <i className="ti ti-refresh" aria-hidden="true"/>
          </button>
        </div>

        {tokens.length > 0 && verwendete === 0 && (
          <p style={{ fontSize:12, color:C.textLight, marginTop:10 }}>
            <i className="ti ti-info-circle" aria-hidden="true"/> Löschen nur wenn eine Korrektur nötig ist — z.B. falsche Anzahl. Sobald eine Stimme abgegeben wurde ist das Löschen gesperrt.
          </p>
        )}
      </div>

      {/* Token-Liste direkt */}
      {!loading && tokens.length > 0 && (
        <div style={S.card}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:8, flexWrap:"wrap" }}>
            <div style={S.sectionLabel}>Wahlcodes ({tokens.length})</div>
            <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={laden} disabled={loading}>
              <i className="ti ti-refresh" aria-hidden="true"/>
            </button>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {tokens.map((t,i) => {
              const abgelaufen = t.gueltigAm && t.gueltigAm < new Date().toISOString().slice(0,10);
              return (
                <div key={t.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px",
                  background:t.verwendet?"#f0faf5":t.aktiv?C.bgWhite:"#fafafa",
                  borderRadius:8, border:`1px solid ${t.verwendet?C.accent:t.aktiv?C.border:"#eee"}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:11, color:C.textLight, minWidth:24, textAlign:"right" }}>{i+1}</span>
                    <span style={{ fontFamily:"monospace", fontWeight:700, fontSize:15, letterSpacing:"0.1em",
                      textDecoration:!t.aktiv?"line-through":"none", opacity:!t.aktiv?0.4:1, color:C.text }}>
                      {t.code}
                    </span>
                  </div>
                  <span style={{ ...S.badge,
                    ...(t.verwendet?S.badgeGreen:t.aktiv?S.badgeGray:S.badgeRed),
                    fontSize:11 }}>
                    {t.verwendet ? <><i className="ti ti-check" aria-hidden="true"/> verwendet</> :
                     t.aktiv ? "verfügbar" : "gesperrt"}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function LeitungView({ appData, eventID, onExit, onDataChange }) {
  const [gewaehlterWahltag, setGewaehlterWahltag] = useState(null);
  const isMobile = useIsMobile();
  // Session-Timeout: nach 30 Minuten Inaktivität automatisch abmelden
  const TIMEOUT_MS = 30 * 60 * 1000;
  const timeoutRef = useRef(null);
  function resetTimeout() {
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => {
      (() => {
        const div = document.createElement("div");
        div.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
        div.innerHTML = `<div style="background:#fff;border-radius:12px;padding:28px 24px;max-width:360px;width:100%;text-align:center">
          <div style="font-size:40px;margin-bottom:12px">⏱</div>
          <div style="font-size:18px;font-weight:700;color:#1a3a5c;margin-bottom:8px">Sitzung abgelaufen</div>
          <p style="font-size:14px;color:#555;margin:0 0 20px">Sie werden automatisch abgemeldet.</p>
          <button onclick="this.closest('div[style]').remove()" style="padding:8px 24px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">OK</button>
        </div>`;
        document.body.appendChild(div);
        setTimeout(() => { if(div.parentNode) div.parentNode.removeChild(div); }, 3000);
      })();
      onExit();
    }, TIMEOUT_MS);
  }
  useEffect(() => {
    resetTimeout();
    const events = ["mousedown","keydown","touchstart","scroll"];
    events.forEach(e => window.addEventListener(e, resetTimeout));
    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
      events.forEach(e => window.removeEventListener(e, resetTimeout));
    };
  }, []);

  if (gewaehlterWahltag) {
    return <WahltageView
      appData={appData} eventID={eventID} wahltag={gewaehlterWahltag}
      onBack={()=>setGewaehlterWahltag(null)} onExit={onExit}
      onDataChange={onDataChange} isMobile={isMobile}/>;
  }

  return <WahltageAuswahl
    appData={appData} eventID={eventID}
    onSelect={wt=>setGewaehlterWahltag(wt)}
    onExit={onExit} isMobile={isMobile}/>;
}


function WahlleitungAblaufCheckliste({ appData, eventID }) {
  const wahllokal = appData.wahllokale.find(w => w.eventID===eventID);
  const storageKey = `wahlleitung_durchfuehrungscheck_${eventID}`;
  const [offen, setOffen] = useState(false);
  const CHECKS = [
    { id:"stimmberechtigte_bekannt", phase:"Vorbereitung (vor dem Wahltag)", text:"Anzahl der Stimmberechtigten ist bekannt und dokumentiert" },
    { id:"wahltag_angelegt", phase:"Vorbereitung (vor dem Wahltag)", text:"Wahltag mit korrekter Stimmberechtigten-Anzahl angelegt" },
    { id:"wahl_angelegt", phase:"Vorbereitung (vor dem Wahltag)", text:"Wahl(en) angelegt und dem Wahltag zugeordnet" },
    { id:"optionen_angelegt", phase:"Vorbereitung (vor dem Wahltag)", text:"Kandidat:innen, Enthaltung und ggf. weitere Stimmoptionen angelegt" },
    { id:"auswahl_zeit_eingestellt", phase:"Vorbereitung (vor dem Wahltag)", text:"Auswahlregel, Startzeit und ggf. Endzeit eingestellt" },
    { id:"tagestoken_generiert", phase:"Am Wahltag (vor der Wahl)", text:"Tagestoken generiert — Anzahl entspricht Stimmberechtigten" },
    { id:"kontrollcode_geprueft", phase:"Am Wahltag (vor der Wahl)", text:"Kontrollcode im 4-Augen-Prinzip geprüft: App-Anzeige = PDF-Deckblatt" },
    { id:"tokens_gedruckt", phase:"Am Wahltag (vor der Wahl)", text:"Wahlcodes gedruckt und verdeckt vorbereitet" },
    { id:"qr_getestet", phase:"Am Wahltag (vor der Wahl)", text:"Wahlseite / QR-Code auf Beamer getestet" },
    { id:"tokens_ausgegeben", phase:"Am Wahltag (vor der Wahl)", text:"Wahlcodes einzeln und anonym an Stimmberechtigte ausgegeben" },
    { id:"verfahren_erlaeutert", phase:"Durchführung", text:"Wahlverfahren kurz erläutert" },
    { id:"wahl_gestartet", phase:"Durchführung", text:"Wahl gestartet / freigegeben" },
    { id:"stimmen_beobachtet", phase:"Durchführung", text:"Eingegangene Stimmen werden beobachtet" },
    { id:"wlan_notfall", phase:"Durchführung", text:"Bei WLAN-Ausfall: Wahl sofort pausieren — nach Wiederherstellung fortsetzen" },
    { id:"wahl_geschlossen", phase:"Abschluss", text:"Wahl geschlossen" },
    { id:"stimmen_plausibilisiert", phase:"Abschluss", text:"Stimmenanzahl mit Anzahl Stimmberechtigter plausibilisiert" },
    { id:"ergebnis_geprueft", phase:"Abschluss", text:"Ergebnis geprüft und protokolliert" },
    { id:"stichwahl", phase:"Abschluss", text:"Ggf. Stichwahl vorbereitet" },
  ];
  const [checked, setChecked] = useState(()=>{
    try { return JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch { return {}; }
  });
  function toggle(id) {
    const next = { ...checked, [id]: !checked[id] };
    setChecked(next);
    try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch(e) {}
  }
  function exportChecklistePDF() {
    const phasen = {};
    CHECKS.forEach(ch => {
      if (!phasen[ch.phase]) phasen[ch.phase] = [];
      phasen[ch.phase].push(ch);
    });
    const phasenHTML = Object.entries(phasen).map(([phase, checks]) => `
      <div style="margin-bottom:20px">
        <div style="font-size:9pt;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#1a3a5c;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #1a3a5c;">${phase}</div>
        ${checks.map(ch => `
          <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;padding:6px 8px;background:${checked[ch.id]?'#f0faf5':'#fafafa'};border-radius:4px;border-left:3px solid ${checked[ch.id]?'#0f6e56':'#ddd'}">
            <div style="width:16px;height:16px;border:2px solid ${checked[ch.id]?'#0f6e56':'#bbb'};border-radius:3px;flex-shrink:0;margin-top:1px;background:${checked[ch.id]?'#0f6e56':'#fff'};display:flex;align-items:center;justify-content:center;">${checked[ch.id]?'<span style="color:#fff;font-size:10px;font-weight:700;">&#10003;</span>':''}</div>
            <div style="font-size:10pt;color:#333;line-height:1.4;">${ch.text}</div>
          </div>`).join('')}
      </div>`).join('');
    const total = CHECKS.length; const done = CHECKS.filter(ch=>checked[ch.id]).length;
    const now = new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
    const time = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
      @page{size:A4;margin:15mm} body{font-family:Arial,sans-serif;color:#333}
      @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
    </style></head><body>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #1a3a5c;">
      <div>
        <div style="font-size:8pt;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#888;margin-bottom:4px;">Evangelische Landeskirche in Baden</div>
        <div style="font-size:18pt;font-weight:900;color:#1a3a5c;margin-bottom:2px;">Durchführungscheck Wahlleitung</div>
        <div style="font-size:9pt;color:#888;">Gedruckt am ${now} um ${time} Uhr</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22pt;font-weight:900;color:${done===total?'#0f6e56':'#1a3a5c'}">${done}/${total}</div>
        <div style="font-size:8pt;color:#888;">Punkte erledigt</div>
      </div>
    </div>
    ${phasenHTML}
    <div style="margin-top:24px;padding-top:12px;border-top:1px solid #eee;font-size:8pt;color:#aaa;text-align:center;">EKIBA Wahlapp · Freiwillige Orientierung ohne Sperrwirkung</div>
    </body></html>`;
    const win = window.open('','_blank');
    win.document.write(html); win.document.close(); win.focus();
    setTimeout(()=>{ win.print(); }, 600);
  }

  async function reset() {
    const ok = await new Promise(resolve => {
      const div = document.createElement("div");
      div.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
      div.innerHTML = `<div style="background:#fff;border-radius:12px;padding:28px 24px;max-width:380px;width:100%">
        <div style="font-size:17px;font-weight:700;color:#1a3a5c;margin-bottom:10px">Checkliste zurücksetzen</div>
        <p style="font-size:14px;color:#555;margin:0 0 20px">Durchführungscheck für dieses Wahllokal zurücksetzen?</p>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="dlg-c" style="padding:8px 16px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-size:14px">Abbrechen</button>
          <button id="dlg-o" style="padding:8px 16px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Zurücksetzen</button>
        </div>
      </div>`;
      document.body.appendChild(div);
      div.querySelector("#dlg-o").onclick = () => { document.body.removeChild(div); resolve(true); };
      div.querySelector("#dlg-c").onclick = () => { document.body.removeChild(div); resolve(false); };
    });
    if (!ok) return;
    setChecked({});
    try { localStorage.removeItem(storageKey); } catch(e) {}
  }
  const gruppen = CHECKS.reduce((acc,c)=>{ (acc[c.phase]=acc[c.phase]||[]).push(c); return acc; },{});
  const erledigt = CHECKS.filter(c=>checked[c.id]).length;
  return (
    <>
      <div style={{ ...S.card, padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, flexWrap:"wrap", background:"#fbfcfd" }}>
        <div style={{ minWidth:240 }}>
          <div style={{ fontSize:12, fontWeight:800, color:C.primary, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:4 }}>Durchführungscheck Wahlleitung</div>
          <div style={{ fontSize:13, color:C.textLight, lineHeight:1.45 }}>Freiwillige Orientierung für die Durchführung mit der App – ohne Sperrwirkung und ohne Pflichtcharakter.</div>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={exportChecklistePDF} style={{ ...S.btn, ...S.btnGhost, whiteSpace:"nowrap" }}><i className="ti ti-download" aria-hidden="true"/> PDF</button>
          <button onClick={()=>setOffen(true)} style={{ ...S.btn, ...S.btnGhost, whiteSpace:"nowrap" }}><i className="ti ti-checklist" aria-hidden="true"/> Checkliste öffnen</button>
        </div>
      </div>

      {offen && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.38)", zIndex:9997, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ background:C.bgWhite, borderRadius:14, width:"100%", maxWidth:680, maxHeight:"88vh", overflow:"auto", boxShadow:"0 12px 40px rgba(0,0,0,0.22)", border:`1px solid ${C.border}` }}>
            <div style={{ padding:"20px 22px 14px", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:16 }}>
              <div>
                <div style={S.sectionLabel}>Orientierung für die Durchführung</div>
                <h3 style={{ margin:"0 0 6px", color:C.primary, fontSize:20 }}>Durchführungscheck Wahlleitung</h3>
                <p style={{ margin:0, color:C.textLight, fontSize:13, lineHeight:1.5 }}>
                  Für {wahllokal?.name || eventID}. Die Liste dient nur der Selbstvergewisserung und ersetzt kein offizielles Sitzungs- oder Wahlprotokoll.
                </p>
              </div>
              <button onClick={()=>setOffen(false)} style={{ ...S.btn, ...S.btnGhost, padding:"6px 10px" }}><i className="ti ti-x" aria-hidden="true"/></button>
            </div>

            <div style={{ padding:"18px 22px" }}>
              {Object.entries(gruppen).map(([phase, items])=>(
                <div key={phase} style={{ marginBottom:18 }}>
                  <div style={{ fontSize:12, fontWeight:800, color:C.primary, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.06em" }}>{phase}</div>
                  <div style={{ border:`1px solid ${C.border}`, borderRadius:10, overflow:"hidden" }}>
                    {items.map((item, idx)=>(
                      <label key={item.id} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"12px 14px", cursor:"pointer", fontSize:14, lineHeight:1.45, color:C.text, background:checked[item.id]?"#f8fbf9":C.bgWhite, borderTop:idx===0?"none":`1px solid ${C.border}` }}>
                        <input type="checkbox" checked={!!checked[item.id]} onChange={()=>toggle(item.id)} style={{ marginTop:2, width:16, height:16 }}/>
                        <span style={{ textDecoration:checked[item.id]?"line-through":"none", color:checked[item.id]?C.textLight:C.text }}>{item.text}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ))}

              <div style={{ padding:"12px 14px", background:C.bg, borderRadius:10, fontSize:12, color:C.textLight, lineHeight:1.5 }}>
                Häkchen werden nur lokal in diesem Browser gespeichert. Die Wahl kann unabhängig von dieser Liste gestartet, geschlossen und ausgewertet werden.
              </div>
            </div>

            <div style={{ padding:"14px 22px", borderTop:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", gap:10, flexWrap:"wrap", alignItems:"center" }}>
              <span style={{ fontSize:12, color:C.textLight }}>{erledigt} von {CHECKS.length} Punkten markiert</span>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={reset} style={{ ...S.btn, ...S.btnGhost }}>Zurücksetzen</button>
                <button onClick={()=>setOffen(false)} style={{ ...S.btn, ...S.btnPrimary }}>Schließen</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function LeitungDashboard({ appData, eventID, onDataChange, wahltag=null, onSwitchTab=null }) {
  const today = new Date().toLocaleDateString("sv-SE");
  const aktiverWahltag = wahltag || (appData.wahltage||[]).find(wt=>wt.datum===today);
  const tokenCount = aktiverWahltag?.tokensGeneriert ? (aktiverWahltag?.anzahlStimmberechtigte || 0) : 0;
  const alleWahlenGesamt = appData.wahlen.filter(w=>w.eventID===eventID).filter(w=>{
    if (!aktiverWahltag?.datum) return true;
    const wDatum = w.startzeit ? new Date(w.startzeit).toLocaleDateString("sv-SE") : null;
    return wDatum === aktiverWahltag.datum.slice(0,10);
  }).length;
  const wahlenGeschlossen = appData.wahlen.filter(w=>w.eventID===eventID&&w.geschlossen).filter(w=>{
    if (!aktiverWahltag?.datum) return true;
    const wDatum = w.startzeit ? new Date(w.startzeit).toLocaleDateString("sv-SE") : null;
    return wDatum === aktiverWahltag.datum.slice(0,10);
  }).length;
  const wahlen = appData.wahlen.filter(w=>{
    if (w.eventID!==eventID||w.geschlossen) return false;
    if (!aktiverWahltag?.datum) return true;
    const wDatum = w.startzeit ? new Date(w.startzeit).toLocaleDateString("sv-SE") : null;
    return wDatum === aktiverWahltag.datum.slice(0,10);
  });
  const [qrVollbild, setQrVollbild] = useState(false);
  const [toggling, setToggling] = useState(null);
  const wahllokalURL = window.location.origin + window.location.pathname + "?wahllokal=" + eventID;
  const aktiveWahlen = wahlen.filter(w=>w.aktiv&&!w.geschlossen);
  const { confirm, dialog } = useConfirm();

  async function schliesseWahl(wahl) {
    const msg = `Wahl "${wahl.titel}" jetzt endgültig schließen?\n\nNach dem Schließen:\n✓ Das Ergebnis wird für alle sichtbar\n✓ Keine weiteren Stimmabgaben möglich\n✗ Kann nicht rückgängig gemacht werden\n\nWichtig bei Gleichstand oder nicht erreichter Mehrheit:\nFür eine Stichwahl bleiben alle bisherigen Zugangscodes/Wahlcodes automatisch gültig — sie müssen nicht neu vergeben werden. Deaktivieren Sie die Wahlcodes erst, wenn der gesamte Wahltag abgeschlossen ist.\n\nWahl jetzt schließen?`;
    const ok = await confirm({ titel:`Wahl schließen`, nachricht:msg, bestaetigen:"Jetzt schließen", typ:"warn" }); if (!ok) return;
    setToggling(wahl.id);
    try { await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:false, geschlossen:true }); await onDataChange(); } catch(e){ console.error(e); }
    setToggling(null);
  }
  async function toggleWahl(wahl) {
    setToggling(wahl.id);
    try { await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:!wahl.aktiv, geschlossen:wahl.geschlossen||false }); await onDataChange(); } catch(e){ console.error(e); }
    setToggling(null);
  }

  return (
    <div>
      {dialog}
      <div style={S.statGrid}>
        <StatCard num={wahlen.filter(w=>w.aktiv).length} label="Aktive Wahlen" color={C.accent}
          hint={wahlen.length>0?"→ Wahl starten":null} onHintClick={wahlen.length>0?()=>onSwitchTab&&onSwitchTab("wahlen"):null}/>
        <StatCard num={alleWahlenGesamt} label={alleWahlenGesamt>0&&alleWahlenGesamt===wahlenGeschlossen?"Alle Wahlen geschlossen":"Wahlen gesamt"} color={C.primary}
          hint={alleWahlenGesamt===0?"Noch keine Wahlen — jetzt anlegen →":null} onHintClick={alleWahlenGesamt===0?()=>onSwitchTab&&onSwitchTab("wahlen"):null}/>
        <StatCard num={tokenCount} label="Wahlcodes erstellt" color={tokenCount>0?C.accent:"#b45309"}
          hint={tokenCount===0?"Tagestoken generieren →":null} onHintClick={tokenCount===0?()=>onSwitchTab&&onSwitchTab("tagestoken"):null}/>
      </div>
      <WahlleitungAblaufCheckliste appData={appData} eventID={eventID}/>
      {aktiveWahlen.length>0 && (
        <div style={{ ...S.card, border:`2px solid ${C.accent}`, marginBottom:16 }}>
          <div style={{ ...S.sectionLabel, color:C.accent, marginBottom:12 }}>● Laufende Wahlen</div>
          {aktiveWahlen.map(w=>(

            <button id="url-copy-btn" style={{ ...S.btn, ...S.btnGhost, fontSize:12, marginTop:12 }} onClick={()=>navigator.clipboard?.writeText(wahllokalURL).then(()=>{ const b=document.getElementById("url-copy-btn"); if(b){const t=b.textContent;b.textContent="✓ Kopiert";setTimeout(()=>{b.textContent=t;},2000); } })}><i className="ti ti-copy" aria-hidden="true"/> URL kopieren</button>
          </div>

      {qrVollbild && (

          <button onClick={()=>setQrVollbild(false)} style={{ position:"absolute", top:24, right:24, ...S.btn, ...S.btnGhost }}><i className="ti ti-x" aria-hidden="true"/> Schließen</button>

          <div style={{ fontSize:28, fontWeight:800, color:C.primary }}>Zur Abstimmung scannen</div>
          <div style={{ background:"#fff", padding:24, borderRadius:16, boxShadow:"0 8px 32px rgba(0,0,0,0.12)" }}><QRCode url={wahllokalURL} size={300}/></div>
          <code style={{ fontSize:16, color:C.textLight }}>{wahllokalURL}</code>
        </div>
      )}
    </div>
  );
}

function LeitungWahlen({ appData, eventID, onDataChange, initialStichwahl, onStichwahl, onErgebnisse, isMobile=false, wahltag=null }) {
  const [form, setForm] = useState(null); const [saving, setSaving] = useState(false); const [fehler, setFehler] = useState(null);
  const { confirm, dialog } = useConfirm();
  // Alle Wahlen — aktive, geschlossene und archivierte
  const alleWahlen = appData.wahlen.filter(w=>{
    if (w.eventID!==eventID) return false;
    if (!wahltag?.datum) return true; // kein Wahltag → alle zeigen
    const wDatum = w.startzeit ? new Date(w.startzeit).toLocaleDateString("sv-SE") : null;
    return wDatum === wahltag.datum.slice(0,10);
  });
  const wahlen = alleWahlen.filter(w=>!w.archiviert); // aktiv + geschlossen (nicht archiviert)
  const archiviertWahlen = alleWahlen.filter(w=>w.archiviert);
  useEffect(()=>{
    if(initialStichwahl){
      // Stichwahl braucht trotzdem eine Startzeit, weil SharePoint die Spalte Startzeit erwartet.
      // Die Wahl bleibt nach dem Speichern pausiert und wird erst über den Starten-Button freigegeben.
      setForm({
        ...initialStichwahl,
        aktiv:false,
        geschlossen:false,
        startzeit: initialStichwahl.startzeit || naechsteViertelStunde(),
        hatEndzeit: !!initialStichwahl.endzeit,
        endzeit: initialStichwahl.endzeit || ""
      });
      if(onStichwahl) onStichwahl();
    }
  },[]);
  async function openForm(wahl) {
    let hatStimmen = false;
    try { const r=await callFlow("getErgebnisse",{ wahlID:parseInt(wahl.id), eventID }); hatStimmen=(Array.isArray(r)?r.length:(r.value?.length||0))>0; } catch(e) {}
    const endzeitLocal = wahl.endzeit ? toLocalInputValue(parseSharePointDate(wahl.endzeit)) : "";
    setForm({ ...wahl, optionen:[...wahl.optionen], hatStimmen, hatEndzeit: !!wahl.endzeit, endzeit: endzeitLocal });
  }
  async function toggleAktiv(wahl) { try{ await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:!wahl.aktiv, geschlossen:false }); onDataChange(); }catch(e){ setFehler(e.message); } }
  async function pauseWahl(wahl) { const ok = await confirm({ titel:"Wahl pausieren", nachricht:`Wahl "${wahl.titel}" pausieren?

Die Abstimmung wird unterbrochen — Stimmberechtigte können keine Stimmen mehr abgeben.`, bestaetigen:"Pausieren", typ:"warn" }); if(!ok) return; try{ await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:false, geschlossen:false }); onDataChange(); }catch(e){ setFehler(e.message); } }
  async function starteWahl(wahl) { try{ await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:true, geschlossen:false }); onDataChange(); }catch(e){ setFehler(e.message); } }
  async function deleteWahl(wahl) {
    // Erst prüfen ob Stimmen vorhanden
    let stimmenAnzahl = 0;
    try {
      const r = await callFlow("getErgebnisse", { wahlID:parseInt(wahl.id), eventID });
      stimmenAnzahl = Array.isArray(r) ? r.length : (r.value?.length||0);
    } catch(e) {}

    let msg = `Wahl "${wahl.titel}" wirklich löschen?`;
    if (stimmenAnzahl > 0) {
      msg += `

⚠️ ACHTUNG: Es wurden bereits ${stimmenAnzahl} Stimme${stimmenAnzahl!==1?"n":""} abgegeben.

Diese Stimmen werden zusammen mit der Wahl unwiderruflich gelöscht.

Nur fortfahren wenn dies eine Testwahl war oder das Löschen bewusst gewünscht ist.`;
    }
    msg += "\n\nWirklich löschen?";

    const ok = await confirm({ titel:"Wahl löschen", nachricht:msg, bestaetigen:"Löschen", abbrechen:"Abbrechen", typ:"danger" });
    if (!ok) return;
    // Bei Stimmen zweite Bestätigung
    if (stimmenAnzahl > 0) {
      const ok2 = await confirm({ titel:"Letzte Bestätigung", nachricht:`${stimmenAnzahl} Stimme${stimmenAnzahl!==1?"n":""} werden unwiderruflich gelöscht. Wirklich fortfahren?`, bestaetigen:"Endgültig löschen", typ:"danger" });
      if (!ok2) return;
    }

    showLoading("Wahl wird gelöscht…");
    try {
      await callFlow("deleteWahl", { wahlID:parseInt(wahl.id) });
      await onDataChange();
    } catch(e) { setFehler(e.message); }
    hideLoading();
  }
  async function schliesseWahl(wahl) {
    const ok = await confirm({ titel:"Wahl schließen", nachricht:`Wahl "${wahl.titel}" endgültig schließen?\n\nNach dem Schließen können keine weiteren Stimmen abgegeben werden.`, bestaetigen:"Schließen", typ:"warn" });
    if (!ok) return;
    try { await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:false, geschlossen:true }); await onDataChange(); } catch(e){ setFehler(e.message); }
  }
  async function archiviereWahl(wahl) {
    const ok = await confirm({ titel:"Wahl archivieren", nachricht:`Wahl "${wahl.titel}" archivieren?

Archivierte Wahlen sind schreibgeschützt und werden separat angezeigt.`, bestaetigen:"Archivieren", typ:"warn" });
    if (!ok) return;
    try { await callFlow("saveWahl",{ wahlID:parseInt(wahl.id), eventID, titel:wahl.titel, aktiv:false, startzeit:wahl.startzeit, mehrfach:wahl.mehrfach, exakt:wahl.exakt, maxAuswahl:wahl.maxAuswahl, mehrheitsregel:wahl.mehrheitsregel||"relativ", geschlossen:true, archiviert:true, optionen:wahl.optionen.map(o=>({ id:o.id&&!isNaN(parseInt(o.id))?String(parseInt(o.id)):null, name:o.name, istEnthaltung:o.istEnthaltung, hatStimmen:true })) }); await onDataChange(); }catch(e){ setFehler(e.message); }
  }
  async function saveWahl(f) {
    setSaving(true); setFehler(null);
    try {
      if (!f.startzeit) {
        setFehler("Bitte eine Startzeit setzen. Die Wahl bleibt trotzdem bis zur Freigabe pausiert.");
        setSaving(false);
        return;
      }
      // BKR-Validierung
      if (f.wahltyp==="bkr") {
        if (berechneBKRQuota(f) < 0) {
          setFehler("Bezirkskirchenratswahl: Quota-Berechnung ungültig — bitte Kraft-Amtes-Zahlen prüfen.");
          setSaving(false); hideLoading(); return;
        }
        const nichtEnthaltung = (f.optionen||[]).filter(o=>!o.istEnthaltung);
        if (nichtEnthaltung.length < f.maxAuswahl) {
          setFehler(`Bezirkskirchenratswahl: Es sind nur ${nichtEnthaltung.length} Kandidierende eingetragen, aber ${f.maxAuswahl} Sitze zu vergeben. Bitte mindestens ${f.maxAuswahl} Kandidierende eintragen oder die Anzahl der Sitze anpassen.`);
          setSaving(false); return;
        }
      }
      let startzeitISO = f.startzeit;
      // Sicherstellen dass Startzeit ein vollständiges Datum+Uhrzeit hat
      if (!startzeitISO || startzeitISO.endsWith("T") || startzeitISO.length < 13) {
        // Fehlende Uhrzeit: Wahltag-Datum + naechsteHalbeStunde
        const datum = wahltag?.datum?.slice(0,10) || new Date().toLocaleDateString("sv-SE");
        const jetzt = new Date();
        const m = jetzt.getMinutes() < 30 ? "30" : "00";
        const h = jetzt.getMinutes() < 30 ? String(jetzt.getHours()).padStart(2,"0") : String(jetzt.getHours()+1).padStart(2,"0");
        startzeitISO = datum + "T" + h + ":" + m;
      }
      if (startzeitISO && !startzeitISO.includes("Z") && !startzeitISO.includes("+")) {
        const parsedStart = parseLocalDatetime(startzeitISO);
        if (!parsedStart || isNaN(parsedStart.getTime())) {
          setFehler("Die Startzeit ist ungültig. Bitte erneut setzen.");
          setSaving(false);
          return;
        }
        startzeitISO = parsedStart.toISOString();
      }
      await callFlow("saveWahl",{
        wahlID: (!f.id||f.isNew) ? null : parseInt(f.id),
        eventID,
        titel: f.titel,
        aktiv: f.aktiv||false,
        startzeit: startzeitISO,
        mehrfach: f.mehrfach,
        exakt: f.exakt,
        maxAuswahl: f.maxAuswahl,
        mehrheitsregel: (typeof f.mehrheitsregel==="object" ? f.mehrheitsregel?.Value : f.mehrheitsregel)||"relativ",
        geschlossen: f.geschlossen||false,
        archiviert: f.archiviert||false,
        endzeit: (f.hatEndzeit&&f.endzeit) ? parseLocalDatetime(f.endzeit).toISOString() : null,
        // BKR-spezifische Felder
        wahltyp: f.wahltyp || "normal",
        kraftAmtesHauptamtlich: f.kraftAmtesHauptamtlich || 0,
        kraftAmtesEhrenamtlich: f.kraftAmtesEhrenamtlich || 0,
        optionen: f.optionen.map(o => ({
          id: o.id && !isNaN(parseInt(o.id)) ? String(parseInt(o.id)) : null,
          name: o.name,
          istEnthaltung: o.istEnthaltung,
          istHauptamtlich: o.istHauptamtlich || false,
          hatStimmen: !!f.hatStimmen
        }))
      });
      await onDataChange(); setForm(null);
    }catch(e){ setFehler(e.message); }
    setSaving(false);
  }
  if (form) return <WahlForm form={form} onSave={saveWahl} onCancel={()=>setForm(null)} saving={saving} fehler={fehler} wahltag={wahltag}/>;
  // Wiederverwendbare Aktionsbuttons für eine Wahl
  function WahlAktionen({ w, size=12 }) {
    const p = `5px ${size>12?"14px":"11px"}`;
    return (
      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
        {!w.geschlossen&&<button style={{ ...S.btn, ...S.btnGhost, fontSize:size, padding:p }} onClick={()=>openForm(w)}><i className="ti ti-edit" aria-hidden="true"/> Bearbeiten</button>}
        {!w.geschlossen&&w.aktiv&&<button style={{ ...S.btn, ...S.btnWarning, fontSize:size, padding:p }} onClick={()=>pauseWahl&&pauseWahl(w)}><i className="ti ti-player-pause" aria-hidden="true"/> Pause</button>}
        {!w.geschlossen&&!w.aktiv&&<button style={{ ...S.btn, ...S.btnPrimary, fontSize:size, padding:p }} onClick={()=>starteWahl&&starteWahl(w)}><i className="ti ti-player-play" aria-hidden="true"/> Starten</button>}
        {!w.geschlossen&&w.aktiv&&<button style={{ ...S.btn, ...S.btnDanger, fontSize:size, padding:p }} onClick={()=>schliesseWahl(w)}><i className="ti ti-lock" aria-hidden="true"/> Schließen</button>}
        {w.geschlossen&&<button style={{ ...S.btn, ...S.btnPrimary, fontSize:size, padding:p }} onClick={()=>onErgebnisse&&onErgebnisse(w.id)}><i className="ti ti-chart-bar" aria-hidden="true"/> Ergebnisse</button>}
        {w.geschlossen&&<button style={{ ...S.btn, ...S.btnGhost, fontSize:size, padding:p }} onClick={()=>archiviereWahl(w)}><i className="ti ti-archive" aria-hidden="true"/> Archivieren</button>}
        <button style={{ ...S.btn, ...S.btnGhostDanger, fontSize:size, padding:p }} onClick={()=>deleteWahl(w)}><i className="ti ti-trash" aria-hidden="true"/> Löschen</button>
      </div>
    );
  }

  return (
    <div>
      {dialog}
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}>
        <h3 style={{ margin:0, color:C.primary }}>Wahlen</h3>
        <button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>{
          const datum = wahltag?.datum?.slice(0,10) || new Date().toISOString().slice(0,10);
          const startzeit = datum + "T" + naechsteHalbeStunde().slice(11,16);
          setForm({ id:Date.now().toString(), eventID, titel:"", aktiv:false, startzeit, hatEndzeit:false, endzeit:"", mehrfach:false, exakt:false, maxAuswahl:1, mehrheitsregel:"absolut", optionen:[{ id:null, _tempKey:"tmp_1", name:"", istEnthaltung:false },{ id:null, _tempKey:"tmp_enth", name:"Enthaltung", istEnthaltung:true }], isNew:true });
        }}>+ Neue Wahl</button>
      </div>

      {/* Aktive & geschlossene Wahlen */}
      <div style={S.card}>
        {wahlen.length===0 ? <p style={{ color:C.textLight, fontSize:14 }}>Noch keine Wahlen angelegt.</p> :
          isMobile ? (
            /* Mobile: Karten-Layout statt Tabelle */
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {wahlen.map(w=>{
                const st = getWahlZeitStatus(w, new Date());
                return (
                  <div key={w.id} style={{ borderRadius:10, border:`1px solid ${C.border}`, padding:14, opacity:w.geschlossen?0.85:1, background:C.bgWhite }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8, gap:8 }}>
                      <div style={{ fontWeight:700, fontSize:15, color:C.text, flex:1 }}>{w.titel}</div>
                      <span style={{ ...S.badge, ...st.badge, flexShrink:0 }}>{st.label}</span>
                    </div>
                    <div style={{ fontSize:12, color:C.textLight, marginBottom:10 }}>
                      {w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"} · {w.optionen.length} Optionen
                      <br/>Start: {formatDatum(w.startzeit)}{w.endzeit?` · Ende: ${formatDatum(w.endzeit)}`:""}
                    </div>
                    <WahlAktionen w={w} size={13}/>
                  </div>
                );
              })}
            </div>
          ) : (
            /* Desktop: Tabelle */
            <table style={S.table}><thead><tr><th style={S.th}>Titel</th><th style={S.th}>Typ</th><th style={S.th}>Status</th><th style={S.th}>Aktionen</th></tr></thead>
            <tbody>{wahlen.map(w=>(
              <tr key={w.id} style={{ opacity:w.geschlossen?0.85:1 }}>
                <td style={S.td}><strong>{w.titel}</strong></td>
                <td style={{ ...S.td, fontSize:12, color:C.textLight }}>
                  {w.mehrfach?`Mehrfach (${w.maxAuswahl})`:"Einzel"} · {w.optionen.length} Opt.
                  <div style={{ marginTop:3 }}>Start: {formatDatum(w.startzeit)}{w.endzeit ? ` · Ende: ${formatDatum(w.endzeit)}` : ""}</div>
                </td>
                <td style={S.td}>
                  {(()=>{ const st = getWahlZeitStatus(w, new Date()); return (
                    <>
                      <span style={{ ...S.badge, ...st.badge }}>{st.icon} {st.label}</span>
                      {st.hint&&<div style={{ marginTop:6, fontSize:12, color:C.textLight, lineHeight:1.4 }}>{st.hint}</div>}
                    </>
                  ); })()}
                </td>
                <td style={S.td}><WahlAktionen w={w}/></td>
              </tr>
            ))}</tbody></table>
          )
        }
      </div>

      {/* Archiv */}
      {archiviertWahlen.length>0&&(
        <ArchivWahlen wahlen={archiviertWahlen} onDelete={deleteWahl}/>
      )}
    </div>
  );
}

function ArchivWahlen({ wahlen, onDelete }) {
  const [zeig,setZeig]=useState(false);

    <div style={S.card}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:zeig?12:0 }}>
        <div style={S.sectionLabel}><i className="ti ti-archive" aria-hidden="true"/> Archiv ({wahlen.length} archivierte {wahlen.length===1?"Wahl":"Wahlen"})</div>
        <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={()=>setZeig(!zeig)}>{zeig?"Ausblenden":"Anzeigen"}</button>
      </div>
      {zeig&&(<table style={S.table}><thead><tr><th style={S.th}>Titel</th><th style={S.th}>Typ</th><th style={S.th}>Status</th><th style={S.th}>Aktionen</th></tr></thead>
        <tbody>{wahlen.map(w=>(<tr key={w.id} style={{ opacity:0.6 }}>
          <td style={S.td}><strong>{w.titel}</strong></td>
          <td style={{ ...S.td, fontSize:12, color:C.textLight }}>{w.mehrfach?`Mehrfach (${w.maxAuswahl})`:"Einzel"} · {w.optionen.length} Opt.</td>
          <td style={S.td}><span style={{ ...S.badge, background:"#e2e8f0", color:"#475569" }}><i className="ti ti-archive" aria-hidden="true"/> archiviert</span></td>
          <td style={S.td}><button style={{ ...S.btn, ...S.btnGhostDanger, fontSize:12, padding:"5px 11px" }} onClick={()=>onDelete(w)}><i className="ti ti-trash" aria-hidden="true"/> Löschen</button></td>
        </tr>))}</tbody>
      </table>)}
    </div>
  );
}

// FIX: OfflineTokenListe liest tokenList aus getDaten und mappt korrekt via mapToken
function OfflineTokenListe({ eventID, reloadTrigger, wahllokalName, isMobile=false, filterTyp=null, filterGueltigAm=null }) {
  const [mitQR, setMitQR] = useState(false);
  const [letzterKontrollcode, setLetzterKontrollcode] = useState(null);
  const [tokens, setTokens] = useState([]); const [loading, setLoading] = useState(true); const [suche, setSuche] = useState(""); const [toggling, setToggling] = useState(null); const [fehler, setFehler] = useState(null);
  const [erfolg, setErfolg] = useState(null); const [ausgewaehlt, setAusgewaehlt] = useState([]); const [loesching, setLoesching] = useState(false);
  const { confirm, dialog } = useConfirm();
  const deleteVerfuegbar = !API.flows.deleteToken.startsWith("PLATZHALTER");
  async function laden() {
    setLoading(true);
    try {
      const result = await callFlow("getDaten",{ eventID });
      const allRaw = result.tokenList||[];
      let rawTokens = filterTyp ? allRaw.filter(t=>(t.TokenTyp||t.tokenTyp||"offline")===filterTyp) : allRaw;
      if (filterGueltigAm) rawTokens = rawTokens.filter(t=>t.GueltigAm?.slice(0,10)===filterGueltigAm||t.gueltigAm===filterGueltigAm);
      // Sortierung: neu → alt
      const mapped = rawTokens.map(mapToken).sort((a,b)=>{
        const da = a.erstellt ? new Date(a.erstellt) : new Date(0);
        const db = b.erstellt ? new Date(b.erstellt) : new Date(0);
        return db - da;
      });
      setTokens(mapped);

function LeitungWaehler({ appData, eventID, isMobile=false }) {

  const [fehler, setFehler] = useState(null); const [erfolg, setErfolg] = useState(null);
  const [tab, setTab] = useState("liste"); const [offlineAnzahl, setOfflineAnzahl] = useState(10);

    const email = emailInput.trim().toLowerCase();
    if (!email || !email.includes("@")) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("saveWaehler", { eventID, waehler:[{ email, token:"" }] });
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:[email], gueltigBis:formatGueltigBis(gueltigBis) });
      setEmailInput(""); await loadWaehler();
      setErfolg("Wähler angelegt. Link kann jetzt versendet werden."); setTimeout(()=>setErfolg(null),4000);
    } catch(e) { setFehler(e.message); }
    setSaving(false);
  }
  async function addEmailUndVersenden() {
    const email = emailInput.trim().toLowerCase();
    if (!email || !email.includes("@")) return;
    setSaving(true); setFehler(null);

            {hatAuswahl&&kannAktivieren&&<button style={{ ...S.btn, ...S.btnSuccess, fontSize:12 }} onClick={ausgewaehltAktivieren} disabled={saving}><i className="ti ti-circle-check" aria-hidden="true"/> Aktivieren</button>}

          <input style={S.input} type="text" value={suche} onChange={e=>setSuche(e.target.value)} placeholder="E-Mail suchen..."/>
        </div>
        {loading?<p style={{ color:C.textLight, fontSize:14 }}>Wird geladen...</p>
          :gefilterteWaehler.length===0?<p style={{ color:C.textLight, fontSize:14 }}>{suche||filterStatus!=="alle"?"Keine Ergebnisse.":"Noch keine Wähler angelegt."}</p>
          :(
          <table style={S.table}>
            <thead><tr>
              <th style={{ ...S.th, width:40 }}><input type="checkbox" checked={alleAusgewaehlt} onChange={toggleAlle}/></th>
              <SortTh col="email" label="E-Mail"/>
              <SortTh col="status" label="Status"/>
              <th style={S.th}>Aktion</th>
            </tr></thead>
            <tbody>{gefilterteWaehler.map(w=>(
              <tr key={w.id} style={{ background:ausgewaehlt.includes(w.id)?"#f0f4ff":"transparent" }}>
                <td style={S.td}><input type="checkbox" checked={ausgewaehlt.includes(w.id)} onChange={()=>toggleAuswahl(w.id)}/></td>
                <td style={S.td}>{w.email}</td>
                <td style={S.td}>
                  <span style={{ ...S.badge,
                    ...(w.status==="abgeholt"?S.badgeGreen:
                        w.status==="versendet"?S.badgeOrange:
                        S.badgeGray) }}>
                    {w.status==="abgeholt"?<><i className="ti ti-circle-check" aria-hidden="true"/> abgeholt</>:
                     w.status==="versendet"?<><i className="ti ti-mail" aria-hidden="true"/> versendet</>:
                     <><i className="ti ti-clock" aria-hidden="true"/> ausstehend</>}
                  </span>
                </td>
                <td style={S.td}>
                  {w.status!=="abgeholt" && (
                    <button style={{ ...S.btn, fontSize:11, padding:"3px 9px", ...S.btnGhost }} onClick={()=>einzelVersenden(w)} disabled={saving}>
                      <i className="ti ti-mail" aria-hidden="true"/>{w.status==="versendet"?" Erneut senden":"Link senden"}
                    </button>
                  )}
                </td>
              </tr>
            ))}</tbody>
          </table>
        )}
        </div>}
      </div>
    </div>
  );
}

function LeitungErgebnisse({ appData, eventID, onDataChange, onSwitchTab, wahltag=null }) {

function PraesentationsModus({ appData, wahllokalID, onExit }) {
  const wahllokal = appData.wahllokale.find(w=>w.eventID===wahllokalID);
  const [wahlenFrisch, setWahlenFrisch] = useState(null);
  const wahlen = wahlenFrisch||appData.wahlen.filter(w=>w.eventID===wahllokalID&&w.geschlossen);
  const wahlenGeladen = wahlenFrisch !== null;
  const gruppen = gruppiereWahlen(wahlen);
  const [selectedGruppeIdx, setSelectedGruppeIdx] = useState(0);

  useEffect(()=>{
    async function laden(){ try{
      const raw=await callFlow("getDaten",{ eventID:wahllokalID });
      const optionen=(raw.optionen||[]).map(mapOption);
      const w=(raw.wahlen||[]).map(mapWahl).filter(wahl=>wahl.geschlossen);
      w.forEach(wahl=>{ wahl.optionen=optionen.filter(o=>o.wahlID===wahl.id).sort((a,b)=>{ if(a.istEnthaltung&&!b.istEnthaltung) return 1; if(!a.istEnthaltung&&b.istEnthaltung) return -1; return parseInt(a.id)-parseInt(b.id); }); });
      setWahlenFrisch(w);
    }catch(e){} }
    laden();
    const t = setInterval(laden, 30000);
    return ()=>clearInterval(t);
  },[wahllokalID]);

  return (
    <div style={{ position:"fixed", inset:0, background:C.primary, zIndex:9999, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      {/* Header */}
      <div style={{ padding:"clamp(12px, 2vh, 24px) clamp(16px, 3vw, 48px)", borderBottom:"1px solid rgba(255,255,255,0.15)", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
        <div>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:"0.15em", textTransform:"uppercase", color:"rgba(255,255,255,0.5)", marginBottom:4 }}>Evangelische Landeskirche in Baden</div>
          <h1 style={{ fontSize:"clamp(18px, 3vh, 32px)", fontWeight:900, color:"#fff", margin:0 }}>{wahllokal?.name||wahllokalID} · Wahlergebnisse</h1>
        </div>
        <button onClick={onExit} style={{ ...S.btn, background:"rgba(255,255,255,0.15)", color:"#fff", fontSize:13 }}><i className="ti ti-x" aria-hidden="true"/> Beenden</button>
      </div>

      {/* Gruppenauswahl */}
      {gruppen.length>1&&(
        <div style={{ padding:"12px 40px", display:"flex", gap:8, flexWrap:"wrap", borderBottom:"1px solid rgba(255,255,255,0.1)", flexShrink:0 }}>
          {gruppen.map((g,idx)=>(
            <button key={g.hauptwahl.id} onClick={()=>setSelectedGruppeIdx(idx)}
              style={{ padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer", fontSize:14, fontWeight:700,
                background:idx===selectedGruppeIdx?C.accent:"rgba(255,255,255,0.15)", color:"#fff" }}>
              {getBasisTitel(g.hauptwahl.titel)}
            </button>
          ))}
        </div>
      )}

      {/* Inhalt */}
      <div style={{ flex:1, overflowY:"auto", overflowX:"hidden", padding:"clamp(12px, 2vh, 32px) clamp(16px, 3vw, 48px)" }}>
        {wahlen.length===0&&<div style={{ textAlign:"center", paddingTop:80, color:"rgba(255,255,255,0.5)", fontSize:18 }}>Noch keine abgeschlossenen Wahlen.</div>}
        {gruppen[selectedGruppeIdx]&&(
          <KombinierteGruppenAnsicht
            gruppe={gruppen[selectedGruppeIdx]}
            wahllokalID={wahllokalID}
            isLeitung={false}
            onDataChange={null}
            wahlen={wahlen}
            VB={true}
          />
        )}
      </div>

      {/* Footer */}
      <div style={{ padding:"12px 40px", borderTop:"1px solid rgba(255,255,255,0.1)", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
        <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)" }}>Auto-Refresh alle 30 Sekunden</div>
        <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)" }}>{new Date().toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" })}</div>
      </div>
    </div>
  );
}

function KombinierteGruppenAnsicht({ gruppe, wahllokalID, isLeitung, onDataChange, wahlen, VB }) {
  const alleWahlen = [gruppe.hauptwahl, ...gruppe.stichwahlen];
  const [ergebnisseMap, setErgebnisseMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [letzteAkt, setLetzteAkt] = useState(null);

  async function laden() {
    setLoading(true);
    const neu = {};
    for (const w of alleWahlen) {
      try {
        const result = await callFlow("getErgebnisse", { wahlID: parseInt(w.id), eventID: wahllokalID });
        neu[w.id] = Array.isArray(result) ? result : (result.value||result.abstimmungen||[]);
      } catch(e) { neu[w.id] = []; }
    }
    setErgebnisseMap(neu);
    setLetzteAkt(new Date());
    setLoading(false);
  }

  useEffect(() => { laden(); }, [gruppe.hauptwahl.id]);
  useEffect(() => { const t = setInterval(laden, 30000); return () => clearInterval(t); }, [gruppe.hauptwahl.id]);

  function berechneOptErgebnisseBKR(wahl, ergebnisse) {
    // BKR-Auswertung — vollständig abgekapselt
    if (!wahl?.optionen?.length || !ergebnisse) return [];
    const bkr = berechneBKRErgebnisse(wahl, ergebnisse);
    if (!bkr?.opts) return [];
    const enthaltung = (wahl?.optionen||[]).find(o=>o.istEnthaltung);
    const enthaltungStimmen = enthaltung ? (ergebnisse||[]).filter(a=>{
      try { const pos=JSON.parse(a.Positionen||a.positionen||"[]"); return pos.some(p=>String(p.optionID)===enthaltung.id); } catch { return false; }
    }).length : 0;

    return bkr.opts.map(opt => ({
      ...opt,
      gewaehlt: bkr.gewaehlte.some(g=>g.id===opt.id),
      quotaGesperrt: bkr.nichtGewaehlteQuota.some(g=>g.id===opt.id),
      nichtGewaehlt: !bkr.gewaehlte.some(g=>g.id===opt.id) && !bkr.nichtGewaehlteQuota.some(g=>g.id===opt.id),
    })).concat(enthaltung ? [{...enthaltung, stimmen: enthaltungStimmen, gewaehlt:false, quotaGesperrt:false, nichtGewaehlt:false}] : []);
  }

  function berechneOptErgebnisse(wahl, ergebnisse) {
    const total = berechneTotal(ergebnisse);
    const maxAuswahl = wahl?.maxAuswahl || 1;
    const mehrfach = wahl?.mehrfach || false;
    const istFWG = istFolgeWahlgang(wahl);

    const opts = (wahl?.optionen||[]).map(opt => ({
      ...opt,
      stimmen: (ergebnisse||[]).filter(a => {
        try { const pos = JSON.parse(a.Positionen||a.positionen||"[]"); return pos.some(p=>String(p.optionID)===opt.id); } catch { return false; }
      }).length
    })).sort((a,b) => {
      // Enthaltungen immer zuletzt
      if (a.istEnthaltung && !b.istEnthaltung) return 1;
      if (!a.istEnthaltung && b.istEnthaltung) return -1;
      return b.stimmen - a.stimmen;
    });

    // Bei Mehrfachauswahl: markiere wer gewählt ist
    if (mehrfach && maxAuswahl > 1) {
      const nichtenthaltung = opts.filter(o=>!o.istEnthaltung);
      let gewaehlteAnzahl = 0;
      return opts.map(opt => {
        if (opt.istEnthaltung) return { ...opt, gewaehlt: false, nichtGewaehlt: false };
        const hatMehrheit = istFWG
          ? pruefeFolgeWahlgang(opt.stimmen, total)
          : pruefeMehrheitGO(opt.stimmen, total);
        // Im 2. Wahlgang: gewählt nur wenn 1/3 erreicht UND unter den top-N (Ämter)
        // Im 1. Wahlgang: gewählt nur wenn absolute Mehrheit UND unter den top-N
        const rangIdx = nichtenthaltung.findIndex(o=>o.id===opt.id);
        const gewaehlt = hatMehrheit && rangIdx < maxAuswahl && opt.stimmen > 0;
        if (gewaehlt) gewaehlteAnzahl++;
        return { ...opt, gewaehlt, nichtGewaehlt: !gewaehlt && !opt.istEnthaltung && opt.stimmen > 0 };
      });
    }
    return opts.map(opt => ({ ...opt, gewaehlt: false, nichtGewaehlt: false }));
  }

  function pruefeMehrheit(stimmen, total, wahl) {
    if (total===0) return false;
    if (istFolgeWahlgang(wahl)) return pruefeFolgeWahlgang(stimmen, total);
    return pruefeMehrheitGO(stimmen, total);
  }

  const col = (normal, vb) => VB ? vb : normal;

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        {letzteAkt&&<div style={{ fontSize:11, color:C.textLight }}>Aktualisiert: {letzteAkt.toLocaleTimeString("de-DE")} · Auto-Refresh alle 30 Sek.</div>}
        <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={laden} disabled={loading}><i className="ti ti-refresh" aria-hidden="true"/></button>
      </div>
      {loading&&!Object.keys(ergebnisseMap).length&&<div style={{ textAlign:"center", padding:24 }}><div style={S.spinner}/></div>}
      {alleWahlen.map((wahl, idx) => {
        const ergebnisse = ergebnisseMap[wahl.id]||[];
        const total = ergebnisse.length;
        const optErg = istBKRWahl(wahl)
          ? berechneOptErgebnisseBKR(wahl, ergebnisse)
          : berechneOptErgebnisse(wahl, ergebnisse);
        const bkrDaten = istBKRWahl(wahl) ? berechneBKRErgebnisse(wahl, ergebnisse) : null;
        const maxS = Math.max(...optErg.map(e=>e.stimmen), 1);
        const nichtenthaltung = optErg.filter(e=>!e.istEnthaltung);
        const enthaltung = optErg.find(e=>e.istEnthaltung);
        const fuehrend = nichtenthaltung[0];
        const maxAuswahl = parseInt(wahl?.maxAuswahl||1);
        const istMehrfach = wahl?.mehrfach && maxAuswahl>1;
        const isBKR = istBKRWahl(wahl);
        const istFWGw = istFolgeWahlgang(wahl);
        const wahlGeschlossen = !!wahl.geschlossen;
        const istLetzte = idx===alleWahlen.length-1;
        const hatNaechsteStichwahl = alleWahlen.some((w,i)=>i>idx&&getBasisTitel(w.titel)===getBasisTitel(wahl.titel));

        const gewaehlteNeu = isBKR
          ? (bkrDaten?.gewaehlte||[])
          : nichtenthaltung.filter(e=>{
              if (!wahlGeschlossen||total===0) return false;
              if (istMehrfach) return !!e.gewaehlt;
              if (istFWGw) return e===fuehrend&&pruefeFolgeWahlgang(e.stimmen,total);
              return e===fuehrend&&pruefeMehrheitGO(e.stimmen,total);
            });
        const quotaGesperrtNeu = isBKR ? (bkrDaten?.nichtGewaehlteQuota||[]) : [];
        const nichtGewaehlteNeu = nichtenthaltung.filter(e=>
          !gewaehlteNeu.some(g=>g.id===e.id)&&!quotaGesperrtNeu.some(g=>g.id===e.id)
        );
        const mehrheitErreicht = gewaehlteNeu.length>0&&(isBKR?bkrDaten?.offeneAemter===0:(!istMehrfach||gewaehlteNeu.length>=maxAuswahl));
        const gleichstand = !isBKR&&!mehrheitErreicht&&fuehrend&&nichtenthaltung.filter(e=>e.stimmen===fuehrend.stimmen&&e.id!==fuehrend.id).length>0;
        const keinDrittelGlobal = istFWGw&&fuehrend&&!pruefeFolgeWahlgang(fuehrend.stimmen,total);
        const offeneAemterNeu = isBKR?(bkrDaten?.offeneAemter||0):istMehrfach?maxAuswahl-gewaehlteNeu.length:(gewaehlteNeu.length===0?1:0);
        const braucht2WG = wahlGeschlossen&&total>0&&offeneAemterNeu>0&&!gleichstand&&!keinDrittelGlobal;
        const wahlgescheitert = wahlGeschlossen&&total>0&&keinDrittelGlobal&&!gleichstand;

        function ErgebnisBalken({opt,hl}) {
          const pct = maxS>0?Math.round(opt.stimmen/maxS*100):0;
          const tpct = total>0?Math.round(opt.stimmen/total*100):0;
          const barColor = hl==="g"?(VB?"#4ade80":C.accent):hl==="q"?"#f59e0b":hl==="w"?(VB?"#a78bfa":"#6366f1"):(VB?"rgba(255,255,255,0.15)":"#d1d5db");
          const nameColor = hl==="g"?(VB?"#fff":C.text):(VB?"rgba(255,255,255,0.7)":C.textLight);
          const pctColor = hl==="g"?(VB?"#4ade80":C.accent):(VB?"rgba(255,255,255,0.5)":C.textLight);
          return (
            <div style={{marginBottom:VB?10:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  {hl==="g"&&<i className="ti ti-circle-check" style={{color:VB?"#4ade80":C.accent,fontSize:13}}/>}
                  {hl==="q"&&<i className="ti ti-lock" style={{color:"#f59e0b",fontSize:13}}/>}
                  <span style={{fontSize:VB?17:14,fontWeight:hl==="g"?700:400,color:nameColor}}>{opt.name}</span>
                  {opt.istHauptamtlich&&<span style={{fontSize:10,background:VB?"rgba(59,130,246,0.3)":"#dbeafe",color:VB?"#93c5fd":"#1e40af",padding:"1px 5px",borderRadius:4,fontWeight:600}}>kirchl. Dienst</span>}
                  {opt.istEnthaltung&&<span style={{fontSize:10,background:VB?"rgba(255,255,255,0.1)":"#f3f4f6",color:VB?"rgba(255,255,255,0.5)":C.textLight,padding:"1px 5px",borderRadius:4}}>Enthaltung</span>}
                </div>
                <span style={{fontSize:VB?17:13,fontWeight:600,color:pctColor}}>{opt.stimmen} ({tpct}%)</span>
              </div>
              <div style={{background:VB?"rgba(255,255,255,0.1)":"#f3f4f6",borderRadius:4,height:VB?10:8,overflow:"hidden"}}>
                <div style={{width:pct+"%",height:"100%",background:barColor,borderRadius:4}}/>
              </div>
            </div>
          );
        }

        function ErgebnisBlock({type,title,children}) {
          const cfgLight={g:{bg:"#f0faf5",bd:C.accent,tc:C.accent},q:{bg:"#fffbeb",bd:"#f59e0b",tc:"#92400e"},w:{bg:"#f5f3ff",bd:"#6366f1",tc:"#4338ca"},e:{bg:"#fef2f2",bd:C.error,tc:"#7b2d2d"}}[type]||{bg:"#f9fafb",bd:C.border,tc:C.textLight};
          const cfgDark={g:{bg:"rgba(74,222,128,0.12)",bd:"rgba(74,222,128,0.4)",tc:"#4ade80"},q:{bg:"rgba(245,158,11,0.12)",bd:"rgba(245,158,11,0.4)",tc:"#fbbf24"},w:{bg:"rgba(99,102,241,0.12)",bd:"rgba(99,102,241,0.4)",tc:"#a78bfa"},e:{bg:"rgba(239,68,68,0.12)",bd:"rgba(239,68,68,0.4)",tc:"#fca5a5"}}[type]||{bg:"rgba(255,255,255,0.05)",bd:"rgba(255,255,255,0.1)",tc:"rgba(255,255,255,0.5)"};
          const cfg = VB ? cfgDark : cfgLight;
          return (
            <div style={{background:cfg.bg,border:"2px solid "+cfg.bd,borderRadius:10,padding:VB?"16px 20px":"12px 16px",marginBottom:10}}>
              <div style={{fontSize:VB?13:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:cfg.tc,marginBottom:VB?12:8}}>{title}</div>
              {children}
            </div>
          );
        }

        return (
          <div key={wahl.id} style={{marginBottom:24}}>
            {idx>0&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <div style={{flex:1,height:1,background:C.border}}/>
                <span style={{fontSize:12,color:C.textLight,fontWeight:600,whiteSpace:"nowrap"}}>{ist2Wahlgang(wahl)?"2. Wahlgang":istStichwahl(wahl)?"Stichwahl":"Folgewahlgang"}</span>
                <div style={{flex:1,height:1,background:C.border}}/>
              </div>
            )}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:C.primary}}>{wahl.titel}</div>
                <div style={{fontSize:12,color:C.textLight,marginTop:2}}>{getMehrheitsregelLabel(wahl)} · {total} Stimmen abgegeben</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                {wahlGeschlossen&&<span style={{...S.badge,...S.badgeRed,fontSize:11}}><i className="ti ti-lock"/> geschlossen</span>}
                {!wahlGeschlossen&&wahl.aktiv&&<span style={{...S.badge,...S.badgeGreen,fontSize:11}}>läuft</span>}
                <button onClick={()=>laden()} style={{...S.btn,...S.btnGhost,fontSize:11,padding:"2px 8px"}}><i className="ti ti-refresh"/></button>
              </div>
            </div>
            {isBKR&&istFolgeWahlgang(wahl)&&(()=>{
              const mhf=berechneBKRQuota(wahl);
              return (<div style={{...S.alert,background:"#eff6ff",border:"1px solid #bfdbfe",color:"#1e40af",fontSize:12,marginBottom:12}}><i className="ti ti-info-circle"/> <strong>Hinweis zur Quota (§45 Abs. 2 LWG):</strong> Bereits gewählte Mitglieder fließen in die Quota-Berechnung ein. Für diesen Wahlgang noch max. <strong>{mhf} Person{mhf!==1?"en":""} im kirchl. Dienst</strong> wählbar.</div>);
            })()}
            {wahlGeschlossen&&total>0 ? (
              <div>
                {gewaehlteNeu.length>0&&<ErgebnisBlock type="g" title={"✓ Gewählt"+(istMehrfach||isBKR?" ("+gewaehlteNeu.length+" von "+maxAuswahl+" Plätzen)":"")}>{gewaehlteNeu.map(o=><ErgebnisBalken key={o.id} opt={o} hl="g"/>)}</ErgebnisBlock>}
                {quotaGesperrtNeu.length>0&&<ErgebnisBlock type="q" title="⚠ Quota erreicht — nicht berücksichtigt (§45 Abs. 2 LWG)"><div style={{fontSize:11,color:"#92400e",marginBottom:8}}>Trotz ausreichender Stimmen nicht gewählt.</div>{quotaGesperrtNeu.map(o=><ErgebnisBalken key={o.id} opt={o} hl="q"/>)}</ErgebnisBlock>}
                {!gleichstand&&braucht2WG&&nichtGewaehlteNeu.length>0&&<ErgebnisBlock type="w" title={"⏳ "+offeneAemterNeu+" Platz"+(offeneAemterNeu>1?"e":"")+" offen — "+(istFWGw?"Stichwahl":"2. Wahlgang")+" erforderlich"}>{nichtGewaehlteNeu.map(o=><ErgebnisBalken key={o.id} opt={o} hl="w"/>)}</ErgebnisBlock>}
                {gleichstand&&<ErgebnisBlock type="w" title={"⚖ Gleichstand — "+(istFWGw?"Stichwahl":"2. Wahlgang")+" erforderlich"}>{nichtGewaehlteNeu.map(o=><ErgebnisBalken key={o.id} opt={o} hl="w"/>)}</ErgebnisBlock>}
                {wahlgescheitert&&<ErgebnisBlock type="e" title="✕ Kein Kandidat hat 1/3 erreicht — neue Wahl in späterer Sitzung">{nichtGewaehlteNeu.map(o=><ErgebnisBalken key={o.id} opt={o} hl="n"/>)}</ErgebnisBlock>}
                {!braucht2WG&&!gleichstand&&!wahlgescheitert&&nichtGewaehlteNeu.length>0&&<div style={{marginTop:4}}>{nichtGewaehlteNeu.map(o=><ErgebnisBalken key={o.id} opt={o} hl="n"/>)}</div>}
                {enthaltung&&<div style={{marginTop:4}}><ErgebnisBalken opt={enthaltung} hl="n"/></div>}
                {mehrheitErreicht&&!braucht2WG&&<div style={{...S.alert,background:"#f0faf5",border:"1px solid "+C.accent,color:C.accent,fontSize:13,marginTop:4}}><i className="ti ti-circle-check"/> {isBKR||istMehrfach?"Alle "+maxAuswahl+" Plätze besetzt.":"Wahl abgeschlossen."}</div>}
              </div>
            ) : (
              <div>
                {optErg.map(o=><ErgebnisBalken key={o.id} opt={o} hl="n"/>)}
                {!wahlGeschlossen&&<p style={{fontSize:12,color:C.textLight,textAlign:"center",marginTop:8}}>Wahl läuft — Ergebnisse nach Schließen sichtbar.</p>}
              </div>
            )}
            {istLetzte&&wahlGeschlossen&&total>0&&(braucht2WG||gleichstand)&&isLeitung&&!hatNaechsteStichwahl&&(()=>{
              const kDU=istFWGw&&(!fuehrend||fuehrend.stimmen===0||keinDrittelGlobal);
              const iGF=istFolgeWahlgang(wahl)&&gleichstand;
              if (kDU&&!iGF) return null;
              const bMK=isBKR&&bkrDaten?{...wahl,_gewaehlteH:bkrDaten.gewaehlte.filter(g=>g.istHauptamtlich).length,_gewaehlteE:bkrDaten.gewaehlte.filter(g=>!g.istHauptamtlich).length}:wahl;
              const bFK=isBKR&&bkrDaten?nichtenthaltung.filter(e=>!gewaehlteNeu.some(g=>g.id===e.id)&&!quotaGesperrtNeu.some(g=>g.id===e.id)&&e.stimmen>0):null;
              const fK=bFK||(istMehrfach?nichtenthaltung.filter(e=>!e.gewaehlt&&e.stimmen>0):nichtenthaltung.slice(0,2).filter(e=>e.stimmen>0));
              if (isBKR&&fK.length===0) return (<div style={{...S.alert,background:"#fef2f2",border:"1px solid "+C.error,color:"#7b2d2d",fontSize:13,marginTop:12}}><i className="ti ti-circle-x"/> <strong>Kein weiterer Wahlgang möglich:</strong> Quota ausgeschöpft. Besetzung in späterer Sitzung.</div>);
              return (
                <div style={{marginTop:12}}>
                  {iGF&&<div style={{...S.alert,...S.alertWarning,fontSize:12,marginBottom:10}}><i className="ti ti-alert-triangle"/> Gleichstand im {ist2Wahlgang(wahl)?"2. Wahlgang":"Stichwahl"} — Stichwahl erforderlich.</div>}
                  {isBKR&&quotaGesperrtNeu.length>0&&<div style={{...S.alert,background:"#eff6ff",border:"1px solid #bfdbfe",color:"#1e40af",fontSize:12,marginBottom:10}}><i className="ti ti-info-circle"/> Gem. §46 Abs. 4 Satz 2 LWG: Im weiteren Wahlgang nur andere Mitglieder berücksichtigt.</div>}
                  <StichwahVorbereiten
                    wahl={bMK}
                    kandidaten={fK}
                    offeneAemter={isBKR&&bkrDaten?bkrDaten.offeneAemter:istMehrfach?offeneAemterNeu:1}
                    wahllokalID={wahllokalID}
                    isLeitung={isLeitung}
                    onDataChange={onDataChange}
                    wahlen={wahlen}
                    istBKR={isBKR}
                    bkrWahl={bMK}
                  />
                </div>
              );
            })()}
          </div>
        );
      })}
    </div>
  );
}


function StichwahVorbereiten({ wahl, kandidaten, wahllokalID, isLeitung, onDataChange, wahlen, offeneAemter=1, istBKR=false, bkrWahl=null }) {
  const basisTitel = getBasisTitel(wahl?.titel || "");
  const hat2Wahlgang = wahlen.some(w => ist2Wahlgang(w) && getBasisTitel(w.titel) === basisTitel);
  const naechsterTitel = !hat2Wahlgang && !istStichwahl(wahl)
    ? `2. Wahlgang: ${basisTitel}`
    : `Stichwahl: ${basisTitel}`;
  const naechsterTyp = !hat2Wahlgang && !istStichwahl(wahl) ? "2. Wahlgang" : "Stichwahl";
  const mehrheitsregel = "stichwahl";

  // Kumulative Quota-Berechnung (Fall 1 LWG):
  // Im 2. Wahlgang bereits gewählte Mitglieder aus 1. Wahlgang einbeziehen
  const bkrGewaehlteAusVorherigen = istBKR && bkrWahl ? (() => {
    const bkrErg = berechneBKRErgebnisse(bkrWahl, []);
    // Gewählte aus diesem Wahlgang (bkrDaten bereits berechnet in Parent)
    return { hauptamtlich: kandidaten.filter(k=>k.istHauptamtlich&&k.gewaehlt).length,
             ehrenamtlich: kandidaten.filter(k=>!k.istHauptamtlich&&!k.istEnthaltung&&k.gewaehlt).length };
  })() : { hauptamtlich: 0, ehrenamtlich: 0 };

  // Neue kraft-Amtes-Zahlen für Folgewahlgang = ursprünglich + bereits gewählt
  const neueKraftAmtesH = istBKR && bkrWahl
