// Offline-Status: globales Event-basiertes System
const offlineListeners = new Set();
function subscribeOffline(fn) { offlineListeners.add(fn); return () => offlineListeners.delete(fn); }
function notifyOffline(state) { offlineListeners.forEach(fn => fn(state)); }
window.addEventListener("online",  () => notifyOffline(false));
window.addEventListener("offline", () => notifyOffline(true));

// Retry-fähiger Flow-Call: bei Netzwerkfehler bis zu 3× mit Backoff wiederholen
// Stimmabgabe (submitStimme) wird idempotent behandelt — ein „doppelt"-Status
// gilt als akzeptabler Retry-Ausgang (Token bereits verbraucht = Stimme war drin).
async function callFlow(flowName, body, { retries = 3, retryDelay = 1500 } = {}) {
  const url = API.flows[flowName];
  if (url.startsWith("PLATZHALTER")) throw new Error(`Flow '${flowName}' noch nicht konfiguriert.`);

  let lastErr;
  for (let attempt = 1; attempt <= retries; attempt++) {
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apiKey: API.key, ...body }),
        signal: AbortSignal.timeout(20000), // 20s pro Versuch
      });
      // 502/504 bei bestimmten Flows = SharePoint hat trotzdem ausgeführt (Flow-Timeout)
      if ((res.status === 502 || res.status === 504) &&
          ["deleteToken","saveTokens","deleteWahllokal","saveWahl","saveWahllokal","deleteWahl"].includes(flowName)) {
        return { status: "ok", timeout: true };
      }
      if (!res.ok) throw new Error(`Flow ${flowName} Fehler: ${res.status}`);
      return await res.json();
    } catch (e) {
      lastErr = e;
      // Nur bei Netzwerkfehlern / Timeouts erneut versuchen, nicht bei HTTP 4xx
      const isNetworkErr = (e instanceof TypeError) || e.name === "TimeoutError" || e.name === "AbortError";
      if (!isNetworkErr || attempt === retries) break;
      // Exponentieller Backoff: 1,5s → 3s → 4,5s
      await new Promise(r => setTimeout(r, retryDelay * attempt));
    }
  }
  throw lastErr;
}

// Hook: liefert true wenn offline, false wenn online
function useOfflineStatus() {
  const [offline, setOffline] = useState(!navigator.onLine);
  useEffect(() => subscribeOffline(setOffline), []);
  return offline;
}

// Hook: true wenn Viewport <= 600px (Mobile)
function useIsMobile() {
  const [mobile, setMobile] = useState(window.innerWidth <= 600);
  useEffect(() => {
    const fn = () => setMobile(window.innerWidth <= 600);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return mobile;
}

// Zeitzone-Fix: datetime-local liefert lokale Zeit ohne Offset
function parseLocalDatetime(val) {
  if (!val) return null;
  if (!val.includes("Z") && !val.includes("+") && !val.match(/T\d{2}:\d{2}:\d{2}-/)) {
    const [date, time] = val.split("T");
    const [y,mo,d] = date.split("-").map(Number);
    const [h,mi] = (time||"00:00").split(":").map(Number);
    return new Date(y, mo-1, d, h||0, mi||0);
  }
  return new Date(val);
}
function parseSharePointDate(val) {
  if (!val) return null;
  if (val.includes("Z") || val.includes("+")) return new Date(val);
  return new Date(val + "Z");
}
function isAfterEndzeit(wahl, refDate = new Date()) {
  if (!wahl || !wahl.endzeit) return false;
  const end = parseSharePointDate(wahl.endzeit);
  return !!end && !isNaN(end.getTime()) && end <= refDate;
}
function isWithinWahlZeitfenster(wahl, refDate = new Date()) {
  const start = parseSharePointDate(wahl?.startzeit);
  if (!start || isNaN(start.getTime())) return false;
  return start <= refDate && !isAfterEndzeit(wahl, refDate);
}

function secondsUntilEndzeit(wahl, refDate = new Date()) {
  if (!wahl || !wahl.endzeit) return null;
  const end = parseSharePointDate(wahl.endzeit);
  if (!end || isNaN(end.getTime())) return null;
  return Math.floor((end - refDate) / 1000);
}
function formatRestzeit(seconds) {
  if (seconds === null || seconds === undefined || isNaN(seconds)) return "";
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
  return `${m}m ${String(sec).padStart(2,"0")}s`;
}
function getWahlZeitStatus(wahl, refDate = new Date()) {
  if (!wahl) return { status:"unbekannt", label:"unbekannt", icon:<i className="ti ti-question-mark" aria-hidden="true"/>, badge:S.badgeGray, hint:"" };
  if (wahl.geschlossen) return { status:"geschlossen", label:"geschlossen", icon:<i className="ti ti-lock" aria-hidden="true"/>, badge:S.badgeRed, hint:"Die Wahl ist offiziell geschlossen; Ergebnisse können angezeigt werden." };
  if (!wahl.aktiv) return { status:"pausiert", label:"pausiert", icon:<i className="ti ti-player-pause" aria-hidden="true"/>, badge:S.badgeOrange, hint:"Die Wahl ist angelegt, aber noch nicht freigegeben." };

  const start = parseSharePointDate(wahl.startzeit);
  if (start && !isNaN(start.getTime()) && start > refDate) {
    return { status:"wartet", label:"wartet auf Startzeit", icon:<i className="ti ti-clock" aria-hidden="true"/>, badge:S.badgeGray, hint:`Start in ${formatRestzeit(Math.floor((start - refDate) / 1000))}` };
  }

  const rest = secondsUntilEndzeit(wahl, refDate);
  if (rest !== null && rest <= 0) {
    return { status:"endzeit_erreicht", label:"Endzeit erreicht", icon:<i className="ti ti-clock-off" aria-hidden="true"/>, badge:S.badgeOrange, hint:"Stimmabgabe ist gesperrt. Die Wahl kann nun offiziell geschlossen werden." };
  }
  if (rest !== null && rest <= 300) {
    return { status:"endet_bald", label:"endet bald", icon:<i className="ti ti-alert-triangle" aria-hidden="true"/>, badge:S.badgeOrange, hint:`Endet in ${formatRestzeit(rest)}` };
  }
  return { status:"laeuft", label:"läuft", icon:<span style={{color:"#22c55e", fontSize:10}}>●</span>, badge:S.badgeGreen, hint: rest !== null ? `Endet um ${formatDatum(wahl.endzeit)}.` : "Keine Endzeit gesetzt." };
}
function toLocalInputValue(date, withSeconds = false) {
  if (!date) return "";
  const d = new Date(date);
  const pad = n => String(n).padStart(2,"0");
  const base = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return withSeconds ? `${base}:${pad(d.getSeconds())}` : base;
}

// Zentrale Datumsformatierung für Anzeige in Wahlleitung/Wahlcodeliste
function formatDatum(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }) + " " +
    d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
}

// Nutzerfreundlicher Datum/Uhrzeit-Picker
function DateTimePicker({ value, onChange, label, hint, minDate, inline=false }) {
  const parts = (value||"").split("T");
  const datePart = parts[0]||"";
  const timePart = parts[1]||"00:00";
  const [h, m] = timePart.split(":");

  const hours = Array.from({length:24},(_,i)=>String(i).padStart(2,"0"));
  const minutes = ["00","05","10","15","20","25","30","35","40","45","50","55"];

  function update(newDate, newH, newM) { onChange(`${newDate}T${newH}:${newM}`); }

  const inputStyle = { ...S.input, fontSize:14, padding:"10px 12px", height:42, boxSizing:"border-box" };

  return (
    <div style={S.formGroup}>
      {label&&<label style={S.label}>{label}</label>}
      <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
        <input type="date" value={datePart} min={minDate||""} onChange={e=>update(e.target.value,h||"09",m||"00")}
          style={{ ...inputStyle, width:150 }}/>
        <select value={h||"09"} onChange={e=>update(datePart,e.target.value,m||"00")}
          style={{ ...inputStyle, width:72, appearance:"none", textAlign:"center", cursor:"pointer" }}>
          {hours.map(hh=><option key={hh} value={hh}>{hh}</option>)}
        </select>
        <span style={{ color:C.textLight, fontWeight:700, fontSize:16 }}>:</span>
        <select value={m||"00"} onChange={e=>update(datePart,h||"09",e.target.value)}
          style={{ ...inputStyle, width:60, appearance:"none", textAlign:"center", cursor:"pointer" }}>
          {minutes.map(mm=><option key={mm} value={mm}>{mm}</option>)}
        </select>
        <span style={{ fontSize:13, color:C.textLight }}>Uhr</span>
      </div>
      {hint&&<p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>{hint}</p>}
    </div>
  );
}

// Nächste halbe Stunde berechnen
function naechsteHalbeStunde() {
  const now = new Date();
  const m = now.getMinutes();
  if (m < 30) { now.setMinutes(30, 0, 0); }
  else { now.setHours(now.getHours()+1, 0, 0, 0); }
  return toLocalInputValue(now);
}
function naechsteViertelStunde() {
  const d = new Date();
  const minuten = d.getMinutes();
  const naechste = Math.ceil((minuten + 1) / 15) * 15;
  d.setMinutes(naechste, 0, 0);
  return toLocalInputValue(d);
}
// Deutsches Datumsformat "DD.MM.YYYY HH:MM" → Date
function parseGueltigBis(val) {
  if (!val) return null;
  // Unix-Timestamp (Sekunden)
  if (/^\d{9,12}$/.test(val.trim())) return new Date(parseInt(val) * 1000);
  // Deutsches Format: 15.06.2026 10:30
  const m = val.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
  if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]), parseInt(m[4]), parseInt(m[5]));
  // Fallback: ISO oder anderes Format
  return new Date(val);
}
function formatGueltigBis(val) {
  const d = parseLocalDatetime(val);
  if (!d) return "";
  // Als Unix-Timestamp (Sekunden seit 1970) speichern — formatunabhängig
  return String(Math.floor(d.getTime() / 1000));
}

function generateToken() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  let t = "";
  for (let i = 0; i < 8; i++) t += chars[arr[i] % chars.length];
  return t.slice(0,4) + "-" + t.slice(4);
}

// ─── Token PDF Generierung (global) ─────────────────────────────────────────
function generiereTokenPDF(tokens, wahllokalName, evID, mitQR=true) {
  const COLS = 2, ROWS = 6, PER_PAGE = COLS * ROWS;
  const baseURL = window.location.origin + window.location.pathname;
  const total = tokens.length;
  const now = new Date();
  const druckDatum = now.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" });
  const druckZeit = now.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
  const druckDatumZeit = druckDatum + ", " + druckZeit + " Uhr";

  function kontrollcode(n, evid, datum) {
    let h = 0;
    const s = n + "|" + evid + "|" + datum;
    for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const pos = Math.abs(h);
    return "KP-" + now.getFullYear() + "-" +
           chars[pos%32] + chars[(pos>>5)%32] + chars[(pos>>10)%32] +
           chars[(pos>>15)%32] + chars[(n*7+pos)%32] + chars[(n*13+pos)%32];
  }
  const kCode = kontrollcode(total, evID, druckDatumZeit);

  const pages = [];
  for (let i = 0; i < tokens.length; i += PER_PAGE) pages.push(tokens.slice(i, i + PER_PAGE));

  function karteHTML(t, globalIdx) {
    if (!t) return '<div class="karte leer"></div>';
    const wahlURL = baseURL + "?wahllokal=" + evID;
    const qrHTML = mitQR
      ? '<img src="https://api.qrserver.com/v1/create-qr-code/?size=44x44&data=' + encodeURIComponent(wahlURL) + '&color=1a2744&bgcolor=ffffff&margin=2" width="44" height="44" alt="QR" style="display:block;margin:1.5mm auto 0;"/>'
      : '';
    return '<div class="karte">' +
      '<div class="logo">Evangelische Landeskirche in Baden</div>' +
      '<div class="wahllokal">' + wahllokalName + '</div>' +
      '<div class="label">Persönlicher Wahlcode</div>' +
      '<div class="token">' + t + '</div>' +
      qrHTML +
      '<div class="hinweis">' + (mitQR ? 'QR-Code scannen oder Code eingeben' : 'Diesen Code geheim halten') + '</div>' +
      '<div class="nummer">Nr. ' + (globalIdx + 1) + ' von ' + total + '</div>' +
      '</div>';
  }

  const deckblatt = '<div class="deckblatt">' +
    '<div class="deck-logo">Evangelische Landeskirche in Baden</div>' +
    '<div class="deck-title">Wahlcodes</div>' +
    '<div class="deck-sub">' + wahllokalName + '</div>' +
    '<table class="deck-table">' +
      '<tr><td>Gedruckt am</td><td><strong>' + druckDatumZeit + '</strong></td></tr>' +
      '<tr><td>Wahllokal</td><td><strong>' + evID + '</strong></td></tr>' +
      '<tr><td>Anzahl Wahlcodes</td><td><strong>' + total + '</strong></td></tr>' +
      '<tr><td>Kontrollcode</td><td><strong class="kcode">' + kCode + '</strong></td></tr>' +
    '</table>' +
    '<div class="deck-hinweis">Bitte vor Beginn der Wahl pr&uuml;fen:<br>' +
    'Anzahl der Wahlcodes = Anzahl der Stimmberechtigten.<br>' +
    'Kontrollcode in der App unter Wahlcodes &rarr; Kontrollcode pr&uuml;fen vergleichen.</div>' +
    '</div>';

  const styles = `
    @page { size: A4; margin: 8mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; }
    .deckblatt { width: 194mm; height: 281mm; display: flex; flex-direction: column; align-items: center; justify-content: center; page-break-after: always; gap: 5mm; }
    .deck-logo { font-size: 8pt; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #1a3a5c; }
    .deck-title { font-size: 26pt; font-weight: 900; color: #1a3a5c; margin: 2mm 0; }
    .deck-sub { font-size: 13pt; color: #5a6a7a; margin-bottom: 7mm; }
    .deck-table { border-collapse: collapse; width: 120mm; }
    .deck-table td { padding: 2.5mm 4mm; border-bottom: 1px solid #eee; font-size: 10pt; color: #333; }
    .deck-table td:first-child { color: #888; font-size: 8pt; text-transform: uppercase; letter-spacing: 0.08em; width: 48mm; }
    .kcode { font-family: 'Courier New', monospace; font-size: 14pt; color: #1a3a5c; letter-spacing: 0.12em; }
    .deck-hinweis { margin-top: 7mm; width: 120mm; padding: 3.5mm 5mm; background: #f8f9fa; border-left: 3px solid #1a3a5c; font-size: 8.5pt; color: #555; line-height: 1.6; }
    .page { width: 194mm; height: 281mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(6, 1fr); gap: 0; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
    .karte { border: 0.5px dashed #bbb; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5mm 3mm; text-align: center; }
    .logo { font-size: 5.5pt; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #1a3a5c; margin-bottom: 0.5mm; }
    .wahllokal { font-size: 6.5pt; color: #5a6a7a; margin-bottom: 1mm; }
    .label { font-size: 5.5pt; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 0.5mm; }

  const pageHTML = pages.map(function(page, pi) {
    return '<div class="page">' +
      Array.from({length: PER_PAGE}, function(_, i) {
        return karteHTML(page[i], pi * PER_PAGE + i);
      }).join('') +
      '</div>';
  }).join('');

  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Wahlcodes ' + wahllokalName + '</title><style>' + styles + '</style></head><body>' + deckblatt + pageHTML + '</body></html>';
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if (win) { win.onload = function() { win.print(); }; }
}

          <WahllokalView appData={appData} wahllokalID={wahllokalID} onDataChange={loadAppData} />
          {/* DemoSwitcher entfernt — Zugänge nur über direkte URLs: ?ansicht=leitung / ?ansicht=superadmin */}
        </>
      )}
      {view === "ergebnisse" && appData && (leitungAuth
        ? <ErgebnisDashboard appData={appData} wahllokalID={leitungAuth} onBack={() => { setView("leitung"); updateURL(leitungAuth, "leitung"); }} isLeitung={true} onDataChange={loadAppData} />
        : <LeitungLoginScreen onAuth={(eid) => { setLeitungAuth(eid); }} onBack={() => { setView("wahllokal"); updateURL(wahllokalID, null); }} fixedEventID={wahllokalID} />
      )}
      {view === "leitung" && (leitungAuth
        ? <LeitungView appData={appData} eventID={leitungAuth} onExit={() => { setView("wahllokal"); setLeitungAuth(null); updateURL(wahllokalID, null); }} onDataChange={loadAppData} />
        : <LeitungLoginScreen onAuth={(eid) => setLeitungAuth(eid)} onBack={() => { setView("wahllokal"); updateURL(wahllokalID, null); }} fixedEventID={ansicht === "leitung" ? wahllokalID : null} />
      )}
      {view === "superadmin" && (superadminAuth
        ? <SuperadminView appData={appData || { wahllokale:[], wahlen:[], optionen:[], tokens:[], tokenCount:0 }} onExit={() => { setView("wahllokal"); setSuperadminAuth(false); updateURL(wahllokalID, null); }} onDataChange={loadAppData} />
        : <SuperadminPinScreen onAuth={() => { setSuperadminAuth(true); }} onBack={() => { setView("wahllokal"); updateURL(wahllokalID, null); }} />
      )}
      {view === "praesentation" && appData && (
        <PraesentationsModus appData={appData} wahllokalID={wahllokalID} onExit={() => { setView("wahllokal"); updateURL(wahllokalID, null); }}/>
      )}
    </div>
  );
}

        <input type="password" value={pin} onChange={e => setPin(e.target.value)} onKeyDown={e => e.key==="Enter" && submitWithFallback()} placeholder="PIN eingeben" style={{ ...S.input, textAlign:"center", fontSize:20, letterSpacing:"0.2em", marginBottom:8, borderColor:error?C.error:C.border }} autoFocus />

        <button onClick={submitWithFallback} disabled={loading} style={{ ...S.btn, background:C.superadmin, color:"#fff", width:"100%", padding:"12px", marginBottom:8 }}>{loading?"Prüfe…":"Anmelden"}</button>

function LeitungLoginScreen({ onAuth, onBack, fixedEventID }) {
  const [wahllokale, setWahllokale] = useState([]); const [loading, setLoading] = useState(true);
  const [selectedEventID, setSelectedEventID] = useState(fixedEventID || "");
  const [step, setStep] = useState(fixedEventID ? "pin" : "waehlen");
  const [pin, setPin] = useState(""); const [error, setError] = useState(false);
  const selectedWahllokal = wahllokale.find(w => w.eventID === selectedEventID);
  useEffect(() => {
    async function load() {
      try { const result = await callFlow("getAlle", {}); const alle = (result||[]).map(mapWahllokal).filter(w=>w.aktiv); setWahllokale(alle); if (!fixedEventID && alle.length>0) setSelectedEventID(alle[0].eventID); } catch(e){}
      setLoading(false);
    }
    load();
  }, []);
  const [submitting, setSubmitting] = useState(false);
  async function submit() {
    if (!pin || !selectedEventID) return;
    setSubmitting(true); setError(false);
    try {
      if (API.flows.checkPin && !API.flows.checkPin.startsWith("PLATZHALTER")) {
        const result = await callFlow("checkPin", { eventID: selectedEventID, pin, typ: "leitung" });
        if (result && result.status === "ok") { onAuth(selectedEventID); return; }
      } else {
        // Fallback solange Flow noch nicht konfiguriert:
        // PIN kommt noch aus getAlle → funktioniert wie bisher, aber mit Warnung
        console.warn("checkPin-Flow nicht konfiguriert — PIN wird clientseitig geprüft.");
        if (selectedWahllokal && pin === selectedWahllokal.leitungPIN) { onAuth(selectedEventID); return; }
      }
    } catch(e) { console.error(e); }
    setError(true); setPin(""); setTimeout(()=>setError(false),2000);
    setSubmitting(false);
  }
  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:C.bg }}>
      <div style={{ ...S.card, width:340, textAlign:"center" }}>
        <div style={{ width:48, height:48, borderRadius:"50%", background:C.primary, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, margin:"0 auto 16px" }}>{step==="waehlen"?<i className="ti ti-map-pin" aria-hidden="true" style={{fontSize:"22px"}}/>:<i className="ti ti-shield-lock" aria-hidden="true" style={{fontSize:"22px"}}/>}</div>
        <h2 style={{ margin:"0 0 4px", color:C.primary }}>Wahlleitung</h2>
        {step==="waehlen" && (<>
          <p style={{ color:C.textLight, fontSize:14, marginBottom:24 }}>Bitte wählen Sie Ihr Wahllokal.</p>
          {loading ? <p style={{ color:C.textLight, fontSize:14, marginBottom:24 }}>Wird geladen…</p> : wahllokale.length===0 ? <p style={{ color:C.error, fontSize:14, marginBottom:24 }}>Keine aktiven Wahllokale.</p> :
            <div style={S.formGroup}><select style={{ ...S.select, textAlign:"center" }} value={selectedEventID} onChange={e=>setSelectedEventID(e.target.value)}>{wahllokale.map(wl=><option key={wl.id} value={wl.eventID}>{wl.name} ({wl.eventID})</option>)}</select></div>}
          <button onClick={()=>setStep("pin")} disabled={loading||wahllokale.length===0} style={{ ...S.btn, ...S.btnPrimary, width:"100%", padding:"12px", marginBottom:8 }}>Weiter →</button>
          <button onClick={onBack} style={{ ...S.btn, ...S.btnGhost, width:"100%", padding:"10px" }}>← Zurück</button>
        </>)}
        {step==="pin" && (<>
          <p style={{ color:C.textLight, fontSize:14, marginBottom:4 }}>PIN für <strong style={{ color:C.primary }}>{selectedWahllokal?.name}</strong></p>
          <p style={{ color:C.textLight, fontSize:12, marginBottom:20 }}>Der PIN wird von Ihrem Administrator vergeben.</p>
          <input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="PIN eingeben" style={{ ...S.input, textAlign:"center", fontSize:20, letterSpacing:"0.2em", marginBottom:8, borderColor:error?C.error:C.border }} autoFocus />
          {error ? <p style={{ color:C.error, fontSize:13, margin:"0 0 8px" }}>Falscher PIN.</p> : <div style={{ height:28 }}/>}
          <button onClick={submit} disabled={submitting} style={{ ...S.btn, ...S.btnPrimary, width:"100%", padding:"12px", marginBottom:8 }}>{submitting?"Prüfe…":"Anmelden"}</button>
          <button onClick={()=>setStep("waehlen")} disabled={submitting} style={{ ...S.btn, ...S.btnGhost, width:"100%", padding:"10px" }}>← Wahllokal ändern</button>
        </>)}
      </div>
    </div>
  );
}

function WahllokalView({ appData, wahllokalID, onDataChange }) {
  const wahllokal = appData.wahllokale.find(w => w.eventID === wahllokalID);
  const now = new Date();
  // FIX Zeitzone + Endzeit: Wahl ist erst ab Startzeit und nur bis zur optionalen Endzeit abstimmbar
  const aktiveWahlen = appData.wahlen.filter(w => w.eventID===wahllokalID && w.aktiv && !w.geschlossen && isWithinWahlZeitfenster(w, now));
  const naechsteWahl = appData.wahlen
    .filter(w => w.eventID===wahllokalID && w.aktiv && !w.geschlossen && !isAfterEndzeit(w, now) && parseSharePointDate(w.startzeit)>now)
    .sort((a,b)=>parseSharePointDate(a.startzeit)-parseSharePointDate(b.startzeit))[0];
  const abgelaufeneWahl = appData.wahlen
    .filter(w => w.eventID===wahllokalID && w.aktiv && !w.geschlossen && isAfterEndzeit(w, now))
    .sort((a,b)=>parseSharePointDate(b.endzeit)-parseSharePointDate(a.endzeit))[0];
  const [selectedWahlID, setSelectedWahlID] = useState("");
  const [tokenRaw, setTokenRaw] = useState("");
  const [selected, setSelected] = useState([]);
  const [status, setStatus] = useState(null);
  const [statusMsg, setStatusMsg] = useState("");
  const [countdown, setCountdown] = useState(5);
  const [nowTime, setNowTime] = useState(new Date());
  const [submitting, setSubmitting] = useState(false);
  const [flowFehler, setFlowFehler] = useState(null);
  const [showConfirm, setShowConfirm] = useState(false);

  useEffect(() => { const t = setInterval(()=>setNowTime(new Date()),1000); return ()=>clearInterval(t); },[]);
  // Wenn sich die aktive Wahl ändert: Auswahl zurücksetzen und neue Wahl setzen
  const aktiveWahlIDs = aktiveWahlen.map(w=>w.id).sort().join(",");
  useEffect(() => {
    if (aktiveWahlen.length === 0) return;
    if (!selectedWahlID) {
      setSelectedWahlID(aktiveWahlen[0].id);
      return;
    }
    // Prüfen ob aktuelle Wahl noch aktiv ist
    const nochAktiv = aktiveWahlen.find(w=>w.id===selectedWahlID);
    if (!nochAktiv) {
      // Aktuelle Wahl nicht mehr aktiv — auf neue wechseln und Auswahl leeren
      setSelectedWahlID(aktiveWahlen[0].id);
      setSelected([]);
    }
  }, [aktiveWahlIDs]);
  useEffect(() => {
    if (status && status!=="pruefen") {
      // Bei ungueltig: sofort frische Daten laden damit Optionen korrekt sind
      if (status==="ungueltig") onDataChange();
      setCountdown(5);
      const t = setInterval(()=>{
        setCountdown(c=>{ if(c<=1){ clearInterval(t); setStatus(null); setStatusMsg(""); setTokenRaw(""); setSelected([]); setFlowFehler(null); setShowConfirm(false); return 5; } return c-1; });
      },1000);
      return ()=>clearInterval(t);
    }
  },[status]);

  const tokenClean = tokenRaw.replace(/-/g,"").toUpperCase().slice(0,8);
  // Mit Bindestrich für Flow und SharePoint (Format: XXXX-YYYY)
  const tokenFormatted = tokenClean.length===8 ? tokenClean.slice(0,4)+"-"+tokenClean.slice(4) : tokenClean;
  const selectedWahl = appData.wahlen.find(w => w.id===selectedWahlID);

  // Wenn Wahl wechselt: Auswahl zurücksetzen
  useEffect(()=>{ setSelected([]); setShowConfirm(false); },[selectedWahlID]);

  function toggleOption(opt) {
    if (!selectedWahl) return;
    // Sicherheitscheck: Option muss zur aktuellen Wahl gehören
    if (!selectedWahl.optionen.find(o=>o.id===opt.id)) return;
    const isSel = selected.find(s=>s.id===opt.id);
    if (isSel) { setSelected(selected.filter(s=>s.id!==opt.id)); return; }
    if (opt.istEnthaltung) { setSelected([opt]); return; }
    const ohneEnthaltung = selected.filter(s=>!s.istEnthaltung);
    if (!selectedWahl.mehrfach) { setSelected([opt]); }
    else if (ohneEnthaltung.length < selectedWahl.maxAuswahl) { setSelected([...ohneEnthaltung, opt]); }
  }

  function isValid() {
    if (!selectedWahl || tokenClean.length!==8 || selected.length===0 || submitting) return false;
    if (!selectedWahl.mehrfach && selected.length!==1) return false;
    if (selectedWahl.mehrfach && selectedWahl.exakt && selected.length!==selectedWahl.maxAuswahl) return false;
    if (selectedWahl.mehrfach && !selectedWahl.exakt && selected.length>selectedWahl.maxAuswahl) return false;
    return true;
  }

  async function submitStimme() {
    if (!isValid()) return;
    setShowConfirm(false);

    // SICHERHEITSCHECK: Alle Optionen müssen zur selectedWahl gehören
    const wahlZumAbstimmen = appData.wahlen.find(w => w.id===selectedWahlID);
    if (!wahlZumAbstimmen) { setFlowFehler("Fehler: Wahl nicht gefunden. Bitte Seite neu laden."); return; }
    if (!wahlZumAbstimmen.aktiv || wahlZumAbstimmen.geschlossen) { setFlowFehler("Fehler: Diese Wahl ist nicht mehr aktiv."); return; }
    if (!isWithinWahlZeitfenster(wahlZumAbstimmen, new Date())) { setFlowFehler(isAfterEndzeit(wahlZumAbstimmen) ? "Diese Wahl ist beendet. Eine Stimmabgabe ist nicht mehr möglich." : "Diese Wahl ist noch nicht freigegeben. Bitte warten Sie bis zur Startzeit."); return; }
    const gueltigeOptionIDs = new Set(wahlZumAbstimmen.optionen.map(o=>o.id));
    const alleOptionenGueltig = selected.every(s => gueltigeOptionIDs.has(s.id));
    if (!alleOptionenGueltig) {
      setFlowFehler("FEHLER: Inkonsistenz zwischen Wahl und Optionen erkannt. Bitte Seite neu laden und erneut versuchen.");
      setSubmitting(false);
      return;
    }

    setSubmitting(true); setStatus("pruefen"); setFlowFehler(null);
    try {
      const result = await callFlow("submitStimme", {
        tokenCode: tokenFormatted,
        eventID: wahllokalID,
        wahlID: parseInt(wahlZumAbstimmen.id),
        wahlTitel: wahlZumAbstimmen.titel,
        positionen: selected.map(s=>({ optionID:parseInt(s.id), name:s.name })),
        maxAuswahl: wahlZumAbstimmen.maxAuswahl||1
      });
      if (result.status==="gueltig") { setStatus("gueltig"); setStatusMsg(`Ihre Stimme für „${wahlZumAbstimmen.titel}" wurde anonym gespeichert und gezählt.`); onDataChange(); }
      else if (result.status==="doppelt") { setStatus("doppelt"); setStatusMsg(`Für die Wahl „${wahlZumAbstimmen.titel}" wurde mit diesem Wahlcode bereits eine Stimme abgegeben.`); }
      else { setStatus("ungueltig"); setStatusMsg(result.reason==="wahl_beendet" ? "Diese Wahl ist beendet. Eine Stimmabgabe ist nicht mehr möglich." : result.reason==="wahl_noch_nicht_gestartet" ? "Diese Wahl ist noch nicht freigegeben. Bitte warten Sie bis zur Startzeit." : result.reason==="abgelaufen" ? "Der Wahlcode ist abgelaufen und kann nicht mehr verwendet werden." : result.reason==="gesperrt" ? "Der Wahlcode wurde gesperrt. Bitte wenden Sie sich an die Wahlleitung." : "Der Wahlcode ist ungültig oder die Wahl ist nicht aktiv. Bitte prüfen Sie Ihre Eingabe."); }
    } catch(e) {
      setStatus(null);
      // Netzwerkfehler nach allen Retry-Versuchen
      const isNetErr = (e instanceof TypeError) || e.name === "TimeoutError" || e.name === "AbortError" || e.message?.includes("fetch");
      setFlowFehler(isNetErr
        ? "Verbindungsfehler: Ihre Stimme konnte nicht übermittelt werden. Bitte prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut."
        : e.message);
    }
    finally { setSubmitting(false); }
  }

  if (status==="pruefen") return <div style={{ ...S.statusScreen, background:C.bg }}><div style={S.spinner}/><h2 style={{ ...S.statusTitle, color:C.primary }}>PRÜFUNG LÄUFT</h2><p style={{ color:C.textLight, fontSize:15 }}>Ihre Stimme wird geprüft und gespeichert.</p></div>;
  if (status==="gueltig") return <div style={{ ...S.statusScreen, background:C.successBg }}><i className="ti ti-circle-check" aria-hidden="true" style={{ fontSize:72, color:C.success }}/><h2 style={{ ...S.statusTitle, color:C.success }}>STIMME ERFOLGREICH ABGEGEBEN</h2><p style={{ ...S.statusMsg, color:"#2d6a4f" }}>{statusMsg}</p><p style={{ fontSize:13, color:"rgba(0,0,0,0.35)", marginTop:8 }}>Zurück in {countdown} Sekunden…</p></div>;
  if (status==="ungueltig") return <div style={{ ...S.statusScreen, background:C.errorBg }}><i className="ti ti-ban" aria-hidden="true" style={{ fontSize:72, color:C.error }}/><h2 style={{ ...S.statusTitle, color:C.error }}>KEINE STIMMABGABE MÖGLICH</h2><p style={{ ...S.statusMsg, color:"#7b2d2d" }}>{statusMsg}</p><p style={{ fontSize:13, color:"rgba(0,0,0,0.35)", marginTop:8 }}>Bitte wenden Sie sich an die Wahlleitung. Zurück in {countdown} Sekunden…</p></div>;
  if (status==="doppelt") return <div style={{ ...S.statusScreen, background:C.warningBg }}><i className="ti ti-alert-triangle" aria-hidden="true" style={{ fontSize:72, color:C.warning }}/><h2 style={{ ...S.statusTitle, color:C.warning }}>STIMME BEREITS ABGEGEBEN</h2><p style={{ ...S.statusMsg, color:"#7d5a0a" }}>{statusMsg}</p><p style={{ fontSize:13, color:"rgba(0,0,0,0.35)", marginTop:8 }}>Für diese Wahl wurde mit diesem Code bereits abgestimmt. Zurück in {countdown} Sekunden…</p></div>;
  if (!wahllokal||!wahllokal.aktiv) return <div style={S.wlContainer}><WlHeader/><WahllokalGear wahllokalID={wahllokalID}/><div style={S.closedScreen}><div><i className="ti ti-lock" aria-hidden="true" style={{fontSize:48, color:C.textLight}}/></div><h2 style={{ fontSize:22, fontWeight:700, color:C.primary, margin:0 }}>Das Wahllokal ist geschlossen.</h2></div></div>;
  if (aktiveWahlen.length===0) {
    const diff = naechsteWahl ? Math.max(0, Math.floor((parseSharePointDate(naechsteWahl.startzeit)-nowTime)/1000)) : null;
    const endzeitErreicht = !naechsteWahl && !!abgelaufeneWahl;
    return (
      <div style={S.wlContainer}>
        <WlHeader name={wahllokal?.name}/>
        <WahllokalGear wahllokalID={wahllokalID}/>
        <div style={S.closedScreen}>
          <div style={{ fontSize:48 }}>{naechsteWahl?<i className="ti ti-clock" aria-hidden="true" style={{fontSize:48}}/>:endzeitErreicht?<i className="ti ti-clock-off" aria-hidden="true" style={{fontSize:48}}/>:<i className="ti ti-lock" aria-hidden="true" style={{fontSize:48}}/>}</div>
          <h2 style={{ fontSize:22, fontWeight:700, color:C.primary, margin:0 }}>{naechsteWahl?"Abstimmung beginnt in Kürze":endzeitErreicht?"Diese Abstimmung ist beendet":"Keine aktive Abstimmung."}</h2>
          {naechsteWahl&&diff!==null&&<div style={{ fontSize:28, fontWeight:700, color:C.accent }}>{formatRestzeit(diff)}</div>}
          {endzeitErreicht&&<p style={{ fontSize:15, color:C.textLight, maxWidth:420, lineHeight:1.6, margin:0 }}>Die Endzeit wurde erreicht. Eine Stimmabgabe ist nicht mehr möglich. Die Wahlleitung schließt die Wahl anschließend offiziell und gibt das Ergebnis frei.</p>}
        </div>
      </div>
    );
  }

  const endCountdownSeconds = selectedWahl ? secondsUntilEndzeit(selectedWahl, nowTime) : null;
  const showEndCountdown = endCountdownSeconds !== null && endCountdownSeconds >= 0 && endCountdownSeconds <= 300;
  const maxCount = selectedWahl?.mehrfach ? selectedWahl.maxAuswahl : 1;
  const counterOk = selectedWahl && (!selectedWahl.mehrfach ? selected.length===1 : selected.length>0 && selected.length<=maxCount);
  return (
    <div style={S.wlContainer}>
      <WlHeader name={wahllokal?.name}/>
      <WahllokalGear wahllokalID={wahllokalID}/>
      {flowFehler && <div style={{ ...S.alert, ...S.alertError }}><i className="ti ti-alert-triangle" aria-hidden="true"/> {flowFehler}</div>}
      {selectedWahl && showEndCountdown && (
        <div style={{ ...S.alert, ...(endCountdownSeconds<=60 ? S.alertError : S.alertWarning), marginBottom:16 }}>

              <div style={{ fontSize:12, color:C.textLight, marginBottom:6 }}>Sie geben Ihre Stimme ab für:</div>

// ─── Token-Ausgabe-Seite (Hash-Link) ────────────────────────────────────────
function TokenAusgabePage({ hash, eventID }) {
  const [phase, setPhase] = useState("hinweis"); // hinweis | deck | result | fehler
  const [code, setCode] = useState("");
  const [fehler, setFehler] = useState("");
  const [countdown, setCountdown] = useState(60);
  const [codeHidden, setCodeHidden] = useState(false);
  const countdownRef = useRef(null);
  const isMobile = useIsMobile();

  const offsets = [
    { x:22, y:22, r:-7 }, { x:17, y:16, r:-4 }, { x:12, y:10, r:2 },
    { x:8,  y:5,  r:-1.5 }, { x:4, y:2, r:1 }, { x:0, y:0, r:0 },
  ];

  function buildDeck() {
    const d = document.getElementById("ta-deck");
    if (!d) return;
    d.innerHTML = "";
    offsets.forEach((o, i) => {
      const c = document.createElement("div");
      c.id = `ta-card-${i}`;
      c.style.cssText = `position:absolute;width:220px;height:138px;border-radius:18px 14px 20px 16px/16px 20px 14px 18px;border:0.5px solid #ddd;background:#f5f5f5;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateX(${o.x}px) translateY(${o.y}px) rotate(${o.r}deg);z-index:${i};transition:transform 0.45s cubic-bezier(.4,0,.2,1),opacity 0.4s;left:10px;top:10px;user-select:none;`;
      c.innerHTML = `<span style="position:absolute;top:12px;font-size:8px;font-weight:500;letter-spacing:0.18em;color:#aaa;font-family:sans-serif;text-transform:uppercase;">Ev. Landeskirche in Baden</span><span style="position:absolute;bottom:12px;font-size:9px;color:#aaa;font-family:sans-serif;letter-spacing:0.1em;">Wahlcode</span>`;
      // inner dashed border
      const inner = document.createElement("div");
      inner.style.cssText = "position:absolute;inset:14px;border-radius:10px 8px 12px 9px/9px 12px 8px 10px;border:1.5px dashed #ddd;";
      c.appendChild(inner);
      d.appendChild(c);
    });
  }

  function startShuffle(afterFn) {
    const cards = offsets.map((_, i) => document.getElementById(`ta-card-${i}`)).filter(Boolean);
    let step = 0;
    function cascade() {
      if (step >= 6) { setTimeout(afterFn, 200); return; }
      cards.forEach((c, i) => {
        const o = offsets[i];
        const dir = step % 2 === 0 ? 1 : -1;
        setTimeout(() => {
          c.style.transition = "transform 0.22s cubic-bezier(.4,0,.2,1)";
          c.style.transform = `translateX(${o.x}px) translateY(${o.y + dir * 9}px) rotate(${o.r}deg)`;
          setTimeout(() => { c.style.transform = `translateX(${o.x}px) translateY(${o.y}px) rotate(${o.r}deg)`; }, 200);
        }, (cards.length - 1 - i) * 55);
      });
      step++;
      setTimeout(cascade, 420);
    }
    cascade();
  }

  async function onZiehen() {
    setPhase("deck");
    setTimeout(() => { buildDeck(); setTimeout(() => startShuffle(doResolve), 300); }, 50);
  }

  async function doResolve() {
    try {
      const res = await callFlow("resolveHash", { hash, eventID });
      if (res.status === "ok") {
        setCode(res.tokenCode);
        setPhase("result");
        startCountdown();
      } else if (res.status === "ungueltig") {
        setFehler("Dieser Link ist bereits verwendet oder ungültig. Bitte wenden Sie sich an die Wahlleitung.");
        setPhase("fehler");
      } else if (res.status === "kein_token_verfuegbar") {
        setFehler("Es sind keine Wahlcodes mehr verfügbar. Bitte wenden Sie sich an die Wahlleitung.");
        setPhase("fehler");
      } else {
        setFehler("Unbekannter Fehler. Bitte wenden Sie sich an die Wahlleitung.");
        setPhase("fehler");
      }
    } catch(e) {
      setFehler("Verbindungsfehler. Bitte prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.");
      setPhase("fehler");
    }
  }

  function startCountdown() {
    let remaining = 60;
    countdownRef.current = setInterval(() => {
      remaining--;
      setCountdown(remaining);
      const bar = document.getElementById("ta-cd-bar");
      if (bar) {
        bar.style.width = Math.round(((60 - remaining) / 60) * 100) + "%";
        if (remaining <= 15) bar.style.background = "#e24b4a";
      }
      if (remaining <= 0) {
        clearInterval(countdownRef.current);
        setCodeHidden(true);
      }
    }, 1000);
  }

  function copyCode() {
    navigator.clipboard.writeText(code).catch(() => {});
    const btn = document.getElementById("ta-copy-btn");
    if (btn) { btn.textContent = "✓ Kopiert"; setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Kopieren'; }, 2000); }
  }

  function printCode() {
    const w = window.open("", "_blank", "width=420,height=280");
    w.document.write(`<!DOCTYPE html><html><head><style>
      body{font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;gap:10px;}
      .org{font-family:sans-serif;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#999;}
      .code{font-size:30px;font-weight:bold;letter-spacing:0.18em;border:1px solid #ccc;padding:14px 28px;border-radius:8px;margin:6px 0;}
      .sub{font-family:sans-serif;font-size:10px;color:#bbb;}
    </style></head><body>
      <div class="org">Evangelische Landeskirche in Baden</div>
      <div class="org" style="margin-top:-6px;">Persönlicher Wahlcode</div>
      <div class="code">${code}</div>
      <div class="sub">Bitte aufbewahren — gilt für alle Abstimmungen des Wahltages.</div>
      <script>window.onload=()=>window.print();<\/script>
    </body></html>`);
    w.document.close();
  }

  const cardStyle = { borderRadius:"18px 14px 20px 16px/16px 20px 14px 18px", border:`0.5px solid ${C.border}`, background:C.bgWhite, padding:"28px 28px 24px", maxWidth:320, margin:"0 auto", textAlign:"center", display:"flex", flexDirection:"column", alignItems:"center", gap:14 };

  return (
    <div style={{ minHeight:"100vh", background:C.bg, display:"flex", flexDirection:"column" }}>
      {/* Header */}
      <div style={{ background:C.primary, padding:isMobile?"12px 16px":"16px 24px", textAlign:"center" }}>
        <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.15em", color:"rgba(255,255,255,0.6)", textTransform:"uppercase", marginBottom:4 }}>Evangelische Landeskirche in Baden</div>
        <div style={{ fontSize:isMobile?18:22, fontWeight:700, color:"#fff" }}>Wahlcode-Ausgabe</div>
      </div>

      <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", padding:"32px 16px" }}>

        {/* Phase 1: Hinweis + Button */}
        {phase === "hinweis" && (
          <div style={{ maxWidth:340, width:"100%" }}>
            <div style={{ background:C.bgWhite, border:`0.5px solid ${C.border}`, borderRadius:12, padding:"14px 16px", fontSize:13, color:C.textLight, lineHeight:1.6, marginBottom:20 }}>
              <div style={{ display:"flex", gap:10, alignItems:"flex-start", marginBottom:8 }}>
                <i className="ti ti-ticket" aria-hidden="true" style={{ fontSize:16, marginTop:2, flexShrink:0 }}/>
                <span>Ihr Wahlcode entspricht <strong style={{ color:C.text, fontWeight:500 }}>Ihrer persönlichen Stimmberechtigung</strong> — er ist vertraulich und darf nicht weitergegeben werden.</span>
              </div>
              <div style={{ display:"flex", gap:10, alignItems:"flex-start", marginBottom:8 }}>
                <i className="ti ti-calendar-event" aria-hidden="true" style={{ fontSize:16, marginTop:2, flexShrink:0 }}/>
                <span>Er gilt für <strong style={{ color:C.text, fontWeight:500 }}>alle Abstimmungen des Wahltages</strong>. Notieren oder drucken Sie ihn nach der Ausgabe.</span>
              </div>
              <div style={{ display:"flex", gap:10, alignItems:"flex-start" }}>
                <i className="ti ti-clock" aria-hidden="true" style={{ fontSize:16, marginTop:2, flexShrink:0 }}/>
                <span>Der Code wird nach <strong style={{ color:C.text, fontWeight:500 }}>60 Sekunden ausgeblendet</strong> und kann nur einmal ausgegeben werden.</span>
              </div>
            </div>
            <div style={{ display:"flex", justifyContent:"center" }}>
              <button style={{ ...S.btn, ...S.btnPrimary, fontSize:15, padding:"12px 32px" }} onClick={onZiehen}>
                <i className="ti ti-cards" aria-hidden="true"/> Wahlcode ziehen
              </button>
            </div>
          </div>
        )}

        {/* Phase 2: Deck */}
        {phase === "deck" && (
          <div style={{ textAlign:"center" }}>
            <div style={{ width:240, height:200, margin:"0 auto", position:"relative", overflow:"visible" }}>
              <div id="ta-deck"/>
            </div>
            <p style={{ fontSize:13, color:C.textLight, marginTop:32 }}>Karten werden gemischt…</p>
          </div>
        )}

        {/* Phase 3: Code anzeigen */}
        {phase === "result" && (
          <div style={{ ...cardStyle, border:`0.5px solid ${C.border}` }}>
            <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.15em", color:C.textLight, textTransform:"uppercase" }}>Ihr persönlicher Wahlcode</div>
            <div style={{ fontFamily:"monospace", fontSize:26, fontWeight:500, letterSpacing:"0.14em", color:C.text, background:C.bg, borderRadius:"12px 10px 14px 11px/10px 14px 10px 12px", padding:"12px 24px", width:"100%", textAlign:"center", transition:"filter 1s, opacity 1s", filter:codeHidden?"blur(12px)":"none", opacity:codeHidden?0.1:1 }}>{code}</div>

            {!codeHidden && (
              <div style={{ width:"100%" }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.textLight, marginBottom:4 }}>
                  <span>Code wird ausgeblendet in</span>
                  <span style={{ fontWeight:500 }}>{countdown}s</span>
                </div>
                <div style={{ width:"100%", height:4, background:C.border, borderRadius:2, overflow:"hidden" }}>
                  <div id="ta-cd-bar" style={{ height:4, width:"0%", background:"#378add", borderRadius:2, transition:"width 1s linear, background 0.5s" }}/>
                </div>
              </div>
            )}

            {!codeHidden && <p style={{ fontSize:12, color:C.textLight, lineHeight:1.6, margin:0 }}>Notieren Sie diesen Code — er gilt für alle Abstimmungen des Wahltages.</p>}

            {!codeHidden && (
              <div style={{ display:"flex", gap:8, width:"100%" }}>
                <button id="ta-copy-btn" style={{ ...S.btn, ...S.btnGhost, flex:1, justifyContent:"center" }} onClick={copyCode}>
                  <i className="ti ti-copy" aria-hidden="true"/> Kopieren
                </button>
                <button style={{ ...S.btn, ...S.btnGhost, flex:1, justifyContent:"center" }} onClick={printCode}>
                  <i className="ti ti-printer" aria-hidden="true"/> Drucken
                </button>
              </div>
            )}

            {codeHidden && (
              <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8, fontSize:12, color:C.textLight }}>
                <i className="ti ti-eye-off" aria-hidden="true" style={{ fontSize:22 }}/>
                <span>Code wurde ausgeblendet.</span>
                <span style={{ fontSize:11, color:C.textLight }}>Bei Problemen wenden Sie sich an die Wahlleitung.</span>
              </div>
            )}

            <div style={{ fontSize:11, color:C.textLight, display:"flex", alignItems:"center", gap:5 }}>
              <i className="ti ti-lock" aria-hidden="true" style={{ fontSize:12 }}/> Dieser Link ist nun ungültig
            </div>
          </div>
        )}

        {/* Phase 4: Fehler */}
        {phase === "fehler" && (
          <div style={{ ...cardStyle }}>
            <i className="ti ti-circle-x" aria-hidden="true" style={{ fontSize:48, color:C.error }}/>
            <div style={{ fontWeight:600, fontSize:16, color:C.error }}>Fehler</div>
            <p style={{ fontSize:13, color:C.textLight, lineHeight:1.6, margin:0 }}>{fehler}</p>
          </div>
        )}

      </div>
    </div>
  );
}

// ─── Bestätigungsdialog (ersetzt browser confirm()) ────────────────────────
function ConfirmDialog({ config, onConfirm, onCancel }) {
  if (!config) return null;
  const { titel, nachricht, bestaetigen="Bestätigen", abbrechen="Abbrechen", typ="warn" } = config;
  const farbe = typ==="danger" ? C.error : typ==="warn" ? C.warning : C.primary;
  const hintergrund = typ==="danger" ? "#fef2f2" : typ==="warn" ? "#fff8e1" : "#eff6ff";
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:9998, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
      <div style={{ background:C.bgWhite, borderRadius:12, padding:24, maxWidth:420, width:"100%", boxShadow:"0 8px 32px rgba(0,0,0,0.18)", border:`1px solid ${C.border}` }}>
        {titel&&<h3 style={{ margin:"0 0 12px", color:farbe, fontSize:17 }}>{titel}</h3>}
        <p style={{ margin:"0 0 20px", color:C.text, fontSize:14, lineHeight:1.6, whiteSpace:"pre-wrap" }}>{nachricht}</p>
        <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
          <button onClick={onCancel} style={{ ...S.btn, ...S.btnGhost }}>{abbrechen}</button>
          <button onClick={onConfirm} style={{ ...S.btn, color:"#fff", background:farbe }}>{bestaetigen}</button>
        </div>
      </div>
    </div>
  );
}

function useConfirm() {
  const [config, setConfig] = useState(null);
  const resolveRef = useRef(null);
  function confirm(cfg) {
    return new Promise(resolve => {
      resolveRef.current = resolve;
      setConfig(cfg);
    });
  }
  function handleConfirm() { setConfig(null); resolveRef.current&&resolveRef.current(true); }
  function handleCancel() { setConfig(null); resolveRef.current&&resolveRef.current(false); }
  const dialog = <ConfirmDialog config={config} onConfirm={handleConfirm} onCancel={handleCancel}/>;
  return { confirm, dialog };
}

  const cells = Array.from({ length:8 },(_,i)=>clean[i]||"");
  const cursorPos = clean.length;
  return (
    <div style={{ position:"relative" }}>
      <div style={S.tokenGrid} onClick={()=>inputRef.current?.focus()}>
        {cells.slice(0,4).map((char,i)=>(<div key={i} style={{ ...S.tokenCell, ...(char?S.tokenCellFilled:{}), ...(focused&&cursorPos===i?S.tokenCellActive:{}) }}>{char}{focused&&cursorPos===i&&<span style={{ position:"absolute", bottom:6, width:2, height:16, background:C.primary, animation:"pulse 1s ease infinite" }}/>}</div>))}
        <div style={S.tokenDash}>–</div>
        {cells.slice(4).map((char,i)=>(<div key={i+4} style={{ ...S.tokenCell, ...(char?S.tokenCellFilled:{}), ...(focused&&cursorPos===i+4?S.tokenCellActive:{}) }}>{char}{focused&&cursorPos===i+4&&<span style={{ position:"absolute", bottom:6, width:2, height:16, background:C.primary, animation:"pulse 1s ease infinite" }}/>}</div>))}
      </div>
      <input ref={inputRef} type="text" value={clean} onChange={e=>onChange(e.target.value.replace(/-/g,"").toUpperCase().slice(0,8))} onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)} maxLength={9} style={{ position:"absolute", opacity:0, top:0, left:0, width:"100%", height:"100%", cursor:"text", fontSize:16 }} autoComplete="off" autoCapitalize="characters" spellCheck={false}/>

  );

function WahltageAuswahl({ appData, eventID, onSelect, onExit, isMobile }) {

  const [loading, setLoading] = useState(true);

  const [form, setForm] = useState({ datum: "", anzahl: "" });
  const [saving, setSaving] = useState(false);
  const [fehler, setFehler] = useState(null);
  const wahllokal = appData.wahllokale.find(w => w.eventID===eventID);
  const today = new Date().toISOString().slice(0,10);

  async function laden() {
    setLoading(true);
    try {
      const res = await callFlow("getDaten", { eventID, wahllokalID: eventID });
      const liste = (res?.wahltage || []).sort((a,b) => b.datum?.localeCompare(a.datum));
      setWahltage(liste);
    } catch(e) { setFehler(e.message); }
    setLoading(false);
  }

  useEffect(() => { laden(); }, []);

  async function speichern() {
    if (!form.datum || !form.anzahl || parseInt(form.anzahl) < 1) return;
    setSaving(true); setFehler(null);
    try {
      const res = await callFlow("saveWahltag", { apiKey: API.key, eventID, datum: form.datum, anzahlStimmberechtigte: parseInt(form.anzahl) });
      // Direkt in den neuen Wahltag springen
      const neuerWahltag = {
        id: res.id || Date.now().toString(),
        datum: form.datum,
        eventID,
        anzahlStimmberechtigte: parseInt(form.anzahl),
        tokensGeneriert: false,
        kontrollcode: null,
      };
      setShowForm(false); setForm({ datum:"", anzahl:"" });
      onSelect(neuerWahltag);
    } catch(e) { setFehler(e.message); }
    setSaving(false);
  }

  function statusInfo(wt) {
    const d = wt.datum?.slice(0,10);
    if (d === today) return { label:"Heute", color:C.accent, badge:S.badgeGreen };
    if (d > today) return { label:"Geplant", color:C.textLight, badge:S.badgeGray };
    return { label:"Vergangen", color:C.textLight, badge:S.badgeGray };
  }

  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      <div style={{ background:C.primary, padding:isMobile?"12px 16px":"16px 24px" }}>
        <div style={{ maxWidth:800, margin:"0 auto", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ fontSize:10, fontWeight:500, letterSpacing:"0.15em", color:"rgba(255,255,255,0.6)", textTransform:"uppercase" }}>Wahlleitung</div>
            <div style={{ fontSize:isMobile?16:20, fontWeight:700, color:"#fff" }}>{wahllokal?.name||eventID}</div>
          </div>
          <button onClick={onExit} style={{ ...S.btn, background:"rgba(255,255,255,0.15)", color:"#fff", fontSize:12 }}>
            <i className="ti ti-logout" aria-hidden="true"/>{!isMobile&&" Abmelden"}
          </button>
        </div>
      </div>

      <div style={{ maxWidth:800, margin:"0 auto", padding:isMobile?"16px 12px":"24px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}>
          <h2 style={{ margin:0, color:C.primary, fontSize:18 }}>Wahltage</h2>
          <button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>setShowForm(true)}>
            <i className="ti ti-plus" aria-hidden="true"/> Wahltag anlegen
          </button>
        </div>

        {fehler && <div style={{ ...S.alert, ...S.alertError, marginBottom:12 }}>{fehler}</div>}

        {showForm && (
          <div style={{ ...S.card, marginBottom:16, border:`1.5px solid ${C.primary}` }}>
            <div style={S.sectionLabel}>Neuer Wahltag</div>
            <div style={{ display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-end", marginBottom:12 }}>
              <div>
                <label style={S.label}>Datum</label>
                <input type="date" style={{ ...S.input, width:160 }} value={form.datum} min={today} onChange={e=>setForm(f=>({...f, datum:e.target.value}))}/>
              </div>
              <div>
                <label style={S.label}>Anzahl Stimmberechtigte</label>
                <input type="number" style={{ ...S.input, width:120 }} min={1} value={form.anzahl} onChange={e=>setForm(f=>({...f, anzahl:e.target.value}))} placeholder="z.B. 150"/>
              </div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button style={{ ...S.btn, ...S.btnPrimary }} onClick={speichern} disabled={saving||!form.datum||!form.anzahl}>
                {saving?"…":"Anlegen"}
              </button>
              <button style={{ ...S.btn, ...S.btnGhost }} onClick={()=>{setShowForm(false);setForm({datum:"",anzahl:""});}}>Abbrechen</button>
            </div>
          </div>
        )}

        {loading ? <p style={{ color:C.textLight }}>Wird geladen…</p> :
         wahltage.length === 0 ? (
           <div style={{ textAlign:"center", padding:"48px 24px" }}>
             <i className="ti ti-calendar-event" aria-hidden="true" style={{ fontSize:64, color:C.border, display:"block", marginBottom:16 }}/>
             <div style={{ fontSize:20, fontWeight:700, color:C.primary, marginBottom:8 }}>Noch kein Wahltag angelegt</div>
             <p style={{ color:C.textLight, fontSize:14, marginBottom:24, lineHeight:1.6, maxWidth:320, margin:"0 auto 24px" }}>
               Legen Sie zuerst einen Wahltag an um Wahlen, Teilnehmende und Tagestoken zu verwalten.
             </p>
             <button style={{ ...S.btn, ...S.btnPrimary, fontSize:15, padding:"12px 28px" }} onClick={()=>setShowForm(true)}>
               <i className="ti ti-plus" aria-hidden="true"/> Ersten Wahltag anlegen
             </button>
           </div>
         ) : (
           <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
             {wahltage.map(wt => {
               const si = statusInfo(wt);
               const datum = wt.datum ? new Date(wt.datum).toLocaleDateString("de-DE", { weekday:"long", day:"2-digit", month:"long", year:"numeric" }) : "—";
               const istHeute = wt.datum?.slice(0,10) === today;
               return (
                 <div key={wt.id} onClick={()=>onSelect(wt)}
                   style={{ ...S.card, cursor:"pointer", border:`1.5px solid ${istHeute?C.accent:C.border}`, background:istHeute?"#f0faf5":C.bgWhite,
                     display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, flexWrap:"wrap",
                     transition:"box-shadow 0.15s" }}
                   onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,0.1)"}
                   onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
                   <div>
                     <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                       <span style={{ ...S.badge, ...si.badge }}>{si.label}</span>
                       {wt.tokensGeneriert && <span style={{ ...S.badge, ...S.badgeGreen, fontSize:11 }}><i className="ti ti-ticket" aria-hidden="true"/> Tokens generiert</span>}
                     </div>
                     <div style={{ fontWeight:700, fontSize:16, color:C.text }}>{datum}</div>
                     <div style={{ fontSize:12, color:C.textLight, marginTop:2 }}>
                       {wt.anzahlStimmberechtigte} Stimmberechtigte
                       {wt.kontrollcode && <span style={{ marginLeft:8, fontFamily:"monospace", color:C.primary }}>{wt.kontrollcode}</span>}
                     </div>
                   </div>
                   <i className="ti ti-chevron-right" aria-hidden="true" style={{ fontSize:20, color:C.textLight }}/>
                 </div>
               );
             })}
           </div>
         )
        }
      </div>
    </div>
  );
}

function LeitungTagestoken({ appData, eventID, wahltag, onDataChange, isMobile, onTokensChanged }) {
  const [tokens, setTokens] = useState([]);
  const [loading, setLoading] = useState(true);
  const [generating, setGenerating] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [fehler, setFehler] = useState(null);
  const [erfolg, setErfolg] = useState(null);
  const [kontrollcode, setKontrollcode] = useState(wahltag.kontrollcode||null);
  const [letzterKontrollcode, setLetzterKontrollcode] = useState(null);
  const [mitQR, setMitQR] = useState(true);
  const wahllokal = appData.wahllokale.find(w=>w.eventID===eventID);
  const datum = wahltag.datum?.slice(0,10);

  async function laden() {
    setLoading(true);
    try {
      const res = await callFlow("getDaten", { eventID, wahllokalID:eventID });
      const allTokens = (res?.tokenList||[]).map(mapToken);
      const tagesTokens = allTokens.filter(t=>t.gueltigAm===datum);
      setTokens(tagesTokens);
    } catch(e) { setFehler(e.message); }
    setLoading(false);
  }

  useEffect(() => { laden(); }, []);

  async function generieren() {
    setGenerating(true); setFehler(null);
    try {
      const res = await callFlow("generateTagestoken", { apiKey:API.key, eventID, datum });
      if (res.status==="bereits_generiert") {
        setFehler("Für diesen Wahltag wurden bereits Tokens generiert. Zuerst löschen falls eine Korrektur nötig ist.");
      } else if (res.status==="ok") {
        setKontrollcode(res.kontrollcode);
        setErfolg(`${wahltag.anzahlStimmberechtigte} Tagestoken generiert. Kontrollcode: ${res.kontrollcode}`);
        setTimeout(()=>setErfolg(null), 5000);
        await laden(); onDataChange(); onTokensChanged();
      }
    } catch(e) { setFehler(e.message); }
    setGenerating(false);
  }

  async function alleLoeschen() {
    const ok = await window.confirm(`Alle ${tokens.length} Tagestoken für den ${datum} wirklich löschen?

Der Kontrollcode wird zurückgesetzt. Ein bereits verteilter Ausdruck wäre damit ungültig.`);
    if (!ok) return;
    setDeleting(true); setFehler(null);
    try {
      await callFlow("deleteTagestoken", { apiKey:API.key, eventID, datum });
      setKontrollcode(null); setTokens([]);
      setErfolg("Alle Tagestoken gelöscht."); setTimeout(()=>setErfolg(null), 3000);
      onDataChange(); onTokensChanged();
    } catch(e) { setFehler(e.message); }
    setDeleting(false);
  }

  function drucken() {
    const now = Math.floor(Date.now()/1000);
    const druckTokens = tokens.filter(t=>t.aktiv&&!t.verwendet).map(t=>t.code);
    if (druckTokens.length===0) { setFehler("Keine druckbaren Tokens vorhanden."); return; }
    generiereTokenPDF(druckTokens, wahllokal?.name||eventID, eventID, mitQR);
    // Kontrollcode aus Token lesen
    if (tokens[0]?.kontrollcode) setLetzterKontrollcode(tokens[0].kontrollcode);
  }

  const aktiveTokens = tokens.filter(t=>t.aktiv&&!t.verwendet).length;
  const verwendete = tokens.filter(t=>t.verwendet).length;

  return (
    <div>
      {fehler && <div style={{ ...S.alert, ...S.alertError, marginBottom:12 }}>{fehler}</div>}
      {erfolg && <div style={{ ...S.alert, ...S.alertSuccess, marginBottom:12 }}><i className="ti ti-circle-check" aria-hidden="true"/> {erfolg}</div>}

      {/* Kontrollcode Banner */}
      {(kontrollcode||letzterKontrollcode) && (
        <div style={{ ...S.card, background:"#f0f4ff", border:`1.5px solid ${C.primary}`, marginBottom:16, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
          <div>
            <div style={{ fontSize:11, color:C.textLight, marginBottom:2 }}>Kontrollcode</div>
            <div style={{ fontFamily:"monospace", fontSize:20, fontWeight:700, color:C.primary, letterSpacing:"0.1em" }}>{kontrollcode||letzterKontrollcode}</div>
          </div>
          <div style={{ fontSize:12, color:C.textLight }}>Mit Deckblatt des PDF-Ausdrucks vergleichen</div>
        </div>
      )}

      {/* Status */}
      <div style={{ ...S.card, marginBottom:16 }}>
        <div style={S.sectionLabel}>Tagestoken — {datum}</div>
        <div style={{ display:"flex", gap:24, flexWrap:"wrap", marginBottom:16 }}>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:C.primary }}>{wahltag.anzahlStimmberechtigte}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Stimmberechtigte</div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:tokens.length>0?C.accent:C.textLight }}>{tokens.length}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Generiert</div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:C.primary }}>{aktiveTokens}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Verfügbar</div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:28, fontWeight:700, color:verwendete>0?C.accent:C.textLight }}>{verwendete}</div>
            <div style={{ fontSize:12, color:C.textLight }}>Verwendet</div>
          </div>
        </div>

        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {tokens.length===0 ? (
            <button style={{ ...S.btn, ...S.btnPrimary }} onClick={generieren} disabled={generating}>
              {generating ? "Wird generiert…" : <><i className="ti ti-ticket" aria-hidden="true"/> {wahltag.anzahlStimmberechtigte} Tagestoken generieren</>}
            </button>
          ) : (
            <>
              <button style={{ ...S.btn, ...S.btnGhost }} onClick={drucken} disabled={aktiveTokens===0}>
                <i className="ti ti-printer" aria-hidden="true"/> PDF drucken ({aktiveTokens})
              </button>
              <button style={{ ...S.btn, ...S.btnGhostDanger }} onClick={alleLoeschen} disabled={deleting}>
                {deleting?"…":<><i className="ti ti-trash" aria-hidden="true"/> Alle löschen</>}
              </button>
            </>
          )}
          <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={laden} disabled={loading}>
            <i className="ti ti-refresh" aria-hidden="true"/>
          </button>
        </div>

        {tokens.length > 0 && (
          <p style={{ fontSize:12, color:C.textLight, marginTop:10 }}>
            <i className="ti ti-info-circle" aria-hidden="true"/> Löschen nur wenn eine Korrektur nötig ist — z.B. falsche Anzahl. Bereits verwendete Tokens können nicht mehr gelöscht werden.
          </p>
        )}
      </div>

      {/* Token-Liste */}
      {!loading && tokens.length > 0 && (
        <OfflineTokenListe eventID={eventID} reloadTrigger={tokens.length} wahllokalName={wahllokal?.name} isMobile={isMobile} filterGueltigAm={datum}/>
      )}
    </div>
  );
}

function LeitungView({ appData, eventID, onExit, onDataChange }) {
  const [gewaehlterWahltag, setGewaehlterWahltag] = useState(null);
  const isMobile = useIsMobile();
  // Session-Timeout: nach 30 Minuten Inaktivität automatisch abmelden
  const TIMEOUT_MS = 30 * 60 * 1000;
  const timeoutRef = useRef(null);
  function resetTimeout() {
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => {
      alert("Sitzung abgelaufen. Sie werden automatisch abgemeldet.");
      onExit();
    }, TIMEOUT_MS);
  }
  useEffect(() => {
    resetTimeout();
    const events = ["mousedown","keydown","touchstart","scroll"];
    events.forEach(e => window.addEventListener(e, resetTimeout));
    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
      events.forEach(e => window.removeEventListener(e, resetTimeout));
    };
  }, []);

  if (gewaehlterWahltag) {
    return <WahltageView
      appData={appData} eventID={eventID} wahltag={gewaehlterWahltag}
      onBack={()=>setGewaehlterWahltag(null)} onExit={onExit}
      onDataChange={onDataChange} isMobile={isMobile}/>;
  }

  return <WahltageAuswahl
    appData={appData} eventID={eventID}
    onSelect={wt=>setGewaehlterWahltag(wt)}
    onExit={onExit} isMobile={isMobile}/>;
}

    { id:"verfahren_erlaeutert", phase:"Durchführung", text:"Wahlverfahren kurz erläutert" },
    { id:"wahl_gestartet", phase:"Durchführung", text:"Wahl gestartet / freigegeben; vor der Startzeit läuft der Countdown" },
    { id:"stimmen_beobachtet", phase:"Durchführung", text:"Eingegangene Stimmen beobachtet" },
    { id:"wlan_notfall", phase:"Durchführung", text:"Bei WLAN-Ausfall: Wahl sofort pausieren — nach Wiederherstellung der Verbindung fortsetzen" },
    { id:"wahl_geschlossen", phase:"Abschluss", text:"Wahl geschlossen" },
    { id:"stimmen_plausibilisiert", phase:"Abschluss", text:"Stimmenanzahl plausibilisiert" },
    { id:"ergebnis_geprueft", phase:"Abschluss", text:"Ergebnis geprüft und protokolliert" },
    { id:"stichwahl", phase:"Abschluss", text:"Ggf. Stichwahl vorbereitet" },
  ];
  const [checked, setChecked] = useState(()=>{
    try { return JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch { return {}; }
  });
  function toggle(id) {
    const next = { ...checked, [id]: !checked[id] };
    setChecked(next);
    try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch(e) {}
  }
  function reset() {
    const ok = window.confirm("Durchführungscheck für dieses Wahllokal zurücksetzen?");
    if (!ok) return;
    setChecked({});
    try { localStorage.removeItem(storageKey); } catch(e) {}
  }
  const gruppen = CHECKS.reduce((acc,c)=>{ (acc[c.phase]=acc[c.phase]||[]).push(c); return acc; },{});
  const erledigt = CHECKS.filter(c=>checked[c.id]).length;
  return (
    <>
      <div style={{ ...S.card, padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, flexWrap:"wrap", background:"#fbfcfd" }}>
        <div style={{ minWidth:240 }}>
          <div style={{ fontSize:12, fontWeight:800, color:C.primary, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:4 }}>Durchführungscheck Wahlleitung</div>
          <div style={{ fontSize:13, color:C.textLight, lineHeight:1.45 }}>Freiwillige Orientierung für die Durchführung mit der App – ohne Sperrwirkung und ohne Pflichtcharakter.</div>
        </div>
        <button onClick={()=>setOffen(true)} style={{ ...S.btn, ...S.btnGhost, whiteSpace:"nowrap" }}><i className="ti ti-checklist" aria-hidden="true"/> Checkliste öffnen</button>
      </div>

      {offen && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.38)", zIndex:9997, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ background:C.bgWhite, borderRadius:14, width:"100%", maxWidth:680, maxHeight:"88vh", overflow:"auto", boxShadow:"0 12px 40px rgba(0,0,0,0.22)", border:`1px solid ${C.border}` }}>
            <div style={{ padding:"20px 22px 14px", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:16 }}>
              <div>
                <div style={S.sectionLabel}>Orientierung für die Durchführung</div>
                <h3 style={{ margin:"0 0 6px", color:C.primary, fontSize:20 }}>Durchführungscheck Wahlleitung</h3>
                <p style={{ margin:0, color:C.textLight, fontSize:13, lineHeight:1.5 }}>
                  Für {wahllokal?.name || eventID}. Die Liste dient nur der Selbstvergewisserung und ersetzt kein offizielles Sitzungs- oder Wahlprotokoll.
                </p>
              </div>
              <button onClick={()=>setOffen(false)} style={{ ...S.btn, ...S.btnGhost, padding:"6px 10px" }}><i className="ti ti-x" aria-hidden="true"/></button>
            </div>

            <div style={{ padding:"18px 22px" }}>
              {Object.entries(gruppen).map(([phase, items])=>(
                <div key={phase} style={{ marginBottom:18 }}>
                  <div style={{ fontSize:12, fontWeight:800, color:C.primary, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.06em" }}>{phase}</div>
                  <div style={{ border:`1px solid ${C.border}`, borderRadius:10, overflow:"hidden" }}>
                    {items.map((item, idx)=>(
                      <label key={item.id} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"12px 14px", cursor:"pointer", fontSize:14, lineHeight:1.45, color:C.text, background:checked[item.id]?"#f8fbf9":C.bgWhite, borderTop:idx===0?"none":`1px solid ${C.border}` }}>
                        <input type="checkbox" checked={!!checked[item.id]} onChange={()=>toggle(item.id)} style={{ marginTop:2, width:16, height:16 }}/>
                        <span style={{ textDecoration:checked[item.id]?"line-through":"none", color:checked[item.id]?C.textLight:C.text }}>{item.text}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ))}

              <div style={{ padding:"12px 14px", background:C.bg, borderRadius:10, fontSize:12, color:C.textLight, lineHeight:1.5 }}>
                Häkchen werden nur lokal in diesem Browser gespeichert. Die Wahl kann unabhängig von dieser Liste gestartet, geschlossen und ausgewertet werden.
              </div>
            </div>

            <div style={{ padding:"14px 22px", borderTop:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", gap:10, flexWrap:"wrap", alignItems:"center" }}>
              <span style={{ fontSize:12, color:C.textLight }}>{erledigt} von {CHECKS.length} Punkten markiert</span>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={reset} style={{ ...S.btn, ...S.btnGhost }}>Zurücksetzen</button>
                <button onClick={()=>setOffen(false)} style={{ ...S.btn, ...S.btnPrimary }}>Schließen</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function QRCode({ url, size=200 }) {
  return <img src={`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}&color=1a2744&bgcolor=ffffff&margin=10`} width={size} height={size} alt="QR-Code" style={{ display:"block" }}/>;
}

    const ok = await confirm({ titel:`Wahl schließen`, nachricht:msg, bestaetigen:"Jetzt schließen", typ:"warn" }); if (!ok) return;

          <div style={{ ...S.sectionLabel, color:C.accent, marginBottom:12 }}>● Laufende Wahlen</div>
          {aktiveWahlen.map(w=>(
            <div key={w.id} style={{ padding:"12px 0", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
              <div style={{ flex:1, minWidth:160 }}><div style={{ fontWeight:700, fontSize:16 }}>{w.titel}</div><div style={{ fontSize:12, color:C.textLight, marginTop:2 }}>{w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"} · {w.optionen.length} Kandidaten</div></div>
              <button style={{ ...S.btn, ...S.btnDanger, fontSize:13, width:"100%", justifyContent:"center", maxWidth:220 }} onClick={()=>schliesseWahl(w)} disabled={toggling===w.id}>{toggling===w.id?"…":<><i className="ti ti-lock" aria-hidden="true"/> Wahl schließen</>}</button>
            </div>
          ))}
        </div>

      <div style={S.card}>
        <div style={S.sectionLabel}>Alle Wahlen</div>
        {wahlen.length===0 ? <p style={{ color:C.textLight, fontSize:14 }}>Noch keine Wahlen angelegt.</p> :
          wahlen.map(w=>(
            <div key={w.id} style={{ padding:"10px 0", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div><div style={{ fontWeight:600, fontSize:14 }}>{w.titel}</div><div style={{ fontSize:12, color:C.textLight }}>{w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"} · {w.optionen.length} Kandidaten</div></div>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                {w.aktiv?<span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>:w.geschlossen?<span style={{ ...S.badge, ...S.badgeRed }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>:<span style={{ ...S.badge, ...S.badgeGray }}>pausiert</span>}
                {!w.geschlossen&&!w.aktiv&&<button style={{ ...S.btn, ...S.btnPrimary, fontSize:12, padding:"5px 12px" }} onClick={()=>toggleWahl(w)} disabled={toggling===w.id}>{toggling===w.id?"…":<><i className="ti ti-player-play" aria-hidden="true"/> Starten</>}</button>}

          <div style={{ fontSize:14, fontWeight:700, letterSpacing:"0.15em", textTransform:"uppercase", color:C.textLight }}>Evangelische Landeskirche in Baden</div>
          <div style={{ fontSize:28, fontWeight:800, color:C.primary }}>Zur Abstimmung scannen</div>
          <div style={{ background:"#fff", padding:24, borderRadius:16, boxShadow:"0 8px 32px rgba(0,0,0,0.12)" }}><QRCode url={wahllokalURL} size={300}/></div>
          <code style={{ fontSize:16, color:C.textLight }}>{wahllokalURL}</code>

      )}

  );
