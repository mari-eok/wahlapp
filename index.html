async function callFlow(flowName, body) {
  const url = API.flows[flowName];
  if (url.startsWith("PLATZHALTER")) {
    throw new Error(`Flow '${flowName}' noch nicht konfiguriert.`);
  }
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apiKey: API.key, ...body }),
  });
  if (!res.ok) throw new Error(`Flow ${flowName} Fehler: ${res.status}`);
  return res.json();
}

// WÄHLER MAPPING
// ═══════════════════════════════════════════════════════════════════════════════
function mapWaehler(item) {
  return {
    id: String(item.ID),
    email: item.Email || item.Title,
    eventID: item.EventID,
    tokenCode: item.TokenCode || "",
    status: item.Status || "angelegt",
    versendet: item.Versendet || false,
    tokenAktiv: item.TokenAktiv === false ? false : true,
  };
}

// ═══════════════════════════════════════════════════════════════════════════════
// URL MANAGEMENT
// ═══════════════════════════════════════════════════════════════════════════════
function updateURL(wahllokalID, ansicht) {
  const params = new URLSearchParams();
  if (wahllokalID) params.set("wahllokal", wahllokalID);
  if (ansicht && ansicht !== "wahllokal") params.set("ansicht", ansicht);
  const newURL = params.toString() ? `?${params.toString()}` : window.location.pathname;
  window.history.pushState({}, "", newURL);
}

// DATEN-MAPPING (SharePoint → App)
// ═══════════════════════════════════════════════════════════════════════════════
function mapWahllokal(item) {
  return {
    id: String(item.ID),
    eventID: item.EventID,
    name: item.Title,
    aktiv: item.Aktiv,
    leitungPIN: item.LeitungPIN,
  };
}

function mapWahl(item) {
  return {
    id: String(item.ID),
    eventID: item.EventID,
    titel: item.Title,
    aktiv: item.Aktiv && !(item.Geschlossen === true || item.Geschlossen === "true" || item.Geschlossen === 1),
    startzeit: item.Startzeit,
    mehrfach: item.Mehrfach,
    exakt: item.Exakt,
    maxAuswahl: item.MaxAuswahl || 1,
    mehrheitsregel: (item.Mehrheitsregel?.Value || item.Mehrheitsregel || "relativ"),
    geschlossen: !!(item.Geschlossen === true || item.Geschlossen === "true" || item.Geschlossen === 1 || (typeof item.Geschlossen === 'object' && item.Geschlossen?.Value === true)),
    optionen: [],
  };
}

function mapOption(item) {
  return {
    id: String(item.ID),
    wahlID: String(item.WahlID),
    eventID: item.EventID,
    name: item.Title,
    istEnthaltung: item.IstEnthaltung,
  };
}

function mapToken(item) {
  return {
    id: String(item.ID),
    code: item.Title,
    eventID: item.EventID,
    verwendet: item.Verwendet,
    usedForWahlID: item.UsedForWahlID ? String(item.UsedForWahlID) : null,
  };
}

// TOKEN GENERATOR
// ═══════════════════════════════════════════════════════════════════════════════
function generateToken() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let t = "";
  for (let i = 0; i < 8; i++) t += chars[Math.floor(Math.random() * chars.length)];
  return t.slice(0,4) + "-" + t.slice(4);
}

function App() {
  const urlParams = new URL(window.location.href).searchParams;
  const wahllokalID = urlParams.get("wahllokal") || "EOK";
  const ansicht = urlParams.get("ansicht") || "";

  const [view, setView] = useState(ansicht === "ergebnisse" ? "ergebnisse" : ansicht === "leitung" ? "leitung" : ansicht === "superadmin" ? "superadmin" : "wahllokal");
  const [leitungAuth, setLeitungAuth] = useState(null);
  const [superadminAuth, setSuperadminAuth] = useState(false);
  const [appData, setAppData] = useState(null);
  const [loadError, setLoadError] = useState(null);

  // Daten beim Start laden
  useEffect(() => {
    loadAppData();
  }, []);

  // Daten alle 10 Sekunden neu laden
  useEffect(() => {
    const t = setInterval(loadAppData, 10000);
    return () => clearInterval(t);
  }, []);

  // Fallback-Daten aus dem letzten erfolgreichen Flow-Aufruf
  // (wird automatisch ersetzt wenn der Flow erreichbar ist)
  const FALLBACK_DATA = {
    wahllokale: [{ id: "1", eventID: "EOK", name: "Synode Ortenau", aktiv: true, leitungPIN: "5678" }],
    wahlen: [{ id: "1", eventID: "EOK", titel: "Diakoniepfarrer*in", aktiv: true, startzeit: new Date(Date.now() - 60000).toISOString(), mehrfach: false, exakt: true, maxAuswahl: 1, optionen: [{ id: "1", wahlID: "1", eventID: "EOK", name: "Leon Hartmann", istEnthaltung: false }, { id: "2", wahlID: "1", eventID: "EOK", name: "Enthaltung", istEnthaltung: true }] }],
    optionen: [{ id: "1", wahlID: "1", eventID: "EOK", name: "Leon Hartmann", istEnthaltung: false }, { id: "2", wahlID: "1", eventID: "EOK", name: "Enthaltung", istEnthaltung: true }],
    tokens: [{ id: "1", code: "KIJI8JJK", eventID: "EOK", verwendet: false, usedForWahlID: null }],
  };

  async function loadAppData() {
    try {
      const raw = await callFlow("getDaten", { eventID: wahllokalID });
      const wahllokale = (raw.wahllokale || []).map(mapWahllokal);
      const wahlen = (raw.wahlen || []).map(mapWahl);
      const optionen = (raw.optionen || []).map(mapOption);
      wahlen.forEach(w => { w.optionen = optionen.filter(o => o.wahlID === w.id); });
      const tokenCount = raw.tokenCount || 0;
      setAppData({ wahllokale, wahlen, optionen, tokens: [], tokenCount });
      setLoadError(null);
    } catch (e) {
      // CORS im Artifact oder echter Verbindungsfehler
      // Fallback auf eingebettete Testdaten
      if (!appData) {
        setAppData(FALLBACK_DATA);
        setLoadError("cors_fallback");
      }
    }
  }

  const CSS = `
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button:hover { filter: brightness(1.08); }
  `;

  // Ladescreen
  if (!appData && !loadError) {
    return (
      <div style={S.app}>
        <style>{CSS}</style>
        <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16 }}>
          <div style={S.spinner} />
          <p style={{ color: C.textLight, fontSize: 14 }}>Wahllokal wird geladen…</p>
        </div>
      </div>
    );
  }

  // CORS-Fallback Banner (kein Fehlerscreen, App läuft weiter mit Testdaten)
  const corsWarning = loadError === "cors_fallback";

  return (
    <div style={S.app}>
      <style>{CSS}</style>

      {view === "wahllokal" && (
        <>
          {corsWarning && (
            <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 1000, background: C.warning, color: "#fff", fontSize: 12, padding: "6px 16px", textAlign: "center" }}>
              ⚠️ Demo-Modus: Verbindung zu SharePoint nicht möglich (CORS). In der gehosteten App funktioniert alles normal.
            </div>
          )}
          <WahllokalView
            appData={appData}
            wahllokalID={wahllokalID}
            onDataChange={loadAppData}
            corsWarning={corsWarning}
          />
          <DemoSwitcher
            onSuperadmin={() => { setView("superadmin"); updateURL(wahllokalID, "superadmin"); }}
            onErgebnisse={() => { setView("ergebnisse"); updateURL(wahllokalID, "ergebnisse"); }}
            wahllokalID={wahllokalID}
          />
        </>
      )}

      {view === "ergebnisse" && appData && (
        <ErgebnisDashboard appData={appData} wahllokalID={wahllokalID} onBack={() => { setView("wahllokal"); updateURL(wahllokalID, null); }} />
      )}

      {view === "leitung" && (
        leitungAuth
          ? <LeitungView
              appData={appData}
              eventID={leitungAuth}
              onExit={() => { setView("wahllokal"); setLeitungAuth(null); updateURL(wahllokalID, null); }}
              onDataChange={loadAppData}
            />
          : <LeitungLoginScreen
              onAuth={(eventID) => setLeitungAuth(eventID)}
              onBack={() => { setView("wahllokal"); updateURL(wahllokalID, null); }}
              fixedEventID={ansicht === "leitung" ? wahllokalID : null}
            />
      )}

      {view === "superadmin" && (
        superadminAuth
          ? <SuperadminView
              appData={appData}
              onExit={() => { setView("wahllokal"); setSuperadminAuth(false); updateURL(wahllokalID, null); }}
              onDataChange={loadAppData}
            />
          : <PinScreen
              title="Superadmin"
              subtitle="Systemzugang für EKIBA-Administratoren."
              color={C.superadmin}
              onAuth={(pin) => { if (pin === "1234") { setSuperadminAuth(true); return true; } return false; }}
              onBack={() => { setView("wahllokal"); updateURL(wahllokalID, null); }}
            />
      )}
    </div>
  );
}

// ─── LEITUNG LOGIN ────────────────────────────────────────────────────────────
function LeitungLoginScreen({ onAuth, onBack, fixedEventID }) {
  const [wahllokale, setWahllokale] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedEventID, setSelectedEventID] = useState(fixedEventID || "");
  const [step, setStep] = useState(fixedEventID ? "pin" : "waehlen");
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const selectedWahllokal = wahllokale.find(w => w.eventID === selectedEventID);

  useEffect(() => {
    async function load() {
      try {
        const result = await callFlow("getAlle", {});
        const alle = (result || []).map(mapWahllokal).filter(w => w.aktiv);
        setWahllokale(alle);
        if (!fixedEventID && alle.length > 0) setSelectedEventID(alle[0].eventID);
      } catch (e) { console.error(e); }
      setLoading(false);
    }
    load();
  }, []);

  function submit() {
    if (selectedWahllokal && pin === selectedWahllokal.leitungPIN) { onAuth(selectedEventID); return; }
    setError(true); setPin("");
    setTimeout(() => setError(false), 2000);
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg }}>
      <div style={{ ...S.card, width: 340, textAlign: "center" }}>
        <div style={{ width: 48, height: 48, borderRadius: "50%", background: C.primary, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, margin: "0 auto 16px" }}>
          {step === "waehlen" ? "📍" : "🔐"}
        </div>
        <h2 style={{ margin: "0 0 4px", color: C.primary }}>Wahlleitung</h2>
        {step === "waehlen" && (
          <>
            <p style={{ color: C.textLight, fontSize: 14, marginBottom: 24 }}>Bitte wählen Sie Ihr Wahllokal.</p>
            {loading ? (
              <p style={{ color: C.textLight, fontSize: 14, marginBottom: 24 }}>Wahllokale werden geladen…</p>
            ) : wahllokale.length === 0 ? (
              <p style={{ color: C.error, fontSize: 14, marginBottom: 24 }}>Keine aktiven Wahllokale gefunden.</p>
            ) : (
            <div style={S.formGroup}>
              <select style={{ ...S.select, textAlign: "center" }} value={selectedEventID} onChange={e => setSelectedEventID(e.target.value)}>
                {wahllokale.map(wl => <option key={wl.id} value={wl.eventID}>{wl.name} ({wl.eventID})</option>)}
              </select>
            </div>
            )}
            <button onClick={() => setStep("pin")} disabled={loading || wahllokale.length === 0} style={{ ...S.btn, ...S.btnPrimary, width: "100%", padding: "12px", marginBottom: 8 }}>Weiter →</button>
            <button onClick={onBack} style={{ ...S.btn, ...S.btnGhost, width: "100%", padding: "10px" }}>← Zurück</button>
          </>
        )}
        {step === "pin" && (
          <>
            <p style={{ color: C.textLight, fontSize: 14, marginBottom: 4 }}>PIN für <strong style={{ color: C.primary }}>{selectedWahllokal?.name}</strong></p>
            <p style={{ color: C.textLight, fontSize: 12, marginBottom: 20 }}>Der PIN wird von Ihrem Administrator vergeben.</p>
            <input type="password" value={pin} onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} placeholder="PIN eingeben" style={{ ...S.input, textAlign: "center", fontSize: 20, letterSpacing: "0.2em", marginBottom: 8, borderColor: error ? C.error : C.border }} autoFocus />
            {error && <p style={{ color: C.error, fontSize: 13, margin: "0 0 8px" }}>Falscher PIN.</p>}
            {!error && <div style={{ height: 28 }} />}
            <button onClick={submit} style={{ ...S.btn, ...S.btnPrimary, width: "100%", padding: "12px", marginBottom: 8 }}>Anmelden</button>
            <button onClick={() => setStep("waehlen")} style={{ ...S.btn, ...S.btnGhost, width: "100%", padding: "10px" }}>← Wahllokal ändern</button>
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// EBENE 1: WAHLLOKAL
// ═══════════════════════════════════════════════════════════════════════════════
function WahllokalView({ appData, wahllokalID, onDataChange }) {
  const wahllokal = appData.wahllokale.find(w => w.eventID === wahllokalID);
  const now = new Date();
  const aktiveWahlen = appData.wahlen.filter(w => w.eventID === wahllokalID && w.aktiv && new Date(w.startzeit) <= now);
  const naechsteWahl = appData.wahlen.filter(w => w.eventID === wahllokalID && w.aktiv && new Date(w.startzeit) > now).sort((a, b) => new Date(a.startzeit) - new Date(b.startzeit))[0];

  const [selectedWahlID, setSelectedWahlID] = useState("");
  const [tokenRaw, setTokenRaw] = useState("");
  const [selected, setSelected] = useState([]);
  const [status, setStatus] = useState(null);
  const [statusMsg, setStatusMsg] = useState("");
  const [countdown, setCountdown] = useState(5);
  const [nowTime, setNowTime] = useState(new Date());
  const [submitting, setSubmitting] = useState(false);
  const [flowFehler, setFlowFehler] = useState(null);

  useEffect(() => { const t = setInterval(() => setNowTime(new Date()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => { if (aktiveWahlen.length > 0 && !selectedWahlID) setSelectedWahlID(aktiveWahlen[0].id); }, [aktiveWahlen.length]);

  useEffect(() => {
    if (status && status !== "pruefen") {
      setCountdown(5);
      const t = setInterval(() => {
        setCountdown(c => {
          if (c <= 1) { clearInterval(t); setStatus(null); setStatusMsg(""); setTokenRaw(""); setSelected([]); setFlowFehler(null); return 5; }
          return c - 1;
        });
      }, 1000);
      return () => clearInterval(t);
    }
  }, [status]);

  const tokenClean = tokenRaw.replace(/-/g, "").toUpperCase().slice(0, 8);
  const selectedWahl = appData.wahlen.find(w => w.id === selectedWahlID);

  function toggleOption(opt) {
    if (!selectedWahl) return;
    const isSel = selected.find(s => s.id === opt.id);
    if (isSel) { setSelected(selected.filter(s => s.id !== opt.id)); return; }
    if (opt.istEnthaltung) { setSelected([opt]); return; }
    const ohneEnthaltung = selected.filter(s => !s.istEnthaltung);
    if (!selectedWahl.mehrfach) { setSelected([opt]); }
    else if (ohneEnthaltung.length < selectedWahl.maxAuswahl) { setSelected([...ohneEnthaltung, opt]); }
  }

  function isValid() {
    if (!selectedWahl || tokenClean.length !== 8 || selected.length === 0 || submitting) return false;
    if (!selectedWahl.mehrfach && selected.length !== 1) return false;
    if (selectedWahl.mehrfach && selectedWahl.exakt && selected.length !== selectedWahl.maxAuswahl) return false;
    if (selectedWahl.mehrfach && !selectedWahl.exakt && selected.length > selectedWahl.maxAuswahl) return false;
    return true;
  }

  async function submitStimme() {
    if (!isValid()) return;
    setSubmitting(true);
    setStatus("pruefen");
    setFlowFehler(null);

    try {
      // Flow noch nicht konfiguriert → simulieren
      if (API.flows.submitStimme.startsWith("PLATZHALTER")) {
        await new Promise(r => setTimeout(r, 2000));
        setStatus("gueltig");
        setStatusMsg(`Ihre Stimme wurde für die Wahl '${selectedWahl.titel}' gezählt. (Simuliert — Flow noch nicht verbunden)`);
      } else {
        const result = await callFlow("submitStimme", {
          tokenCode: tokenClean,
          eventID: wahllokalID,
          wahlID: parseInt(selectedWahlID),
          wahlTitel: selectedWahl.titel,
          positionen: selected.map(s => ({ optionID: parseInt(s.id), name: s.name })),
          maxAuswahl: selectedWahl.maxAuswahl || 1,
        });
        if (result.status === "gueltig") {
          setStatus("gueltig");
          setStatusMsg(`Ihre Stimme wurde für die Wahl '${selectedWahl.titel}' gezählt.`);
          onDataChange();
        } else if (result.status === "ungueltig" && result.grund === "Zu viele Stimmen") {
          setStatus("ungueltig");
          setStatusMsg("Ungültige Stimmabgabe: Zu viele Kandidaten ausgewählt.");
        } else if (result.status === "doppelt") {
          setStatus("doppelt");
          setStatusMsg("Dieser Token wurde für diese Wahl bereits verwendet.");
        } else {
          setStatus("ungueltig");
          setStatusMsg(`Ungültiger Token für die Wahl '${selectedWahl.titel}'. Bitte prüfen Sie Ihre Eingabe.`);
        }
      }
    } catch (e) {
      setStatus(null);
      setFlowFehler(e.message);
    } finally {
      setSubmitting(false);
    }
  }

  // Status Screens
  if (status === "pruefen") return <div style={{ ...S.statusScreen, background: C.bg }}><div style={S.spinner} /><h2 style={{ ...S.statusTitle, color: C.primary }}>PRÜFUNG LÄUFT</h2><p style={{ color: C.textLight, fontSize: 15 }}>Ihre Stimme wird geprüft und gespeichert.</p></div>;
  if (status === "gueltig") return <div style={{ ...S.statusScreen, background: C.successBg }}><div style={{ fontSize: 64 }}>✅</div><h2 style={{ ...S.statusTitle, color: C.success }}>STIMME GÜLTIG</h2><p style={{ ...S.statusMsg, color: "#2d6a4f" }}>{statusMsg}</p><p style={{ fontSize: 14, color: "rgba(0,0,0,0.4)" }}>Zurück in {countdown} Sekunden…</p></div>;
  if (status === "ungueltig") return <div style={{ ...S.statusScreen, background: C.errorBg }}><div style={{ fontSize: 64 }}>❌</div><h2 style={{ ...S.statusTitle, color: C.error }}>STIMME UNGÜLTIG</h2><p style={{ ...S.statusMsg, color: "#7b2d2d" }}>{statusMsg}</p><p style={{ fontSize: 14, color: "rgba(0,0,0,0.4)" }}>Zurück in {countdown} Sekunden…</p></div>;
  if (status === "doppelt") return <div style={{ ...S.statusScreen, background: C.warningBg }}><div style={{ fontSize: 64 }}>⚠️</div><h2 style={{ ...S.statusTitle, color: C.warning }}>TOKEN BEREITS VERWENDET</h2><p style={{ ...S.statusMsg, color: "#7d5a0a" }}>{statusMsg}</p><p style={{ fontSize: 14, color: "rgba(0,0,0,0.4)" }}>Zurück in {countdown} Sekunden…</p></div>;

  if (!wahllokal || !wahllokal.aktiv) return <div style={S.wlContainer}><WlHeader /><div style={S.closedScreen}><div style={{ fontSize: 48 }}>🔒</div><h2 style={{ fontSize: 22, fontWeight: 700, color: C.primary, margin: 0 }}>Das Wahllokal ist geschlossen.</h2><p style={{ color: C.textLight, lineHeight: 1.7 }}>Bei Fragen wenden Sie sich an Ihre Wahlleitung.</p></div></div>;

  if (aktiveWahlen.length === 0) {
    const diff = naechsteWahl ? Math.max(0, Math.floor((new Date(naechsteWahl.startzeit) - nowTime) / 1000)) : null;
    const formatCountdown = (s) => {
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (d > 0) return `${d}T ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m`;
      if (h > 0) return `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
      return `${m}m ${String(sec).padStart(2,"0")}s`;
    };
    return (
      <div style={S.wlContainer}>
        <WlHeader name={wahllokal?.name} />
        <div style={S.closedScreen}>
          <div style={{ fontSize: 48 }}>{naechsteWahl ? "⏰" : "🔒"}</div>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: C.primary, margin: 0 }}>{naechsteWahl ? "Abstimmung beginnt in Kürze" : "Das Wahllokal ist geschlossen."}</h2>
          {naechsteWahl && diff !== null && <div style={{ fontSize: 28, fontWeight: 700, color: C.accent }}>{formatCountdown(diff)}</div>}
          {!naechsteWahl && <p style={{ color: C.textLight, lineHeight: 1.7 }}>Die Abstimmung hat noch nicht begonnen oder wurde bereits beendet.</p>}
        </div>
      </div>
    );
  }

  const maxCount = selectedWahl?.mehrfach ? selectedWahl.maxAuswahl : 1;
  const counterOk = selectedWahl && (!selectedWahl.mehrfach ? selected.length === 1 : selected.length > 0 && selected.length <= maxCount);

  return (
    <div style={S.wlContainer}>
      <WlHeader name={wahllokal?.name} />

      {flowFehler && <div style={{ ...S.alert, ...S.alertError }}>⚠️ {flowFehler}</div>}

      {aktiveWahlen.length > 1 && (
        <div style={S.card}>
          <div style={S.sectionLabel}>Abstimmung</div>
          <select style={S.select} value={selectedWahlID} onChange={e => { setSelectedWahlID(e.target.value); setSelected([]); }}>
            {aktiveWahlen.map(w => <option key={w.id} value={w.id}>{w.titel}</option>)}
          </select>
        </div>
      )}
      {aktiveWahlen.length === 1 && (
        <div style={{ ...S.card, padding: "16px 24px" }}>
          <div style={S.sectionLabel}>Abstimmung</div>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.primary }}>{aktiveWahlen[0].titel}</div>
        </div>
      )}

      <div style={S.card}>
        <div style={S.sectionLabel}>Persönlicher Wahlcode (Token)</div>
        <TokenInput value={tokenRaw} onChange={setTokenRaw} />
      </div>

      {selectedWahl && (
        <div style={S.card}>
          <div style={S.sectionLabel}>{selectedWahl.mehrfach ? `Bitte wählen Sie bis zu ${selectedWahl.maxAuswahl} Personen.` : "Bitte wählen Sie genau 1 Person."}</div>
          {selectedWahl.optionen.map(opt => {
            const isSel = selected.find(s => s.id === opt.id);
            return (
              <div key={opt.id} style={{ ...S.optionRow, ...(isSel ? S.optionRowSelected : {}), ...(opt.istEnthaltung ? { background: C.bg } : {}) }} onClick={() => toggleOption(opt)}>
                <div style={{ ...S.checkbox, ...(isSel ? S.checkboxChecked : {}) }}>{isSel && <span style={{ color: "#fff", fontSize: 13, fontWeight: 700 }}>✓</span>}</div>
                <span style={{ fontSize: 15, fontWeight: 500, color: opt.istEnthaltung ? C.textLight : C.text }}>{opt.name}</span>
              </div>
            );
          })}
          <div style={{ ...S.counter, ...(counterOk ? S.counterOk : {}) }}>{selected.length} von {maxCount} gewählt {counterOk ? "✅" : ""}</div>
        </div>
      )}

      <button style={{ ...S.btnSubmit, ...(isValid() ? S.btnSubmitActive : S.btnSubmitDisabled) }} onClick={submitStimme} disabled={!isValid()}>
        {submitting ? "Wird übermittelt…" : "Stimme abgeben"}
      </button>

      {API.flows.submitStimme.startsWith("PLATZHALTER") && (
        <p style={{ textAlign: "center", fontSize: 12, color: C.warning, marginTop: 8 }}>⚠️ Demo-Modus — Submit-Flow noch nicht verbunden</p>
      )}
    </div>
  );
}

function WlHeader({ name }) {
  return (
    <div style={S.wlHeader}>
      <div style={S.wlLogo}>Evangelische Landeskirche in Baden</div>
      <h1 style={S.wlTitle}>{name || "Digitales Wahllokal"}</h1>
    </div>
  );
}

function TokenInput({ value, onChange }) {
  const inputRef = useRef(null);
  const clean = value.replace(/-/g, "").toUpperCase().slice(0, 8);
  const [focused, setFocused] = useState(false);
  const cells = Array.from({ length: 8 }, (_, i) => clean[i] || "");
  const cursorPos = clean.length;
  return (
    <div style={{ position: "relative" }}>
      <div style={S.tokenGrid} onClick={() => inputRef.current?.focus()}>
        {cells.slice(0, 4).map((char, i) => (
          <div key={i} style={{ ...S.tokenCell, ...(char ? S.tokenCellFilled : {}), ...(focused && cursorPos === i ? S.tokenCellActive : {}) }}>
            {char}
            {focused && cursorPos === i && <span style={{ position: "absolute", bottom: 6, width: 2, height: 16, background: C.primary, animation: "pulse 1s ease infinite" }} />}
          </div>
        ))}
        <div style={S.tokenDash}>–</div>
        {cells.slice(4).map((char, i) => (
          <div key={i + 4} style={{ ...S.tokenCell, ...(char ? S.tokenCellFilled : {}), ...(focused && cursorPos === i + 4 ? S.tokenCellActive : {}) }}>
            {char}
            {focused && cursorPos === i + 4 && <span style={{ position: "absolute", bottom: 6, width: 2, height: 16, background: C.primary, animation: "pulse 1s ease infinite" }} />}
          </div>
        ))}
      </div>
      <input ref={inputRef} type="text" value={clean} onChange={e => onChange(e.target.value.replace(/-/g, "").toUpperCase().slice(0, 8))} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} maxLength={8} style={{ position: "absolute", opacity: 0, top: 0, left: 0, width: "100%", height: "100%", cursor: "text", fontSize: 16 }} autoComplete="off" autoCapitalize="characters" spellCheck={false} />
      <p style={{ textAlign: "center", fontSize: 12, color: C.textLight, marginTop: 8 }}>Tippen Sie hier um Ihren Code einzugeben</p>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// EBENE 2: WAHLLEITUNG
// ═══════════════════════════════════════════════════════════════════════════════
function LeitungView({ appData, eventID, onExit, onDataChange }) {
  const [tab, setTab] = useState("dashboard");
  const wahllokal = appData.wahllokale.find(w => w.eventID === eventID);
  const meineWahlen = appData.wahlen.filter(w => w.eventID === eventID);

  const tabs = [
    { id: "dashboard", label: "📊 Dashboard" },
    { id: "wahlen", label: "🗳️ Wahlen" },
    { id: "waehler", label: "👥 Wähler & Tokens" },
    { id: "ergebnisse", label: "📈 Ergebnisse" },
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      <div style={{ background: C.primary }}>
        <div style={{ maxWidth: 960, margin: "0 auto", ...S.navbar }}>
          <div>
            <span style={S.navTitle}>📋 Wahlleitung</span>
            <span style={{ color: "rgba(255,255,255,0.6)", fontSize: 13, marginLeft: 12 }}>{wahllokal?.name} ({eventID})</span>
          </div>
          <button onClick={onExit} style={{ ...S.btn, background: "rgba(255,255,255,0.15)", color: "#fff", fontSize: 12 }}>← Abmelden</button>
        </div>
      </div>
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "24px 16px" }}>
        <div style={S.navTabs}>
          {tabs.map(t => <button key={t.id} style={{ ...S.navTab, ...(tab === t.id ? S.navTabActive : {}) }} onClick={() => setTab(t.id)}>{t.label}</button>)}
        </div>
        {tab === "dashboard" && <LeitungDashboard appData={appData} eventID={eventID} onDataChange={onDataChange} />}
        {tab === "wahlen" && <LeitungWahlen appData={appData} eventID={eventID} onDataChange={onDataChange} initialStichwahl={window._stichwahl} onStichwahl={() => { window._stichwahl = null; }} />}
        {tab === "tokens" && <LeitungTokens appData={appData} eventID={eventID} onDataChange={onDataChange} />}
        {tab === "waehler" && <LeitungWaehler appData={appData} eventID={eventID} onDataChange={onDataChange} />}
        {tab === "ergebnisse" && <LeitungErgebnisse appData={appData} eventID={eventID} onDataChange={onDataChange} onSwitchTab={setTab} />}
      </div>
    </div>
  );
}

function QRCode({ url, size = 200 }) {
  const encodedUrl = encodeURIComponent(url);
  return (
    <img
      src={`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodedUrl}&color=1a2744&bgcolor=ffffff&margin=10`}
      width={size}
      height={size}
      alt="QR-Code"
      style={{ display: "block" }}
    />
  );
}

      await callFlow("toggleWahl", { wahlID: parseInt(wahl.id), aktiv: false, geschlossen: true });

    } catch (e) { console.error(e); }

    setToggling(wahl.id);
    try {
      await callFlow("toggleWahl", { wahlID: parseInt(wahl.id), aktiv: !wahl.aktiv, geschlossen: wahl.geschlossen || false });
      await onDataChange();

          : wahlen.map(w => (
