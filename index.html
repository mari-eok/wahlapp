    const zeigeOffline = modus === "beides" || nurOffline;

    // Nur ein Modus aktiv → direkt einblenden ohne Auswahlkarte
    if (nurOnline) { setSzenario("online"); loadWaehler(); return null; }
    if (nurOffline) { setSzenario("offline"); return null; }

    return (
      <div>
        <h3 style={{ margin:"0 0 24px", color:C.primary }}>Wahlcodes</h3>
        {!zeigeOnline&&!zeigeOffline&&<div style={{ ...S.alert, ...S.alertWarning }}>Keine Methode für dieses Wahllokal aktiviert. Bitte im Superadmin konfigurieren.</div>}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
          {zeigeOnline&&<div style={{ ...S.card, cursor:"pointer", border:`2px solid ${C.border}`, textAlign:"center", padding:32 }} onClick={()=>{ setSzenario("online"); loadWaehler(); }}>
            <div style={{ fontSize:48, marginBottom:16 }}><i className="ti ti-mail" aria-hidden="true" style={{fontSize:48, color:C.primary}}/></div>
            <h3 style={{ color:C.primary, margin:"0 0 8px" }}>Online-Versand</h3>
            <p style={{ color:C.textLight, fontSize:14, lineHeight:1.6 }}>Wähler per E-Mail einladen. Wahlcode wird automatisch generiert und versendet.</p>
          </div>}
          {zeigeOffline&&<div style={{ ...S.card, cursor:"pointer", border:`2px solid ${C.border}`, textAlign:"center", padding:32 }} onClick={()=>setSzenario("offline")}>
            <div style={{ fontSize:48, marginBottom:16 }}><i className="ti ti-clipboard-list" aria-hidden="true" style={{fontSize:48, color:C.primary}}/></div>
            <h3 style={{ color:C.primary, margin:"0 0 8px" }}>Vor-Ort-Ausgabe</h3>
            <p style={{ color:C.textLight, fontSize:14, lineHeight:1.6 }}>Anonyme Wahlcodes generieren und ausdrucken. Verteilung erfolgt vor Ort.</p>
          </div>}
        </div>
      </div>
    );
  }

  if (szenario==="offline") return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}>
        {(wahllokal?.modus==="beides"||!wahllokal?.modus)&&<button style={{ ...S.btn, ...S.btnGhost }} onClick={()=>setSzenario(null)}>← Zurück</button>}
        <h3 style={{ margin:0, color:C.primary }}><i className="ti ti-clipboard-list" aria-hidden="true"/> Vor-Ort-Ausgabe</h3>
      </div>
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      {erfolg&&<div style={{ ...S.alert, ...S.alertSuccess }}><i className="ti ti-circle-check" aria-hidden="true"/> {erfolg}</div>}
      <div style={S.card}>
        <div style={S.sectionLabel}>Wahlcodes generieren</div>
        <p style={{ color:C.textLight, fontSize:13, marginBottom:16 }}>Legen Sie Anzahl und Gültigkeit fest, dann exportieren Sie die Wahlcodes als Liste zum Ausdrucken.</p>
        <div style={{ marginBottom:20 }}>
          {/* Einzeilige Label-Reihe */}
          <div style={{ display:"flex", gap:32, flexWrap:"wrap", marginBottom:6 }}>
            <label style={{ ...S.label, margin:0, width:88 }}>Anzahl</label>
            <label style={{ ...S.label, margin:0 }}>Gültig bis</label>
          </div>
          {/* Einzeilige Input-Reihe */}
          <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
            <input style={{ ...S.input, width:88, height:42, boxSizing:"border-box" }} type="number" min={1} max={500} value={offlineAnzahl} onChange={e=>setOfflineAnzahl(parseInt(e.target.value))}/>
            <div style={{ width:24 }}/>
            <DateTimePicker label="" value={gueltigBis} onChange={setGueltigBis} hint="" inline={true}/>
          </div>
          <p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>Wahlcodes sind nach diesem Zeitpunkt nicht mehr verwendbar.</p>
        </div>
        {saving&&<div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.35)", zIndex:9990, display:"flex", alignItems:"center", justifyContent:"center" }}><div style={{ background:C.bgWhite, borderRadius:12, padding:"32px 40px", textAlign:"center", boxShadow:"0 8px 32px rgba(0,0,0,0.18)" }}><div style={S.spinner}/><p style={{ marginTop:12, color:C.primary, fontWeight:600 }}>Wahlcodes werden generiert…</p></div></div>}
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button style={{ ...S.btn, ...S.btnPrimary, padding:"10px 24px" }} onClick={offlineGenerierenMitPDF} disabled={saving}>
            {saving ? "Wird generiert…" : <><i className="ti ti-printer" aria-hidden="true"/> Wahlcodes & PDF generieren</>}
          </button>
          <button style={{ ...S.btn, ...S.btnGhost, padding:"10px 24px" }} onClick={offlineGenerieren} disabled={saving}>
            <i className="ti ti-ticket" aria-hidden="true"/> Nur Wahlcodes generieren (ohne PDF)
          </button>
        </div>
        <p style={{ color:C.textLight, fontSize:12, marginTop:8 }}>„Wahlcodes & PDF" speichert neue Wahlcodes und öffnet sofort das Druckfenster. „Nur Wahlcodes" speichert ohne PDF — drucken später über die Wahlcode-Übersicht.</p>
      </div>
      <OfflineTokenListe eventID={eventID} reloadTrigger={tokenReloadTrigger} wahllokalName={wahllokal?.name} isMobile={isMobile}/>
    </div>
  );

  const angelegt=waehler.filter(w=>w.status==="angelegt").length;
  const versendet=waehler.filter(w=>w.status==="versendet").length;
  const abgeholt=waehler.filter(w=>w.status==="abgeholt").length;

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}>
        {(wahllokal?.modus==="beides"||!wahllokal?.modus)&&<button style={{ ...S.btn, ...S.btnGhost }} onClick={()=>setSzenario(null)}>← Zurück</button>}
        <h3 style={{ margin:0, color:C.primary }}><i className="ti ti-mail" aria-hidden="true"/> Online-Versand</h3>
      </div>
      {dialog}
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}<button onClick={()=>setFehler(null)} style={{ float:"right", background:"none", border:"none", cursor:"pointer" }}><i className="ti ti-x" aria-hidden="true"/></button></div>}
      {erfolg&&<div style={{ ...S.alert, ...S.alertSuccess }}><i className="ti ti-circle-check" aria-hidden="true"/> {erfolg}</div>}



      {/* SCHRITT 2: E-Mails importieren */}
      <div style={S.card}>
        <div style={S.sectionLabel}>2 · E-Mail-Adressen importieren</div>
        <p style={{ color:C.textLight, fontSize:13, marginBottom:12 }}>Eine oder mehrere E-Mail-Adressen eingeben — komma- oder zeilengetrennt. Für jede Adresse wird automatisch ein Wahlcode und ein Einmallink generiert.</p>
        <div style={{ marginBottom:16 }}>
          <DateTimePicker label="Wahlcodes gültig bis" value={gueltigBis} onChange={setGueltigBis} hint="Wahlcodes sind nach diesem Zeitpunkt nicht mehr verwendbar."/>
        </div>
        <textarea
          style={{ ...S.input, height:90, resize:"vertical", marginBottom:10 }}
          value={emailInput}
          onChange={e=>{ setEmailInput(e.target.value); setCsvInput(e.target.value); }}
          placeholder={"max@ekiba.de\nanna@ekiba.de, tom@ekiba.de"}
        />
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>{
            const lines = emailInput.split(/[\n\r,;]+/).map(l=>l.trim().toLowerCase()).filter(l=>l.includes("@"));
            if(lines.length===0) return;
            if(lines.length===1) addEmail(); else importCSV();
          }} disabled={saving||!emailInput.trim()}>
            {saving ? "…" : <><i className="ti ti-upload" aria-hidden="true"/> Importieren</>}
          </button>
        </div>
        <p style={{ fontSize:12, color:C.textLight, marginTop:8 }}>Die Links werden noch nicht versendet — erst nach Ihrer Prüfung im nächsten Schritt.</p>
      </div>

      {/* SCHRITT 3: Prüfen & Versenden */}
      {waehler.length > 0 && (
        <div style={{ ...S.card, border:`2px solid ${angelegt>0?C.warning:C.accent}` }}>
          <div style={{ ...S.sectionLabel, color:angelegt>0?C.warning:C.accent }}>3 · Prüfen & Links versenden</div>
          <div style={{ display:"flex", gap:20, flexWrap:"wrap", marginBottom:16 }}>
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:28, fontWeight:700, color:C.text }}>{waehler.length}</div>
              <div style={{ fontSize:12, color:C.textLight }}>Wähler gesamt</div>
            </div>
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:28, fontWeight:700, color:C.warning }}>{angelegt}</div>
              <div style={{ fontSize:12, color:C.textLight }}>Link ausstehend</div>
            </div>
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:28, fontWeight:700, color:C.primary }}>{versendet}</div>
              <div style={{ fontSize:12, color:C.textLight }}>Link versendet</div>
            </div>
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:28, fontWeight:700, color:C.accent }}>{abgeholt}</div>
              <div style={{ fontSize:12, color:C.textLight }}>Code abgeholt</div>
            </div>
          </div>
          {angelegt>0 && (
            <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
              <button style={{ ...S.btn, ...S.btnPrimary }} onClick={emailsVersenden} disabled={sending}>
                {sending ? "Wird versendet…" : <><i className="ti ti-send" aria-hidden="true"/> {angelegt} Einmallink{angelegt!==1?"s":""} versenden</>}
              </button>
              <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={loadWaehler} disabled={loading}><i className="ti ti-refresh" aria-hidden="true"/></button>
            </div>
          )}
          {angelegt===0 && versendet>0 && (
            <div style={{ display:"flex", alignItems:"center", gap:8, color:C.accent, fontSize:13 }}>
              <i className="ti ti-circle-check" aria-hidden="true"/>
              Alle Links wurden versendet.
            </div>
          )}
        </div>
      )}

      {/* SCHRITT 4: Eingeladene + Wahlcodes Tabs */}
      <div style={S.card}>
        <div style={{ display:"flex", gap:0, marginBottom:16, borderBottom:`2px solid ${C.border}` }}>
          <button onClick={()=>setOnlineTab("eingeladene")} style={{ background:"none", border:"none", cursor:"pointer", padding:"8px 16px", fontSize:13, fontWeight:600, color:onlineTab==="eingeladene"?C.primary:C.textLight, borderBottom:onlineTab==="eingeladene"?`2px solid ${C.primary}`:"2px solid transparent", marginBottom:-2 }}>
            <i className="ti ti-users" aria-hidden="true"/> Eingeladene ({waehler.length})
          </button>
          <button onClick={()=>setOnlineTab("wahlcodes")} style={{ background:"none", border:"none", cursor:"pointer", padding:"8px 16px", fontSize:13, fontWeight:600, color:onlineTab==="wahlcodes"?C.primary:C.textLight, borderBottom:onlineTab==="wahlcodes"?`2px solid ${C.primary}`:"2px solid transparent", marginBottom:-2 }}>
            <i className="ti ti-ticket" aria-hidden="true"/> Online-Wahlcodes
          </button>
        </div>

        {onlineTab==="wahlcodes" && (
          <OfflineTokenListe eventID={eventID} reloadTrigger={tokenReloadTrigger} wahllokalName={wahllokal?.name} isMobile={isMobile} filterTyp="online"/>
        )}

        {onlineTab==="eingeladene" && <div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <div style={S.sectionLabel}>Eingeladene</div>
          <div style={{ display:"flex", gap:6, alignItems:"center" }}>
            {hatAuswahl&&kannLoeschen&&<button style={{ ...S.btn, ...S.btnDanger, fontSize:12 }} onClick={ausgewaehlteLoschen} disabled={saving}><i className="ti ti-trash" aria-hidden="true"/> Löschen ({ausgewaehlt.filter(id=>waehler.find(w=>w.id===id)?.status!=="versendet").length})</button>}
            {hatAuswahl&&kannDeaktivieren&&<button style={{ ...S.btn, ...S.btnDanger, fontSize:12 }} onClick={ausgewaehltDeaktivieren} disabled={saving}><i className="ti ti-ban" aria-hidden="true"/> Sperren</button>}
            {hatAuswahl&&kannAktivieren&&<button style={{ ...S.btn, ...S.btnSuccess, fontSize:12 }} onClick={ausgewaehltAktivieren} disabled={saving}><i className="ti ti-circle-check" aria-hidden="true"/> Aktivieren</button>}
            {hatAuswahl&&<span style={{ fontSize:12, color:C.textLight }}>{ausgewaehlt.length} ausgewählt</span>}
          </div>
        </div>
        <div style={{ display:"flex", gap:6, marginBottom:10, flexWrap:"wrap" }}>
          {statusFilterBtns.map(b=><button key={b.id} style={{ ...S.btn, fontSize:12, padding:"4px 10px", ...(filterStatus===b.id?S.btnPrimary:S.btnGhost) }} onClick={()=>setFilterStatus(b.id)}>{b.label}</button>)}
        </div>
        <div style={{ marginBottom:12 }}>
          <input style={S.input} type="text" value={suche} onChange={e=>setSuche(e.target.value)} placeholder="E-Mail suchen..."/>
        </div>
        {loading?<p style={{ color:C.textLight, fontSize:14 }}>Wird geladen...</p>
          :gefilterteWaehler.length===0?<p style={{ color:C.textLight, fontSize:14 }}>{suche||filterStatus!=="alle"?"Keine Ergebnisse.":"Noch keine Wähler angelegt."}</p>
          :(
          <table style={S.table}>
            <thead><tr>
              <th style={{ ...S.th, width:40 }}><input type="checkbox" checked={alleAusgewaehlt} onChange={toggleAlle}/></th>
              <SortTh col="email" label="E-Mail"/>
              <SortTh col="status" label="Status"/>
              <th style={S.th}>Aktion</th>
            </tr></thead>
            <tbody>{gefilterteWaehler.map(w=>(
              <tr key={w.id} style={{ background:ausgewaehlt.includes(w.id)?"#f0f4ff":"transparent" }}>
                <td style={S.td}><input type="checkbox" checked={ausgewaehlt.includes(w.id)} onChange={()=>toggleAuswahl(w.id)}/></td>
                <td style={S.td}>{w.email}</td>
                <td style={S.td}>
                  <span style={{ ...S.badge,
                    ...(w.status==="abgeholt"?S.badgeGreen:
                        w.status==="versendet"?S.badgeOrange:
                        S.badgeGray) }}>
                    {w.status==="abgeholt"?<><i className="ti ti-circle-check" aria-hidden="true"/> abgeholt</>:
                     w.status==="versendet"?<><i className="ti ti-mail" aria-hidden="true"/> versendet</>:
                     <><i className="ti ti-clock" aria-hidden="true"/> ausstehend</>}
                  </span>
                </td>
                <td style={S.td}>
                  {w.status!=="abgeholt" && (
                    <button style={{ ...S.btn, fontSize:11, padding:"3px 9px", ...S.btnGhost }} onClick={()=>einzelVersenden(w)} disabled={saving}>
                      <i className="ti ti-mail" aria-hidden="true"/>{w.status==="versendet"?" Erneut senden":"Link senden"}
                    </button>
                  )}
                </td>
              </tr>
            ))}</tbody>
          </table>
        )}
        </div>}
      </div>
    </div>
  );
}

function LeitungErgebnisse({ appData, eventID, onDataChange, onSwitchTab }) {
  useEffect(()=>{ window._switchToWahlen=()=>onSwitchTab&&onSwitchTab("wahlen"); return ()=>{ window._switchToWahlen=null; }; },[onSwitchTab]);
  return <ErgebnisDashboard appData={appData} wahllokalID={eventID} onBack={null} isLeitung={true} onDataChange={onDataChange} initialWahlId={window._ergebnisWahlId}/>;
}

function SuperadminView({ appData, onExit, onDataChange }) {
  const isMobile = useIsMobile();
  const [tab, setTab] = useState("wahllokale"); const [wahllokale, setWahllokale] = useState(null); const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(null); const [saving, setSaving] = useState(false); const [fehler, setFehler] = useState(null);
  const [expanded, setExpanded] = useState(null); const [deleting, setDeleting] = useState(null);
  const [showPin, setShowPin] = useState({}); const pinTimers = useRef({});
  const { confirm, dialog } = useConfirm();
  function togglePin(id) {
    setShowPin(p=>{ const next={...p,[id]:!p[id]}; if(next[id]){ if(pinTimers.current[id]) clearTimeout(pinTimers.current[id]); pinTimers.current[id]=setTimeout(()=>setShowPin(pp=>({...pp,[id]:false})),5000); } else { if(pinTimers.current[id]) clearTimeout(pinTimers.current[id]); } return next; });
  }
  const [alleWahlen, setAlleWahlen] = useState(appData.wahlen);
  async function laden() {
    setLoading(true);
    try {
      const r = await callFlow("getAlle", {});
      const wls = Array.isArray(r) ? r.map(mapWahllokal) : appData.wahllokale;
      setWahllokale(wls);
      // Alle Wahlen aller Wahllokale laden
      const alleWahlenArr = [];
      for (const wl of wls) {
        try {
          const raw = await callFlow("getDaten", { eventID: wl.eventID });
          const optionen = (raw.optionen||[]).map(mapOption);
          const wahlen = (raw.wahlen||[]).map(mapWahl);
          wahlen.forEach(w=>{ w.optionen=optionen.filter(o=>o.wahlID===w.id).sort((a,b)=>{ if(a.istEnthaltung&&!b.istEnthaltung) return 1; if(!a.istEnthaltung&&b.istEnthaltung) return -1; return parseInt(a.id)-parseInt(b.id); }); });
          alleWahlenArr.push(...wahlen);
        } catch(e) {}
      }
      setAlleWahlen(alleWahlenArr);
    } catch(e) { setFehler(e.message); }
    setLoading(false);
  }
  useEffect(()=>{ laden(); },[]);
  async function saveWahllokal(f) { setSaving(true); setFehler(null); try{ await callFlow("saveWahllokal",{ wahllokalID:f.id?parseInt(f.id):null, eventID:f.eventID, name:f.name, aktiv:f.aktiv!==false, leitungPIN:f.leitungPIN||"0000", modus:f.modus||"beides" }); await laden(); await onDataChange(); setForm(null); }catch(e){ setFehler(e.message); } setSaving(false); }
  async function deleteWahllokal(wl) { const ok = await confirm({ titel:`Wahllokal löschen`, nachricht:`Wahllokal "${wl.name}" wirklich löschen?\n\nAlle zugehörigen Wahlen, Wahlcodes und Abstimmungen werden unwiderruflich gelöscht.`, bestaetigen:"Löschen", typ:"danger" }); if(!ok) return; setDeleting(wl.id); try{ await callFlow("deleteWahllokal",{ wahllokalID:parseInt(wl.id), eventID:wl.eventID }); await laden(); await onDataChange(); }catch(e){ setFehler(e.message); } setDeleting(null); }
  const tabs = [
    { id:"wahllokale", label:"Wahllokale", icon:"ti-building" },
    { id:"wahlen",     label:"Alle Wahlen", icon:"ti-chart-bar" },
    { id:"flows",      label:"Flows", icon:"ti-settings" },
  ];

  if (form!==null) return (
    <div style={{ maxWidth:600, margin:"0 auto", padding:"20px 16px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}><button onClick={()=>setForm(null)} style={{ ...S.btn, ...S.btnGhost }}>← Zurück</button><h2 style={{ fontSize:18, fontWeight:800, color:C.primary }}>{form.id?"Wahllokal bearbeiten":"Neues Wahllokal"}</h2></div>
      <div style={S.card}>
        <div style={S.formGroup}><label style={S.label}>Name</label><input style={S.input} value={form.name||""} onChange={e=>setForm(x=>({...x,name:e.target.value}))} placeholder="z.B. Synode Ortenau"/></div>
        <div style={S.formGroup}><label style={S.label}>EventID</label><input style={S.input} value={form.eventID||""} onChange={e=>setForm(x=>({...x,eventID:e.target.value.toUpperCase()}))} placeholder="z.B. SOR" maxLength={10}/><p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>Kurzkürzel — wird in der URL verwendet.</p></div>
        <div style={S.formGroup}><label style={S.label}>Wahlleitung-PIN</label><div style={{ position:"relative" }}><input style={{ ...S.input, paddingRight:40 }} value={form.leitungPIN||""} onChange={e=>setForm(x=>({...x,leitungPIN:e.target.value}))} placeholder="PIN" maxLength={8} type={showPin["form"]?"text":"password"}/><button onClick={()=>togglePin("form")} style={{ position:"absolute", right:10, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", cursor:"pointer", fontSize:16, color:C.textLight }}>{showPin["form"]?<i className="ti ti-eye-off" aria-hidden="true"/>:<i className="ti ti-eye" aria-hidden="true"/>}</button></div><p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>Der PIN wird in SharePoint gespeichert und nie an den Browser übertragen — Vergleich läuft serverseitig.</p></div>
        <div style={S.formGroup}>
          <label style={S.label}>Verfügbare Funktionen</label>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {[
              { val:"beides", label:"Online-Versand & Vor-Ort-Ausgabe", hint:"Beide Methoden stehen der Wahlleitung zur Verfügung" },
              { val:"online", label:"Nur Online-Versand", hint:"Wahlcodes werden per E-Mail verschickt" },
              { val:"offline", label:"Nur Vor-Ort-Ausgabe", hint:"Wahlcodes werden vor Ort ausgedruckt und verteilt" },
            ].map(opt=>(
              <label key={opt.val} style={{ display:"flex", alignItems:"flex-start", gap:10, cursor:"pointer", padding:"10px 12px", borderRadius:8, border:`1.5px solid ${(form.modus||"beides")===opt.val?C.primary:C.border}`, background:(form.modus||"beides")===opt.val?"#eef4fb":"transparent" }}>
                <input type="radio" name="modus" value={opt.val} checked={(form.modus||"beides")===opt.val} onChange={()=>setForm(x=>({...x,modus:opt.val}))} style={{ marginTop:2 }}/>
                <div>
                  <div style={{ fontWeight:600, fontSize:14 }}>{opt.label}</div>
                  <div style={{ fontSize:12, color:C.textLight }}>{opt.hint}</div>
                </div>
              </label>
            ))}
          </div>
        </div>
        <div style={S.formGroup}><label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:14 }}><input type="checkbox" checked={form.aktiv!==false} onChange={e=>setForm(x=>({...x,aktiv:e.target.checked}))}/>Wahllokal aktiv</label></div>
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button style={{ ...S.btn, ...S.btnGhost }} onClick={()=>setForm(null)}>Abbrechen</button><button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>saveWahllokal(form)} disabled={saving}>{saving?"Speichern…":"Speichern"}</button></div>
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth:900, margin:"0 auto", padding:isMobile?"12px 12px":"20px 16px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}>
        <div><div style={{ fontSize:11, fontWeight:700, letterSpacing:"0.15em", color:C.superadmin, textTransform:"uppercase", marginBottom:2 }}>Systemzugang</div><h1 style={{ fontSize:isMobile?18:22, fontWeight:900, color:C.primary, margin:0 }}>Superadmin</h1></div>
        <button onClick={onExit} style={{ ...S.btn, ...S.btnGhost, fontSize:12 }}><i className="ti ti-logout" aria-hidden="true"/> Abmelden</button>
      </div>
      <div style={S.statGrid}><StatCard num={wahllokale?.length??"—"} label="Wahllokale" color={C.superadmin}/><StatCard num={alleWahlen.length} label="Wahlen gesamt" color={C.primary}/><StatCard num={alleWahlen.filter(w=>w.aktiv).length} label="Aktive Wahlen" color={C.success}/><StatCard num={alleWahlen.filter(w=>w.geschlossen).length} label="Geschlossen" color={C.error}/></div>
      {/* Tabs: scrollbar auf Mobile, normal auf Desktop */}
      <div style={{ display:"flex", gap:isMobile?0:8, marginBottom:20, borderBottom:`2px solid ${C.border}`, paddingBottom:0, overflowX:"auto" }}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{ background:"none", border:"none", cursor:"pointer",
              padding:isMobile?"10px 14px":"10px 16px",
              fontSize:isMobile?13:14, fontWeight:600, whiteSpace:"nowrap",
              display:"flex", alignItems:"center", gap:6,
              color:tab===t.id?C.primary:C.textLight,
              borderBottom:tab===t.id?`2px solid ${C.primary}`:"2px solid transparent",
              marginBottom:-2 }}>
            <i className={`ti ${t.icon}`} aria-hidden="true"/>
            {t.label}
          </button>
        ))}
      </div>
      {dialog}
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      {tab==="wahllokale"&&(
        <div style={S.card}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}><div style={S.sectionLabel}>Wahllokale</div><button style={{ ...S.btn, ...S.btnPrimary, fontSize:13 }} onClick={()=>setForm({ name:"", eventID:"", leitungPIN:"", aktiv:true, modus:"beides" })}>+ Neues Wahllokal</button></div>
          {loading&&<p style={{ color:C.textLight, fontSize:14 }}>Wird geladen…</p>}
          {!loading&&wahllokale?.map(wl=>{
            const wahlenDieses=alleWahlen.filter(w=>w.eventID===wl.eventID); const isOpen=expanded===wl.id;
            return (
              <div key={wl.id} style={{ borderBottom:`1px solid ${C.border}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0" }}>
                  <div style={{ cursor:"pointer", flex:1 }} onClick={()=>setExpanded(isOpen?null:wl.id)}>
                    <div style={{ fontWeight:700, fontSize:15 }}>{wl.name}</div>
                    <div style={{ fontSize:12, color:C.textLight, marginTop:2, display:"flex", alignItems:"center", gap:6 }}>
                    EventID: {wl.eventID} · {wahlenDieses.length} Wahlen · PIN: <span style={{ fontFamily:"monospace", letterSpacing:2, color:C.textLight, fontSize:12 }}>serverseitig gesichert</span>
                    · {wl.modus==="online"?"Online":wl.modus==="offline"?"Vor-Ort":"Online+Vor-Ort"}
                  </div>
                  </div>
                  <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>
                    {wl.aktiv?<span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>:<span style={{ ...S.badge, ...S.badgeGray }}>inaktiv</span>}
                    <button style={{ ...S.btn, ...S.btnGhost, fontSize:12, padding:"5px 10px" }} onClick={()=>setForm({...wl})}><i className="ti ti-edit" aria-hidden="true"/>{!isMobile&&" Bearbeiten"}</button>
                    <button style={{ ...S.btn, ...S.btnGhostDanger, fontSize:12, padding:"5px 10px" }} onClick={()=>deleteWahllokal(wl)} disabled={deleting===wl.id}>{deleting===wl.id?"…":<><i className="ti ti-trash" aria-hidden="true"/>{!isMobile&&" Löschen"}</>}</button>
                    <span style={{ color:C.textLight, cursor:"pointer", fontSize:16, padding:"4px" }} onClick={()=>setExpanded(isOpen?null:wl.id)}>{isOpen?"▲":"▼"}</span>
                  </div>
                </div>
                {isOpen&&(
                  <div style={{ paddingLeft:12, borderLeft:`3px solid ${C.border}`, marginBottom:12 }}>
                    {wahlenDieses.length===0?<p style={{ fontSize:13, color:C.textLight, padding:"8px 0" }}>Keine Wahlen angelegt.</p>:wahlenDieses.map(w=>(
                      <div key={w.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:`1px solid ${C.border}` }}>
                        <div><div style={{ fontWeight:600, fontSize:13 }}>{w.titel}</div><div style={{ fontSize:11, color:C.textLight }}>{w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"} · {w.optionen.length} Kandidaten</div></div>
                        {w.geschlossen?<span style={{ ...S.badge, ...S.badgeRed }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>:w.aktiv?<span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>:<span style={{ ...S.badge, ...S.badgeOrange }}>⏸ pausiert</span>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      {tab==="wahlen"&&(
        <div style={S.card}>
          <div style={S.sectionLabel}>Alle Wahlen</div>
          {isMobile ? (
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {alleWahlen.length===0?<p style={{ color:C.textLight, fontSize:13 }}>Keine Wahlen.</p>:alleWahlen.map(w=>{
                const wl=appData.wahllokale.find(l=>l.eventID===w.eventID);
                return (
                  <div key={w.id} style={{ borderRadius:8, border:`1px solid ${C.border}`, padding:12 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                      <div style={{ fontWeight:600, fontSize:14 }}>{w.titel}</div>
                      {w.geschlossen?<span style={{ ...S.badge, ...S.badgeRed }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>:w.aktiv?<span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>:<span style={{ ...S.badge, ...S.badgeOrange }}>pausiert</span>}
                    </div>
                    <div style={{ fontSize:12, color:C.textLight, marginTop:4 }}>{wl?.name||w.eventID} · {w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"}</div>
                  </div>
                );
              })}
            </div>
          ) : (
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead><tr><th style={{ ...S.th, textAlign:"left" }}>Titel</th><th style={{ ...S.th, textAlign:"left" }}>Wahllokal</th><th style={{ ...S.th, textAlign:"left" }}>Typ</th><th style={{ ...S.th, textAlign:"left" }}>Status</th></tr></thead>
              <tbody>{alleWahlen.length===0?<tr><td colSpan={4} style={{ ...S.td, color:C.textLight }}>Keine Wahlen.</td></tr>:alleWahlen.map(w=>{
                const wl=appData.wahllokale.find(l=>l.eventID===w.eventID);
                return (<tr key={w.id}><td style={{ ...S.td, fontWeight:600 }}>{w.titel}</td><td style={{ ...S.td, color:C.textLight }}>{wl?.name||w.eventID}</td><td style={{ ...S.td, fontSize:12 }}>{w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"}</td><td style={S.td}>{w.geschlossen?<span style={{ ...S.badge, ...S.badgeRed }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>:w.aktiv?<span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>:<span style={{ ...S.badge, ...S.badgeOrange }}>⏸ pausiert</span>}</td></tr>);
              })}</tbody>
            </table>
          )}
        </div>
      )}
      {tab==="flows"&&(
        <div style={S.card}>
          <div style={S.sectionLabel}>Flow-Konfiguration</div>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr><th style={{ ...S.th, textAlign:"left" }}>Flow</th><th style={{ ...S.th, textAlign:"left" }}>Status</th></tr></thead>
            <tbody>{Object.entries(API.flows).map(([key,url])=>(<tr key={key}><td style={{ ...S.td, fontFamily:"monospace", fontSize:13, fontWeight:600 }}>{key}</td><td style={S.td}>{url.startsWith("PLATZHALTER")?<span style={{ ...S.badge, ...S.badgeRed }}><i className="ti ti-alert-triangle" aria-hidden="true"/> nicht verbunden</span>:<span style={{ ...S.badge, ...S.badgeGreen }}><i className="ti ti-circle-check" aria-hidden="true"/> verbunden</span>}</td></tr>))}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function PraesentationsModus({ appData, wahllokalID, onExit }) {
  const wahllokal = appData.wahllokale.find(w=>w.eventID===wahllokalID);
  const [wahlenFrisch, setWahlenFrisch] = useState(null);
  const wahlen = wahlenFrisch||appData.wahlen.filter(w=>w.eventID===wahllokalID&&w.geschlossen);
  const gruppen = gruppiereWahlen(wahlen);
  const [selectedGruppeIdx, setSelectedGruppeIdx] = useState(0);

  useEffect(()=>{
    async function laden(){ try{
      const raw=await callFlow("getDaten",{ eventID:wahllokalID });
      const optionen=(raw.optionen||[]).map(mapOption);
      const w=(raw.wahlen||[]).map(mapWahl).filter(wahl=>wahl.geschlossen);
      w.forEach(wahl=>{ wahl.optionen=optionen.filter(o=>o.wahlID===wahl.id).sort((a,b)=>{ if(a.istEnthaltung&&!b.istEnthaltung) return 1; if(!a.istEnthaltung&&b.istEnthaltung) return -1; return parseInt(a.id)-parseInt(b.id); }); });
      setWahlenFrisch(w);
    }catch(e){} }
    laden();
    const t = setInterval(laden, 30000);
    return ()=>clearInterval(t);
  },[wahllokalID]);

  return (
    <div style={{ position:"fixed", inset:0, background:C.primary, zIndex:9999, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      {/* Header */}
      <div style={{ padding:"clamp(12px, 2vh, 24px) clamp(16px, 3vw, 48px)", borderBottom:"1px solid rgba(255,255,255,0.15)", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
        <div>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:"0.15em", textTransform:"uppercase", color:"rgba(255,255,255,0.5)", marginBottom:4 }}>Evangelische Landeskirche in Baden</div>
          <h1 style={{ fontSize:"clamp(18px, 3vh, 32px)", fontWeight:900, color:"#fff", margin:0 }}>{wahllokal?.name||wahllokalID} · Wahlergebnisse</h1>
        </div>
        <button onClick={onExit} style={{ ...S.btn, background:"rgba(255,255,255,0.15)", color:"#fff", fontSize:13 }}><i className="ti ti-x" aria-hidden="true"/> Beenden</button>
      </div>

      {/* Gruppenauswahl */}
      {gruppen.length>1&&(
        <div style={{ padding:"12px 40px", display:"flex", gap:8, flexWrap:"wrap", borderBottom:"1px solid rgba(255,255,255,0.1)", flexShrink:0 }}>
          {gruppen.map((g,idx)=>(
            <button key={g.hauptwahl.id} onClick={()=>setSelectedGruppeIdx(idx)}
              style={{ padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer", fontSize:14, fontWeight:700,
                background:idx===selectedGruppeIdx?C.accent:"rgba(255,255,255,0.15)", color:"#fff" }}>
              {getBasisTitel(g.hauptwahl.titel)}
            </button>
          ))}
        </div>
      )}

      {/* Inhalt */}
      <div style={{ flex:1, overflowY:"auto", overflowX:"hidden", padding:"clamp(12px, 2vh, 32px) clamp(16px, 3vw, 48px)" }}>
        {wahlen.length===0&&<div style={{ textAlign:"center", paddingTop:80, color:"rgba(255,255,255,0.5)", fontSize:18 }}>Noch keine abgeschlossenen Wahlen.</div>}
        {gruppen[selectedGruppeIdx]&&(
          <KombinierteGruppenAnsicht
            gruppe={gruppen[selectedGruppeIdx]}
            wahllokalID={wahllokalID}
            isLeitung={false}
            onDataChange={null}
            wahlen={wahlen}
            VB={true}
          />
        )}
      </div>

      {/* Footer */}
      <div style={{ padding:"12px 40px", borderTop:"1px solid rgba(255,255,255,0.1)", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
        <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)" }}>Auto-Refresh alle 30 Sekunden</div>
        <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)" }}>{new Date().toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" })}</div>
      </div>
    </div>
  );
}

function KombinierteGruppenAnsicht({ gruppe, wahllokalID, isLeitung, onDataChange, wahlen, VB }) {
  const alleWahlen = [gruppe.hauptwahl, ...gruppe.stichwahlen];
  const [ergebnisseMap, setErgebnisseMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [letzteAkt, setLetzteAkt] = useState(null);

  async function laden() {
    setLoading(true);
    const neu = {};
    for (const w of alleWahlen) {
      try {
        const result = await callFlow("getErgebnisse", { wahlID: parseInt(w.id), eventID: wahllokalID });
        neu[w.id] = Array.isArray(result) ? result : (result.value||result.abstimmungen||[]);
      } catch(e) { neu[w.id] = []; }
    }
    setErgebnisseMap(neu);
    setLetzteAkt(new Date());
    setLoading(false);
  }

  useEffect(() => { laden(); }, [gruppe.hauptwahl.id]);
  useEffect(() => { const t = setInterval(laden, 30000); return () => clearInterval(t); }, [gruppe.hauptwahl.id]);

  function berechneOptErgebnisse(wahl, ergebnisse) {
    return (wahl?.optionen||[]).map(opt => ({
      ...opt,
      stimmen: (ergebnisse||[]).filter(a => {
        try { const pos = JSON.parse(a.Positionen||a.positionen||"[]"); return pos.some(p=>String(p.optionID)===opt.id); } catch { return false; }
      }).length
    })).sort((a,b) => b.stimmen - a.stimmen);
  }

  function pruefeMehrheit(stimmen, total, wahl) {
    if (total===0) return false;
    if (istStichwahl(wahl)) return pruefeStichwahl(stimmen, total);
    return pruefeMehrheitGO(stimmen, total);
  }

  const col = (normal, vb) => VB ? vb : normal;

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        {letzteAkt&&<div style={{ fontSize:11, color:C.textLight }}>Aktualisiert: {letzteAkt.toLocaleTimeString("de-DE")} · Auto-Refresh alle 30 Sek.</div>}
        <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={laden} disabled={loading}><i className="ti ti-refresh" aria-hidden="true"/></button>
      </div>
      {loading&&!Object.keys(ergebnisseMap).length&&<div style={{ textAlign:"center", padding:24 }}><div style={S.spinner}/></div>}
      {alleWahlen.map((wahl, idx) => {
        const ergebnisse = ergebnisseMap[wahl.id]||[];
        const total = ergebnisse.length;
        const optErg = berechneOptErgebnisse(wahl, ergebnisse);
        const maxS = Math.max(...optErg.map(e=>e.stimmen), 1);
        const mehrheitsregel = typeof wahl.mehrheitsregel==="object" ? (wahl.mehrheitsregel?.Value||"relativ") : (wahl.mehrheitsregel||"relativ");
        const nichtenthaltung = optErg.filter(e=>!e.istEnthaltung);
        const fuehrend = nichtenthaltung[0];
        const mehrheitErreicht = fuehrend && pruefeMehrheit(fuehrend.stimmen, total, wahl);
        const gleichstand = nichtenthaltung.filter(e=>e.stimmen===fuehrend?.stimmen&&e.id!==fuehrend?.id).length>0;
        const wahlGeschlossen = !!wahl.geschlossen;
        const istLetzte = idx===alleWahlen.length-1;
        const naechsteStichwahl = gruppe.stichwahlen[idx]; // nächste Stichwahl nach dieser Wahl
        const hatNaechsteStichwahl = !!naechsteStichwahl;

        return (
          <div key={wahl.id} style={{ marginBottom:24 }}>
            {/* Verbindungslinie zwischen Wahlgängen */}
            {idx>0&&<div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:16 }}>
              <div style={{ flex:1, height:1, background:C.border }}/>
              <span style={{ fontSize:12, color:C.textLight, fontWeight:600, whiteSpace:"nowrap" }}>
                {idx===1?"1. Stichwahl":`${idx}. Stichwahl`}
              </span>
              <div style={{ flex:1, height:1, background:C.border }}/>
            </div>}

            <div style={{ background:C.bgWhite, borderRadius:12, padding:20, border:`1px solid ${C.border}`, boxShadow:"0 2px 8px rgba(0,0,0,0.05)" }}>
              {/* Wahlkopf */}
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16, flexWrap:"wrap", gap:8 }}>
                <div>
                  <div style={{ fontWeight:800, fontSize:16, color:C.primary }}>{idx===0?"Hauptwahl":wahl.titel}</div>
                  <div style={{ fontSize:12, color:C.textLight, marginTop:2 }}>
                    {getMehrheitsregelLabel(wahl)}
                    {" · "}{total} Stimme{total!==1?"n":""} eingegangen{wahlGeschlossen ? "" : " · Stimmverteilung erst nach Schließen"}
                  </div>
                </div>
                <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                  {wahl.geschlossen&&<span style={{ ...S.badge, ...S.badgeRed }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>}
                  {!wahl.geschlossen&&wahl.aktiv&&<span style={{ ...S.badge, ...S.badgeGreen }}>● läuft</span>}
                  {!wahl.geschlossen&&!wahl.aktiv&&<span style={{ ...S.badge, ...S.badgeOrange }}>⏸ pausiert</span>}
                </div>
              </div>

              {/* Balken */}
              {total===0&&<p style={{ color:C.textLight, fontSize:13 }}>Noch keine Stimmen abgegeben.</p>}
              {total>0&&!wahlGeschlossen&&(
                <div style={{ padding:"16px", textAlign:"center", background:C.bg, borderRadius:8, marginTop:8 }}>
                  <div style={{ fontSize:28, fontWeight:900, color:C.primary, lineHeight:1, marginBottom:4 }}>{total}</div>
                  <div style={{ fontSize:13, color:C.textLight, marginBottom:8 }}>Stimme{total!==1?"n":""} eingegangen</div>
                  <div style={{ fontSize:12, color:C.textLight }}>Stimmverteilung wird erst nach dem Schließen der Wahl angezeigt.</div>
                </div>
              )}
              {total>0&&wahlGeschlossen&&<div style={{ display:"flex", flexDirection:"column", gap:VB?"clamp(8px, 1.5vh, 20px)":"12px" }}>
                {optErg.map(e => {
                  const pct = total>0 ? Math.round(e.stimmen/total*100) : 0;
                  const istFuehrend = !e.istEnthaltung&&e.id===fuehrend?.id&&!gleichstand;
                  const istGleichstand = !e.istEnthaltung&&nichtenthaltung.filter(n=>n.stimmen===e.stimmen).length>1&&e.stimmen>0;
                  return (
                    <div key={e.id}>
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                          {istFuehrend&&wahlGeschlossen&&mehrheitErreicht&&<i className="ti ti-trophy" aria-hidden="true" style={{color:C.warning}}/>}
                          {istGleichstand&&wahlGeschlossen&&<i className="ti ti-scale" aria-hidden="true" style={{color:"#f59e0b"}}/>}
                          <span style={{ fontWeight:istFuehrend?800:600, fontSize:VB?"clamp(14px, 2vh, 24px)":"14px", color:VB?"#fff":C.text }}>{e.name}</span>
                          {e.istEnthaltung&&<span style={{ ...S.badge, ...S.badgeGray, fontSize:10 }}>Enthaltung</span>}
                        </div>
                        <span style={{ fontWeight:700, fontSize:VB?"clamp(14px, 2vh, 22px)":"14px", color:VB?"#fff":C.primary }}>{e.stimmen} ({pct}%)</span>
                      </div>
                      <div style={{ background:C.border, borderRadius:6, height:VB?"clamp(12px, 2vh, 28px)":"14px", overflow:"hidden" }}>
                        <div style={{ height:"100%", width:`${(e.stimmen/maxS)*100}%`, borderRadius:6, transition:"width 0.8s ease",
                          background: e.istEnthaltung?C.textLight:(istFuehrend&&wahlGeschlossen&&mehrheitErreicht?C.accent:(istGleichstand?C.warning:C.primaryLight))
                        }}/>
                      </div>
                    </div>
                  );
                })}
              </div>}

              {/* Ergebnis-Banner */}
              {wahlGeschlossen&&total>0&&(()=>{
                const istSW = istStichwahl(wahl);
                const keinDrittel = istSW && fuehrend && !pruefeStichwahl(fuehrend.stimmen, total);
                const keinDrittelUeberhaupt = istSW && (!fuehrend || fuehrend.stimmen === 0 || keinDrittel);
                return (
                <div style={{ marginTop:14, padding:10, borderRadius:8,
                  background: mehrheitErreicht&&!gleichstand?"#f0fdf4":keinDrittelUeberhaupt?"#fef2f2":gleichstand?"#fff8e1":"#fef3c7",
                  border:`1px solid ${mehrheitErreicht&&!gleichstand?C.success:keinDrittelUeberhaupt?C.error:gleichstand?C.warning:"#f59e0b"}`
                }}>
                  {mehrheitErreicht&&!gleichstand&&<p style={{ fontWeight:700, color:C.success, fontSize:13, margin:0 }}>
                    <i className="ti ti-trophy" aria-hidden="true" style={{color:C.warning}}/> Gewählt: {fuehrend?.name} · {Math.round(fuehrend.stimmen/total*100)}%
                  </p>}
                  {gleichstand&&!keinDrittelUeberhaupt&&<p style={{ fontWeight:700, color:"#92400e", fontSize:13, margin:0 }}>
                    <i className="ti ti-scale" aria-hidden="true"/> Gleichstand — Stichwahl erforderlich
                  </p>}
                  {keinDrittelUeberhaupt&&<>
                    <p style={{ fontWeight:700, color:C.error, fontSize:13, margin:"0 0 6px" }}>
                      <i className="ti ti-circle-x" aria-hidden="true"/> Kein Kandidat hat die erforderliche Mindestanzahl von 1/3 der Stimmen erreicht.
                    </p>
                    <p style={{ fontSize:12, color:"#7b2d2d", margin:0 }}>
                      Gem. Grundordnung § Abs. 1 Nr. 4 ist keine weitere automatische Stichwahl vorgesehen. Die Versammlung muss über das weitere Vorgehen beraten.
                    </p>
                  </>}
                  {!mehrheitErreicht&&!gleichstand&&!keinDrittelUeberhaupt&&<p style={{ fontWeight:700, color:"#92400e", fontSize:13, margin:0 }}>
                    <i className="ti ti-alert-triangle" aria-hidden="true"/> Absolute Mehrheit nicht erreicht — Stichwahl erforderlich
                  </p>}
                </div>
                );
              })()}

              {/* Stichwahl vorbereiten */}
              {istLetzte&&wahlGeschlossen&&total>0&&(!mehrheitErreicht||gleichstand)&&isLeitung&&!hatNaechsteStichwahl&&(()=>{
                const istSW = istStichwahl(wahl);
                const keinDrittel = istSW && fuehrend && !pruefeStichwahl(fuehrend.stimmen, total);
                const istGleichstandStichwahl = istSW && gleichstand;
                return (
                  <div style={{ marginTop:12 }}>
                    {keinDrittel&&(
                      <div style={{ ...S.alert, background:"#fef2f2", border:`1px solid ${C.error}`, color:"#7b2d2d", fontSize:12, marginBottom:10 }}>
                        <i className="ti ti-alert-triangle" aria-hidden="true"/> Gem. Grundordnung § Abs. 1 Nr. 4 ist keine weitere Stichwahl vorgesehen. Eine weitere Wahl ist nur durch Beschluss der Versammlung möglich.
                      </div>
                    )}
                    {istGleichstandStichwahl&&(
                      <div style={{ ...S.alert, ...S.alertWarning, fontSize:12, marginBottom:10 }}>
                        <i className="ti ti-alert-triangle" aria-hidden="true"/> Gleichstand in der Stichwahl — die Grundordnung sieht hierfür keinen automatischen weiteren Wahlgang vor. Die Versammlung muss beraten.
                      </div>
                    )}
                    <StichwahVorbereiten
                      wahl={wahl}
                      kandidaten={gleichstand
                        ? nichtenthaltung.filter(e=>e.stimmen===fuehrend?.stimmen)
                        : nichtenthaltung.slice(0,2).filter(e=>e.stimmen>0)}
                      wahllokalID={wahllokalID}
                      isLeitung={isLeitung}
                      onDataChange={onDataChange}
                      wahlen={wahlen}
                    />
                  </div>
                );
              })()}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function StichwahVorbereiten({ wahl, kandidaten, wahllokalID, isLeitung, onDataChange, wahlen }) {
  // Ermittle Wahlgang-Nummer anhand bestehender Stichwahlen
  const basisTitel = wahl?.titel?.replace(/^(\d+\. )?Stichwahl: /, "") || wahl?.titel || "";
  const vorherigeStichwahlen = wahlen.filter(w => w.titel.includes("Stichwahl:") && w.titel.includes(basisTitel)).length;
  const naechsterTitel = vorherigeStichwahlen === 0
    ? "Stichwahl: " + basisTitel
    : `${vorherigeStichwahlen + 1}. Stichwahl: ${basisTitel}`;
  // Grundordnung: Stichwahl immer mit einfacher Mehrheit + 1/3-Minimum
  const mehrheitsregel = "stichwahl";

  if (!isLeitung || !onDataChange) {
    return (
      <button style={{ ...S.btn, ...S.btnGhost, fontSize:13 }} onClick={()=>
        alert("Stichwahl erforderlich zwischen:\n"+kandidaten.map(k=>"• "+k.name).join("\n")+"\n\nBitte wende dich an die Wahlleitung.")
      }><i className="ti ti-alert-triangle" aria-hidden="true"/> Stichwahl erforderlich</button>
    );
  }

  return (
    <div style={{ marginTop:12 }}>
      <div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", marginBottom:12, fontSize:13 }}>
        <i className="ti ti-info-circle" aria-hidden="true"/> {istStichwahl(wahl)
          ? "Weitere Stichwahl: Gem. Grundordnung § Abs. 1 Nr. 4 gilt weiterhin einfache Mehrheit mit mindestens 1/3 der abgegebenen Stimmen."
          : "Gem. Grundordnung § Abs. 1 Nr. 4: Im zweiten Wahlgang gilt einfache Mehrheit mit mindestens 1/3 der abgegebenen Stimmen."}
      </div>
      <button style={{ ...S.btn, ...S.btnPrimary, fontSize:13 }} onClick={()=>{
        window._stichwahl = {
          id: null,
          titel: naechsterTitel,
          istStichwahl: true,
          startzeit: toLocalInputValue(new Date()),
          mehrfach: false,
          exakt: false,
          maxAuswahl: 1,
          mehrheitsregel,
          optionen: kandidaten.map(k=>({ id:null, name:k.name, istEnthaltung:false })),
          eventID: wahllokalID,
          hatStimmen: false
        };
        window._switchToWahlen&&window._switchToWahlen();
      }}><i className="ti ti-player-play" aria-hidden="true"/> {naechsterTitel} vorbereiten</button>
      <p style={{ fontSize:12, color:C.textLight, marginTop:8 }}>
        Kandidaten: {kandidaten.map(k=>k.name).join(", ")}
      </p>
    </div>
  );
}

// Hilfsfunktion: Basistitel einer Wahl ermitteln (ohne Stichwahl-Präfix)
// Grundordnung EKIBA: Mehrheitsregel automatisch bestimmen
// Erster Wahlgang: absolute Mehrheit (>50% aller abgegebenen Stimmen inkl. Enthaltungen)
// Stichwahl: einfache Mehrheit + mind. 1/3 der abgegebenen Stimmen
function istStichwahl(wahl) {
  return /Stichwahl:/i.test(wahl?.titel||"");
}
function getMehrheitsregel(wahl) {
  return istStichwahl(wahl) ? "stichwahl" : "absolut";
}
function pruefeMehrheitGO(stimmen, total) {
  // Grundordnung Abs. 2: Enthaltungen zählen zu abgegebenen Stimmen → total ist korrekt
  if (total === 0) return false;
  return stimmen / total > 0.5; // absolute Mehrheit: mehr als 50%
}
function pruefeStichwahl(stimmen, total) {
  // Grundordnung Abs. 1 Nr. 4: einfache Mehrheit + mindestens 1/3
  if (total === 0) return false;
  return stimmen / total >= 1/3; // mind. 1/3
}
function getMehrheitsregelLabel(wahl) {
  if (istStichwahl(wahl)) return "Einfache Mehrheit (mind. 1/3 der Stimmen) · gem. § Grundordnung Abs. 1 Nr. 4";
  return "Absolute Mehrheit (>50%) · gem. § Grundordnung Abs. 1 Nr. 3";
}

function getBasisTitel(titel) {
  return titel.replace(/^(\d+\.\s*)?Stichwahl:\s*/i, "").trim();
}
// Hilfsfunktion: Wahlen gruppieren (Hauptwahl + Stichwahlen)
function gruppiereWahlen(wahlen) {
  const gruppen = [];
  const zugeordnet = new Set();
  wahlen.forEach(w => {
    if (zugeordnet.has(w.id)) return;
    if (/Stichwahl:/i.test(w.titel)) return; // Stichwahlen separat behandeln
    // Hauptwahl gefunden — zugehörige Stichwahlen finden
    const basis = getBasisTitel(w.titel);
    const stichwahlen = wahlen
      .filter(s => /Stichwahl:/i.test(s.titel) && getBasisTitel(s.titel) === basis)
      .sort((a,b) => (a.startzeit||"").localeCompare(b.startzeit||""));
    stichwahlen.forEach(s => zugeordnet.add(s.id));
    zugeordnet.add(w.id);
    gruppen.push({ hauptwahl: w, stichwahlen });
  });
  // Verwaiste Stichwahlen (ohne erkannte Hauptwahl) als eigene Gruppe
  wahlen.filter(w => !zugeordnet.has(w.id)).forEach(w => {
    gruppen.push({ hauptwahl: w, stichwahlen: [] });
  });
  return gruppen;
}

function ErgebnisDashboard({ appData, wahllokalID, onBack, isLeitung=false, onDataChange, initialWahlId }) {
  const wahllokal = appData.wahllokale.find(w=>w.eventID===wahllokalID);
  const [wahlenFrisch, setWahlenFrisch] = useState(null);
  const wahlen = wahlenFrisch||appData.wahlen.filter(w=>w.eventID===wahllokalID);
  useEffect(()=>{
    async function ladeWahlen(){ try{ const raw=await callFlow("getDaten",{ eventID:wahllokalID }); const optionen=(raw.optionen||[]).map(mapOption); const w=(raw.wahlen||[]).map(mapWahl); w.forEach(wahl=>{ wahl.optionen=optionen.filter(o=>o.wahlID===wahl.id).sort((a,b)=>{ if(a.istEnthaltung&&!b.istEnthaltung) return 1; if(!a.istEnthaltung&&b.istEnthaltung) return -1; return parseInt(a.id)-parseInt(b.id); }); }); setWahlenFrisch(w); }catch(e){ console.error(e); } }
    ladeWahlen();
  },[wahllokalID]);
  const gruppen = gruppiereWahlen(wahlen);
  const initialGruppeIdx = initialWahlId ? Math.max(0, gruppen.findIndex(g => g.hauptwahl.id===initialWahlId||g.stichwahlen.some(s=>s.id===initialWahlId))) : 0;
  const [selectedGruppeIdx, setSelectedGruppeIdx] = useState(initialGruppeIdx);
  const [selectedWahlID, setSelectedWahlID] = useState(initialWahlId||wahlen[0]?.id||"");
  const [ansicht, setAnsicht] = useState("kombiniert"); // "kombiniert" | "einzeln"
  const [ergebnisse, setErgebnisse] = useState(null); const [loading, setLoading] = useState(false);
  const [letzteAktualisierung, setLetzteAktualisierung] = useState(null); const [vollbild, setVollbild] = useState(false);
  useEffect(()=>{ if(wahlen.length>0&&!selectedWahlID) setSelectedWahlID(wahlen[0].id); },[wahlen.length]);
  async function laden(){ if(!selectedWahlID) return; setLoading(true); try{ const result=await callFlow("getErgebnisse",{ wahlID:parseInt(selectedWahlID), eventID:wahllokalID }); setErgebnisse(Array.isArray(result)?result:(result.value||result.abstimmungen||[])); setLetzteAktualisierung(new Date()); }catch(e){ console.error(e); } setLoading(false); }
  useEffect(()=>{ laden(); },[selectedWahlID]);
  useEffect(()=>{ const t=setInterval(laden,30000); return ()=>clearInterval(t); },[selectedWahlID]);

  const wahl = wahlen.find(w=>w.id===selectedWahlID);
  const total = ergebnisse?.length||0;
  const maxAuswahl = wahl?.maxAuswahl||1;
  function berechneOptErgebnisse(wahlObj, ergebnisseArr) {
    return (wahlObj?.optionen.map(opt=>({ ...opt, stimmen:(ergebnisseArr||[]).filter(a=>{ try{ const pos=JSON.parse(a.Positionen||a.positionen||"[]"); return pos.some(p=>String(p.optionID)===opt.id); }catch{ return false; } }).length||0 })).sort((a,b)=>b.stimmen-a.stimmen))||[];
  }

  const optErgebnisse = berechneOptErgebnisse(wahl, ergebnisse);
  const maxS = Math.max(...optErgebnisse.map(e=>e.stimmen),1);
  const nichtenthaltung = optErgebnisse.filter(e=>!e.istEnthaltung);
  const gewinner = (nichtenthaltung||[]).slice(0,maxAuswahl).filter(e=>e.stimmen>0);
  const wahlGeschlossen = wahl&&!!wahl.geschlossen;
  const gewinnerSchwelle = gewinner.length>0?gewinner[gewinner.length-1].stimmen:0;
  const gleichstandKandidaten = nichtenthaltung.filter(e=>e.stimmen===gewinnerSchwelle&&!gewinner.find(g=>g.id===e.id));
  const hatGleichstand = gleichstandKandidaten.length>0&&gewinnerSchwelle>0;
  const sichereGewinner = hatGleichstand?gewinner.slice(0,-1):gewinner;
  // Grundordnung: Mehrheit gegen ALLE abgegebenen Stimmen (inkl. Enthaltungen)
  const wahlIstStichwahl = istStichwahl(wahl);
  function pruefeMehrheit(stimmen) {
    if (total===0) return false;
    if (wahlIstStichwahl) return pruefeStichwahl(stimmen, total);
    return pruefeMehrheitGO(stimmen, total);
  }
  const mehrheitErreicht = gewinner.length>0&&gewinner.every(g=>pruefeMehrheit(g.stimmen));
  const stichwahNötig = total>0&&(!mehrheitErreicht||hatGleichstand);
  // Nur Kandidat:innen mit erreichter Mehrheit dürfen als gewählt markiert werden.
  // Bei erforderlicher Stichwahl: kein Pokal, kein Gewinner-Banner, keine Gewinner-Farbe.
  const gewaehlteKandidaten = (mehrheitErreicht && !hatGleichstand) ? sichereGewinner : [];
  const stichwahSuchTitel = "Stichwahl: "+(wahl?.titel||"");
  const stichwahExistiert = !!wahlenFrisch&&wahlen.some(w=>w.titel===stichwahSuchTitel&&w.id!==wahl?.id);
  const mehrheitsregelLabel = getMehrheitsregelLabel(wahl);
  const VB = vollbild;
  const col = (normal,vb)=>VB?vb:normal;

  const BalkenDiagramm = ({ opts, totalStimmen, maxStimmen, gross, gewinnerListe=[], gleichstandListe=[] })=>(
    <div style={{ display:"flex", flexDirection:"column", gap:gross?28:16 }}>
      {opts.map(e=>{
        const istFuehrend=!e.istEnthaltung&&totalStimmen>0&&gewinnerListe.some(g=>g.id===e.id);
        const istGleichstand=!istFuehrend&&!e.istEnthaltung&&gleichstandListe&&gleichstandListe.some(g=>g.id===e.id);
        const pct=totalStimmen>0?Math.round(e.stimmen/totalStimmen*100):0;
        return (
          <div key={e.id}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:gross?10:6, alignItems:"center" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                {istFuehrend&&<i className="ti ti-trophy" aria-hidden="true" style={{fontSize:gross?28:18, color:C.warning}}/>}
                <span style={{ fontWeight:istFuehrend?800:600, fontSize:gross?24:15, color:col(C.text,"#fff") }}>{e.name}</span>
                {e.istEnthaltung&&<span style={{ ...S.badge, background:"rgba(255,255,255,0.15)", color:col(C.textLight,"rgba(255,255,255,0.6)"), fontSize:11 }}>Enthaltung</span>}
              </div>
              <div style={{ textAlign:"right" }}>
                <span style={{ fontSize:gross?28:16, fontWeight:800, color:col(C.primary,C.accent) }}>{e.stimmen}</span>
                <span style={{ fontSize:gross?16:12, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginLeft:6 }}>Stimme{e.stimmen!==1?"n":""} ({pct}%)</span>
              </div>
            </div>
            <div style={{ background:col(C.border,"rgba(255,255,255,0.15)"), borderRadius:8, height:gross?40:16, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${totalStimmen>0?(e.stimmen/maxStimmen)*100:0}%`, background:e.istEnthaltung?col(C.textLight,"rgba(255,255,255,0.3)"):(istFuehrend?col(C.accent,"#4ade80"):(istGleichstand?col("#f59e0b","#fbbf24"):col(C.primaryLight,C.accent))), borderRadius:8, transition:"width 1s ease", minWidth:e.stimmen>0?8:0 }}/>
            </div>
          </div>
        );
      })}
    </div>
  );

  const containerStyle = VB?{ position:"fixed", inset:0, background:C.primary, zIndex:9999, display:"flex", flexDirection:"column", padding:"40px 56px", overflow:"auto" }:{ minHeight:"100vh", background:C.bg, padding:24 };

  return (
    <div style={containerStyle}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:VB?40:24 }}>
        <div>
          {!VB&&onBack&&<button onClick={onBack} style={{ ...S.btn, ...S.btnGhost, fontSize:12, marginBottom:12 }}>← Zurück zum Wahllokal</button>}
          <div style={{ fontSize:VB?14:12, fontWeight:700, letterSpacing:"0.15em", textTransform:"uppercase", color:col(C.textLight,"rgba(255,255,255,0.5)"), marginBottom:6 }}>Evangelische Landeskirche in Baden</div>
          <h1 style={{ fontSize:VB?36:24, fontWeight:900, color:col(C.primary,"#fff"), margin:0 }}>{wahllokal?.name||wahllokalID}</h1>
          <div style={{ fontSize:VB?18:14, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginTop:4 }}>Wahlergebnisse</div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center", flexShrink:0 }}>
          <button style={{ ...S.btn, fontSize:12, ...(VB?{ background:"rgba(255,255,255,0.15)", color:"#fff", border:"none" }:S.btnGhost) }} onClick={laden} disabled={loading}>{loading?"…":<i className="ti ti-refresh" aria-hidden="true"/>}</button>
          <button style={{ ...S.btn, fontSize:12, ...(VB?{ background:"rgba(255,255,255,0.15)", color:"#fff", border:"none" }:S.btnPrimary) }} onClick={()=>setVollbild(!VB)}>{VB?<><i className="ti ti-x" aria-hidden="true"/> Beenden</>:<><i className="ti ti-arrows-maximize" aria-hidden="true"/> Vollbild</>}</button>
        </div>
      </div>
      {wahlen.length>0&&!VB&&(
        <div style={{ marginBottom:20 }}>
          {/* Gruppenauswahl — nur wenn mehrere Wahlgruppen */}
          {gruppen.length>1&&<div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
            {gruppen.map((g,idx)=>(
              <button key={g.hauptwahl.id} onClick={()=>{ setSelectedGruppeIdx(idx); setSelectedWahlID(g.hauptwahl.id); setAnsicht("kombiniert"); }}
                style={{ ...S.btn, fontSize:13, ...(selectedGruppeIdx===idx?S.btnPrimary:S.btnGhost) }}>
                {getBasisTitel(g.hauptwahl.titel)}
                {g.stichwahlen.length>0&&<span style={{ marginLeft:6, fontSize:11, opacity:0.8 }}>+{g.stichwahlen.length} Stichwahl{g.stichwahlen.length>1?"en":""}</span>}
              </button>
            ))}
          </div>}
          {/* Ansicht-Toggle nur wenn Stichwahlen vorhanden */}
          {gruppen[selectedGruppeIdx]?.stichwahlen.length>0&&(
            <div style={{ display:"flex", gap:6, marginBottom:12 }}>
              <button onClick={()=>setAnsicht("kombiniert")} style={{ ...S.btn, fontSize:12, ...(ansicht==="kombiniert"?S.btnPrimary:S.btnGhost) }}><i className="ti ti-chart-bar" aria-hidden="true"/> Gesamtverlauf</button>
              <button onClick={()=>{ setAnsicht("einzeln"); setSelectedWahlID(gruppen[selectedGruppeIdx].hauptwahl.id); }} style={{ ...S.btn, fontSize:12, ...(ansicht==="einzeln"?S.btnPrimary:S.btnGhost) }}>Einzelansicht</button>
            </div>
          )}
          {/* Einzelansicht-Dropdown — nur wenn explizit gewählt */}
          {ansicht==="einzeln"&&gruppen[selectedGruppeIdx]?.stichwahlen.length>0&&(
            <select style={{ ...S.select, maxWidth:400 }} value={selectedWahlID} onChange={e=>setSelectedWahlID(e.target.value)}>
              {wahlen.filter(w=>!w.geschlossen).length>0&&<optgroup label="Aktive & pausierte Wahlen">{wahlen.filter(w=>!w.geschlossen).map(w=><option key={w.id} value={w.id}>{w.aktiv?"● ":"⏸ "}{w.titel}</option>)}</optgroup>}
              {wahlen.filter(w=>w.geschlossen).length>0&&<optgroup label="Archiv (geschlossen)">{wahlen.filter(w=>w.geschlossen).map(w=><option key={w.id} value={w.id}><i className="ti ti-lock" aria-hidden="true"/> {w.titel}</option>)}</optgroup>}
            </select>
          )}
          {/* Kombinierte Ansicht — immer wenn nicht explizit Einzelansicht */}
          {ansicht!=="einzeln"&&gruppen[selectedGruppeIdx]&&(
            <KombinierteGruppenAnsicht
              gruppe={gruppen[selectedGruppeIdx]}
              wahllokalID={wahllokalID}
              isLeitung={isLeitung}
              onDataChange={onDataChange}
              wahlen={wahlen}
              VB={VB}
            />
          )}
        </div>
      )}
      {wahlen.length>1&&VB&&<div style={{ display:"flex", gap:12, marginBottom:32, flexWrap:"wrap" }}>{wahlen.map(w=><button key={w.id} onClick={()=>setSelectedWahlID(w.id)} style={{ padding:"8px 20px", borderRadius:8, border:"none", cursor:"pointer", fontSize:14, fontWeight:600, background:w.id===selectedWahlID?C.accent:"rgba(255,255,255,0.15)", color:"#fff" }}>{w.titel}</button>)}</div>}
      {(ansicht==="einzeln"||VB)&&wahl&&ergebnisse!==null&&(
        <>
          <div style={{ marginBottom:VB?40:24 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:VB?20:12, flexWrap:"wrap" }}>
            <div style={{ fontSize:VB?28:18, fontWeight:800, color:col(C.primary,"#fff") }}>{wahl.titel}</div>
            {!VB&&<div style={{ fontSize:11, color:C.textLight, marginTop:2 }}>{mehrheitsregelLabel}</div>}
            {wahl.geschlossen&&<span style={{ ...S.badge, ...S.badgeRed, fontSize:VB?15:12 }}><i className="ti ti-lock" aria-hidden="true"/> geschlossen</span>}
            {!wahl.geschlossen&&wahl.aktiv&&<span style={{ ...S.badge, ...S.badgeGreen, fontSize:VB?15:12 }}>● läuft</span>}
            {!wahl.geschlossen&&!wahl.aktiv&&<span style={{ ...S.badge, ...S.badgeOrange, fontSize:VB?15:12 }}>⏸ pausiert</span>}
          </div>
            <div style={{ display:"flex", gap:VB?48:24, flexWrap:"wrap", alignItems:"flex-end" }}>
              {wahlGeschlossen ? (
                <div><div style={{ fontSize:VB?64:40, fontWeight:900, color:col(C.primary,C.accent), lineHeight:1 }}>{total}</div><div style={{ fontSize:VB?16:13, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginTop:4 }}>{maxAuswahl>1?`Stimmberechtigte (je ${maxAuswahl} Stimmen)`:`Stimme${total!==1?"n":""} abgegeben`}</div></div>
              ) : (
                <div>
                  <div style={{ fontSize:VB?64:40, fontWeight:900, color:col(C.primary,C.accent), lineHeight:1 }}>{total}</div>
                  <div style={{ fontSize:VB?16:13, color:col(C.textLight,"rgba(255,255,255,0.6)"), marginTop:4 }}>
                    Stimme{total!==1?"n":""} eingegangen
                  </div>
                  <div style={{ fontSize:VB?13:11, color:col(C.textLight,"rgba(255,255,255,0.45)"), marginTop:3 }}>
                    <i className="ti ti-lock" aria-hidden="true"/> Stimmverteilung erst nach Schließen sichtbar
                  </div>
                </div>
              )}
              {wahlGeschlossen&&total>0&&<div style={{ paddingBottom:VB?12:6 }}>
                {gewaehlteKandidaten.length>0&&gewaehlteKandidaten.map(g=><div key={g.id} style={{ fontSize:VB?20:14, fontWeight:800, color:col(C.text,"#fff"), marginBottom:2 }}><i className="ti ti-trophy" aria-hidden="true" style={{color:C.warning}}/> Gewählt: {g.name} · {Math.round(g.stimmen/total*100)}%</div>)}
                {stichwahNötig&&!hatGleichstand&&<div style={{ fontSize:VB?16:13, fontWeight:700, color:col("#92400e","#fbbf24") }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Absolute Mehrheit nicht erreicht — Stichwahl erforderlich</div>}
                {hatGleichstand&&<div style={{ fontSize:VB?16:13, fontWeight:700, color:col("#f59e0b","#fbbf24") }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Gleichstand — Stichwahl erforderlich</div>}
              </div>}
              {letzteAktualisierung&&<div style={{ paddingBottom:VB?12:6, marginLeft:"auto" }}><div style={{ fontSize:12, color:col(C.textLight,"rgba(255,255,255,0.4)") }}>Letzte Aktualisierung: {letzteAktualisierung.toLocaleTimeString("de-DE")}</div><div style={{ fontSize:11, color:col(C.textLight,"rgba(255,255,255,0.3)") }}>Auto-Refresh alle 30 Sekunden</div></div>}
            </div>
          </div>
          {wahlGeschlossen
            ? <BalkenDiagramm opts={optErgebnisse} totalStimmen={total} maxStimmen={maxS} gross={VB} gewinnerListe={gewaehlteKandidaten} gleichstandListe={hatGleichstand?[...gleichstandKandidaten,...(gewinner.slice(-1))]:[]}/>
            : <div style={{ padding:"20px 0", textAlign:"center", color:C.textLight, fontSize:14, background:C.bg, borderRadius:8 }}>
                <div style={{ fontSize:32, marginBottom:8 }}><i className="ti ti-lock" aria-hidden="true" style={{fontSize:32, color:C.textLight}}/></div>
                <p style={{ margin:0, fontWeight:600 }}>Ergebnisse und Stimmverteilung werden erst nach dem Schließen der Wahl angezeigt.</p>
              </div>
          }
          {wahlGeschlossen&&stichwahNötig&&!VB&&(
            <div style={{ marginTop:24, padding:16, borderRadius:10, background:stichwahExistiert?"#f0fdf4":"#fff8e1", border:`1px solid ${stichwahExistiert?"#22c55e":"#f59e0b"}` }}>
              {stichwahExistiert?<p style={{ fontWeight:700, color:"#166534" }}><i className="ti ti-circle-check" aria-hidden="true" style={{color:C.success}}/> Stichwahl bereits angelegt: "{stichwahSuchTitel}"</p>:<>
                {hatGleichstand&&<p style={{ fontWeight:700, color:"#92400e", marginBottom:8 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Gleichstand: {[...gleichstandKandidaten,...gewinner.slice(-1)].map(k=>k.name).join(", ")} — je {gewinnerSchwelle} Stimmen.</p>}
                {!mehrheitErreicht&&!hatGleichstand&&!wahlIstStichwahl&&<p style={{ fontWeight:700, color:"#92400e", marginBottom:8 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Absolute Mehrheit (>50%) nicht erreicht.</p>}
                {!mehrheitErreicht&&wahlIstStichwahl&&gewinner.length>0&&!pruefeStichwahl(gewinner[0].stimmen,total)&&(
                  <><p style={{ fontWeight:700, color:C.error, marginBottom:4 }}><i className="ti ti-circle-x" aria-hidden="true"/> Kein Kandidat hat die erforderliche Mindestanzahl von 1/3 der Stimmen erreicht.</p>
                  <p style={{ fontSize:12, color:"#7b2d2d", marginBottom:12 }}>Gem. Grundordnung § Abs. 1 Nr. 4 ist keine weitere automatische Stichwahl vorgesehen. Die Versammlung muss über das weitere Vorgehen beraten.</p></>
                )}
                {(!wahlIstStichwahl||(wahlIstStichwahl&&gewinner.length>0&&pruefeStichwahl(gewinner[0].stimmen,total)))&&<p style={{ fontSize:13, color:"#78350f", marginBottom:12 }}>Eine Stichwahl ist erforderlich.</p>}
                {wahlenFrisch&&<StichwahVorbereiten
                  wahl={wahl}
                  kandidaten={hatGleichstand?[...gleichstandKandidaten,...gewinner.slice(-1)]:sichereGewinner}
                  wahllokalID={wahllokalID}
                  isLeitung={isLeitung}
                  onDataChange={onDataChange}
                  wahlen={wahlen}
                />}
              </>}
            </div>
          )}
        </>
      )}
      {ergebnisse===null&&<div style={{ textAlign:"center", padding:48, color:col(C.textLight,"rgba(255,255,255,0.5)") }}>Wird geladen…</div>}
      {ergebnisse!==null&&total===0&&<div style={{ textAlign:"center", padding:48, color:col(C.textLight,"rgba(255,255,255,0.5)") }}>Noch keine Stimmen abgegeben.</div>}
    </div>
  );
}

function WahlForm({ form, onSave, onCancel, saving, fehler }) {
  const [f, setF] = useState(form);
  function setField(key,val){ setF(x=>({...x,[key]:val})); }
  function addOption(){ setF(x=>({...x, optionen:[...x.optionen.filter(o=>!o.istEnthaltung),{ id:null, _tempKey:"tmp_"+Date.now(), name:"", istEnthaltung:false },...x.optionen.filter(o=>o.istEnthaltung)]})); }
  function setOptName(key,name){ setF(x=>({...x, optionen:x.optionen.map(o=>(o.id===key||o._tempKey===key)?{...o,name}:o)})); }
  function removeOpt(key){ setF(x=>({...x, optionen:x.optionen.filter(o=>o.id!==key&&o._tempKey!==key)})); }
  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}><button style={{ ...S.btn, ...S.btnGhost }} onClick={onCancel}>← Zurück</button><h3 style={{ margin:0, color:C.primary }}>{f.isNew?"Neue Wahl":"Wahl bearbeiten"}</h3></div>
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      <div style={S.card}>
        <div style={S.formGroup}>
          <label style={S.label}>Titel</label>
          <input style={{ ...S.input, ...(f.istStichwahl?{ background:"#f5f5f5", color:"#555" }:{}) }}
            value={f.titel}
            onChange={e=>!f.istStichwahl&&setField("titel",e.target.value)}
            readOnly={!!f.istStichwahl}
            placeholder="z.B. Diakoniepfarrer*in"/>
          {f.istStichwahl&&<p style={{ fontSize:12, color:C.textLight, marginTop:4 }}>Titel einer Stichwahl kann nicht geändert werden.</p>}
        </div>
        {f.istStichwahl&&<div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", fontSize:13, marginBottom:16 }}><i className="ti ti-info-circle" aria-hidden="true"/> Die Stichwahl ist nach dem Speichern sofort startbereit — einfach auf ▶ Starten klicken.</div>}
        {!f.istStichwahl && <DateTimePicker label="Startzeit (lokale Zeit)" value={f.startzeit?(f.startzeit.includes("Z")?toLocalInputValue(new Date(f.startzeit)):f.startzeit.slice(0,16)):""} onChange={v=>setField("startzeit",v)} hint="Angabe in Ihrer lokalen Zeit (MEZ/MESZ). Die Wahl bleibt zunächst pausiert; nach dem Start/Freigeben erscheint vor Erreichen der Startzeit ein Countdown."/>}
        <div style={S.formGroup}>
          <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", marginBottom:f.hatEndzeit?10:0 }}>
            <input type="checkbox" checked={!!f.hatEndzeit} onChange={e=>setF(x=>({...x, hatEndzeit:e.target.checked, endzeit:e.target.checked ? (x.endzeit || "") : ""}))}/>
            <span style={S.label}>Endzeit festlegen (optional)</span>
          </label>
          {f.hatEndzeit&&(()=>{
            const startVal = f.startzeit?(f.startzeit.includes("Z")?toLocalInputValue(new Date(f.startzeit)):f.startzeit.slice(0,16)):"";
            const startDatum = startVal.split("T")[0]||"";
            return (<>
              <DateTimePicker label="" value={f.endzeit||""} minDate={startDatum} onChange={v=>{
                if (startVal && v) {
                  const [sd]=startVal.split("T"); const [vd]=v.split("T");
                  if (vd<sd) return; // früheres Datum blockieren
                  // Gleiches oder späteres Datum: immer setzen, Fehler wird separat angezeigt
                }
                setField("endzeit",v);
              }} hint="Gleicher Tag möglich — Uhrzeit muss nach der Startzeit liegen."/>
              {f.endzeit&&startVal&&(()=>{
                const [sd,st]=startVal.split("T"); const [vd,vt]=(f.endzeit||"").split("T");
                return (vd<sd||(vd===sd&&vt<=st)) ? <p style={{ color:C.error, fontSize:12, marginTop:4 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Endzeit muss nach der Startzeit liegen.</p> : null;
              })()}
            </>);
          })()}
        </div>
        <div style={{ display:"flex", gap:16, marginBottom:16, flexWrap:"wrap", opacity:f.hatStimmen?0.5:1, pointerEvents:f.hatStimmen?"none":"auto" }}>
          <label style={{ display:"flex", alignItems:"center", gap:8, cursor:f.hatStimmen?"not-allowed":"pointer", fontSize:14 }}><input type="checkbox" checked={f.mehrfach} disabled={!!f.hatStimmen} onChange={e=>setField("mehrfach",e.target.checked)}/>Mehrfachauswahl</label>
          {f.mehrfach&&<><label style={{ display:"flex", alignItems:"center", gap:8, fontSize:14 }}><input type="checkbox" checked={f.exakt} disabled={!!f.hatStimmen} onChange={e=>setField("exakt",e.target.checked)}/>Exakte Anzahl</label><label style={{ display:"flex", alignItems:"center", gap:8, fontSize:14 }}>Max: <input style={{ ...S.input, width:60 }} type="number" min={1} value={f.maxAuswahl} disabled={!!f.hatStimmen} onChange={e=>setField("maxAuswahl",parseInt(e.target.value))}/></label></>}
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>Kandidaten</label>
          {f.hatStimmen&&<div style={{ ...S.alert, ...S.alertWarning, marginBottom:12 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> Bereits Stimmen abgegeben — Kandidaten können nicht mehr geändert werden.</div>}
          {f.optionen.filter(o=>!o.istEnthaltung).map((o,idx,arr)=>(
            <div key={o.id||o._tempKey||idx} style={{ display:"flex", gap:8, marginBottom:8 }}>
              {(() => {
                const istGespeichert = o.id && !isNaN(parseInt(o.id));
                const nameReadonly = f.hatStimmen && istGespeichert;
                return (<>
                  <input
                    style={{ ...S.input, flex:1, ...(nameReadonly?{ background:"#f5f5f5", color:"#555" }:{}) }}
                    value={o.name}
                    onChange={e=>!nameReadonly&&setOptName(o.id||o._tempKey,e.target.value)}
                    placeholder="Name"
                    readOnly={nameReadonly}
                    autoFocus={!nameReadonly&&idx===arr.length-1&&o.name===""}
                    onKeyDown={e=>{ if(e.key==="Enter"&&!nameReadonly){ e.preventDefault(); addOption(); } }}
                    title={nameReadonly?"Name kann nicht geändert werden da bereits Stimmen abgegeben wurden.":""}
                  />
                  {!f.hatStimmen&&<button style={{ ...S.btn, ...S.btnDanger }} onClick={()=>removeOpt(o.id||o._tempKey)}><i className="ti ti-x" aria-hidden="true"/></button>}
                  {f.hatStimmen&&!istGespeichert&&<button style={{ ...S.btn, ...S.btnDanger }} onClick={()=>removeOpt(o.id||o._tempKey)}><i className="ti ti-x" aria-hidden="true"/></button>}
                </>);
              })()}
            </div>
          ))}
          {!f.hatStimmen&&<button style={{ ...S.btn, ...S.btnGhost, marginTop:4 }} onClick={addOption}>+ Kandidat hinzufügen</button>}
        </div>
        <div style={{ marginBottom:16 }}>
          <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:14 }}>
            <input type="checkbox" checked={f.optionen.some(o=>o.istEnthaltung)} onChange={e=>{ if(e.target.checked) setF(x=>({...x, optionen:[...x.optionen.filter(o=>!o.istEnthaltung),{ id:null, _tempKey:"tmp_enth_"+Date.now(), name:"Enthaltung", istEnthaltung:true }]})); else setF(x=>({...x, optionen:x.optionen.filter(o=>!o.istEnthaltung)})); }}/>
            Enthaltung als Option anbieten
          </label>
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>Mehrheitsregel</label>
          <div style={{ ...S.alert, background:"#eff6ff", border:"1px solid #bfdbfe", color:"#1e40af", fontSize:13, marginBottom:0 }}>
            <i className="ti ti-info-circle" aria-hidden="true"/> {f.istStichwahl
              ? "Stichwahl: Einfache Mehrheit + mind. 1/3 der abgegebenen Stimmen (gem. Grundordnung § Abs. 1 Nr. 4)"
              : "Erster Wahlgang: Absolute Mehrheit (>50% aller abgegebenen Stimmen inkl. Enthaltungen, gem. Grundordnung § Abs. 1 Nr. 3)"}
          </div>
        </div>
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button style={{ ...S.btn, ...S.btnGhost }} onClick={onCancel}>Abbrechen</button><button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>onSave(f)} disabled={saving}>{saving?"Speichern…":"Speichern"}</button></div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
