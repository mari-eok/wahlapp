function LeitungWahlen({ appData, eventID, onDataChange, initialStichwahl, onStichwahl }) {
  const [form, setForm] = useState(initialStichwahl || null);
  const [saving, setSaving] = useState(false);
  const [fehler, setFehler] = useState(null);
  const [stimmenCount, setStimmenCount] = useState({});
  const wahlen = appData.wahlen.filter(w => w.eventID === eventID);

  useEffect(() => {
    if (initialStichwahl) {
      setForm(initialStichwahl);
      if (onStichwahl) onStichwahl();
    }
  }, []);

  async function pruefeStimmen(wahlID) {
    try {
      const result = await callFlow("getErgebnisse", { wahlID: parseInt(wahlID), eventID });
      const count = Array.isArray(result) ? result.length : (result.value?.length || 0);
      setStimmenCount(prev => ({ ...prev, [wahlID]: count }));
      return count;
    } catch { return 0; }
  }

  async function openForm(wahl) {
    const count = await pruefeStimmen(wahl.id);
    setForm({ ...wahl, optionen: [...wahl.optionen], hatStimmen: count > 0 });
  }

  async function toggleAktiv(wahl) {
    try {
      if (API.flows.toggleWahl.startsWith("PLATZHALTER")) {
        alert("Flow 'WAHL_ToggleWahl' noch nicht verbunden.");
        return;
      }
      await callFlow("toggleWahl", { wahlID: parseInt(wahl.id), aktiv: !wahl.aktiv, geschlossen: false });
      onDataChange();
    } catch (e) { setFehler(e.message); }
  }

  async function deleteWahl(wahl) {
    if (!confirm(`Wahl "${wahl.titel}" und alle Optionen wirklich löschen?`)) return;
    try {
      await callFlow("deleteWahl", { wahlID: parseInt(wahl.id) });
      await onDataChange();
    } catch (e) { setFehler(e.message); }
  }

  async function saveWahl(f) {
    setSaving(true); setFehler(null);
    try {
      if (API.flows.saveWahl.startsWith("PLATZHALTER")) {
        alert("Flow 'WAHL_SaveWahl' noch nicht verbunden.");
        setSaving(false); return;
      }
      await callFlow("saveWahl", {
        wahlID: (!f.id || f.isNew) ? null : parseInt(f.id),
        eventID,
        titel: f.titel,
        aktiv: f.aktiv || false,
        startzeit: f.startzeit,
        mehrfach: f.mehrfach,
        exakt: f.exakt,
        maxAuswahl: f.maxAuswahl,
        mehrheitsregel: (typeof f.mehrheitsregel === "object" ? f.mehrheitsregel?.Value : f.mehrheitsregel) || "relativ",
        geschlossen: f.geschlossen || false,
        optionen: f.optionen,
      });
      await onDataChange();
      setForm(null);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  if (form) return <WahlForm form={form} onSave={saveWahl} onCancel={() => setForm(null)} saving={saving} fehler={fehler} />;

  return (
    <div>
      {fehler && <div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h3 style={{ margin: 0, color: C.primary }}>Wahlen</h3>
        <button style={{ ...S.btn, ...S.btnPrimary }} onClick={() => setForm({ id: Date.now().toString(), eventID, titel: "", aktiv: false, startzeit: new Date().toISOString().slice(0, 16), mehrfach: false, exakt: false, maxAuswahl: 1, optionen: [{ id: "o1", name: "", istEnthaltung: false }, { id: "enth", name: "Enthaltung", istEnthaltung: true }], isNew: true })}>
          + Neue Wahl
        </button>
      </div>
      <div style={S.card}>
        {wahlen.length === 0
          ? <p style={{ color: C.textLight, fontSize: 14 }}>Noch keine Wahlen. Legen Sie eine neue Wahl an.</p>
          : <table style={S.table}>
            <thead><tr><th style={S.th}>Titel</th><th style={S.th}>Typ</th><th style={S.th}>Optionen</th><th style={S.th}>Status</th><th style={S.th}>Aktionen</th></tr></thead>
            <tbody>
              {wahlen.map(w => (
                <tr key={w.id}>
                  <td style={S.td}><strong>{w.titel}</strong></td>
                  <td style={S.td}>{w.mehrfach ? `Mehrfach (max. ${w.maxAuswahl})` : "Einzel"}</td>
                  <td style={S.td}>{w.optionen.length}</td>
                  <td style={S.td}>
                    {w.geschlossen
                      ? <span style={{ ...S.badge, ...S.badgeRed }}>🔒 geschlossen</span>
                      : w.aktiv
                        ? <span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>
                        : <span style={{ ...S.badge, ...S.badgeGray }}>pausiert</span>
                    }
                  </td>
                  <td style={S.td}>
                    <div style={{ display: "flex", gap: 6 }}>
                      {!w.geschlossen && <button style={{ ...S.btn, ...S.btnGhost, fontSize: 12, padding: "5px 11px" }} onClick={() => openForm(w)}>Bearbeiten</button>}
                      {!w.geschlossen && !w.aktiv && <button style={{ ...S.btn, ...S.btnSuccess, fontSize: 12, padding: "5px 11px" }} onClick={() => toggleAktiv(w)}>Starten</button>}
                      <button style={{ ...S.btn, fontSize: 12, padding: "5px 11px", background: "transparent", color: C.error, border: `1px solid ${C.error}` }} onClick={() => deleteWahl(w)}>Löschen</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        }
      </div>
    </div>
  );
}


// ─── LEITUNG WÄHLER & TOKENS ─────────────────────────────────────────────────
function LeitungWaehler({ appData, eventID }) {
  const wahllokal = appData.wahllokale.find(w => w.eventID === eventID);
  const [szenario, setSzenario] = useState(null);
  const [waehler, setWaehler] = useState([]);
  const [loading, setLoading] = useState(false);
  const [emailInput, setEmailInput] = useState("");
  const [csvInput, setCsvInput] = useState("");
  const [saving, setSaving] = useState(false);
  const [sending, setSending] = useState(false);
  const [fehler, setFehler] = useState(null);
  const [erfolg, setErfolg] = useState(null);
  const [tab, setTab] = useState("liste");
  const [offlineAnzahl, setOfflineAnzahl] = useState(10);
  const [suche, setSuche] = useState("");
  const [ausgewaehlt, setAusgewaehlt] = useState([]);
  const [gueltigBis, setGueltigBis] = useState(() => {
    const d = new Date();
    d.setHours(23, 59, 0, 0);
    return d.toISOString().slice(0, 16);
  });

  function generateToken() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let t = "";
    for (let i = 0; i < 8; i++) t += chars[Math.floor(Math.random() * chars.length)];
    return t.slice(0,4) + "-" + t.slice(4);
  }

  async function loadWaehler() {
    setLoading(true);
    try {
      const result = await callFlow("getWaehler", { eventID });
      setWaehler((result || []).map(mapWaehler));
      setAusgewaehlt([]);
    } catch (e) { setFehler(e.message); }
    setLoading(false);
  }

  async function addEmail() {
    const email = emailInput.trim().toLowerCase();
    if (!email || !email.includes("@")) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("saveWaehler", { eventID, waehler: [{ email, token: "" }] });
      setEmailInput("");
      await loadWaehler();
      setErfolg("Wähler hinzugefügt.");
      setTimeout(() => setErfolg(null), 2000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function importCSV() {
    const lines = csvInput.split(/[\n\r,;]+/).map(l => l.trim().toLowerCase()).filter(l => l.includes("@"));

    if (lines.length === 0) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("saveWaehler", { eventID, waehler: lines.map(email => ({ email, token: "" })) });
      setCsvInput("");
      await loadWaehler();
      setErfolg(`${lines.length} importiert (Duplikate ignoriert).`);
      setTimeout(() => setErfolg(null), 3000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function tokensZuweisen() {
    const ohneToken = waehler.filter(w => w.status === "angelegt");
    if (ohneToken.length === 0) { setErfolg("Alle Wähler haben bereits einen Token."); return; }
    setSaving(true); setFehler(null);
    try {
      const tokenListe = ohneToken.map(w => ({ id: parseInt(w.id), email: w.email, token: generateToken() }));
      await callFlow("saveTokens", { eventID, tokens: tokenListe.map(t => t.token), gueltigBis: new Date(gueltigBis).toISOString() });
      await callFlow("updateWaehler", { updates: tokenListe.map(t => ({ id: t.id, tokenCode: t.token, status: "zugewiesen" })) });
      await loadWaehler();
      setErfolg(`${ohneToken.length} Tokens zugewiesen (gültig bis ${new Date(gueltigBis).toLocaleString("de-DE")}).`);
      setTimeout(() => setErfolg(null), 4000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function emailsVersenden() {
    const zuSenden = waehler.filter(w => w.status === "zugewiesen" && w.tokenCode);
    if (zuSenden.length === 0) { setFehler("Keine Wähler mit zugewiesenem Token."); return; }
    setSending(true); setFehler(null);
    try {
      await callFlow("sendTokenEmail", {
        eventID,
        wahllokalName: wahllokal?.name || eventID,
        wahllokalURL: window.location.origin + window.location.pathname + "?wahllokal=" + eventID,
        waehlerIDs: zuSenden.map(w => parseInt(w.id))
      });
      await loadWaehler();
      setErfolg(`${zuSenden.length} E-Mails versendet.`);
      setTimeout(() => setErfolg(null), 3000);
    } catch (e) { setFehler(e.message); }
    setSending(false);
  }

  async function ausgewaehlteLoschen() {
    const zuLoeschen = waehler.filter(w => ausgewaehlt.includes(w.id) && w.status !== "versendet");
    if (zuLoeschen.length === 0) return;
    if (!confirm(`${zuLoeschen.length} Wähler wirklich löschen?`)) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("deleteWaehler", { waehlerIDs: zuLoeschen.map(w => parseInt(w.id)) });
      await loadWaehler();
      setErfolg(`${zuLoeschen.length} Wähler gelöscht.`);
      setTimeout(() => setErfolg(null), 3000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function ausgewaehltDeaktivieren() {
    const zuDeaktivieren = waehler.filter(w => ausgewaehlt.includes(w.id) && w.tokenCode && w.tokenAktiv !== false);
    if (zuDeaktivieren.length === 0) return;
    if (!confirm(`Token für ${zuDeaktivieren.length} Wähler deaktivieren?`)) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("deactivateToken", {
        eventID,
        tokenCodes: zuDeaktivieren.map(w => w.tokenCode),
        waehlerIDs: zuDeaktivieren.map(w => parseInt(w.id)),
        aktiv: false
      });
      await loadWaehler();
      setErfolg(`${zuDeaktivieren.length} Tokens gesperrt.`);
      setTimeout(() => setErfolg(null), 3000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function ausgewaehltAktivieren() {
    const zuAktivieren = waehler.filter(w => ausgewaehlt.includes(w.id) && w.tokenCode && w.tokenAktiv === false);
    if (zuAktivieren.length === 0) return;
    if (!confirm(`Token für ${zuAktivieren.length} Wähler wieder aktivieren?`)) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("deactivateToken", {
        eventID,
        tokenCodes: zuAktivieren.map(w => w.tokenCode),
        waehlerIDs: zuAktivieren.map(w => parseInt(w.id)),
        aktiv: true
      });
      await loadWaehler();
      setErfolg(`${zuAktivieren.length} Tokens reaktiviert.`);
      setTimeout(() => setErfolg(null), 3000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function offlineGenerieren() {
    setSaving(true); setFehler(null);
    try {
      const tokens = Array.from({ length: offlineAnzahl }, () => generateToken());
      await callFlow("saveTokens", { eventID, tokens, gueltigBis: new Date(gueltigBis).toISOString() });
      const text = tokens.join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      a.download = "tokens_" + eventID + "_" + (wahllokal?.name || eventID) + ".txt";
      a.click();
      setErfolg(`${offlineAnzahl} Tokens generiert und exportiert.`);
      setTimeout(() => setErfolg(null), 3000);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  const gefilterteWaehler = waehler.filter(w => !suche || w.email.includes(suche.toLowerCase()));
  const alleAusgewaehlt = gefilterteWaehler.length > 0 && gefilterteWaehler.every(w => ausgewaehlt.includes(w.id));
  const hatAuswahl = ausgewaehlt.length > 0;
  const kannLoeschen = ausgewaehlt.some(id => waehler.find(w => w.id === id)?.status !== "versendet");
  const kannDeaktivieren = ausgewaehlt.some(id => { const w = waehler.find(w => w.id === id); return w?.tokenCode && w?.tokenAktiv !== false; });
  const kannAktivieren = ausgewaehlt.some(id => { const w = waehler.find(w => w.id === id); return w?.tokenCode && w?.tokenAktiv === false; });

  function toggleAuswahl(id) {
    setAusgewaehlt(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  function toggleAlle() {
    if (alleAusgewaehlt) setAusgewaehlt([]);
    else setAusgewaehlt(gefilterteWaehler.map(w => w.id));
  }

  const GueltigBisInput = () => (
    <div style={{ ...S.card, marginBottom: 16 }}>
      <div style={S.sectionLabel}>Token-Gültigkeit</div>
      <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
        <div>
          <label style={S.label}>Gültig bis</label>
          <input style={{ ...S.input, width: 220 }} type="datetime-local" value={gueltigBis} onChange={e => setGueltigBis(e.target.value)} />
        </div>
        <p style={{ color: C.textLight, fontSize: 12, paddingBottom: 10 }}>Tokens sind nach diesem Zeitpunkt nicht mehr verwendbar.</p>
      </div>
    </div>
  );

  if (!szenario) {
    return (
      <div>
        <h3 style={{ margin: "0 0 24px", color: C.primary }}>Wähler & Tokens</h3>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <div style={{ ...S.card, cursor: "pointer", border: `2px solid ${C.border}`, textAlign: "center", padding: 32 }} onClick={() => { setSzenario("online"); loadWaehler(); }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>📧</div>
            <h3 style={{ color: C.primary, margin: "0 0 8px" }}>Online-Versand</h3>
            <p style={{ color: C.textLight, fontSize: 14, lineHeight: 1.6 }}>Wähler per E-Mail einladen. Token wird automatisch generiert und versendet.</p>
          </div>
          <div style={{ ...S.card, cursor: "pointer", border: `2px solid ${C.border}`, textAlign: "center", padding: 32 }} onClick={() => setSzenario("offline")}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>📋</div>
            <h3 style={{ color: C.primary, margin: "0 0 8px" }}>Vor-Ort-Ausgabe</h3>
            <p style={{ color: C.textLight, fontSize: 14, lineHeight: 1.6 }}>Anonyme Tokens generieren und ausdrucken. Verteilung erfolgt vor Ort.</p>
          </div>
        </div>
      </div>
    );
  }

  if (szenario === "offline") {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
          <button style={{ ...S.btn, ...S.btnGhost }} onClick={() => setSzenario(null)}>← Zurück</button>
          <h3 style={{ margin: 0, color: C.primary }}>📋 Vor-Ort-Ausgabe</h3>
        </div>
        {fehler && <div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
        {erfolg && <div style={{ ...S.alert, ...S.alertSuccess }}>✅ {erfolg}</div>}
        <GueltigBisInput />
        <div style={S.card}>
          <div style={S.sectionLabel}>Tokens generieren</div>
          <div style={{ display: "flex", gap: 12, alignItems: "flex-end", marginBottom: 8 }}>
            <div>
              <label style={S.label}>Anzahl</label>
              <input style={{ ...S.input, width: 80 }} type="number" min={1} max={500} value={offlineAnzahl} onChange={e => setOfflineAnzahl(parseInt(e.target.value))} />
            </div>
            <button style={{ ...S.btn, ...S.btnPrimary, padding: "10px 20px" }} onClick={offlineGenerieren} disabled={saving}>
              {saving ? "Wird generiert..." : "Generieren & Exportieren"}
            </button>
          </div>
          <p style={{ color: C.textLight, fontSize: 12 }}>Tokens werden in SharePoint gespeichert und als .txt-Datei exportiert (Format: XXXX-YYYY).</p>
        </div>
      </div>
    );
  }

  const angelegt = waehler.filter(w => w.status === "angelegt").length;
  const zugewiesen = waehler.filter(w => w.status === "zugewiesen").length;
  const versendet = waehler.filter(w => w.status === "versendet").length;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button style={{ ...S.btn, ...S.btnGhost }} onClick={() => setSzenario(null)}>← Zurück</button>
        <h3 style={{ margin: 0, color: C.primary }}>📧 Online-Versand</h3>
      </div>
      {fehler && <div style={{ ...S.alert, ...S.alertError }}>{fehler} <button onClick={() => setFehler(null)} style={{ float: "right", background: "none", border: "none", cursor: "pointer" }}>✕</button></div>}
      {erfolg && <div style={{ ...S.alert, ...S.alertSuccess }}>✅ {erfolg}</div>}

      <GueltigBisInput />

      <div style={S.statGrid}>
        <StatCard num={waehler.length} label="Wähler gesamt" color={C.primary} />
        <StatCard num={angelegt} label="Ohne Token" color={C.textLight} />
        <StatCard num={zugewiesen} label="Token zugewiesen" color={C.warning} />
        <StatCard num={versendet} label="E-Mail versendet" color={C.accent} />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <button style={{ ...S.btn, ...S.btnPrimary }} onClick={tokensZuweisen} disabled={saving || angelegt === 0}>
          🔑 Tokens zuweisen ({angelegt})
        </button>
        <button style={{ ...S.btn, ...S.btnSuccess }} onClick={emailsVersenden} disabled={sending || zugewiesen === 0}>
          {sending ? "Wird versendet..." : `📧 E-Mails versenden (${zugewiesen})`}
        </button>
        {hatAuswahl && kannLoeschen && (
          <button style={{ ...S.btn, ...S.btnDanger }} onClick={ausgewaehlteLoschen} disabled={saving}>
            🗑️ Löschen ({ausgewaehlt.filter(id => waehler.find(w => w.id === id)?.status !== "versendet").length})
          </button>
        )}
        {hatAuswahl && kannDeaktivieren && (
          <button style={{ ...S.btn, ...S.btnDanger }} onClick={ausgewaehltDeaktivieren} disabled={saving}>
            🚫 Token sperren ({ausgewaehlt.filter(id => { const w = waehler.find(w => w.id === id); return w?.tokenCode && w?.tokenAktiv !== false; }).length})
          </button>
        )}
        {hatAuswahl && kannAktivieren && (
          <button style={{ ...S.btn, ...S.btnSuccess }} onClick={ausgewaehltAktivieren} disabled={saving}>
            ✅ Token aktivieren ({ausgewaehlt.filter(id => { const w = waehler.find(w => w.id === id); return w?.tokenCode && w?.tokenAktiv === false; }).length})
          </button>
        )}
        <button style={{ ...S.btn, ...S.btnGhost }} onClick={loadWaehler} disabled={loading}>🔄</button>
      </div>

      <div style={S.navTabs}>
        <button style={{ ...S.navTab, ...(tab === "liste" ? S.navTabActive : {}) }} onClick={() => setTab("liste")}>📋 Wähler-Liste</button>
        <button style={{ ...S.navTab, ...(tab === "hinzufuegen" ? S.navTabActive : {}) }} onClick={() => setTab("hinzufuegen")}>+ Hinzufügen</button>
      </div>

      {tab === "hinzufuegen" && (
        <div style={S.card}>
          <div style={S.formGroup}>
            <label style={S.label}>Einzeln hinzufügen</label>
            <div style={{ display: "flex", gap: 8 }}>
              <input style={{ ...S.input, flex: 1 }} type="email" value={emailInput} onChange={e => setEmailInput(e.target.value)} onKeyDown={e => e.key === "Enter" && addEmail()} placeholder="name@ekiba.de" />
              <button style={{ ...S.btn, ...S.btnPrimary }} onClick={addEmail} disabled={saving}>{saving ? "..." : "+ Hinzufügen"}</button>
            </div>
          </div>
          <div style={S.formGroup}>
            <label style={S.label}>CSV / Mehrere importieren</label>
            <p style={{ color: C.textLight, fontSize: 12, marginBottom: 8 }}>E-Mail-Adressen durch Komma, Semikolon oder Zeilenumbruch getrennt:</p>
            <textarea style={{ ...S.input, height: 100, resize: "vertical", marginBottom: 8 }} value={csvInput} onChange={e => setCsvInput(e.target.value)} placeholder="max@ekiba.de, anna@ekiba.de" />
            <button style={{ ...S.btn, ...S.btnPrimary }} onClick={importCSV} disabled={saving}>{saving ? "Importieren..." : "📋 Importieren"}</button>
          </div>
        </div>
      )}

      {tab === "liste" && (
        <div style={S.card}>
          <div style={{ marginBottom: 12 }}>
            <input
              style={{ ...S.input }}
              type="text"
              value={suche}
              onChange={e => setSuche(e.target.value)}
              placeholder="🔍 E-Mail suchen..."
            />
          </div>
          {loading ? (
            <p style={{ color: C.textLight, fontSize: 14 }}>Wird geladen...</p>
          ) : gefilterteWaehler.length === 0 ? (
            <p style={{ color: C.textLight, fontSize: 14 }}>{suche ? "Keine Ergebnisse." : "Noch keine Wähler angelegt."}</p>
          ) : (
            <table style={S.table}>
              <thead>
                <tr>
                  <th style={{ ...S.th, width: 40 }}>
                    <input type="checkbox" checked={alleAusgewaehlt} onChange={toggleAlle} />
                  </th>
                  <th style={S.th}>E-Mail</th>
                  <th style={S.th}>Token</th>
                  <th style={S.th}>Status</th>
                </tr>
              </thead>
              <tbody>
                {gefilterteWaehler.map(w => (
                  <tr key={w.id} style={{ background: ausgewaehlt.includes(w.id) ? "#f0f4ff" : "transparent" }}>
                    <td style={S.td}>
                      <input
                        type="checkbox"
                        checked={ausgewaehlt.includes(w.id)}
                        onChange={() => toggleAuswahl(w.id)}
                      />
                    </td>
                    <td style={S.td}>{w.email}</td>
                    <td style={{ ...S.td, fontFamily: "monospace", fontWeight: 700, letterSpacing: "0.1em" }}>
                      {w.tokenCode
                        ? <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={{ textDecoration: w.tokenAktiv === false ? "line-through" : "none", opacity: w.tokenAktiv === false ? 0.5 : 1 }}>
                              {w.tokenCode}
                            </span>
                            {w.tokenAktiv === false && (
                              <span style={{ ...S.badge, background: C.errorBg, color: C.error, border: `1px solid ${C.error}`, fontSize: 11 }}>
                                gesperrt
                              </span>
                            )}
                          </div>
                        : <span style={{ color: C.textLight }}>—</span>
                      }
                    </td>
                    <td style={S.td}>
                      <span style={{ ...S.badge, ...(w.status === "versendet" ? S.badgeGreen : w.status === "zugewiesen" ? S.badgeOrange : S.badgeGray) }}>
                        {w.status === "versendet" ? "✅ versendet" : w.status === "zugewiesen" ? "🔑 zugewiesen" : "📝 angelegt"}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          {hatAuswahl && (
            <div style={{ marginTop: 12, fontSize: 13, color: C.textLight }}>
              {ausgewaehlt.length} ausgewählt
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function LeitungErgebnisse({ appData, eventID, onDataChange, onSwitchTab }) {
  useEffect(() => {
    window._switchToWahlen = () => onSwitchTab && onSwitchTab("wahlen");
    return () => { window._switchToWahlen = null; };
  }, [onSwitchTab]);
  return (
    <ErgebnisDashboard
      appData={appData}
      wahllokalID={eventID}
      onBack={null}
      isLeitung={true}
      onDataChange={onDataChange}
    />
  );
}



function SuperadminView({ appData, onExit, onDataChange }) {
  const [tab, setTab] = useState("wahllokale");
  const [wahllokale, setWahllokale] = useState(null);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [fehler, setFehler] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [showPin, setShowPin] = useState({});
  const pinTimers = useRef({});

  function togglePin(id) {
    setShowPin(p => {
      const next = { ...p, [id]: !p[id] };
      if (next[id]) {
        if (pinTimers.current[id]) clearTimeout(pinTimers.current[id]);
        pinTimers.current[id] = setTimeout(() => {
          setShowPin(pp => ({ ...pp, [id]: false }));
        }, 5000);
      } else {
        if (pinTimers.current[id]) clearTimeout(pinTimers.current[id]);
      }
      return next;
    });
  }

  async function laden() {
    setLoading(true);
    try {
      const result = await callFlow("getAlle", {});
      setWahllokale(Array.isArray(result) ? result.map(mapWahllokal) : appData.wahllokale);
    } catch (e) { setFehler(e.message); }
    setLoading(false);
  }

  useEffect(() => { laden(); }, []);

  async function saveWahllokal(f) {
    setSaving(true); setFehler(null);
    try {
      await callFlow("saveWahllokal", {
        wahllokalID: f.id ? parseInt(f.id) : null,
        eventID: f.eventID,
        name: f.name,
        aktiv: f.aktiv !== false,
        leitungPIN: f.leitungPIN || "0000",
      });
      await laden();
      await onDataChange();
      setForm(null);
    } catch (e) { setFehler(e.message); }
    setSaving(false);
  }

  async function deleteWahllokal(wl) {
    if (!confirm(`Wahllokal "${wl.name}" wirklich löschen? Alle zugehörigen Daten bleiben in SharePoint erhalten.`)) return;
    setDeleting(wl.id);
    try {
      await callFlow("deleteWahllokal", { wahllokalID: parseInt(wl.id) });
      await laden();
      await onDataChange();
    } catch (e) { setFehler(e.message); }
    setDeleting(null);
  }

  const alleWahlen = appData.wahlen;
  const tabs = [
    { id: "wahllokale", label: "🏛️ Wahllokale" },
    { id: "wahlen", label: "📊 Alle Wahlen" },
    { id: "flows", label: "⚙️ Flows" },
  ];

  if (form !== null) return (
    <div style={{ maxWidth: 600, margin: "0 auto", padding: "20px 16px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={() => setForm(null)} style={{ ...S.btn, ...S.btnGhost }}>← Zurück</button>
        <h2 style={{ fontSize: 18, fontWeight: 800, color: C.primary }}>{form.id ? "Wahllokal bearbeiten" : "Neues Wahllokal"}</h2>
      </div>
      {fehler && <div style={{ ...S.errorBox, marginBottom: 16 }}>{fehler}</div>}
      <div style={S.card}>
        <div style={S.formGroup}>
          <label style={S.label}>Name</label>
          <input style={S.input} value={form.name || ""} onChange={e => setForm(x => ({ ...x, name: e.target.value }))} placeholder="z.B. Synode Ortenau" />
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>EventID</label>
          <input style={S.input} value={form.eventID || ""} onChange={e => setForm(x => ({ ...x, eventID: e.target.value.toUpperCase() }))} placeholder="z.B. SOR" maxLength={10} />
          <p style={{ fontSize: 12, color: C.textLight, marginTop: 4 }}>Kurzkürzel für dieses Wahllokal — wird in der URL verwendet.</p>
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>Wahlleitung-PIN</label>
          <div style={{ position: "relative" }}>
            <input style={{ ...S.input, paddingRight: 40 }} value={form.leitungPIN || ""} onChange={e => setForm(x => ({ ...x, leitungPIN: e.target.value }))} placeholder="4-stellige PIN" maxLength={8} type={showPin["form"] ? "text" : "password"} />
            <button onClick={() => togglePin("form")} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", fontSize: 16, color: C.textLight }}>{showPin["form"] ? "🙈" : "👁"}</button>
          </div>
        </div>
        <div style={S.formGroup}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 14 }}>
            <input type="checkbox" checked={form.aktiv !== false} onChange={e => setForm(x => ({ ...x, aktiv: e.target.checked }))} />
            Wahllokal aktiv
          </label>
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button style={{ ...S.btn, ...S.btnGhost }} onClick={() => setForm(null)}>Abbrechen</button>
          <button style={{ ...S.btn, ...S.btnPrimary }} onClick={() => saveWahllokal(form)} disabled={saving}>{saving ? "Speichern…" : "Speichern"}</button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth: 900, margin: "0 auto", padding: "20px 16px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.15em", color: C.superadmin, textTransform: "uppercase", marginBottom: 2 }}>Systemzugang</div>
          <h1 style={{ fontSize: 22, fontWeight: 900, color: C.primary, margin: 0 }}>Superadmin</h1>
        </div>
        <button onClick={onExit} style={{ ...S.btn, ...S.btnGhost }}>← Abmelden</button>
      </div>

      <div style={S.statGrid}>
        <StatCard num={wahllokale?.length ?? "—"} label="Wahllokale" color={C.superadmin} />
        <StatCard num={alleWahlen.length} label="Wahlen gesamt" color={C.primary} />
        <StatCard num={alleWahlen.filter(w => w.aktiv).length} label="Aktive Wahlen" color={C.success} />
        <StatCard num={alleWahlen.filter(w => w.geschlossen).length} label="Geschlossen" color={C.error} />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20, borderBottom: `2px solid ${C.border}`, paddingBottom: 0 }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            background: "none", border: "none", cursor: "pointer", padding: "10px 16px", fontSize: 14, fontWeight: 600,
            color: tab === t.id ? C.primary : C.textLight,
            borderBottom: tab === t.id ? `2px solid ${C.primary}` : "2px solid transparent",
            marginBottom: -2,
          }}>{t.label}</button>
        ))}
      </div>

      {fehler && <div style={{ ...S.errorBox, marginBottom: 16 }}>{fehler}</div>}

      {tab === "wahllokale" && (
        <div style={S.card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={S.sectionLabel}>Wahllokale</div>
            <button style={{ ...S.btn, ...S.btnPrimary, fontSize: 13 }} onClick={() => setForm({ name: "", eventID: "", leitungPIN: "", aktiv: true })}>+ Neues Wahllokal</button>
          </div>
          {loading && <p style={{ color: C.textLight, fontSize: 14 }}>Wird geladen…</p>}
          {!loading && wahllokale?.map(wl => {
            const wahlenDieses = alleWahlen.filter(w => w.eventID === wl.eventID);
            const isOpen = expanded === wl.id;
            return (
              <div key={wl.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0" }}>
                  <div style={{ cursor: "pointer", flex: 1 }} onClick={() => setExpanded(isOpen ? null : wl.id)}>
                    <div style={{ fontWeight: 700, fontSize: 15 }}>{wl.name}</div>
                    <div style={{ fontSize: 12, color: C.textLight, marginTop: 2, display: "flex", alignItems: "center", gap: 6 }}>
                      EventID: {wl.eventID} · {wahlenDieses.length} Wahlen · PIN:{" "}
                      <span style={{ fontFamily: "monospace", letterSpacing: 2 }}>{showPin[wl.id] ? wl.leitungPIN : "•".repeat((wl.leitungPIN || "").length)}</span>
                      <button onClick={e => { e.stopPropagation(); togglePin(wl.id); }} style={{ background: "none", border: "none", cursor: "pointer", color: C.textLight, fontSize: 13, padding: "0 2px" }}>{showPin[wl.id] ? "🙈" : "👁"}</button>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    {wl.aktiv ? <span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span> : <span style={{ ...S.badge, ...S.badgeGray }}>inaktiv</span>}
                    <button style={{ ...S.btn, ...S.btnGhost, fontSize: 12, padding: "5px 11px" }} onClick={() => setForm({ ...wl })}>Bearbeiten</button>
                    <button style={{ ...S.btn, fontSize: 12, padding: "5px 11px", background: "transparent", color: C.error, border: `1px solid ${C.error}` }} onClick={() => deleteWahllokal(wl)} disabled={deleting === wl.id}>{deleting === wl.id ? "…" : "Löschen"}</button>
                    <span style={{ color: C.textLight, cursor: "pointer", fontSize: 16 }} onClick={() => setExpanded(isOpen ? null : wl.id)}>{isOpen ? "▲" : "▼"}</span>
                  </div>
                </div>
                {isOpen && (
                  <div style={{ paddingLeft: 12, borderLeft: `3px solid ${C.border}`, marginBottom: 12 }}>
                    <div style={{ padding: "8px 0 12px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                      <span style={{ color: C.textLight }}>Wahlleitung-PIN:</span>
                      <span style={{ fontFamily: "monospace", fontWeight: 700, letterSpacing: 2 }}>{showPin[wl.id] ? wl.leitungPIN : "•".repeat((wl.leitungPIN || "").length)}</span>
                      <button onClick={() => togglePin(wl.id)} style={{ background: "none", border: "none", cursor: "pointer", color: C.textLight, fontSize: 13 }}>{showPin[wl.id] ? "🙈" : "👁"}</button>
                      {showPin[wl.id] && <span style={{ fontSize: 11, color: C.warning }}>wird in 5 Sek. versteckt</span>}
                    </div>
                    {wahlenDieses.length === 0
                      ? <p style={{ fontSize: 13, color: C.textLight, padding: "8px 0" }}>Keine Wahlen angelegt.</p>
                      : wahlenDieses.map(w => (
                        <div key={w.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${C.border}` }}>
                          <div>
                            <div style={{ fontWeight: 600, fontSize: 13 }}>{w.titel}</div>
                            <div style={{ fontSize: 11, color: C.textLight }}>{w.mehrfach ? `Mehrfach (max. ${w.maxAuswahl})` : "Einzelwahl"} · {w.optionen.length} Kandidaten</div>
                          </div>
                          {w.geschlossen ? <span style={{ ...S.badge, ...S.badgeRed }}>🔒 geschlossen</span>
                            : w.aktiv ? <span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>
                            : <span style={{ ...S.badge, ...S.badgeGray }}>pausiert</span>}
                        </div>
                      ))
                    }
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {tab === "wahlen" && (
        <div style={S.card}>
          <div style={S.sectionLabel}>Alle Wahlen</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th style={{ ...S.th, textAlign: "left" }}>Titel</th>
                <th style={{ ...S.th, textAlign: "left" }}>Wahllokal</th>
                <th style={{ ...S.th, textAlign: "left" }}>Typ</th>
                <th style={{ ...S.th, textAlign: "left" }}>Status</th>
              </tr>
            </thead>
            <tbody>
              {alleWahlen.length === 0
                ? <tr><td colSpan={4} style={{ ...S.td, color: C.textLight }}>Keine Wahlen vorhanden.</td></tr>
                : alleWahlen.map(w => {
                  const wl = appData.wahllokale.find(l => l.eventID === w.eventID);
                  return (
                    <tr key={w.id}>
                      <td style={{ ...S.td, fontWeight: 600 }}>{w.titel}</td>
                      <td style={{ ...S.td, color: C.textLight }}>{wl?.name || w.eventID}</td>
                      <td style={{ ...S.td, fontSize: 12 }}>{w.mehrfach ? `Mehrfach (max. ${w.maxAuswahl})` : "Einzelwahl"}</td>
                      <td style={S.td}>
                        {w.geschlossen ? <span style={{ ...S.badge, ...S.badgeRed }}>🔒 geschlossen</span>
                          : w.aktiv ? <span style={{ ...S.badge, ...S.badgeGreen }}>● aktiv</span>
                          : <span style={{ ...S.badge, ...S.badgeGray }}>pausiert</span>}
                      </td>
                    </tr>
                  );
                })
              }
            </tbody>
          </table>
        </div>
      )}

      {tab === "flows" && (
        <div style={S.card}>
          <div style={S.sectionLabel}>Flow-Konfiguration</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th style={{ ...S.th, textAlign: "left" }}>Flow</th>
                <th style={{ ...S.th, textAlign: "left" }}>Status</th>
              </tr>
            </thead>
            <tbody>
              {Object.entries(API.flows).map(([key, url]) => (
                <tr key={key}>
                  <td style={{ ...S.td, fontFamily: "monospace", fontSize: 13, fontWeight: 600 }}>{key}</td>
                  <td style={S.td}>
                    {url.startsWith("PLATZHALTER")
                      ? <span style={{ ...S.badge, ...S.badgeRed }}>⚠ nicht verbunden</span>
                      : <span style={{ ...S.badge, ...S.badgeGreen }}>✓ verbunden</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}


function ErgebnisDashboard({ appData, wahllokalID, onBack, isLeitung = false, onDataChange }) {
  const wahllokal = appData.wahllokale.find(w => w.eventID === wahllokalID);
  const [wahlenFrisch, setWahlenFrisch] = useState(null);
  const wahlen = wahlenFrisch || appData.wahlen.filter(w => w.eventID === wahllokalID);

  useEffect(() => {
    async function ladeWahlen() {
      try {
        const raw = await callFlow("getDaten", { eventID: wahllokalID });
        const optionen = (raw.optionen || []).map(mapOption);
        const w = (raw.wahlen || []).map(mapWahl);
        w.forEach(wahl => { wahl.optionen = optionen.filter(o => o.wahlID === wahl.id); });
        setWahlenFrisch(w);
      } catch (e) { console.error(e); }
    }
    ladeWahlen();
  }, [wahllokalID]);
  const [selectedWahlID, setSelectedWahlID] = useState(wahlen[0]?.id || "");
  const [ergebnisse, setErgebnisse] = useState(null);
  const [loading, setLoading] = useState(false);
  const [letzteAktualisierung, setLetzteAktualisierung] = useState(null);
  const [vollbild, setVollbild] = useState(false);
  const [ansichtModus, setAnsichtModus] = useState("einzeln"); // einzeln | alle

  // Gesamtzahl Tokens für Wahlbeteiligung
  const [tokenCount, setTokenCount] = useState(null);

  useEffect(() => {
    if (wahlen.length > 0 && !selectedWahlID) setSelectedWahlID(wahlen[0].id);
  }, [wahlen.length]);

  async function laden() {
    if (!selectedWahlID) return;
    setLoading(true);
    try {
      const result = await callFlow("getErgebnisse", { wahlID: parseInt(selectedWahlID), eventID: wahllokalID });
      setErgebnisse(Array.isArray(result) ? result : (result.value || result.abstimmungen || []));
      setLetzteAktualisierung(new Date());
    } catch (e) { console.error(e); }
    setLoading(false);
  }

  useEffect(() => { laden(); }, [selectedWahlID]);
  useEffect(() => {
    const t = setInterval(laden, 30000);
    return () => clearInterval(t);
  }, [selectedWahlID]);

  const wahl = wahlen.find(w => w.id === selectedWahlID);
  const total = ergebnisse?.length || 0;
  const maxAuswahl = wahl?.maxAuswahl || 1;
  const mehrheitsregel = typeof wahl?.mehrheitsregel === "object" ? (wahl?.mehrheitsregel?.Value || "relativ") : (wahl?.mehrheitsregel || "relativ");

  function berechneOptErgebnisse(wahlObj, ergebnisseArr) {
    return (wahlObj?.optionen.map(opt => ({
      ...opt,
      stimmen: (ergebnisseArr || []).filter(a => {
        try {
          const pos = JSON.parse(a.Positionen || a.positionen || "[]");
          return pos.some(p => String(p.optionID) === opt.id);
        } catch { return false; }
      }).length || 0,
    })).sort((a, b) => b.stimmen - a.stimmen)) || [];
  }

  const optErgebnisse = berechneOptErgebnisse(wahl, ergebnisse);
  const maxS = Math.max(...optErgebnisse.map(e => e.stimmen), 1);
  const nichtenthaltung = optErgebnisse.filter(e => !e.istEnthaltung);
  const gewinner = (nichtenthaltung || []).slice(0, maxAuswahl).filter(e => e.stimmen > 0);
  const fuehrend = (nichtenthaltung || [])[0];

  // Nur Gewinner anzeigen wenn Wahl geschlossen
  const wahlGeschlossen = wahl && (!wahl.aktiv || wahl.geschlossen);

  // Gleichstand-Erkennung
  const gewinnerSchwelle = gewinner.length > 0 ? gewinner[gewinner.length - 1].stimmen : 0;
  const gleichstandKandidaten = nichtenthaltung.filter(e => e.stimmen === gewinnerSchwelle && !gewinner.find(g => g.id === e.id));
  const hatGleichstand = gleichstandKandidaten.length > 0 && gewinnerSchwelle > 0;
  // Bei Gleichstand: letzten Gewinner-Platz entfernen da unklar wer dort hingehört
  const sichereGewinner = hatGleichstand ? gewinner.slice(0, -1) : gewinner;

  // Mehrheitsregel-Prüfung
  function pruefeMehrheit(stimmen) {
    if (total === 0) return true;
    const pct = stimmen / total;
    if (mehrheitsregel === "absolut") return pct > 0.5;
    if (mehrheitsregel === "zweidrittel") return pct >= 2/3;
    return true; // relativ — immer erfüllt
  }
  const mehrheitErreicht = gewinner.every(g => pruefeMehrheit(g.stimmen));
  const stichwahNötig = total > 0 && (!mehrheitErreicht || hatGleichstand);
  const stichwahSuchTitel = "Stichwahl: " + (wahl?.titel || "");
  const stichwahExistiert = !!wahlenFrisch && wahlen.some(w => w.titel === stichwahSuchTitel && w.id !== wahl?.id);

  const VB = vollbild;
  const col = (normal, vb) => VB ? vb : normal;

  const BalkenDiagramm = ({ opts, totalStimmen, maxStimmen, gross, gewinnerListe = [], gleichstandListe = [] }) => (
    <div style={{ display: "flex", flexDirection: "column", gap: gross ? 28 : 16 }}>
      {opts.map((e, idx) => {
        const istFuehrend = !e.istEnthaltung && totalStimmen > 0 && gewinnerListe.some(g => g.id === e.id);
        const istGleichstand = !istFuehrend && !e.istEnthaltung && gleichstandListe && gleichstandListe.some(g => g.id === e.id);
        const pct = totalStimmen > 0 ? Math.round(e.stimmen / totalStimmen * 100) : 0;
        return (
          <div key={e.id}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: gross ? 10 : 6, alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                {istFuehrend && <span style={{ fontSize: gross ? 28 : 18 }}>🏆</span>}
                <span style={{ fontWeight: istFuehrend ? 800 : 600, fontSize: gross ? 24 : 15, color: col(C.text, "#fff") }}>
                  {e.name}
                </span>
                {e.istEnthaltung && (
                  <span style={{ ...S.badge, background: "rgba(255,255,255,0.15)", color: col(C.textLight, "rgba(255,255,255,0.6)"), fontSize: 11 }}>Enthaltung</span>
                )}
              </div>
              <div style={{ textAlign: "right" }}>
                <span style={{ fontSize: gross ? 28 : 16, fontWeight: 800, color: col(C.primary, C.accent) }}>
                  {e.stimmen}
                </span>
                <span style={{ fontSize: gross ? 16 : 12, color: col(C.textLight, "rgba(255,255,255,0.6)"), marginLeft: 6 }}>
                  Stimme{e.stimmen !== 1 ? "n" : ""} ({pct}%)
                </span>
              </div>
            </div>
            <div style={{ background: col(C.border, "rgba(255,255,255,0.15)"), borderRadius: 8, height: gross ? 40 : 16, overflow: "hidden", position: "relative" }}>
              <div style={{
                height: "100%",
                width: `${totalStimmen > 0 ? (e.stimmen / maxStimmen) * 100 : 0}%`,
                background: e.istEnthaltung ? col(C.textLight, "rgba(255,255,255,0.3)") : (istFuehrend ? col(C.accent, "#4ade80") : (istGleichstand ? col("#f59e0b", "#fbbf24") : col(C.primaryLight, C.accent))),
                borderRadius: 8,
                transition: "width 1s ease",
                minWidth: e.stimmen > 0 ? 8 : 0,
              }} />
            </div>
          </div>
        );
      })}
    </div>
  );

  const containerStyle = VB ? {
    position: "fixed", inset: 0, background: C.primary, zIndex: 9999,
    display: "flex", flexDirection: "column", padding: "40px 56px", overflow: "auto"
  } : { minHeight: "100vh", background: C.bg, padding: 24 };

  return (
    <div style={containerStyle}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: VB ? 40 : 24 }}>
        <div>
          {!VB && onBack && <button onClick={onBack} style={{ ...S.btn, ...S.btnGhost, fontSize: 12, marginBottom: 12 }}>← Zurück zum Wahllokal</button>}
          <div style={{ fontSize: VB ? 14 : 12, fontWeight: 700, letterSpacing: "0.15em", textTransform: "uppercase", color: col(C.textLight, "rgba(255,255,255,0.5)"), marginBottom: 6 }}>
            Evangelische Landeskirche in Baden
          </div>
          <h1 style={{ fontSize: VB ? 36 : 24, fontWeight: 900, color: col(C.primary, "#fff"), margin: 0, letterSpacing: VB ? "-0.02em" : 0 }}>
            {wahllokal?.name || wahllokalID}
          </h1>
          <div style={{ fontSize: VB ? 18 : 14, color: col(C.textLight, "rgba(255,255,255,0.6)"), marginTop: 4 }}>
            Wahlergebnisse
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
          <button style={{ ...S.btn, fontSize: 12, ...(VB ? { background: "rgba(255,255,255,0.15)", color: "#fff", border: "none" } : S.btnGhost) }} onClick={laden} disabled={loading}>
            {loading ? "…" : "🔄"}
          </button>
          <button style={{ ...S.btn, fontSize: 12, ...(VB ? { background: "rgba(255,255,255,0.15)", color: "#fff", border: "none" } : S.btnPrimary) }} onClick={() => setVollbild(!VB)}>
            {VB ? "✕ Beenden" : "⛶ Vollbild"}
          </button>
        </div>
      </div>

      {/* Wahl auswählen */}
      {wahlen.length > 1 && !VB && (
        <div style={{ marginBottom: 20 }}>
          <select style={{ ...S.select, maxWidth: 400 }} value={selectedWahlID} onChange={e => setSelectedWahlID(e.target.value)}>
            {wahlen.map(w => <option key={w.id} value={w.id}>{w.titel}</option>)}
          </select>
        </div>
      )}

      {wahlen.length > 1 && VB && (
        <div style={{ display: "flex", gap: 12, marginBottom: 32, flexWrap: "wrap" }}>
          {wahlen.map(w => (
            <button key={w.id} onClick={() => setSelectedWahlID(w.id)} style={{
              padding: "8px 20px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 14, fontWeight: 600,
              background: w.id === selectedWahlID ? C.accent : "rgba(255,255,255,0.15)",
              color: "#fff"
            }}>{w.titel}</button>
          ))}
        </div>
      )}

      {wahl && ergebnisse !== null && (
        <>
          {/* Wahl-Titel + Statistik */}
          <div style={{ marginBottom: VB ? 40 : 24 }}>
            <div style={{ fontSize: VB ? 28 : 18, fontWeight: 800, color: col(C.primary, "#fff"), marginBottom: VB ? 20 : 12 }}>
              {wahl.titel}
            </div>
            <div style={{ display: "flex", gap: VB ? 48 : 24, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <div style={{ fontSize: VB ? 64 : 40, fontWeight: 900, color: col(C.primary, C.accent), lineHeight: 1 }}>{total}</div>
                <div style={{ fontSize: VB ? 16 : 13, color: col(C.textLight, "rgba(255,255,255,0.6)"), marginTop: 4 }}>
                  {maxAuswahl > 1 ? `Wähler (je ${maxAuswahl} Stimmen)` : `Stimme${total !== 1 ? "n" : ""} abgegeben`}
                </div>
              </div>
              {total > 0 && (
                <div style={{ paddingBottom: VB ? 12 : 6 }}>
                  {wahlGeschlossen && sichereGewinner.length > 0 && !hatGleichstand && (
                    <>
                      <div style={{ fontSize: VB ? 14 : 12, color: col(C.textLight, "rgba(255,255,255,0.5)"), marginBottom: 4 }}>
                        {maxAuswahl > 1 ? `Gewählt (Top ${maxAuswahl})` : "Führend"}
                      </div>
                      {sichereGewinner.map(g => (
                        <div key={g.id} style={{ fontSize: VB ? 20 : 14, fontWeight: 800, color: col(C.text, "#fff"), marginBottom: 2 }}>
                          🏆 {g.name} · {Math.round(g.stimmen / total * 100)}%
                        </div>
                      ))}
                    </>
                  )}
                  {wahlGeschlossen && hatGleichstand && (
                    <div style={{ fontSize: VB ? 16 : 13, fontWeight: 700, color: col("#f59e0b", "#fbbf24") }}>
                      ⚠️ Gleichstand ({gewinnerSchwelle} {gewinnerSchwelle === 1 ? "Stimme" : "Stimmen"}) — Stichwahl erforderlich
                    </div>
                  )}
                  {!wahlGeschlossen && (
                    <div style={{ fontSize: VB ? 16 : 13, fontWeight: 600, color: col(C.accent, "#4ade80") }}>
                      ● Abstimmung läuft
                    </div>
                  )}
                </div>
              )}
              {letzteAktualisierung && (
                <div style={{ paddingBottom: VB ? 12 : 6, marginLeft: "auto" }}>
                  <div style={{ fontSize: 12, color: col(C.textLight, "rgba(255,255,255,0.4)") }}>
                    Letzte Aktualisierung: {letzteAktualisierung.toLocaleTimeString("de-DE")}
                  </div>
                  <div style={{ fontSize: 11, color: col(C.textLight, "rgba(255,255,255,0.3)") }}>
                    Auto-Refresh alle 30 Sekunden
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Balkendiagramm */}
          <BalkenDiagramm opts={optErgebnisse} totalStimmen={total} maxStimmen={maxS} gross={VB} gewinnerListe={wahlGeschlossen ? sichereGewinner : []} gleichstandListe={wahlGeschlossen && hatGleichstand ? [...gleichstandKandidaten, ...(gewinner.slice(-1))] : []} />

          {wahlGeschlossen && stichwahNötig && !VB && (
            <div style={{ marginTop: 24, padding: 16, borderRadius: 10, background: stichwahExistiert ? "#f0fdf4" : "#fff8e1", border: `1px solid ${stichwahExistiert ? "#22c55e" : "#f59e0b"}` }}>
              {stichwahExistiert ? (
                <p style={{ fontWeight: 700, color: "#166534" }}>
                  ✅ Stichwahl wurde bereits angelegt: "{stichwahSuchTitel}"
                </p>
              ) : (
                <>
                  {hatGleichstand && (
                    <p style={{ fontWeight: 700, color: "#92400e", marginBottom: 8 }}>
                      ⚠️ Gleichstand: {[...gleichstandKandidaten, ...gewinner.slice(-1)].map(k => k.name).join(", ")} sind gleichauf mit je {gewinnerSchwelle} {gewinnerSchwelle === 1 ? "Stimme" : "Stimmen"}.
                    </p>
                  )}
                  {!mehrheitErreicht && !hatGleichstand && (
                    <p style={{ fontWeight: 700, color: "#92400e", marginBottom: 8 }}>
                      ⚠️ {mehrheitsregel === "absolut" ? "Absolute Mehrheit (>50%)" : "2/3-Mehrheit (≥66,7%)"} nicht erreicht.
                    </p>
                  )}
                  <p style={{ fontSize: 13, color: "#78350f", marginBottom: 12 }}>Eine Stichwahl ist erforderlich.</p>
                  {!wahlenFrisch && <p style={{ fontSize: 12, color: C.textLight }}>Prüfe ob Stichwahl bereits existiert…</p>}
                  {wahlenFrisch && (
                    <button
                      style={{ ...S.btn, ...S.btnPrimary, fontSize: 13 }}
                      onClick={() => {
                        const stichwahKandidaten = hatGleichstand
                          ? [...gleichstandKandidaten, ...gewinner.slice(-1)]
                          : sichereGewinner;
                        if (isLeitung && onDataChange) {
                          const stichwahl = {
                            id: null,
                            titel: "Stichwahl: " + (wahl?.titel || ""),
                            startzeit: "",
                            mehrfach: false,
                            exakt: false,
                            maxAuswahl: 1,
                            mehrheitsregel: wahl?.mehrheitsregel || "relativ",
                            optionen: stichwahKandidaten.map((k, idx) => ({ id: String(Date.now() + idx), name: k.name, istEnthaltung: false })),
                            eventID: wahllokalID,
                            hatStimmen: false,
                          };
                          window._stichwahl = stichwahl;
                          window._switchToWahlen && window._switchToWahlen();
                        } else {
                          alert("Stichwahl erforderlich zwischen:\n" + stichwahKandidaten.map(k => "• " + k.name).join("\n") + "\n\nBitte wende dich an die Wahlleitung.");
                        }
                      }}
                    >
                      🗳️ Stichwahl vorbereiten
                    </button>
                  )}
                </>
              )}
            </div>
          )}
        </>
      )}

      {ergebnisse === null && (
        <div style={{ textAlign: "center", padding: 48, color: col(C.textLight, "rgba(255,255,255,0.5)") }}>
          Wird geladen…
        </div>
      )}
      {ergebnisse !== null && total === 0 && (
        <div style={{ textAlign: "center", padding: 48, color: col(C.textLight, "rgba(255,255,255,0.5)") }}>
          Noch keine Stimmen abgegeben.
        </div>
      )}
    </div>
  );
}

function WahlForm({ form, onSave, onCancel, saving, fehler }) {
  const [f, setF] = useState(form);
  function setField(key, val) { setF(x => ({ ...x, [key]: val })); }
  function addOption() { setF(x => ({ ...x, optionen: [...x.optionen.filter(o => !o.istEnthaltung), { id: Date.now().toString(), name: "", istEnthaltung: false }, ...x.optionen.filter(o => o.istEnthaltung)] })); }
  function setOptName(id, name) { setF(x => ({ ...x, optionen: x.optionen.map(o => o.id === id ? { ...o, name } : o) })); }
  function removeOpt(id) { setF(x => ({ ...x, optionen: x.optionen.filter(o => o.id !== id) })); }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button style={{ ...S.btn, ...S.btnGhost }} onClick={onCancel}>← Zurück</button>
        <h3 style={{ margin: 0, color: C.primary }}>{f.isNew ? "Neue Wahl" : "Wahl bearbeiten"}</h3>
      </div>
      {fehler && <div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      <div style={S.card}>
        <div style={S.formGroup}><label style={S.label}>Titel</label><input style={S.input} value={f.titel} onChange={e => setField("titel", e.target.value)} placeholder="z.B. Diakoniepfarrer*in" /></div>
        <div style={S.formGroup}><label style={S.label}>Startzeit</label><input style={S.input} type="datetime-local" value={f.startzeit?.slice(0, 16)} onChange={e => setField("startzeit", e.target.value)} /></div>
        <div style={{ display: "flex", gap: 16, marginBottom: 16, flexWrap: "wrap", opacity: f.hatStimmen ? 0.5 : 1, pointerEvents: f.hatStimmen ? "none" : "auto" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: f.hatStimmen ? "not-allowed" : "pointer", fontSize: 14 }}>
            <input type="checkbox" checked={f.mehrfach} disabled={!!f.hatStimmen} onChange={e => setField("mehrfach", e.target.checked)} />Mehrfachauswahl
          </label>
          {f.mehrfach && <>
            <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: f.hatStimmen ? "not-allowed" : "pointer", fontSize: 14 }}>
              <input type="checkbox" checked={f.exakt} disabled={!!f.hatStimmen} onChange={e => setField("exakt", e.target.checked)} />Exakte Anzahl
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14 }}>
              Max: <input style={{ ...S.input, width: 60 }} type="number" min={1} value={f.maxAuswahl} disabled={!!f.hatStimmen} onChange={e => setField("maxAuswahl", parseInt(e.target.value))} />
            </label>
          </>}
        </div>
        <div style={S.formGroup}>
          <label style={S.label}>Kandidaten</label>
          {f.hatStimmen && (
            <div style={{ ...S.alert, ...S.alertWarning, marginBottom: 12 }}>
              ⚠️ Für diese Wahl wurden bereits Stimmen abgegeben. Kandidaten und Wahltyp können nicht mehr geändert werden.
            </div>
          )}
          {f.optionen.filter(o => !o.istEnthaltung).map((o, idx, arr) => (
            <div key={o.id} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <input
                style={{ ...S.input, flex: 1, ...(f.hatStimmen ? { background: "#f5f5f5", color: "#999" } : {}) }}
                value={o.name}
                onChange={e => !f.hatStimmen && setOptName(o.id, e.target.value)}
                placeholder="Name"
                readOnly={f.hatStimmen}
                autoFocus={!f.hatStimmen && idx === arr.length - 1 && o.name === ""}
                onKeyDown={e => {
                  if (e.key === "Enter" && !f.hatStimmen) {
                    e.preventDefault();
                    addOption();
                  }
                }}
              />
              {!f.hatStimmen && <button style={{ ...S.btn, ...S.btnDanger }} onClick={() => removeOpt(o.id)}>✕</button>}
            </div>
          ))}
          {!f.hatStimmen && <button style={{ ...S.btn, ...S.btnGhost, marginTop: 4 }} onClick={addOption}>+ Kandidat hinzufügen</button>}
        </div>
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 14 }}>
            <input
              type="checkbox"
              checked={f.optionen.some(o => o.istEnthaltung)}
              onChange={e => {
                if (e.target.checked) {
                  setF(x => ({ ...x, optionen: [...x.optionen.filter(o => !o.istEnthaltung), { id: "enthaltung", name: "Enthaltung", istEnthaltung: true }] }));
                } else {
                  setF(x => ({ ...x, optionen: x.optionen.filter(o => !o.istEnthaltung) }));
                }
              }}
            />
            Enthaltung als Option anbieten
          </label>
        </div>
        <div style={S.formGroup}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <label style={S.label}>Mehrheitsregel</label>
            <div style={{ position: "relative", display: "inline-block" }} title="Legt fest welche Mehrheit ein Kandidat für einen gültigen Wahlausgang benötigt.&#10;&#10;Relative Mehrheit: Meiste Stimmen gewinnt (Standard).&#10;Absolute Mehrheit: Mehr als 50% aller Stimmen nötig.&#10;2/3-Mehrheit: Mindestens 66,7% aller Stimmen nötig.&#10;&#10;Wird die Mehrheit nicht erreicht, schlägt die App eine Stichwahl vor.">
              <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 18, height: 18, borderRadius: "50%", background: C.border, color: C.textLight, fontSize: 11, fontWeight: 700, cursor: "help" }}>?</span>
            </div>
          </div>
          <select
            style={{ ...S.select }}
            value={f.mehrheitsregel || "relativ"}
            onChange={e => setF(x => ({ ...x, mehrheitsregel: e.target.value }))}
            disabled={!!f.hatStimmen}
          >
            <option value="relativ">Relative Mehrheit — meiste Stimmen gewinnt</option>
            <option value="absolut">Absolute Mehrheit — mehr als 50% nötig</option>
            <option value="zweidrittel">2/3-Mehrheit — mindestens 66,7% nötig</option>
          </select>
          {f.hatStimmen && <p style={{ fontSize: 12, color: C.textLight, marginTop: 4 }}>Kann nach Stimmabgabe nicht mehr geändert werden.</p>}
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button style={{ ...S.btn, ...S.btnGhost }} onClick={onCancel}>Abbrechen</button>
          <button style={{ ...S.btn, ...S.btnPrimary }} onClick={() => onSave(f)} disabled={saving}>{saving ? "Speichern…" : "Speichern"}</button>
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
