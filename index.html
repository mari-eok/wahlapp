function LeitungWahlen({ appData, eventID, onDataChange, initialStichwahl, onStichwahl, onErgebnisse, isMobile=false }) {
  const [form, setForm] = useState(null); const [saving, setSaving] = useState(false); const [fehler, setFehler] = useState(null);
  const { confirm, dialog } = useConfirm();
  // Alle Wahlen — aktive, geschlossene und archivierte
  const alleWahlen = appData.wahlen.filter(w=>w.eventID===eventID);
  const wahlen = alleWahlen.filter(w=>!w.archiviert); // aktiv + geschlossen (nicht archiviert)
  const archiviertWahlen = alleWahlen.filter(w=>w.archiviert);
  useEffect(()=>{
    if(initialStichwahl){
      // Stichwahl braucht trotzdem eine Startzeit, weil SharePoint die Spalte Startzeit erwartet.
      // Die Wahl bleibt nach dem Speichern pausiert und wird erst über den Starten-Button freigegeben.
      setForm({
        ...initialStichwahl,
        aktiv:false,
        geschlossen:false,
        startzeit: initialStichwahl.startzeit || naechsteViertelStunde(),
        hatEndzeit: !!initialStichwahl.endzeit,
        endzeit: initialStichwahl.endzeit || ""
      });
      if(onStichwahl) onStichwahl();
    }
  },[]);
  async function openForm(wahl) {
    let hatStimmen = false;
    try { const r=await callFlow("getErgebnisse",{ wahlID:parseInt(wahl.id), eventID }); hatStimmen=(Array.isArray(r)?r.length:(r.value?.length||0))>0; } catch(e) {}
    const endzeitLocal = wahl.endzeit ? toLocalInputValue(parseSharePointDate(wahl.endzeit)) : "";
    setForm({ ...wahl, optionen:[...wahl.optionen], hatStimmen, hatEndzeit: !!wahl.endzeit, endzeit: endzeitLocal });
  }
  async function toggleAktiv(wahl) { try{ await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:!wahl.aktiv, geschlossen:false }); onDataChange(); }catch(e){ setFehler(e.message); } }
  async function pauseWahl(wahl) { const ok = await confirm({ titel:"Wahl pausieren", nachricht:`Wahl "${wahl.titel}" pausieren?

Die Abstimmung wird unterbrochen — Stimmberechtigte können keine Stimmen mehr abgeben.`, bestaetigen:"Pausieren", typ:"warn" }); if(!ok) return; try{ await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:false, geschlossen:false }); onDataChange(); }catch(e){ setFehler(e.message); } }
  async function starteWahl(wahl) { try{ await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:true, geschlossen:false }); onDataChange(); }catch(e){ setFehler(e.message); } }
  async function deleteWahl(wahl) {
    // Erst prüfen ob Stimmen vorhanden
    let stimmenAnzahl = 0;
    try {
      const r = await callFlow("getErgebnisse", { wahlID:parseInt(wahl.id), eventID });
      stimmenAnzahl = Array.isArray(r) ? r.length : (r.value?.length||0);
    } catch(e) {}

    let msg = `Wahl "${wahl.titel}" wirklich löschen?`;
    if (stimmenAnzahl > 0) {
      msg += `

⚠️ ACHTUNG: Es wurden bereits ${stimmenAnzahl} Stimme${stimmenAnzahl!==1?"n":""} abgegeben.

Diese Stimmen werden zusammen mit der Wahl unwiderruflich gelöscht.

Nur fortfahren wenn dies eine Testwahl war oder das Löschen bewusst gewünscht ist.`;
    }
    msg += "\n\nWirklich löschen?";

    const ok = await confirm({ titel:"Wahl löschen", nachricht:msg, bestaetigen:"Löschen", abbrechen:"Abbrechen", typ:"danger" });
    if (!ok) return;
    // Bei Stimmen zweite Bestätigung
    if (stimmenAnzahl > 0) {
      const ok2 = await confirm({ titel:"Letzte Bestätigung", nachricht:`${stimmenAnzahl} Stimme${stimmenAnzahl!==1?"n":""} werden unwiderruflich gelöscht. Wirklich fortfahren?`, bestaetigen:"Endgültig löschen", typ:"danger" });
      if (!ok2) return;
    }

    try {
      await callFlow("deleteWahl", { wahlID:parseInt(wahl.id) });
      await onDataChange();
    } catch(e) { setFehler(e.message); }
  }
  async function schliesseWahl(wahl) {
    const ok = await confirm({ titel:"Wahl schließen", nachricht:`Wahl "${wahl.titel}" endgültig schließen?\n\nNach dem Schließen können keine weiteren Stimmen abgegeben werden.`, bestaetigen:"Schließen", typ:"warn" });
    if (!ok) return;
    try { await callFlow("toggleWahl",{ wahlID:parseInt(wahl.id), aktiv:false, geschlossen:true }); await onDataChange(); } catch(e){ setFehler(e.message); }
  }
  async function archiviereWahl(wahl) {
    const ok = await confirm({ titel:"Wahl archivieren", nachricht:`Wahl "${wahl.titel}" archivieren?

Archivierte Wahlen sind schreibgeschützt und werden separat angezeigt.`, bestaetigen:"Archivieren", typ:"warn" });
    if (!ok) return;
    try { await callFlow("saveWahl",{ wahlID:parseInt(wahl.id), eventID, titel:wahl.titel, aktiv:false, startzeit:wahl.startzeit, mehrfach:wahl.mehrfach, exakt:wahl.exakt, maxAuswahl:wahl.maxAuswahl, mehrheitsregel:wahl.mehrheitsregel||"relativ", geschlossen:true, archiviert:true, optionen:wahl.optionen.map(o=>({ id:o.id&&!isNaN(parseInt(o.id))?String(parseInt(o.id)):null, name:o.name, istEnthaltung:o.istEnthaltung, hatStimmen:true })) }); await onDataChange(); }catch(e){ setFehler(e.message); }
  }
  async function saveWahl(f) {
    setSaving(true); setFehler(null);
    try {
      if (!f.startzeit) {
        setFehler("Bitte eine Startzeit setzen. Die Wahl bleibt trotzdem bis zur Freigabe pausiert.");
        setSaving(false);
        return;
      }
      let startzeitISO = f.startzeit;
      if (startzeitISO && !startzeitISO.includes("Z") && !startzeitISO.includes("+")) {
        const parsedStart = parseLocalDatetime(startzeitISO);
        if (!parsedStart || isNaN(parsedStart.getTime())) {
          setFehler("Die Startzeit ist ungültig. Bitte erneut setzen.");
          setSaving(false);
          return;
        }
        startzeitISO = parsedStart.toISOString();
      }
      await callFlow("saveWahl",{
        wahlID: (!f.id||f.isNew) ? null : parseInt(f.id),
        eventID,
        titel: f.titel,
        aktiv: f.aktiv||false,
        startzeit: startzeitISO,
        mehrfach: f.mehrfach,
        exakt: f.exakt,
        maxAuswahl: f.maxAuswahl,
        mehrheitsregel: (typeof f.mehrheitsregel==="object" ? f.mehrheitsregel?.Value : f.mehrheitsregel)||"relativ",
        geschlossen: f.geschlossen||false,
        archiviert: f.archiviert||false,
        endzeit: (f.hatEndzeit&&f.endzeit) ? parseLocalDatetime(f.endzeit).toISOString() : null,
        optionen: f.optionen.map(o => ({
          id: o.id && !isNaN(parseInt(o.id)) ? String(parseInt(o.id)) : null,
          name: o.name,
          istEnthaltung: o.istEnthaltung,
          hatStimmen: !!f.hatStimmen
        }))
      });
      await onDataChange(); setForm(null);
    }catch(e){ setFehler(e.message); }
    setSaving(false);
  }
  if (form) return <WahlForm form={form} onSave={saveWahl} onCancel={()=>setForm(null)} saving={saving} fehler={fehler}/>;
  // Wiederverwendbare Aktionsbuttons für eine Wahl
  function WahlAktionen({ w, size=12 }) {
    const p = `5px ${size>12?"14px":"11px"}`;
    return (
      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
        {!w.geschlossen&&<button style={{ ...S.btn, ...S.btnGhost, fontSize:size, padding:p }} onClick={()=>openForm(w)}><i className="ti ti-edit" aria-hidden="true"/> Bearbeiten</button>}
        {!w.geschlossen&&w.aktiv&&<button style={{ ...S.btn, ...S.btnWarning, fontSize:size, padding:p }} onClick={()=>pauseWahl&&pauseWahl(w)}><i className="ti ti-player-pause" aria-hidden="true"/> Pause</button>}
        {!w.geschlossen&&!w.aktiv&&<button style={{ ...S.btn, ...S.btnPrimary, fontSize:size, padding:p }} onClick={()=>starteWahl&&starteWahl(w)}><i className="ti ti-player-play" aria-hidden="true"/> Starten</button>}
        {!w.geschlossen&&w.aktiv&&<button style={{ ...S.btn, ...S.btnDanger, fontSize:size, padding:p }} onClick={()=>schliesseWahl(w)}><i className="ti ti-lock" aria-hidden="true"/> Schließen</button>}
        {w.geschlossen&&<button style={{ ...S.btn, ...S.btnPrimary, fontSize:size, padding:p }} onClick={()=>onErgebnisse&&onErgebnisse(w.id)}><i className="ti ti-chart-bar" aria-hidden="true"/> Ergebnisse</button>}
        {w.geschlossen&&<button style={{ ...S.btn, ...S.btnGhost, fontSize:size, padding:p }} onClick={()=>archiviereWahl(w)}><i className="ti ti-archive" aria-hidden="true"/> Archivieren</button>}
        <button style={{ ...S.btn, ...S.btnGhostDanger, fontSize:size, padding:p }} onClick={()=>deleteWahl(w)}><i className="ti ti-trash" aria-hidden="true"/> Löschen</button>
      </div>
    );
  }

  return (
    <div>
      {dialog}
      {fehler&&<div style={{ ...S.alert, ...S.alertError }}>{fehler}</div>}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}>
        <h3 style={{ margin:0, color:C.primary }}>Wahlen</h3>
        <button style={{ ...S.btn, ...S.btnPrimary }} onClick={()=>setForm({ id:Date.now().toString(), eventID, titel:"", aktiv:false, startzeit:naechsteHalbeStunde(), hatEndzeit:false, endzeit:"", mehrfach:false, exakt:false, maxAuswahl:1, mehrheitsregel:"absolut", optionen:[{ id:null, _tempKey:"tmp_1", name:"", istEnthaltung:false },{ id:null, _tempKey:"tmp_enth", name:"Enthaltung", istEnthaltung:true }], isNew:true })}>+ Neue Wahl</button>
      </div>

      {/* Aktive & geschlossene Wahlen */}
      <div style={S.card}>
        {wahlen.length===0 ? <p style={{ color:C.textLight, fontSize:14 }}>Noch keine Wahlen angelegt.</p> :
          isMobile ? (
            /* Mobile: Karten-Layout statt Tabelle */
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {wahlen.map(w=>{
                const st = getWahlZeitStatus(w, new Date());
                return (
                  <div key={w.id} style={{ borderRadius:10, border:`1px solid ${C.border}`, padding:14, opacity:w.geschlossen?0.85:1, background:C.bgWhite }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8, gap:8 }}>
                      <div style={{ fontWeight:700, fontSize:15, color:C.text, flex:1 }}>{w.titel}</div>
                      <span style={{ ...S.badge, ...st.badge, flexShrink:0 }}>{st.label}</span>
                    </div>
                    <div style={{ fontSize:12, color:C.textLight, marginBottom:10 }}>
                      {w.mehrfach?`Mehrfach (max. ${w.maxAuswahl})`:"Einzelwahl"} · {w.optionen.length} Optionen
                      <br/>Start: {formatDatum(w.startzeit)}{w.endzeit?` · Ende: ${formatDatum(w.endzeit)}`:""}
                    </div>
                    <WahlAktionen w={w} size={13}/>
                  </div>
                );
              })}
            </div>
          ) : (
            /* Desktop: Tabelle */
            <table style={S.table}><thead><tr><th style={S.th}>Titel</th><th style={S.th}>Typ</th><th style={S.th}>Status</th><th style={S.th}>Aktionen</th></tr></thead>
            <tbody>{wahlen.map(w=>(
              <tr key={w.id} style={{ opacity:w.geschlossen?0.85:1 }}>
                <td style={S.td}><strong>{w.titel}</strong></td>
                <td style={{ ...S.td, fontSize:12, color:C.textLight }}>
                  {w.mehrfach?`Mehrfach (${w.maxAuswahl})`:"Einzel"} · {w.optionen.length} Opt.
                  <div style={{ marginTop:3 }}>Start: {formatDatum(w.startzeit)}{w.endzeit ? ` · Ende: ${formatDatum(w.endzeit)}` : ""}</div>
                </td>
                <td style={S.td}>
                  {(()=>{ const st = getWahlZeitStatus(w, new Date()); return (
                    <>
                      <span style={{ ...S.badge, ...st.badge }}>{st.icon} {st.label}</span>
                      {st.hint&&<div style={{ marginTop:6, fontSize:12, color:C.textLight, lineHeight:1.4 }}>{st.hint}</div>}
                    </>
                  ); })()}
                </td>
                <td style={S.td}><WahlAktionen w={w}/></td>
              </tr>
            ))}</tbody></table>
          )
        }
      </div>

      {/* Archiv */}
      {archiviertWahlen.length>0&&(
        <ArchivWahlen wahlen={archiviertWahlen} onDelete={deleteWahl}/>
      )}
    </div>
  );
}

function ArchivWahlen({ wahlen, onDelete }) {
  const [zeig,setZeig]=useState(false);
  return (
    <div style={S.card}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:zeig?12:0 }}>
        <div style={S.sectionLabel}><i className="ti ti-archive" aria-hidden="true"/> Archiv ({wahlen.length} archivierte {wahlen.length===1?"Wahl":"Wahlen"})</div>
        <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={()=>setZeig(!zeig)}>{zeig?"Ausblenden":"Anzeigen"}</button>
      </div>
      {zeig&&(<table style={S.table}><thead><tr><th style={S.th}>Titel</th><th style={S.th}>Typ</th><th style={S.th}>Status</th><th style={S.th}>Aktionen</th></tr></thead>
        <tbody>{wahlen.map(w=>(<tr key={w.id} style={{ opacity:0.6 }}>
          <td style={S.td}><strong>{w.titel}</strong></td>
          <td style={{ ...S.td, fontSize:12, color:C.textLight }}>{w.mehrfach?`Mehrfach (${w.maxAuswahl})`:"Einzel"} · {w.optionen.length} Opt.</td>
          <td style={S.td}><span style={{ ...S.badge, background:"#e2e8f0", color:"#475569" }}><i className="ti ti-archive" aria-hidden="true"/> archiviert</span></td>
          <td style={S.td}><button style={{ ...S.btn, ...S.btnGhostDanger, fontSize:12, padding:"5px 11px" }} onClick={()=>onDelete(w)}><i className="ti ti-trash" aria-hidden="true"/> Löschen</button></td>
        </tr>))}</tbody>
      </table>)}
    </div>
  );
}

// FIX: OfflineTokenListe liest tokenList aus getDaten und mappt korrekt via mapToken
function OfflineTokenListe({ eventID, reloadTrigger, wahllokalName, isMobile=false, filterTyp=null, filterGueltigAm=null }) {
  const [mitQR, setMitQR] = useState(false);
  const [letzterKontrollcode, setLetzterKontrollcode] = useState(null);
  const [tokens, setTokens] = useState([]); const [loading, setLoading] = useState(true); const [suche, setSuche] = useState(""); const [toggling, setToggling] = useState(null); const [fehler, setFehler] = useState(null);
  const [erfolg, setErfolg] = useState(null); const [ausgewaehlt, setAusgewaehlt] = useState([]); const [loesching, setLoesching] = useState(false);
  const { confirm, dialog } = useConfirm();
  const deleteVerfuegbar = !API.flows.deleteToken.startsWith("PLATZHALTER");
  async function laden() {
    setLoading(true);
    try {
      const result = await callFlow("getDaten",{ eventID });
      const allRaw = result.tokenList||[];
      let rawTokens = filterTyp ? allRaw.filter(t=>(t.TokenTyp||t.tokenTyp||"offline")===filterTyp) : allRaw;
      if (filterGueltigAm) rawTokens = rawTokens.filter(t=>t.GueltigAm?.slice(0,10)===filterGueltigAm||t.gueltigAm===filterGueltigAm);
      // Sortierung: neu → alt
      const mapped = rawTokens.map(mapToken).sort((a,b)=>{
        const da = a.erstellt ? new Date(a.erstellt) : new Date(0);
        const db = b.erstellt ? new Date(b.erstellt) : new Date(0);
        return db - da;
      });
      setTokens(mapped);
      if (rawTokens.length===0 && (result.tokenCount||0)>0) setFehler("Wahlcode-Liste fehlt im Flow-Antwort-Body.");
      else setFehler(null);
    }catch(e){ setFehler(e.message); }
    setLoading(false);
  }
  useEffect(()=>{ laden(); },[eventID, reloadTrigger]);
  async function toggleToken(token) {
    const aktiv = !token.aktiv;
    setToggling(token.id);
    try { await callFlow("deactivateToken",{ eventID, tokenCodes:[token.code], waehlerIDs:[], aktiv }); await laden(); }catch(e){ setFehler(e.message); }
    setToggling(null);
  }
  async function loescheAusgewaehlt() {
    const zu = tokens.filter(t=>ausgewaehlt.includes(t.id));
    if(zu.length===0) return;
    const ok = await confirm({ titel:`${zu.length} Wahlcode(s) löschen`, nachricht:`${zu.length} Wahlcode(s) wirklich unwiderruflich löschen?`, bestaetigen:`${zu.length} Wahlcode(s) löschen`, typ:"danger" }); if(!ok) return;
    setLoesching(true); setFehler(null);
    try { await callFlow("deleteToken",{ eventID, tokenIDs:zu.map(t=>parseInt(t.id)), tokenCodes:zu.map(t=>t.code) }); }
    catch(e){ if(!e.message.includes("502")){ setFehler(e.message); setLoesching(false); return; } }
    setAusgewaehlt([]); setFilter("alle"); await laden();
    setErfolg(`${zu.length} Wahlcode(s) gelöscht.`); setTimeout(()=>setErfolg(null),3000);
    setLoesching(false);
  }
  async function loescheAlle() {
    if(tokens.length===0) return;
    const ok = await confirm({ titel:`Alle ${tokens.length} Wahlcodes löschen`, nachricht:`ALLE ${tokens.length} Wahlcodes unwiderruflich löschen?\n\nDies sollte nur nach vollständigem Abschluss des Wahltags gemacht werden.`, bestaetigen:"Alle löschen", typ:"danger" }); if(!ok) return;
    setLoesching(true); setFehler(null);
    try { await callFlow("deleteToken",{ eventID, tokenIDs:tokens.map(t=>parseInt(t.id)), tokenCodes:tokens.map(t=>t.code) }); }
    catch(e){ if(!e.message.includes("502")){ setFehler(e.message); setLoesching(false); return; } }
    setAusgewaehlt([]); setFilter("alle"); await laden();
    setErfolg("Alle Wahlcodes gelöscht."); setTimeout(()=>setErfolg(null),3000);
    setLoesching(false);
  }
  const [filter, setFilter] = useState("alle");
  const [sort, setSort] = useState({ col:"erstellt", dir:"desc" });
  const now = new Date();

  function toggleSortToken(col) { setSort(s=>s.col===col?{ col, dir:s.dir==="asc"?"desc":"asc" }:{ col, dir:"asc" }); }
  function SortThT({ col, label }) {
    const aktiv = sort.col===col;
    return (<th style={{ ...S.th, cursor:"pointer", userSelect:"none", whiteSpace:"nowrap" }} onClick={()=>toggleSortToken(col)}>{label} <span style={{ color:aktiv?C.primary:C.border, fontSize:10 }}>{aktiv?(sort.dir==="asc"?"▲":"▼"):"▲"}</span></th>);
  }
  function formatCode(code) { return code.includes("-") ? code : code.slice(0,4)+"-"+code.slice(4); }
  function gueltigkeitStatus(t) {
    if (!t.aktiv) return { label:"gesperrt", color:C.error, bg:C.errorBg };
    if (t.verwendet) return { label:"abgestimmt", color:"#166534", bg:"#dcfce7" };
    if (t.gueltigBis && parseGueltigBis(t.gueltigBis) < now) return { label:"⏱ abgelaufen", color:"#92400e", bg:"#fff8e1" };
    return { label:"● gültig", color:"#166534", bg:"#dcfce7" };
  }
  const gefiltert = tokens.filter(t=>{
    if(suche && !t.code.toLowerCase().includes(suche.toLowerCase().replace("-",""))) return false;
    if(filter==="gueltig") return t.aktiv && !t.verwendet && (!t.gueltigBis || parseGueltigBis(t.gueltigBis) >= now);
    if(filter==="abgestimmt") return t.verwendet;
    if(filter==="abgelaufen") return t.aktiv && !t.verwendet && t.gueltigBis && parseGueltigBis(t.gueltigBis) < now;
    if(filter==="gesperrt") return !t.aktiv;
    return true;
  }).sort((a,b)=>{
    const dir = sort.dir==="asc" ? 1 : -1;
    if(sort.col==="code") return (a.code||"").localeCompare(b.code||"") * dir;
    if(sort.col==="status"){
      const sv = t=>t.verwendet?"abgestimmt":!t.aktiv?"gesperrt":t.gueltigBis&&parseGueltigBis(t.gueltigBis)<now?"abgelaufen":"gueltig";
      return sv(a).localeCompare(sv(b)) * dir;
    }
    if(sort.col==="gueltigBis"){
      const da = a.gueltigBis ? parseGueltigBis(a.gueltigBis) : new Date(0);
      const db = b.gueltigBis ? parseGueltigBis(b.gueltigBis) : new Date(0);
      return (da-db) * dir;
    }
    // default: erstellt
    const da = a.erstellt ? new Date(a.erstellt) : new Date(0);
    const db = b.erstellt ? new Date(b.erstellt) : new Date(0);
    return (da-db) * dir;
  });
  const alleAusgewaehlt=gefiltert.length>0&&gefiltert.every(t=>ausgewaehlt.includes(t.id));
  function toggleAuswahl(id){ setAusgewaehlt(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]); }
  function toggleAlle(){ if(alleAusgewaehlt) setAusgewaehlt([]); else setAusgewaehlt(gefiltert.map(t=>t.id)); }

  const abgelaufenCount = tokens.filter(t=>t.aktiv&&!t.verwendet&&t.gueltigBis&&parseGueltigBis(t.gueltigBis)<now).length;
  const filterBtns = [
    { id:"alle", label:`Alle (${tokens.length})` },
    { id:"gueltig", label:`Gültig (${tokens.filter(t=>t.aktiv&&!t.verwendet&&(!t.gueltigBis||parseGueltigBis(t.gueltigBis)>=now)).length})` },
    { id:"abgestimmt", label:`Abgestimmt (${tokens.filter(t=>t.verwendet).length})` },
    { id:"abgelaufen", label:`Abgelaufen (${abgelaufenCount})`, warn: abgelaufenCount > 0 },
    { id:"gesperrt", label:`Gesperrt (${tokens.filter(t=>!t.aktiv).length})` },
  ];

  async function loescheAusgewaehlt() {
    const zu = tokens.filter(t=>ausgewaehlt.includes(t.id));
    if(zu.length===0) return;
    const mitStimme = zu.filter(t=>t.verwendet).length;
    const ohneStimme = zu.filter(t=>!t.verwendet).length;
    let msg = `${zu.length} Wahlcode(s) löschen?\n\n`;
    if(mitStimme > 0) msg += `⚠️ ${mitStimme} Wahlcode(s) haben bereits eine Stimme abgegeben.\nDie Stimmen bleiben erhalten — nur der Wahlcode-Eintrag wird gelöscht.\n\n`;
    if(ohneStimme > 0) msg += `${ohneStimme} Wahlcode(s) wurden noch nicht verwendet.\n\n`;
    msg += mitStimme > 0 ? "Löschen empfiehlt sich erst nach vollständigem Abschluss des Wahltags.\n\nTrotzdem fortfahren?" : "Fortfahren?";
    const ok = await confirm({ titel:"Wähler löschen", nachricht:msg, bestaetigen:"Löschen", typ:"danger" }); if(!ok) return;
    setLoesching(true); setFehler(null);
    try {
      await callFlow("deleteToken",{ eventID, tokenIDs:zu.map(t=>parseInt(t.id)), tokenCodes:zu.map(t=>t.code) });
      setAusgewaehlt([]); setFilter("alle"); await laden();
      setErfolg(`${zu.length} Wahlcode(s) gelöscht.`); setTimeout(()=>setErfolg(null),3000);
    } catch(e){ setFehler(e.message); }
    setLoesching(false);
  }

  async function loescheAlle() {
    if(tokens.length===0) return;
    const mitStimme = tokens.filter(t=>t.verwendet).length;
    let msg = `ALLE ${tokens.length} Wahlcodes löschen?\n\n`;
    if(mitStimme > 0) msg += `${mitStimme} Wahlcode(s) haben bereits eine Stimme abgegeben.\nDie Stimmen bleiben erhalten.\n\n`;
    msg += "Dies sollte nur nach vollständigem Abschluss des Wahltags gemacht werden.\n\nWirklich alle löschen?";
    const ok2 = await confirm({ titel:"Wähler löschen", nachricht:msg, bestaetigen:"Löschen", typ:"danger" }); if(!ok2) return;
    setLoesching(true); setFehler(null);
    try {
      await callFlow("deleteToken",{ eventID, tokenIDs:tokens.map(t=>parseInt(t.id)), tokenCodes:tokens.map(t=>t.code) });
      setAusgewaehlt([]); setFilter("alle"); await laden();
      setErfolg("Alle Wahlcodes gelöscht."); setTimeout(()=>setErfolg(null),3000);
    } catch(e){ setFehler(e.message); }
    setLoesching(false);
  }

  return (
    <div style={{ ...S.card, marginTop:16 }}>
      {dialog}
      {loesching&&<div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.35)", zIndex:9990, display:"flex", alignItems:"center", justifyContent:"center" }}><div style={{ background:C.bgWhite, borderRadius:12, padding:"32px 40px", textAlign:"center", boxShadow:"0 8px 32px rgba(0,0,0,0.18)" }}><div style={S.spinner}/><p style={{ marginTop:12, color:C.primary, fontWeight:600 }}>Wahlcodes werden gelöscht…</p></div></div>}
      {letzterKontrollcode && (
        <div style={{ ...S.alert, background:"#f0f4ff", border:`1px solid ${C.primary}`, marginBottom:12, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
          <div>
            <div style={{ fontSize:11, color:C.textLight, marginBottom:2 }}>Kontrollcode letzter Druck</div>
            <div style={{ fontFamily:"monospace", fontSize:16, fontWeight:700, color:C.primary, letterSpacing:"0.1em" }}>{letzterKontrollcode}</div>
          </div>
          <div style={{ fontSize:11, color:C.textLight, textAlign:"right" }}>
            Mit Deckblatt des<br/>PDF-Ausdrucks vergleichen
          </div>
        </div>
      )}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:8, flexWrap:"wrap" }}>
        <div style={{ ...S.sectionLabel, minWidth:0, flex:1 }}>Wahlcode-Übersicht</div>
        <div style={{ display:"flex", gap:6, flexShrink:0 }}>
          {tokens.filter(t=>t.aktiv&&!t.verwendet).length>0&&(
            <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={()=>{
                const now = Math.floor(Date.now()/1000);
                const druckWahlcodes = gefiltert.filter(t=>t.aktiv&&!t.verwendet&&(!t.gueltigBis||parseInt(t.gueltigBis)>now)).map(t=>t.code);
                if (druckWahlcodes.length===0) return;
                generiereTokenPDF(druckWahlcodes, wahllokalName||eventID, eventID, true);
                // Kontrollcode berechnen und anzeigen
                const n = druckWahlcodes.length;
                const now2 = new Date();
                const dat = now2.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})+", "+now2.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";
                let h=0; const s=n+"|"+eventID+"|"+dat;
                for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
                const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const pos=Math.abs(h);
                const kc="KP-"+now2.getFullYear()+"-"+ch[pos%32]+ch[(pos>>5)%32]+ch[(pos>>10)%32]+ch[(pos>>15)%32]+ch[(n*7+pos)%32]+ch[(n*13+pos)%32];
                setLetzterKontrollcode(kc);
              }} disabled={loading} title="Aktive, unverwendete, gültige Wahlcodes als PDF drucken">
                <i className="ti ti-printer" aria-hidden="true"/> PDF drucken ({(()=>{ const n=Math.floor(Date.now()/1000); return tokens.filter(t=>t.aktiv&&!t.verwendet&&(!t.gueltigBis||parseInt(t.gueltigBis)>n)).length; })()})
              </button>
          )}
          <button style={{ ...S.btn, ...S.btnGhost, fontSize:12 }} onClick={laden} disabled={loading}><i className="ti ti-refresh" aria-hidden="true"/></button>
        </div>
      </div>
      <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
        {filterBtns.map(b=><button key={b.id} style={{ ...S.btn, fontSize:12, padding:"5px 12px", ...(filter===b.id?S.btnPrimary:S.btnGhost), ...(b.warn&&filter!==b.id?{ borderColor:C.warning, color:C.warning }:{}) }} onClick={()=>setFilter(b.id)}>{b.label}</button>)}
      </div>
      {abgelaufenCount > 0 && <div style={{ ...S.alert, ...S.alertWarning, marginBottom:8 }}><i className="ti ti-alert-triangle" aria-hidden="true"/> {abgelaufenCount} Wahlcode(s) abgelaufen — können gelöscht oder ignoriert werden.</div>}
      <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        {ausgewaehlt.length>0&&deleteVerfuegbar&&<button style={{ ...S.btn, ...S.btnDanger, fontSize:12 }} onClick={loescheAusgewaehlt} disabled={loesching}><i className="ti ti-trash" aria-hidden="true"/> Auswahl löschen ({ausgewaehlt.length})</button>}
        {tokens.length>0&&deleteVerfuegbar&&<button style={{ ...S.btn, fontSize:12, background:"transparent", color:C.error, border:`1px solid ${C.error}` }} onClick={loescheAlle} disabled={loesching}><i className="ti ti-trash" aria-hidden="true"/> Alle löschen ({tokens.length})</button>}
      </div>
      {erfolg&&<div style={{ ...S.alert, ...S.alertSuccess, marginBottom:8 }}><i className="ti ti-circle-check" aria-hidden="true"/> {erfolg}</div>}
      {fehler&&<p style={{ color:C.error, fontSize:13, marginBottom:8 }}>{fehler}</p>}
      <input style={{ ...S.input, marginBottom:12 }} placeholder="Wahlcode suchen..." value={suche} onChange={e=>setSuche(e.target.value)}/>
      {loading?<p style={{ color:C.textLight, fontSize:14 }}>Wird geladen…</p>:gefiltert.length===0?<p style={{ color:C.textLight, fontSize:14 }}>{suche?"Kein Wahlcode gefunden.":"Noch keine Wahlcodes generiert."}</p>:(
        isMobile ? (
          /* Mobile: Karten pro Wahlcode */
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {gefiltert.map(t=>{
              const gs = gueltigkeitStatus(t);
              async function einzelLoeschen() {
                const msg = t.verwendet ? "Dieser Wahlcode wurde bereits zur Abstimmung verwendet.\nDie Stimme bleibt erhalten.\n\nWahlcode trotzdem löschen?" : "Wahlcode löschen?";
                const okEl = await confirm({ titel:"Wahlcode löschen", nachricht:msg, bestaetigen:"Löschen", typ:"danger" }); if(!okEl) return;
                setLoesching(true);
                callFlow("deleteToken",{ eventID, tokenIDs:[parseInt(t.id)], tokenCodes:[t.code] })
                  .then(async ()=>{ setFilter("alle"); await laden(); setErfolg("Wahlcode gelöscht."); setTimeout(()=>setErfolg(null),2000); })
                  .catch(e=>{ if(!e.message.includes("502")){ setFehler(e.message); } else { setFilter("alle"); laden(); setErfolg("Wahlcode gelöscht."); setTimeout(()=>setErfolg(null),2000); } })
                  .finally(()=>setLoesching(false));
              }
              return (
                <div key={t.id} style={{ borderRadius:8, border:`1px solid ${ausgewaehlt.includes(t.id)?C.primary:C.border}`, padding:"10px 12px", background:ausgewaehlt.includes(t.id)?"#f0f4ff":C.bgWhite }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                    <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer" }}>
                      <input type="checkbox" checked={ausgewaehlt.includes(t.id)} onChange={()=>toggleAuswahl(t.id)}/>
                      <span style={{ fontFamily:"monospace", fontWeight:700, fontSize:16, letterSpacing:"0.08em", textDecoration:!t.aktiv?"line-through":"none", opacity:!t.aktiv?0.5:1 }}>{formatCode(t.code)}</span>
                    </label>
                    <span style={{ ...S.badge, background:gs.bg, color:gs.color, fontSize:11 }}>{gs.label}</span>
                  </div>
                  <div style={{ fontSize:11, color:C.textLight, marginBottom:8, display:"flex", gap:12, flexWrap:"wrap" }}>
                    {t.gueltigBis&&<span>Gültig bis: {/^\d{9,12}$/.test(t.gueltigBis.trim()) ? new Date(parseInt(t.gueltigBis)*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"}) : t.gueltigBis}</span>}
                    {t.verwendetAm&&<span>Abgestimmt: {new Date(t.verwendetAm).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>}
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <button style={{ ...S.btn, fontSize:12, padding:"4px 10px", background:"transparent", color:t.aktiv?C.error:C.success, border:`1px solid ${t.aktiv?C.error:C.success}` }} onClick={()=>toggleToken(t)} disabled={toggling===t.id||t.verwendet}>
                      {toggling===t.id?"…":t.aktiv?"Sperren":"Aktivieren"}
                    </button>
                    {deleteVerfuegbar&&<button style={{ ...S.btn, ...S.btnGhostDanger, fontSize:12, padding:"4px 10px" }} onClick={einzelLoeschen} disabled={loesching}><i className="ti ti-trash" aria-hidden="true"/></button>}
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          /* Desktop: Tabelle */
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr>
              <th style={{ ...S.th, width:36 }}><input type="checkbox" checked={alleAusgewaehlt} onChange={toggleAlle}/></th>
              <SortThT col="code" label="Wahlcode"/>
              <SortThT col="status" label="Status"/>
              <SortThT col="erstellt" label="Erstellt"/>
              <SortThT col="gueltigBis" label="Gültig bis"/>
              <SortThT col="verwendetAm" label="Verwendet am"/>
              <th style={S.th}>Aktion</th>
            </tr></thead>
            <tbody>{gefiltert.map(t=>{
              const gs = gueltigkeitStatus(t);
              async function einzelLoeschen() {
                const msg = t.verwendet ? "Dieser Wahlcode wurde bereits zur Abstimmung verwendet.\nDie Stimme bleibt erhalten.\n\nWahlcode trotzdem löschen?" : "Wahlcode löschen?";
                const okEl = await confirm({ titel:"Wahlcode löschen", nachricht:msg, bestaetigen:"Löschen", typ:"danger" }); if(!okEl) return;
                setLoesching(true);
                callFlow("deleteToken",{ eventID, tokenIDs:[parseInt(t.id)], tokenCodes:[t.code] })
                  .then(async ()=>{ setFilter("alle"); await laden(); setErfolg("Wahlcode gelöscht."); setTimeout(()=>setErfolg(null),2000); })
                  .catch(e=>{ if(!e.message.includes("502")){ setFehler(e.message); } else { setFilter("alle"); laden(); setErfolg("Wahlcode gelöscht."); setTimeout(()=>setErfolg(null),2000); } })
                  .finally(()=>setLoesching(false));
              }
              return (
                <tr key={t.id} style={{ background:ausgewaehlt.includes(t.id)?"#f0f4ff":"transparent" }}>
                  <td style={S.td}><input type="checkbox" checked={ausgewaehlt.includes(t.id)} onChange={()=>toggleAuswahl(t.id)}/></td>
                  <td style={{ ...S.td, fontFamily:"monospace", fontWeight:700, letterSpacing:"0.08em", textDecoration:!t.aktiv?"line-through":"none", opacity:!t.aktiv?0.5:1 }}>{formatCode(t.code)}</td>
                  <td style={S.td}><span style={{ ...S.badge, background:gs.bg, color:gs.color, fontSize:11 }}>{gs.label}</span></td>
                  <td style={{ ...S.td, fontSize:12, color:C.textLight }}>{formatDatum(t.erstellt)}</td>
                  <td style={{ ...S.td, fontSize:12, color:t.gueltigBis&&parseGueltigBis(t.gueltigBis)<now?C.warning:C.textLight }}>{t.gueltigBis ? (/^\d{9,12}$/.test(t.gueltigBis.trim()) ? new Date(parseInt(t.gueltigBis)*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"}) : t.gueltigBis) : "—"}</td>
                  <td style={{ ...S.td, fontSize:12, color:C.textLight }}>{t.verwendetAm ? new Date(t.verwendetAm).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—"}</td>
                  <td style={S.td}>
                    <div style={{ display:"flex", gap:4 }}>
                      <button style={{ ...S.btn, fontSize:11, padding:"3px 9px", background:"transparent", color:t.aktiv?C.error:C.success, border:`1px solid ${t.aktiv?C.error:C.success}` }} onClick={()=>toggleToken(t)} disabled={toggling===t.id||t.verwendet} title={t.verwendet?"Bereits verwendet":""}>
                        {toggling===t.id?"…":t.aktiv?"Sperren":"Aktivieren"}
                      </button>
                      {deleteVerfuegbar&&(
                        <button style={{ ...S.btn, fontSize:11, padding:"3px 9px", background:"transparent", color:C.error, border:`1px solid ${C.error}` }} onClick={einzelLoeschen} disabled={loesching}>
                          <i className="ti ti-trash" aria-hidden="true"/>
                        </button>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        )
      )}
    </div>
  );
}

function LeitungWaehler({ appData, eventID, isMobile=false }) {
  const wahllokal = appData.wahllokale.find(w=>w.eventID===eventID);
  const { confirm, dialog } = useConfirm();
  const [szenario, setSzenario] = useState(null); const [waehler, setWaehler] = useState([]); const [loading, setLoading] = useState(false);
  const [emailInput, setEmailInput] = useState(""); const [csvInput, setCsvInput] = useState("");
  const [saving, setSaving] = useState(false); const [sending, setSending] = useState(false);
  const [fehler, setFehler] = useState(null); const [erfolg, setErfolg] = useState(null);
  const [tab, setTab] = useState("liste"); const [offlineAnzahl, setOfflineAnzahl] = useState(10);
  const [tokenReloadTrigger, setTokenReloadTrigger] = useState(0);
  const [suche, setSuche] = useState(""); const [ausgewaehlt, setAusgewaehlt] = useState([]);
  const [gueltigBis, setGueltigBis] = useState(()=>naechsteViertelStunde());

  async function loadWaehler() { setLoading(true); try{ const r=await callFlow("getWaehler",{ eventID }); setWaehler((r||[]).map(mapWaehler)); setAusgewaehlt([]); }catch(e){ setFehler(e.message); } setLoading(false); }
  async function addEmail() {
    const email = emailInput.trim().toLowerCase();
    if (!email || !email.includes("@")) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("saveWaehler", { eventID, waehler:[{ email, token:"" }] });
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:[email], gueltigBis:formatGueltigBis(gueltigBis) });
      setEmailInput(""); await loadWaehler();
      setErfolg("Wähler angelegt. Link kann jetzt versendet werden."); setTimeout(()=>setErfolg(null),4000);
    } catch(e) { setFehler(e.message); }
    setSaving(false);
  }
  async function addEmailUndVersenden() {
    const email = emailInput.trim().toLowerCase();
    if (!email || !email.includes("@")) return;
    setSaving(true); setFehler(null);
    try {
      // 1. Wähler speichern
      await callFlow("saveWaehler", { eventID, waehler:[{ email, token:"" }] });
      // 2. Hash generieren
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:[email], gueltigBis:formatGueltigBis(gueltigBis) });
      // 3. Link per Mail versenden
      await callFlow("versendeLinks", { apiKey:API.key, eventID, basisUrl:window.location.origin+window.location.pathname, wahlTitel:wahllokal?.name||eventID, wahlDatum:new Date().toLocaleDateString("de-DE"), wahllokalUrl:window.location.origin+window.location.pathname+"?wahllokal="+eventID });
      setEmailInput(""); await loadWaehler();
      setErfolg(`Wähler angelegt und Wahlcode-Link an ${email} versendet.`); setTimeout(()=>setErfolg(null),4000);
    } catch(e) { setFehler(e.message); }
    setSaving(false);
  }
  async function importCSV() {
    const lines = csvInput.split(/[\n\r,;]+/).map(l=>l.trim().toLowerCase()).filter(l=>l.includes("@"));
    if (lines.length===0) return;
    setSaving(true); setFehler(null);
    try {
      // Wähler speichern + Hashes generieren (noch kein Versand)
      await callFlow("saveWaehler", { eventID, waehler:lines.map(email=>({ email, token:"" })) });
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:lines, gueltigBis:formatGueltigBis(gueltigBis) });
      setCsvInput(""); await loadWaehler();
      setErfolg(`${lines.length} Wähler importiert. Links können jetzt versendet werden.`); setTimeout(()=>setErfolg(null),4000);
    } catch(e) { setFehler(e.message); }
    setSaving(false);
  }
  async function importCSVUndVersenden() {
    const lines = csvInput.split(/[\n\r,;]+/).map(l=>l.trim().toLowerCase()).filter(l=>l.includes("@"));
    if (lines.length===0) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("saveWaehler", { eventID, waehler:lines.map(email=>({ email, token:"" })) });
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:lines, gueltigBis:formatGueltigBis(gueltigBis) });
      await callFlow("versendeLinks", { apiKey:API.key, eventID, basisUrl:window.location.origin+window.location.pathname, wahlTitel:wahllokal?.name||eventID, wahlDatum:new Date().toLocaleDateString("de-DE"), wahllokalUrl:window.location.origin+window.location.pathname+"?wahllokal="+eventID });
      setCsvInput(""); await loadWaehler();
      setErfolg(`${lines.length} Wähler angelegt und Wahlcode-Links versendet.`); setTimeout(()=>setErfolg(null),4000);
    } catch(e) { setFehler(e.message); }
    setSaving(false);
  }
  async function tokensZuweisen() {
    // Hashes für alle Wähler ohne Link generieren (ohne sofortigen Versand)
    const ohneHash = waehler.filter(w=>w.status==="angelegt");
    if(ohneHash.length===0){ setErfolg("Alle Wähler haben bereits einen Link erhalten."); return; }
    setSaving(true); setFehler(null);
    try {
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:ohneHash.map(w=>w.email), gueltigBis:formatGueltigBis(gueltigBis) });
      await loadWaehler();
      setErfolg(`${ohneHash.length} Einmallinks generiert. Jetzt versenden.`); setTimeout(()=>setErfolg(null),4000);
    } catch(e){ setFehler(e.message); }
    setSaving(false);
  }
  async function emailsVersenden() {
    const zuSenden = waehler.filter(w=>w.status==="angelegt");
    if(zuSenden.length===0){ setFehler("Keine ausstehenden Links."); return; }
    setSending(true); setFehler(null);
    try {
      await callFlow("versendeLinks", { apiKey:API.key, eventID, basisUrl:window.location.origin+window.location.pathname, wahlTitel:wahllokal?.name||eventID, wahlDatum:new Date().toLocaleDateString("de-DE"), wahllokalUrl:window.location.origin+window.location.pathname+"?wahllokal="+eventID });
      // Status auf "versendet" setzen
      await callFlow("updateWaehler", { updates:zuSenden.map(w=>({ id:parseInt(w.id), status:"versendet" })) });
      await callFlow("updateWaehler",{ updates:zuSenden.map(w=>({ id:parseInt(w.id), status:"versendet" })) });
      setErfolg(`${zuSenden.length} Wahlcode-Links versendet.`); setTimeout(()=>setErfolg(null),3000);
      await loadWaehler();
    } catch(e){ setFehler(e.message); }
    setSending(false);
  }
  async function einzelVersenden(w) {
    setSaving(true); setFehler(null);
    try {
      // Neuen Hash generieren und Link versenden
      await callFlow("generateHashes", { apiKey:API.key, eventID, emails:[w.email] });
      await callFlow("versendeLinks", { apiKey:API.key, eventID, basisUrl:window.location.origin+window.location.pathname, wahlTitel:wahllokal?.name||eventID, wahlDatum:new Date().toLocaleDateString("de-DE"), wahllokalUrl:window.location.origin+window.location.pathname+"?wahllokal="+eventID });
      setErfolg(`Wahlcode-Link an ${w.email} versendet.`); setTimeout(()=>setErfolg(null),3000);
      await loadWaehler();
    } catch(e){ setFehler(e.message); }
    setSaving(false);
  }
  async function einzelTokenToggle(w) { const aktiv=w.tokenAktiv===false; const ok = await confirm({ titel:`Wahlcode ${aktiv?"reaktivieren":"sperren"}`, nachricht:`Wahlcode ${w.tokenCode} für ${w.email} wirklich ${aktiv?"reaktivieren":"sperren"}?`, bestaetigen:aktiv?"Reaktivieren":"Sperren", typ:aktiv?"warn":"danger" }); if(!ok) return; setSaving(true); setFehler(null); try{ await callFlow("deactivateToken",{ eventID, tokenCodes:[w.tokenCode], waehlerIDs:[parseInt(w.id)], aktiv }); await loadWaehler(); }catch(e){ setFehler(e.message); } setSaving(false); }
  async function ausgewaehlteLoschen() {
    const zu = waehler.filter(w=>ausgewaehlt.includes(w.id)&&w.status!=="versendet");
    if(zu.length===0) return;
    const ok = await confirm({ titel:`${zu.length} Wähler löschen`, nachricht:`${zu.length} Wähler wirklich löschen?\n\nZugehörige Wahlcodes werden ebenfalls entfernt.`, bestaetigen:"Löschen", typ:"danger" }); if(!ok) return;
    setSaving(true); setFehler(null);
    try {
      await callFlow("deleteWaehler",{ waehlerIDs:zu.map(w=>parseInt(w.id)) });
      // Zugehörige Wahlcodes ebenfalls löschen
      const mitToken = zu.filter(w=>w.tokenCode);
      if(mitToken.length>0 && !API.flows.deleteToken.startsWith("PLATZHALTER")) {
        await callFlow("deleteToken",{ eventID, tokenIDs:[], tokenCodes:mitToken.map(w=>w.tokenCode) });
      }
      await loadWaehler();
      setErfolg(`${zu.length} Wähler gelöscht.`); setTimeout(()=>setErfolg(null),3000);
    } catch(e){ setFehler(e.message); }
    setSaving(false);
  }
  async function ausgewaehltDeaktivieren() { const zu=waehler.filter(w=>ausgewaehlt.includes(w.id)&&w.tokenCode&&w.tokenAktiv!==false); if(zu.length===0) return; const ok = await confirm({ titel:`${zu.length} Wahlcodes sperren`, nachricht:`Wahlcode für ${zu.length} Wähler sperren?

Diese Wähler können danach nicht mehr abstimmen.`, bestaetigen:"Sperren", typ:"danger" }); if(!ok) return; setSaving(true); setFehler(null); try{ await callFlow("deactivateToken",{ eventID, tokenCodes:zu.map(w=>w.tokenCode), waehlerIDs:zu.map(w=>parseInt(w.id)), aktiv:false }); await loadWaehler(); setErfolg(`${zu.length} Wahlcodes gesperrt.`); setTimeout(()=>setErfolg(null),3000); }catch(e){ setFehler(e.message); } setSaving(false); }
  async function ausgewaehltAktivieren() { const zu=waehler.filter(w=>ausgewaehlt.includes(w.id)&&w.tokenCode&&w.tokenAktiv===false); if(zu.length===0) return; const ok = await confirm({ titel:`${zu.length} Wahlcodes reaktivieren`, nachricht:`Wahlcode für ${zu.length} Wähler reaktivieren?

Diese Wähler können danach wieder abstimmen.`, bestaetigen:"Reaktivieren", typ:"warn" }); if(!ok) return; setSaving(true); setFehler(null); try{ await callFlow("deactivateToken",{ eventID, tokenCodes:zu.map(w=>w.tokenCode), waehlerIDs:zu.map(w=>parseInt(w.id)), aktiv:true }); await loadWaehler(); setErfolg(`${zu.length} Wahlcodes reaktiviert.`); setTimeout(()=>setErfolg(null),3000); }catch(e){ setFehler(e.message); } setSaving(false); }

  async function offlineGenerieren() {
    setSaving(true); setFehler(null);
    try {
      const tokens = Array.from({ length:offlineAnzahl }, ()=>generateToken());
      await callFlow("saveTokens",{ eventID, tokens, typ:"offline", gueltigBis:formatGueltigBis(gueltigBis) });
      // PDF generieren: 2x6 Wahlcodes pro Seite, zum Ausschneiden
      setTokenReloadTrigger(t=>t+1);
      setErfolg(`${offlineAnzahl} Wahlcodes generiert. Jetzt PDF drucken über den Button in der Wahlcode-Übersicht.`);
      setTimeout(()=>setErfolg(null),3000);
    } catch(e){ setFehler(e.message); }
    setSaving(false);
  }
  async function offlineGenerierenMitPDF() {
    setSaving(true); setFehler(null);
    try {
      const tokens = Array.from({ length:offlineAnzahl }, ()=>generateToken());
      await callFlow("saveTokens",{ eventID, tokens, typ:"offline", gueltigBis:formatGueltigBis(gueltigBis) });
      const now2 = Math.floor(Date.now()/1000);
      const druckTokens = tokens.filter(t=>t.aktiv&&!t.verwendet&&(!t.gueltigBis||parseInt(t.gueltigBis)>now2)).map(t=>t.code);
      generiereTokenPDF(druckTokens, wahllokal?.name||eventID, eventID);
      setTokenReloadTrigger(t=>t+1);
      setErfolg(`${offlineAnzahl} Wahlcodes generiert und PDF geöffnet.`);
      setTimeout(()=>setErfolg(null),3000);
    } catch(e){ setFehler(e.message); }
    setSaving(false);
  }

// Sortierung & Filter State
  const [sortWaehler, setSortWaehler] = useState({ col:"email", dir:"asc" });
  const [filterStatus, setFilterStatus] = useState("alle");
  const [onlineTab, setOnlineTab] = useState("eingeladene");

  function toggleSort(col) {
    setSortWaehler(s => s.col===col ? { col, dir:s.dir==="asc"?"desc":"asc" } : { col, dir:"asc" });
  }
  function SortTh({ col, label }) {
    const aktiv = sortWaehler.col===col;
    return (
      <th style={{ ...S.th, cursor:"pointer", userSelect:"none", whiteSpace:"nowrap" }} onClick={()=>toggleSort(col)}>
        {label} <span style={{ color:aktiv?C.primary:C.border, fontSize:10 }}>{aktiv?(sortWaehler.dir==="asc"?"▲":"▼"):"▲"}</span>
      </th>
    );
  }

  const statusFilterBtns = [
    { id:"alle",       label:`Alle (${waehler.length})` },
    { id:"versendet",  label:`Versendet (${waehler.filter(w=>w.status==="versendet").length})` },
    { id:"abgeholt",   label:`Abgeholt (${waehler.filter(w=>w.status==="abgeholt").length})` },
    { id:"angelegt",   label:`Ausstehend (${waehler.filter(w=>w.status==="angelegt").length})` },
  ];

  const gefilterteWaehler = waehler
    .filter(w => {
      if (suche && !w.email.includes(suche.toLowerCase())) return false;
      if (filterStatus !== "alle" && w.status !== filterStatus) return false;
      return true;
    })
    .sort((a,b) => {
      const dir = sortWaehler.dir==="asc" ? 1 : -1;
      if (sortWaehler.col==="email") return a.email.localeCompare(b.email) * dir;
      if (sortWaehler.col==="status") return a.status.localeCompare(b.status) * dir;
      if (sortWaehler.col==="token") return (a.tokenCode||"").localeCompare(b.tokenCode||"") * dir;
      return 0;
    });
  const alleAusgewaehlt = gefilterteWaehler.length>0&&gefilterteWaehler.every(w=>ausgewaehlt.includes(w.id));
  const hatAuswahl = ausgewaehlt.length>0;
  const kannLoeschen = ausgewaehlt.some(id=>waehler.find(w=>w.id===id)?.status!=="versendet");
  const kannDeaktivieren = ausgewaehlt.some(id=>{ const w=waehler.find(w=>w.id===id); return w?.tokenCode&&w?.tokenAktiv!==false; });
  const kannAktivieren = ausgewaehlt.some(id=>{ const w=waehler.find(w=>w.id===id); return w?.tokenCode&&w?.tokenAktiv===false; });
  function toggleAuswahl(id){ setAusgewaehlt(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]); }
  function toggleAlle(){ if(alleAusgewaehlt) setAusgewaehlt([]); else setAusgewaehlt(gefilterteWaehler.map(w=>w.id)); }

  const GueltigBisInput = ()=>(
    <div style={{ ...S.card, marginBottom:16 }}>
      <div style={S.sectionLabel}>Wahlcode-Gültigkeit</div>
      <div style={{ display:"flex", gap:12, alignItems:"flex-end", flexWrap:"wrap" }}>
        <DateTimePicker label="Gültig bis" value={gueltigBis} onChange={setGueltigBis} hint="Wahlcodes sind nach diesem Zeitpunkt nicht mehr verwendbar."/>
      </div>
    </div>
  );

  if (!szenario) {
    const modus = wahllokal?.modus || "beides";
